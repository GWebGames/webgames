</head>

</script>

<script>
const NET = {mode: 'single', peer: null, conns: {}, hostConn: null, myId: null, code: '', name: '', players: [], started: false, prefix: 'tg49-'};
const $n = id => document.getElementById(id);

function netName(){ const v = ($n('lb-name').value.trim() || '플레이어').slice(0, 10); try { localStorage.setItem('tg49name', v); } catch (e) {} return v; }

function netToIdx(idx, m){ const p = NET.players.find(q => q.idx === idx); if (p && !p.host) netToPid(p.pid, m); }
function netHost(){
  if (typeof Peer === 'undefined') { netMsg('네트워크 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인하세요.'); return; }

}
function netJoin(){

  let done = false, peer; const fail = t => { if (done) return; done = true; netMsg(t); try { peer.destroy(); } catch (e) {} NET.mode = 'single'; };
  try { peer = new Peer(); } catch (e) { netMsg('연결에 실패했어요'); return; }

  peer.on('open', id => {
    NET.myId = id; const conn = peer.connect(NET.prefix + code, {reliable: true, serialization: 'json'}); NET.hostConn = conn;
    conn.on('open', () => conn.send({t: 'hello', name: NET.name}));
    conn.on('data', m => { done = true; netRecv(conn.peer, m, conn); });
    conn.on('close', () => netHostLost()); conn.on('error', () => fail('연결 오류'));
    setTimeout(() => { if (!done) fail('방을 찾을 수 없어요 (코드를 확인하세요)'); }, 9000);
  });

}
function netLeave(){ try { if (NET.peer) NET.peer.destroy(); } catch (e) {} NET.peer = null; NET.hostConn = null; NET.conns = {}; NET.mode = 'single'; NET.players = []; NET.started = false; netShow('menu'); }

function netRoomRender(){
  $n('lb-codeview').textContent = NET.code;
  $n('lb-list').innerHTML = NET.players.map(p => '<div style="padding:6px 12px;border-radius:8px;background:#1e293b;margin:3px 0">' + (p.host ? '👑 ' : '👤 ') + String(p.name).replace(/</g, '&lt;') + '</div>').join('');
  const host = NET.mode === 'host'; $n('lb-start').style.display = host ? 'block' : 'none'; $n('lb-wait').style.display = host ? 'none' : 'block'; $n('lb-share').style.display = host ? 'block' : 'none';
  $n('lb-count').textContent = '참가자 ' + NET.players.length + ' / 8 (나머지는 AI가 채워 총 50명)';
}
function netLost(pid){
  const i = NET.players.findIndex(p => p.pid === pid); if (i < 0) return; const p = NET.players[i]; NET.players.splice(i, 1); delete NET.conns[pid];
  if (NET.started) { const a = TG.ag[p.idx]; if (a) a.human = false; tgToast(p.name + ' 님이 나갔어요 (AI가 이어받아요)', 2000); } else netLobbyBcast();
}
function netHostLost(){
  if (TG.mp === 'client' && !TG.over) { TG.run = false; TG.over = true; $tg('tg-rt').textContent = '방장이 나갔어요'; $tg('tg-rd').textContent = '게임이 종료되었어요'; $tg('tg-retry').classList.add('hidden'); $tg('tg-specbtn').classList.add('hidden'); $tg('tg-result').classList.remove('hidden'); $tg('tg-result').classList.add('flex'); }

}
function netStart(){

}
function netRecv(from, msg, conn){
  if (!msg || !msg.t) return;

    if (msg.t === 'hello') {
      if (conn) NET.conns[from] = conn;
      if (NET.started) { netToPid(from, {t: 'busy'}); return; }
      if (NET.players.length >= 8) { netToPid(from, {t: 'full'}); return; }
      if (!NET.players.find(p => p.pid === from)) { const used = new Set(NET.players.map(p => p.idx)); let idx = 0; while (used.has(idx)) idx++; NET.players.push({pid: from, name: String(msg.name || '플레이어').slice(0, 10), idx}); }

    } else if (msg.t === 'p') {
      const p = NET.players.find(q => q.pid === from), a = p && TG.ag[p.idx];
      if (a && !a.dead) { a.x = msg.x; a.y = msg.y; a.h = msg.h; a.fx = msg.fx; a.fz = msg.fz; a.mv = !!(msg.f & 1); a.sprinting = !!(msg.f & 2); a.slideT = (msg.f & 4) ? 1 : 0; }
    } else if (msg.t === 'tag') { const p = NET.players.find(q => q.pid === from); if (p) tgRemoteTag(p.idx, msg); }
  } else if (NET.mode === 'client') {
    if (msg.t === 'lobby') { NET.players = msg.players; NET.code = msg.code || NET.code; netShow('room'); netRoomRender(); netMsg(''); }
    else if (msg.t === 'full') { netMsg('방이 가득 찼어요 (최대 8명)'); netLeave(); }
    else if (msg.t === 'busy') { netMsg('이미 게임이 시작된 방이에요'); netLeave(); }
    else if (msg.t === 'start') { NET.started = true; $n('start-overlay').style.display = 'none'; startTag({mp: 'client', myIdx: msg.myIdx, humans: msg.humans, pos: msg.pos}); }
    else if (msg.t === 's') { if (TG.mp === 'client' && TG.run) tgApplySnap(msg); }
    else if (msg.t === 'dead') { TG.rank = msg.rank; if (TG.me && TG.mp === 'client') tgDie('tag'); }
    else if (msg.t === 'tagok') { tgToast('태그 성공! 🎯', 1200); tgaHit(); const xh = $tg('tg-xh'); xh.style.borderColor = '#ef4444'; setTimeout(() => { xh.style.borderColor = 'rgba(255,255,255,.85)'; }, 160); }
    else if (msg.t === 'end') { tgFinish(msg.w); }
  }
}
function tgGenPos(){
  if (!TG.map) TG.map = tgBuildMap(); TG.obs = TG.map.obs; const pos = [];
  for (let i = 0; i < 50; i++) { let x, y, n = 0; do { const g = tgR(0, 6.283), d = tgR(0, 1400); x = TG.W / 2 + Math.cos(g) * d; y = TG.W / 2 + Math.sin(g) * d; n++; } while (!tgFree(x, y) && n < 40); pos.push([Math.round(x), Math.round(y)]); }

}
const TG_RI = {rabbit: 0, wolf: 1, hunter: 2}, TG_RN = ['rabbit', 'wolf', 'hunter'];
function tgFlags(a){ return (a.mv ? 1 : 0) | (a.sprinting ? 2 : 0) | (a.slideT > 0 ? 4 : 0); }
function tgHostSend(dt){
  TG.snT += dt; if (TG.snT < 1 / 15) return; TG.snT = 0;
  netBcast({t: 's', rt: Math.ceil(TG.roleT), ag: TG.ag.map(a => [+a.x.toFixed(1), +a.y.toFixed(1), +a.h.toFixed(1), +a.fx.toFixed(2), +a.fz.toFixed(2), tgFlags(a), TG_RI[a.role], a.dead ? 1 : 0])});
}
function tgApplySnap(m){
  m.ag.forEach((r, i) => {
    const a = TG.ag[i]; if (!a) return;
    if (i === TG.myIdx) {
      const nr = TG_RN[r[6]]; if (a.role !== nr) { a.role = nr; a.stam = Math.min(a.stam, 3 * ROLE[nr].mul); tgaRole(nr); tgToast(ROLE[nr].e + ' ' + ROLE[nr].n + '(으)로 바뀌었어요!', 2800); }
      if (r[7] && !a.dead) tgDie('tag'); return;
    }
    if (a.tx === undefined) { a.x = r[0]; a.y = r[1]; a.h = r[2]; }
    a.tx = r[0]; a.ty = r[1]; a.th = r[2]; a.fx = r[3]; a.fz = r[4]; a.mv = !!(r[5] & 1); a.sprinting = !!(r[5] & 2); a.slideT = (r[5] & 4) ? 1 : 0; a.role = TG_RN[r[6]]; a.dead = !!r[7];
  });

}
function tgClientStep(dt){
  const k = TG.keys, me = TG.me;
  if (k.ArrowLeft) TG.yaw += 1.8 * dt; if (k.ArrowRight) TG.yaw -= 1.8 * dt; if (k.ArrowUp) TG.pitch = Math.max(-1.3, TG.pitch - 1.2 * dt); if (k.ArrowDown) TG.pitch = Math.min(1.3, TG.pitch + 1.2 * dt);

  if (TG.stT >= 0.05 && !me.dead) { TG.stT = 0; netToHost({t: 'p', x: +me.x.toFixed(1), y: +me.y.toFixed(1), h: +me.h.toFixed(1), fx: +me.fx.toFixed(2), fz: +me.fz.toFixed(2), f: tgFlags(me)}); }
}
function tgRemoteTag(idx, m){
  const a = TG.ag[idx]; if (!a || a.dead || a.cd > 0) return; a.cd = 0.6; a.x = m.x; a.y = m.y; a.h = m.h;
  const fx = -Math.sin(m.yaw), fz = -Math.cos(m.yaw); let best = null, bd = 1e9;
  for (const t of TG.ag) { if (t.dead || t === a || !canTag(a, t)) continue; const dx = t.x - a.x, dy = t.y - a.y, d = Math.hypot(dx, dy); if (d > 80 || (dx * fx + dy * fz) / (d || 1) < 0.4 || Math.abs(t.h - a.h) > 45) continue; if (d < bd) { bd = d; best = t; } }
  if (best) tgKill(best, a);
}
function tgCheckEnd(){
  if (TG.mp !== 'host' || TG.over) return; const alive = TG.ag.filter(a => !a.dead);
  if (alive.length <= 1 || !alive.some(a => a.human)) { TG.over = true; const w = alive.length === 1 ? alive[0].idx : -1; netBcast({t: 'end', w}); tgFinish(w); }
}
function tgFinish(w){
  TG.run = false; TG.over = true; const win = w === TG.myIdx, wa = TG.ag[w]; if (win) tgaWin(); else tgaLose();
  $tg('tg-rt').textContent = win ? '🏆 승리!' : '🏁 게임 종료';
  $tg('tg-rd').textContent = win ? '마지막 생존자예요!' : (w < 0 ? '모든 플레이어가 탈락했어요' : ((wa && wa.name) || (wa && wa.human ? '플레이어' : 'AI')) + ' 님이 마지막까지 살아남았어요');
  $tg('tg-retry').classList.add('hidden'); $tg('tg-specbtn').classList.add('hidden'); $tg('tg-spec').classList.add('hidden');
  $tg('tg-result').classList.remove('hidden'); $tg('tg-result').classList.add('flex');
  try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) {}
}
function tgDie(why){

  $tg('tg-rt').textContent = '😵 태그당했다!'; $tg('tg-rd').textContent = '순위 ' + rank + '위 / 50 · 관전할 수 있어요';
  $tg('tg-retry').classList.add('hidden'); $tg('tg-specbtn').classList.remove('hidden');
  $tg('tg-result').classList.remove('hidden'); $tg('tg-result').classList.add('flex');
  try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) {}

function tgSpecNext(){

function tgSpecStart(){ $tg('tg-result').classList.add('hidden'); $tg('tg-result').classList.remove('flex'); TG.spec = true; tgSpecNext(); $tg('tg-spec').classList.remove('hidden'); }
function tgNames(){
  const cv = $tg('tg-names'); if (!cv) return; const c = cv.getContext('2d');

}
(function(){
  try { const n = localStorage.getItem('tg49name'); $n('lb-name').value = n || ('플레이어' + (10 + (Math.random() * 90 | 0))); } catch (e) { $n('lb-name').value = '플레이어'; }
  const rp = new URLSearchParams(location.search).get('room'); if (rp) { $n('lb-code').value = rp.toUpperCase().slice(0, 4); netMsg('방 코드가 입력되어 있어요. 닉네임을 정하고 "방 참가"를 누르세요.'); }
