<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#43291a">
<title>철혈의 대장간 - 중세 대장장이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap">
<style>
:root{
  --ink:#2a1a0e; --paper:#e8d6aa; --paper2:#d6bd86; --gold:#e0b04a; --gold2:#8a5f16; --cream:#f4e8c8;
  --board:#1d1815; --board2:#14100d; --wood:#5b3a21; --wood2:#3d2615;
  --yellow:#e0b04a; --blue:#6b8fb5; --green:#5fa564; --pink:#c0453f; --red:#c0453f;
  --t0:#7b7468; --t1:#5a5448; --t2:#1f7a3a; --t3:#2457b8; --t4:#7a2fb0; --t5:#c77a0a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0e0a08;
  font-family:'Nanum Myeongjo','Batang','AppleMyungjo','Noto Serif KR',serif;font-weight:700;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:radial-gradient(ellipse at 50% -10%,#4a3626 0%,#1a120c 55%,#0a0705 100%)}
#app{position:relative;margin:0 auto;height:100dvh;max-width:820px;display:flex;flex-direction:column;
  background:
    linear-gradient(rgba(10,6,3,.55),rgba(10,6,3,.7)),
    repeating-linear-gradient(0deg,transparent 0 46px,rgba(0,0,0,.4) 46px 48px),
    repeating-linear-gradient(90deg,transparent 0 94px,rgba(0,0,0,.32) 94px 96px),
    #403a34;
  box-shadow:0 0 0 3px #150e08,0 0 0 7px #8a6a30,0 0 0 10px #150e08,0 0 70px rgba(0,0,0,.8);
  padding-top:env(safe-area-inset-top)}
button{font-family:inherit;font-weight:inherit;color:inherit}
/* HUD : 나무 널빤지 */
#hud{display:flex;gap:8px;align-items:center;padding:8px 10px;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 3px,transparent 3px 15px),linear-gradient(#734a29,#43291a);
  border-bottom:4px solid #150e08;box-shadow:inset 0 2px 0 rgba(255,220,160,.28),0 4px 10px rgba(0,0,0,.55);position:relative;z-index:2}
.chip{background:linear-gradient(#efdfb6,#d3b97e);border:2px solid #150e08;border-radius:7px;padding:3px 10px;font-size:17px;white-space:nowrap;
  box-shadow:inset 0 0 0 2px rgba(150,110,40,.45),0 3px 0 #150e08;color:var(--ink)}
#lvbox{flex:1;min-width:0}
#lvbox .lvtxt{display:flex;justify-content:space-between;font-size:14px}
.bar{height:10px;border-radius:5px;background:#150e08;border:2px solid #150e08;overflow:hidden;margin-top:2px;box-shadow:inset 0 0 0 1px #6a5028}
.bar>i{display:block;height:100%;background:linear-gradient(#ffe08a,#c58a14);width:0}
#setbtn{font-size:20px;padding:2px 10px;cursor:pointer}
#hint{background:linear-gradient(#1e1713,#15100d);color:#e8d29a;font-size:14px;padding:6px 14px;text-align:center;border-bottom:2px solid #8a6a30;min-height:32px;font-style:italic;position:relative;z-index:1}
#hint::before,#hint::after{content:'';display:inline-block;width:7px;height:7px;background:#b8923c;transform:rotate(45deg);margin:0 10px 1px}
/* views */
#main{position:relative;flex:1;min-height:0}
.view{position:absolute;inset:0;overflow-y:auto;padding:12px;display:none;-webkit-overflow-scrolling:touch}
.view.on{display:block}
h2{display:flex;align-items:center;gap:10px;margin:2px 0 12px;color:#f0c964;font-weight:800;font-size:22px;letter-spacing:1px;text-shadow:0 2px 0 #000,0 0 14px rgba(224,176,74,.35)}
h2::after{content:'';flex:1;height:3px;min-width:20px;background:linear-gradient(90deg,#c99a3c,rgba(201,154,60,0));border-radius:2px}
h3{margin:12px 0 6px;color:#e8d29a;font-weight:800;font-size:17px;text-shadow:0 2px 0 #000;letter-spacing:.5px}
h3::before{content:'';display:inline-block;width:6px;height:6px;background:#b8923c;transform:rotate(45deg);margin:0 8px 2px 0}
/* 양피지 패널 */
.paper{position:relative;color:var(--ink);
  background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.4),transparent 42%),radial-gradient(circle at 88% 92%,rgba(120,70,20,.28),transparent 48%),
    repeating-linear-gradient(7deg,rgba(120,80,30,.05) 0 2px,transparent 2px 5px),linear-gradient(#ecdcb0,#d7bd84);
  border:3px solid #150e08;border-radius:8px;padding:11px 13px;margin-bottom:12px;
  box-shadow:inset 0 0 0 2px rgba(138,95,22,.55),inset 0 0 26px rgba(120,80,30,.4),0 4px 0 #150e08,0 7px 12px rgba(0,0,0,.45)}
.paper::before,.paper::after{content:'';position:absolute;top:5px;width:7px;height:7px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#f0d27a,#7a5a1c);box-shadow:0 0 0 1px #150e08}
.paper::before{left:5px}.paper::after{right:5px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.small{font-size:13px;opacity:.85}
.btn{background:linear-gradient(#ecc15c,#a9771c);border:3px solid #150e08;border-radius:8px;padding:7px 14px;font-size:16px;cursor:pointer;color:var(--ink);
  text-shadow:0 1px 0 rgba(255,240,200,.55);box-shadow:inset 0 0 0 2px rgba(255,236,170,.55),0 4px 0 #150e08,0 6px 8px rgba(0,0,0,.4);transition:transform .05s,box-shadow .05s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 0 0 2px rgba(255,236,170,.4),0 1px 0 #150e08}
.btn:disabled{background:linear-gradient(#8a8272,#625b4d);color:#b3a98f;text-shadow:none;cursor:not-allowed;box-shadow:inset 0 0 0 2px rgba(255,255,255,.1),0 2px 0 #150e08}
.btn.b2{background:linear-gradient(#7ea3c8,#34506f);color:var(--cream);text-shadow:0 1px 0 #0c1824}
.btn.b3{background:linear-gradient(#74b879,#2d5a33);color:var(--cream);text-shadow:0 1px 0 #0d2010}
.btn.b4{background:linear-gradient(#d4584f,#7a1c1c);color:var(--cream);text-shadow:0 1px 0 #2a0808}
.btn.b5{background:linear-gradient(#d6cbb0,#8f8568)}
.btn.big{font-size:22px;padding:14px 18px;width:100%;letter-spacing:.5px}
.btn.sm{font-size:14px;padding:4px 10px;border-width:2px;box-shadow:inset 0 0 0 2px rgba(255,236,170,.45),0 3px 0 #150e08}
.tag{display:inline-block;font-size:12px;border:2px solid #150e08;border-radius:4px;padding:0 6px;background:rgba(255,248,220,.55);margin-right:3px}
.lock{filter:grayscale(.9) brightness(.8);opacity:.75}
.ic{height:1.2em;width:1.2em;vertical-align:-.28em;margin:0 .08em;pointer-events:none;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
.ico .ic{height:40px;width:40px}
#nav button .e .ic{height:28px;width:28px}
#atk .ic{height:52px;width:52px}
.ico{font-size:30px;width:44px;text-align:center;flex:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.cnt{font-size:15px}
.ok{color:#1d7a3c}.no{color:#a83030}
/* 하단 메뉴 : 철제+나무 */
#nav{display:flex;background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 3px,transparent 3px 15px),linear-gradient(#5a3a21,#2c1a0e);
  border-top:4px solid #150e08;box-shadow:inset 0 3px 0 #8a6a3a,0 -4px 10px rgba(0,0,0,.5);padding-bottom:env(safe-area-inset-bottom);position:relative;z-index:2}
#nav button{flex:1;border:0;background:transparent;font-size:13px;padding:7px 0 5px;cursor:pointer;position:relative;line-height:1.15;color:#dcc690;font-weight:800;letter-spacing:.5px}
#nav button .e{display:block;font-size:24px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
#nav button.on{background:linear-gradient(#efdfb6,#cdb176);color:var(--ink);box-shadow:inset 0 4px 0 var(--gold),inset 0 0 0 2px rgba(138,95,22,.5)}
#nav button .dot{position:absolute;top:4px;right:calc(50% - 26px);width:12px;height:12px;border-radius:50%;background:radial-gradient(#ff8a7a,#b01e1e);border:2px solid #150e08;display:none}
#nav button.has .dot{display:block}
.running #nav,.running #hint{display:none}
/* 던전 */
#runwrap{position:absolute;inset:0;display:none;background:#000}
#runwrap.on{display:block}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#runhud{position:absolute;left:0;right:0;top:0;padding:8px 10px;display:flex;gap:8px;align-items:center;pointer-events:none}
#runhud .chip{font-size:15px}
#tbar{flex:1}
#tbar .bar{height:14px;margin:0}
#hpw{position:absolute;left:10px;top:54px;width:min(260px,60%);pointer-events:none;color:var(--cream);text-shadow:0 2px 0 #000;font-size:15px}
#hpw .bar{height:15px;margin:0 0 2px;box-shadow:inset 0 0 0 1px #8a6a30,0 2px 0 #000}
#hpb{background:linear-gradient(#ff8a7a,#b01e1e)!important}
#combo{position:absolute;right:14px;bottom:176px;font-size:32px;color:#ffe9a8;text-shadow:0 3px 0 #150e08,0 0 14px rgba(255,190,70,.7);pointer-events:none;opacity:0;transition:opacity .15s;font-weight:800}
#combo small{font-size:14px;display:block;text-align:right}
#toolb{position:absolute;right:14px;bottom:122px;padding:3px 12px;border-radius:7px;font-size:15px;pointer-events:none;color:var(--cream);
  background:linear-gradient(#4a3320,#24160c);border:2px solid #8a6a30;box-shadow:0 3px 0 #000;text-shadow:0 1px 0 #000}
#quit{position:absolute;left:10px;bottom:12px}
#atk{position:absolute;right:16px;bottom:24px;width:92px;height:92px;border-radius:50%;font-size:42px;
  background:radial-gradient(circle at 35% 30%,#f6d57a,#a9771c 70%);border:4px solid #150e08;box-shadow:inset 0 0 0 3px rgba(255,236,170,.5),0 5px 0 #150e08;touch-action:none;cursor:pointer}
#atk2{position:absolute;right:118px;bottom:30px;width:66px;height:66px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bcd2e8,#4a6a8a 70%);border:4px solid #150e08;box-shadow:inset 0 0 0 3px rgba(220,240,255,.45),0 4px 0 #150e08;touch-action:none;cursor:pointer;padding:0}
#atk2 .ic{height:34px;width:34px}
#atk:active{transform:translateY(3px);box-shadow:inset 0 0 0 3px rgba(255,236,170,.4),0 2px 0 #150e08}
@media(hover:hover) and (pointer:fine){#atk,#atk2{display:none}#toolb{bottom:24px}#combo{bottom:76px}}
/* 모달 : 두루마리 */
#modal{position:fixed;inset:0;background:rgba(5,3,2,.78);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
#mbody{position:relative;width:min(520px,100%);max-height:92dvh;overflow-y:auto;padding:18px 18px 16px;
  background:radial-gradient(circle at 18% 10%,rgba(255,255,255,.42),transparent 42%),radial-gradient(circle at 90% 95%,rgba(120,70,20,.3),transparent 50%),linear-gradient(#efdfb4,#d5ba80);
  border:4px solid #150e08;border-radius:10px;box-shadow:inset 0 0 0 3px rgba(138,95,22,.65),inset 0 0 36px rgba(120,80,30,.45),0 0 0 3px #8a6a30,0 12px 0 #150e08,0 16px 30px rgba(0,0,0,.6);color:var(--ink)}
#mbody h2{color:#5a1f12;text-align:center;justify-content:center;text-shadow:0 1px 0 rgba(255,240,200,.7)}
#mbody h2::after{display:none}
#mbody h3{color:#5a1f12;text-shadow:none}
.steps{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.steps span{padding:2px 10px;border-radius:5px;border:2px solid #150e08;background:rgba(255,248,220,.5);font-size:14px}
.steps span.on{background:linear-gradient(#ecc15c,#a9771c)}
.gauge{position:relative;height:46px;background:linear-gradient(#3a2818,#1d130a);border:3px solid #150e08;border-radius:8px;overflow:hidden;margin:12px 0;box-shadow:inset 0 0 0 2px #8a6a30,inset 0 4px 10px #000}
.gauge .zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#5fa564 0 8px,#4a8c50 8px 16px)}
.gauge .zone i{position:absolute;top:0;bottom:0;left:50%;width:30%;transform:translateX(-50%);background:#ffe27a;opacity:.92}
.gauge .needle{position:absolute;top:-2px;bottom:-2px;width:8px;margin-left:-4px;background:linear-gradient(90deg,#ff8a7a,#b01e1e);border:2px solid #150e08;border-radius:4px}
.center{text-align:center}
.flash{height:30px;text-align:center;font-size:22px}
#arena{position:relative;height:300px;background:radial-gradient(circle at 50% 50%,#3a2a1c,#120c07);border:3px solid #150e08;border-radius:8px;overflow:hidden;margin:10px 0;touch-action:none;box-shadow:inset 0 0 0 2px #8a6a30,inset 0 0 40px #000}
.note{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;pointer-events:none}
.note .core{position:absolute;inset:23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a0,#c58a14);border:3px solid #fff4cf;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 0 12px rgba(255,210,100,.6)}
.note .ring{position:absolute;inset:23px;border-radius:50%;border:4px solid #fff;box-shadow:0 0 12px rgba(255,255,255,.7),inset 0 0 8px rgba(255,255,255,.5);transform:scale(4.2);will-change:transform}
.pop{animation:pop .5s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.glow5{animation:gl 1s infinite alternate}
@keyframes gl{from{filter:drop-shadow(0 0 4px #f59e0b)}to{filter:drop-shadow(0 0 16px #ffd24d)}}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%}
#toast div{background:linear-gradient(#2a1c10,#15100a);color:#f4e0a8;border:2px solid #8a6a30;border-radius:7px;padding:6px 14px;font-size:15px;animation:tin .25s ease-out;box-shadow:0 3px 0 #000;max-width:100%}
@keyframes tin{from{transform:translateY(-12px);opacity:0}}
.paper.openc{grid-column:1/-1}
.fcv{width:100%;aspect-ratio:16/10;display:block;border:3px solid #150e08;border-radius:8px;touch-action:none;margin:8px 0;background:#120c07}
#mbody.wide{width:min(720px,100%)}
.mixrow{display:flex;align-items:center;gap:6px;margin:4px 0}.mixn{min-width:24px;text-align:center;font-size:18px}
.slotrow{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0}
.opt{border:2px solid #150e08;border-radius:6px;background:rgba(255,248,220,.55);padding:3px 8px;font-size:14px;cursor:pointer}
.opt.on{background:linear-gradient(#ecc15c,#a9771c);box-shadow:0 0 0 2px rgba(138,95,22,.6)}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.eqi{height:46px;display:flex;align-items:center;justify-content:center}.eqi .ic{height:44px;width:44px}.eqi.empty:after{content:'';width:34px;height:34px;border:2px dashed rgba(60,35,10,.4);border-radius:8px}
.col{display:flex;flex-direction:column}
.warn{background:linear-gradient(#f3c9a8,#d99a78);border-color:#7a2a1a}
#lvbox.sp{box-shadow:0 0 0 2px #ffd24d,0 0 12px #ffb02e}
.eqslot{flex:1;min-width:92px;text-align:center;border:3px double #8a5f16;border-radius:8px;padding:6px 4px;background:rgba(255,248,220,.35);font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:2px solid #150e08;background:linear-gradient(#6a4628,#3d2615);color:#dcc690;border-radius:7px 7px 0 0;padding:5px 14px;font-size:15px;cursor:pointer;font-weight:800;box-shadow:inset 0 2px 0 rgba(255,220,160,.25)}
.tabs button.on{background:linear-gradient(#f0c964,#b07d1d);color:var(--ink)}
.mat{display:flex;align-items:center;gap:6px;background:rgba(255,248,220,.6);border:2px solid #150e08;border-radius:6px;padding:3px 8px;font-size:15px;color:var(--ink)}
.mats{display:flex;flex-wrap:wrap;gap:6px}
@media(min-width:700px){.btn.big{font-size:24px}}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="chip" id="coins">‹coin› 0</div>
    <div id="lvbox" class="chip" data-act="stats" style="cursor:pointer"><div class="lvtxt"><span id="lvt">Lv.1</span><span id="xpt"></span></div><div class="bar"><i id="xpb"></i></div></div>
    <button class="chip" id="setbtn" data-act="settings">‹gear›</button>
  </div>
  <div id="hint"></div>
  <div id="main">
    <section class="view on" id="v-class"></section>
    <section class="view" id="v-proc"></section>
    <section class="view" id="v-craft"></section>
    <section class="view" id="v-bag"></section>
    <section class="view" id="v-shop"></section>
    <div id="runwrap">
      <canvas id="cv"></canvas>
      <div id="runhud">
        <div class="chip" id="rt">‹timer› 0:00</div>
        <div id="tbar"></div>
        <div class="chip" id="rbag">‹bag› 0/50</div>
      </div>
      <div id="hpw"><div class="bar"><i id="hpb" style="width:100%"></i></div><span id="hpt"></span></div>
      <div id="toolb"></div>
      <div id="combo"></div>
      <button class="btn sm b5" id="quit" data-act="quitclass">‹door› 마을로</button>
      <button id="atk2"><img class="ic" alt="" src=""></button>
      <button id="atk">‹sword›</button>
    </div>
  </div>
  <nav id="nav">
    <button data-v="class" class="on"><span class="e">‹pick›</span>던전<i class="dot"></i></button>
    <button data-v="proc"><span class="e">‹flame›</span>제련<i class="dot"></i></button>
    <button data-v="craft"><span class="e">‹hammer›</span>대장간<i class="dot"></i></button>
    <button data-v="bag"><span class="e">‹bag›</span>가방<i class="dot"></i></button>
    <button data-v="shop"><span class="e">‹house›</span>상점<i class="dot"></i></button>
  </nav>
</div>
<div id="modal"><div id="mbody"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* =========================================================
   철혈의 대장간 : 중세 대장장이 (초안 v0.3)
   던전(전투+채굴) → 제련 → 대장간(3단 미니게임) → 판매/주문/강화
   ========================================================= */
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sum=o=>Object.values(o).reduce((a,b)=>a+b,0);
const fmt=n=>Math.floor(n).toLocaleString('ko-KR');
const pick=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- 데이터 ---------- */
const RARE=[{n:'일반',c:'#ffffff'},{n:'고급',c:'#7be3a0'},{n:'희귀',c:'#6cb6ff'},{n:'영웅',c:'#d98bff'}];
// 원재료 (수업에서 채집)
const RAW={
  wood:{n:'통나무',i:'‹ore_wood›',c:'#b9834f',hp:8,v:3,r:0},
  stone:{n:'돌덩이',i:'‹ore_stone›',c:'#8d939c',hp:10,v:3,r:0},
  copper:{n:'구리 광석',i:'‹ore_copper›',c:'#d9803a',hp:10,v:5,r:0},
  iron:{n:'철 광석',i:'‹ore_iron›',c:'#9aa5b1',hp:14,v:8,r:1},
  leather:{n:'짐승 가죽',i:'‹ore_leather›',c:'#a0693c',hp:9,v:5,r:1},
  cloth:{n:'거친 천',i:'‹ore_cloth›',c:'#c9b79c',hp:8,v:4,r:0},
  herb:{n:'약초',i:'‹ore_herb›',c:'#5fcf6e',hp:7,v:5,r:1},
  silver:{n:'은 광석',i:'‹ore_silver›',c:'#cfd8e3',hp:18,v:14,r:2},
  gold:{n:'금 광석',i:'‹ore_gold›',c:'#f2c230',hp:22,v:20,r:2},
  ruby:{n:'루비 원석',i:'‹ore_ruby›',c:'#e0314b',hp:26,v:28,r:3},
  mithril:{n:'미스릴 광석',i:'‹ore_mithril›',c:'#7fe3ff',hp:30,v:36,r:3},
};
// 1차 가공품 (pow = 재료 배율, 최종 장비 성능에 곱해짐)

function hexRgb(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255]}
function rgbHex(a){return '#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function mixHex(a,b,t){const x=hexRgb(a),y=hexRgb(b);return rgbHex(x.map((v,i)=>v+(y[i]-v)*t))}
function adj(h,amt){return rgbHex(hexRgb(h).map(v=>v+amt))}
function blendCols(list){let t=0,r=[0,0,0];for(const [h,w] of list){const c=hexRgb(h);t+=w;r=r.map((v,i)=>v+c[i]*w)}return t?rgbHex(r.map(v=>v/t)):'#c9d2dc'}
function mixInfo(r,mix){let n=0,p=0;const cl=[];for(const k in mix){const c=mix[k]||0;if(c<=0)continue;n+=c;p+=PROC[k].pow*c;cl.push([MATCOL[k],c])}
  const min=r.free?r.free.min:0;return {n,pow:n?p/n:0,mult:n?(p/n)*(1+.07*Math.max(0,n-min)):0,col:blendCols(cl)}}
function canMix(r,mix){if(r.lv>S.lv)return false;if(r.free){const mi=mixInfo(r,mix);if(mi.n<r.free.min||mi.n>r.free.max)return false;for(const k in mix)if((S.proc[k]||0)<mix[k])return false}
  if(r.req){for(const q of r.req){let need=q.n;if(r.free&&mix[q.id])need+=mix[q.id];if((S.proc[q.id]||0)<need)return false}}
  if(r.slots)return r.slots.every((s,i)=>(S.proc[s.o.find(o=>(S.proc[o]||0)>=s.n)||s.o[0]]||0)>=s.n);return true}

const used=()=>sum(S.raw)+sum(S.proc);

const needXp=lv=>60+45*(lv-1);
function addMat(kind,id,n,force){const sp=force?n:Math.min(n,Math.max(0,cap()-used()));if(sp>0)S[kind][id]=(S[kind][id]||0)+sp;return sp}
function takeMat(kind,id,n){if((S[kind][id]||0)<n)return false;S[kind][id]-=n;if(S[kind][id]<=0)delete S[kind][id];return true}
function gainXp(n){S.xp+=n;let up=false;while(S.lv<30&&S.xp>=needXp(S.lv)){S.xp-=needXp(S.lv);S.lv++;S.sp+=3;up=true;
  const nd=DUN.filter(d=>d.lv===S.lv).map(d=>d.n),nr=RECS.filter(r=>r.lv===S.lv).map(r=>r.n);
  toast(`‹star› Lv.${S.lv} 달성!${nd.length?' 새 던전: '+nd.join(','):''}${nr.length?' 새 레시피: '+nr.join(','):''} · 스탯 포인트 +3`);snd('level')}
  if(S.lv>=30)S.xp=0;hud();save()}

function itemStats(it){const R=REC[it.r],o={};for(const k in R.eff)o[k]=R.eff[k]*it.m;return o}
function itemName(it){return `${REC[it.r].n}`}
function matList(R,it){const a=[];(R.req||[]).forEach(x=>a.push([x.id,x.n]));if(it.mix)for(const k in it.mix)a.push([k,it.mix[k]]);if(it.sel)R.slots.forEach((s,i)=>a.push([it.sel[i],s.n]));return a}
function itemVal(it){const R=REC[it.r];let v=0;matList(R,it).forEach(([id,n])=>v+=n*procVal(id));return Math.round(v*1.6*TIERS[it.t].m)}
function recVal(r){let v=0;(r.req||[]).forEach(x=>v+=x.n*procVal(x.id));if(r.free)v+=r.free.min*procVal(r.free.kinds[Math.min(1,r.free.kinds.length-1)]);if(r.slots)r.slots.forEach(s=>v+=s.n*procVal(s.o[0]));return v}
function statLines(o){return Object.keys(o).map(k=>`<div class="small">${STAT[k](o[k])}</div>`).join('')}

function calcStats(snack){
  const sp=S.stats,s={hp:100+10*sp.vit,dmg:2+.35*sp.str,dmgOff:2+.35*sp.str,mine:2.6+S.up.tool+.3*sp.mine,time:8*S.up.time,penalty:0,combo:0,comboWin:.9,luck:.01*sp.luk,spd:1+.012*sp.dex,haste:Math.max(.6,1-.015*sp.dex)};
  for(const it of [gearBy(S.eq.main),gearBy(S.eq.helm),gearBy(S.eq.chest),gearBy(S.eq.legs),snack]){if(!it)continue;const o=itemStats(it);for(const k in o)s[k]=(s[k]||0)+o[k]}
  const off=gearBy(S.eq.off);if(off){const o=itemStats(off);s.dmgOff+=o.dmg||0;s.luck+=o.luck||0}
  s.penalty=Math.min(.8,s.penalty);return s}

let AC=null;
function tone(f,d,type='square',v=.06,slide=0,delay=0){
  if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function snd(k){
  switch(k){
    case'hit':tone(rnd(150,210),.07,'square',.05,-60);break;
    case'crit':tone(420,.12,'sawtooth',.06,300);break;
    case'break':tone(500,.12,'triangle',.08,300);tone(760,.12,'triangle',.06,0,.07);break;

    sc.push(F.k==='gauge'?await stageGauge(head(i),F,hand):F.k==='pour'?await stagePourDom(head(i),F,hand):await stageRingsDom(head(i),F,hand))}
  const avg=sc.reduce((a,b)=>a+b,0)/sc.length;return {sc,score:Math.round(avg*100),t:tierOf(Math.round(avg*100))};
}
function stageGauge(head,F,hand){
  return new Promise(async res=>{
    openModal(`${head}<h2>${F.t}</h2><div class="center small">${F.text}</div>
      <div class="gauge"><div class="zone" id="hz"></div><div class="needle" id="hn" style="left:15%"></div></div>
      <div class="bar" style="height:12px"><i id="ht" style="width:100%;background:var(--blue)"></i></div>
      <button class="btn big b4" id="hb" style="margin-top:12px;touch-action:none">${F.btn} (꾹)</button>`);
    let holding=false,heat=.15,t=0,inside=0,total=F.total,last=performance.now(),ph=rnd(0,6),w=.26*hand*(F.narrow||1);
    const dn=()=>{holding=true},up=()=>{holding=false};
    const b=$('hb');b.addEventListener('pointerdown',e=>{e.preventDefault();dn()});['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up));Hook.down=dn;Hook.up=up;
    await sleep(900);last=performance.now();
    const tick=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;if(!$('hz'))return;
      t+=dt;heat=clamp(heat+(holding?.75:-.6)*dt,0,1);
      const c=clamp(.5+.27*Math.sin(t*.9+ph)+.12*Math.sin(t*2.3+ph*2),w/2+.02,1-w/2-.02);if(Math.abs(heat-c)<=w/2)inside+=dt;
      $('hz').style.left=((c-w/2)*100)+'%';$('hz').style.width=(w*100)+'%';$('hn').style.left=(heat*100)+'%';$('ht').style.width=(100-t/total*100)+'%';
      if(t>=total){Hook.down=Hook.up=null;res(clamp(inside/total*1.08,0,1));return}requestAnimationFrame(tick)};requestAnimationFrame(tick);
  });
}
function stagePourDom(head,F,hand){
  return new Promise(async res=>{
    let scores=[],att=0;const n=F.rounds;
    const round=()=>new Promise(done=>{
      const c=rnd(.28,.72),w=.16*hand,pw=.045*hand;let pos=0,dir=1,sp=.95+.3*att+(n>=4?.35:0),running=true,last=performance.now();
      openModal(`${head}<h2>${F.t}${n>1?` (${att+1}/${n})`:''}</h2><div class="center small">${F.text}</div>
        <div class="gauge"><div class="zone" style="left:${(c-w/2)*100}%;width:${w*100}%"><i style="width:${pw/w*100}%"></i></div><div class="needle" id="pn"></div></div>
        <div class="flash" id="pf"></div><button class="btn big b2" id="pb">${F.btn}</button>`);
      const stop=()=>{if(!running)return;running=false;Hook.down=null;
        const d=Math.abs(pos-c)/hand;const sc=d<=.0225?1:Math.max(0,1-(d-.0225)/.3);scores.push(sc);
        $('pf').innerHTML=sc>.9?'완벽!':sc>.65?'좋아':sc>.3?'아쉬워':'빗나감';snd(sc>.9?'perfect':sc>.5?'good':'miss');setTimeout(done,600)};
      $('pb').addEventListener('pointerdown',e=>{e.preventDefault();stop()});Hook.down=stop;
      const tick=now=>{if(!running)return;const dt=Math.min(.05,(now-last)/1000);last=now;pos+=dir*sp*dt;if(pos>=1){pos=1;dir=-1}if(pos<=0){pos=0;dir=1}
        const nd=$('pn');if(!nd){running=false;return}nd.style.left=(pos*100)+'%';requestAnimationFrame(tick)};requestAnimationFrame(tick);
    });
    for(att=0;att<n;att++)await round();
    res(scores.reduce((a,b)=>a+b,0)/n);
  });
}
function stageRingsDom(head,F,hand){
  return new Promise(async res=>{
    openModal(`${head}<h2>${F.t}</h2><div class="center small">${F.text}</div><div id="arena"></div><div class="flash" id="hf">준비…</div>`);
    const arena=$('arena'),N=F.N,T=1.35,S0=4.2,S1=.45,tHit=(S0-1)/(S0-S1)*T;let scores=[];
    await sleep(900);
    for(let i=0;i<N;i++){
      const sc=await new Promise(done=>{
        const nt=document.createElement('div');nt.className='note';nt.style.left=rnd(26,74)+'%';nt.style.top=rnd(32,68)+'%';
        nt.innerHTML='<div class="ring"></div><div class="core"></div>';arena.appendChild(nt);
        const ring=nt.querySelector('.ring');const t0=performance.now();let fin=false;
        const finish=(s,txt)=>{if(fin)return;fin=true;arena.removeEventListener('pointerdown',tap);Hook.down=null;
          const h=$('hf');if(h)h.innerHTML=txt;nt.remove();snd(s>.9?'clang':s>.4?'good':'miss');setTimeout(()=>done(s),350)};
        const tap=e=>{e.preventDefault();const dt=Math.abs((performance.now()-t0)/1000-tHit)/hand;
          if(dt<=.07)finish(1,'PERFECT!');else if(dt<=.14)finish(.8,'GREAT');else if(dt<=.24)finish(.5,'GOOD');else finish(.15,'BAD')};
        arena.addEventListener('pointerdown',tap);Hook.down=()=>tap({preventDefault(){}});
        const tick=()=>{if(fin)return;const t=(performance.now()-t0)/1000;
          if(t>=T){finish(0,'MISS');return}
          const sc=S0-(S0-S1)*t/T;ring.style.transform=`scale(${sc})`;ring.style.borderWidth=(4/sc).toFixed(2)+'px';ring.style.opacity=Math.min(1,t*6);requestAnimationFrame(tick)};requestAnimationFrame(tick);
      });
      scores.push(sc);
    }
    res(scores.reduce((a,b)=>a+b,0)/N);
  });
}

function iconDraw(name,c){
  if(ICF[name])return ICF[name](c);if(ICX[name])return ICX[name](c);
  const [fam,...rest]=name.split('_'),id=rest.join('_');
  if(fam==='ore'){const sp=nodeSprite(id,0);c.save();c.scale(64/NSZ,64/NSZ);c.translate(-NSZ/2,-NSZ/2-8*NK/3+6);c.drawImage(sp,0,0);c.restore();return}
  if(fam==='rec'){const r=REC[id];const u=craftIcon(r,null,128);const im=new Image();im.src=u;c.drawImage(im,-32,-32,64,64);return}
  if(fam==='mon'){const boss=['boar','goblinchief','skelcap','bear','dragon'].includes(id),a=ART[id]||ART.bat,m={x:0,y:12,a:id,n:id,hp:0,max:1,r:boss?34:20,boss:false,hideBar:1,hit:0,ph:1,state:'idle',face:1},Rr={clock:1.3,P:{x:-999,y:0}};
    c.save();const k=boss?.62:1.05/(a.k||1)*(a.k?1:1);c.scale(k,k);drawMonster(c,m,Rr);c.restore();return}
  circ(c,0,0,18,'#c9b79c',2.4);
}
function icoURL(name){
  if(ICN[name])return ICN[name];
  const px=96,cv=document.createElement('canvas');cv.width=cv.height=px;const c=cv.getContext('2d');c.translate(px/2,px/2);c.scale(px/64,px/64);
  try{iconDraw(name,c)}catch(e){console.warn('icon',name,e)}
  return ICN[name]=cv.toDataURL();
}
/* rec_ 아이콘은 이미지 로딩이 비동기라 직접 craftIcon 이미지를 쓴다 */
function icoSrc(name){
  if(name.startsWith('rec_')){if(!ICN[name])ICN[name]=craftIcon(REC[name.slice(4)],null,128);return ICN[name]}
  return icoURL(name);
}
const TOK=/‹(\w+)›/g;
function iconify(node){
  if(node.nodeType===3){
    if(node.nodeValue.indexOf('‹')<0)return;
    const frag=document.createDocumentFragment();let last=0,m;TOK.lastIndex=0;const v=node.nodeValue;
    while((m=TOK.exec(v))){if(m.index>last)frag.appendChild(document.createTextNode(v.slice(last,m.index)));
      const im=document.createElement('img');im.className='ic';im.src=icoSrc(m[1]);im.alt='';im.draggable=false;frag.appendChild(im);last=TOK.lastIndex}
    if(last<v.length)frag.appendChild(document.createTextNode(v.slice(last)));
    node.parentNode&&node.parentNode.replaceChild(frag,node);return}
  if(node.nodeType===1){if(node.tagName==='SCRIPT'||node.tagName==='STYLE'||node.tagName==='CANVAS')return;[...node.childNodes].forEach(iconify)}
}
new MutationObserver(ms=>{for(const m of ms){if(m.type==='characterData')iconify(m.target);else m.addedNodes.forEach(iconify)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
iconify(document.body);
/* 캔버스 텍스트 + 아이콘 */
const ICIMG={};
function icoImg(name){if(!ICIMG[name]){const im=new Image();im.src=icoSrc(name);ICIMG[name]=im}return ICIMG[name]}
function iconText(c,t,x,y,fill,stroke){
  const m=/‹(\w+)›/.exec(t),txt=t.replace(/‹\w+›/g,'').trim();
  const fs=parseInt(c.font.match(/(\d+)px/)[1])||20,iw=m?fs*1.15:0,tw=c.measureText(txt).width,tot=tw+(m?iw+5:0),x0=x-tot/2;
  c.textAlign='left';const tx=x0+(m?iw+5:0);
  if(stroke){c.strokeStyle=stroke;c.strokeText(txt,tx,y)}c.fillStyle=fill;c.fillText(txt,tx,y);
  if(m){const im=icoImg(m[1]);if(im.complete)c.drawImage(im,x0,y-fs*.95,iw,iw)}
}
