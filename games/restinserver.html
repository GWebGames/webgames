function runBurn(labels,done){
 scene(`<div class="burn"><div class="btop"><span>🔥 영구 삭제 프로토콜 — 노드를 연타해 소각하라</span><button class="btn sm dim" data-act="skipburn">건너뛰기</button></div><canvas id="bc"></canvas></div>`);
 const cv=$('#bc'),W=cv.width=cv.clientWidth||320,H=cv.height=cv.clientHeight||240,ctx=cv.getContext('2d');
 const rnd=(a,b)=>a+Math.random()*(b-a);
 const nodes=[],parts=[],dust=[];let ended=false,fin=0,raf=0,last=performance.now(),tm=null;
 labels.forEach(t=>{const w=Math.min(190,W*.6);nodes.push({t,main:1,w,h:34,x:rnd(0,W-w),y:rnd(10,H-50),vx:(Math.random()<.5?-1:1)*rnd(40,70),vy:(Math.random()<.5?-1:1)*rnd(30,60),hp:3,burn:0,sh:0});});
 ['cache.tmp','thumbs.db','~$temp','log.old','cookie.dat'].forEach(t=>nodes.push({t,main:0,w:88,h:26,x:rnd(0,W-88),y:rnd(10,H-40),vx:(Math.random()<.5?-1:1)*rnd(60,110),vy:(Math.random()<.5?-1:1)*rnd(50,90),hp:1,burn:0,sh:0}));
 function end(){if(ended)return;ended=true;cancelAnimationFrame(raf);clearTimeout(tm);BURN=null;hideScene();done();}
 BURN={end};
 const spark=(x,y,n,c)=>{for(let i=0;i<n;i++)parts.push({x,y,vx:rnd(-60,60),vy:rnd(-110,-20),l:rnd(.3,.8),c:c||['#ff9f1c','#ffd166','#ff4d6d','#fff'][i%4]});};
 cv.addEventListener('pointerdown',e=>{
  if(ended)return;const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];if(!n.burn&&x>=n.x&&x<=n.x+n.w&&y>=n.y&&y<=n.y+n.h){
   n.hp--;n.sh=.18;spark(x,y,8);sfx('burn');n.vx*=1.15;n.vy*=1.15;if(n.hp<=0){n.burn=.9;spark(n.x+n.w/2,n.y+n.h/2,24);}break;}}
 });
 function frame(now){
  if(ended)return;const dt=Math.min(.05,(now-last)/1000);last=now;
  ctx.fillStyle='#14060b';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#14102a';for(let x=0;x<W;x+=24)ctx.fillRect(x,0,1,H);for(let y=0;y<H;y+=24)ctx.fillRect(0,y,W,1);
  ctx.font='11px GalmuriPx, monospace';ctx.textBaseline='middle';
  for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];
   n.x+=n.vx*dt*(n.burn?.3:1);n.y+=n.vy*dt*(n.burn?.3:1);
   if(n.x<0){n.x=0;n.vx=Math.abs(n.vx);}if(n.x+n.w>W){n.x=W-n.w;n.vx=-Math.abs(n.vx);}if(n.y<0){n.y=0;n.vy=Math.abs(n.vy);}if(n.y+n.h>H){n.y=H-n.h;n.vy=-Math.abs(n.vy);}
   if(n.sh>0)n.sh-=dt;
   if(n.burn>0){n.burn-=dt;if(Math.random()<.6)spark(n.x+rnd(0,n.w),n.y+rnd(0,n.h),1);
    if(n.burn<=0){if(n.main){ctx.font='11px GalmuriPx, monospace';let px=n.x+10;for(const ch of n.t){dust.push({ch,x:px,y:n.y+n.h/2,vx:rnd(-20,30),vy:rnd(-60,-15),l:rnd(1.4,2.2),m:2.2});px+=ctx.measureText(ch).width;}}nodes.splice(i,1);continue;}}
   const ox=n.sh>0?rnd(-3,3):0;
   ctx.fillStyle=n.burn>0?'#5a1d12':(n.main?'#1b2a4a':'#1a1a2a');ctx.fillRect(n.x+ox,n.y,n.w,n.h);
   ctx.fillStyle=n.burn>0?'#ff9f1c':(n.main?'#5df2c0':'#4a4a6a');ctx.fillRect(n.x+ox,n.y,n.w,2);ctx.fillRect(n.x+ox,n.y+n.h-2,n.w,2);ctx.fillRect(n.x+ox,n.y,2,n.h);ctx.fillRect(n.x+ox+n.w-2,n.y,2,n.h);
   ctx.fillStyle=n.burn>0?'#ffd166':'#c9f7e3';let t=n.t;const mw=n.w-(n.main?44:14);while(t.length>1&&ctx.measureText(t).width>mw)t=t.slice(0,-1);ctx.fillText(t+(t.length<n.t.length?'…':''),n.x+ox+8,n.y+n.h/2+1);
   if(n.main&&!n.burn){for(let k=0;k<3;k++){ctx.fillStyle=k<n.hp?'#ff4d6d':'#3a2030';ctx.fillRect(n.x+n.w-34+k*10+ox,n.y+n.h/2-4,8,8);}}
  }
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.l-=dt;if(p.l<=0){parts.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x),Math.round(p.y),3,3);}
  ctx.font='11px GalmuriPx, monospace';
  for(let i=dust.length-1;i>=0;i--){const p=dust[i];p.l-=dt;if(p.l<=0){dust.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=clamp(p.l/p.m*1.6,0,1);ctx.fillStyle='#c9f7e3';ctx.fillText(p.ch,p.x,p.y);ctx.globalAlpha=1;}
  if(!nodes.some(n=>n.main)){
   fin+=dt;ctx.fillStyle='#5df2c0';ctx.textAlign='center';ctx.font='22px GalmuriPx, monospace';ctx.globalAlpha=clamp(fin*2,0,1);ctx.fillText('— PERMANENTLY DELETED —',W/2,H/2);ctx.globalAlpha=1;ctx.textAlign='left';
   if(fin>2.6){end();return;}
  }
  raf=requestAnimationFrame(frame);
 }
 raf=requestAnimationFrame(frame);
}
