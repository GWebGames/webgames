<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>[hidden]{display:none!important}</style></head><body><title>IT 컴퍼니 타이쿤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: 블루프린트(설계도) 느낌의 사무실 평면도가 중심. 왼쪽은 사무실·프로젝트·재무, 오른쪽은 탭으로 운영 메뉴. */
:root{
  --bg:#EAEFF6; --surface:#FFFFFF; --surface2:#F3F6FB; --ink:#0F1A33; --muted:#586682; --line:#D2DAE7; --grid:#DDE5F1;
  --accent:#F25C1F; --accent-ink:#FFFFFF; --good:#127A49; --bad:#C8243A; --warn:#A86B00;
  --dev:#3A63F0; --des:#D0397F; --pm:#0C8F87; --mkt:#B98300;
  --shadow:0 1px 0 rgba(15,26,51,.04),0 8px 20px -14px rgba(15,26,51,.35);
  --f-display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1122; --surface:#111B33; --surface2:#16223F; --ink:#E7ECF7; --muted:#9AA8C6; --line:#27365A; --grid:#1B2A4A;
    --accent:#FF7A3D; --accent-ink:#1A0B02; --good:#3FD08B; --bad:#FF6B80; --warn:#F0B73A;
    --dev:#7C98FF; --des:#F27AB4; --pm:#3CCFC4; --mkt:#F4C22E; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1122; --surface:#111B33; --surface2:#16223F; --ink:#E7ECF7; --muted:#9AA8C6; --line:#27365A; --grid:#1B2A4A;
  --accent:#FF7A3D; --accent-ink:#1A0B02; --good:#3FD08B; --bad:#FF6B80; --warn:#F0B73A;
  --dev:#7C98FF; --des:#F27AB4; --pm:#3CCFC4; --mkt:#F4C22E; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
h1{font:400 30px/1.1 var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font:400 18px/1.2 var(--f-display);margin:0;letter-spacing:.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.date{font:500 13px var(--f-mono);color:var(--muted);margin-top:4px}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.mbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.mbar i{display:block;height:100%;width:0;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em}
.stat b{display:block;font:600 17px/1.3 var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat em{display:block;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sub{font:500 12px var(--f-mono);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface2);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:600;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.on{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plan{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--surface2);padding:14px;border:1px solid var(--line);border-radius:10px}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px}
.desk{aspect-ratio:1/1;max-width:100%;border:1.5px solid var(--ink);background:var(--surface);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.desk .mon{width:46%;height:7px;background:var(--role);opacity:.3;border-radius:1px}
.desk b{font:400 19px/1 var(--f-display);color:var(--role)}
.desk .sk{font:500 9px var(--f-mono);color:var(--muted);letter-spacing:.05em}
.desk.empty{border:1.5px dashed var(--muted);background:transparent;color:var(--muted);font-size:18px}
.desk.ceo{border-color:var(--accent)}
.working .desk .mon{animation:blink 1.1s steps(2,end) infinite;animation-delay:var(--d,0s)}
@keyframes blink{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.working .desk .mon{animation:none;opacity:.9}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--role,var(--accent))}
.bar.thin{height:4px;margin-top:3px}
.ptitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:6px;font-size:13px}
.num{font:500 12px var(--f-mono);color:var(--muted);min-width:70px;text-align:right}
.hint,.rates,.empty{color:var(--muted);font-size:12.5px;margin:8px 0}
.empty{font-size:13.5px;line-height:1.6}
.pill{display:inline-block;font:600 11px var(--f-mono);padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;color:var(--role);border:1px solid var(--role);white-space:nowrap}
.good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)} .warnc{color:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:-4px 0 6px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .meta{color:var(--muted);font-size:12px;margin-top:1px}
.row .act{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.sect{font:400 15px var(--f-display);margin:14px 0 2px;color:var(--muted);letter-spacing:.04em}
.sect:first-child{margin-top:4px}
.mono{font-family:var(--f-mono)}
ol.log{list-style:none;margin:0;padding:0;font-size:13px}
ol.log li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
ol.log li:last-child{border-bottom:0}
ol.log time{font:500 11px var(--f-mono);color:var(--muted);flex:none;padding-top:2px;min-width:62px}
ul.goals{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 14px;font-size:13px}
ul.goals li{display:flex;gap:8px}
ul.goals li.done{color:var(--muted);text-decoration:line-through}
ul.goals li i{font-style:normal;font-family:var(--f-mono);color:var(--good);width:14px;flex:none}
svg.spark{display:block;width:100%;height:auto}
svg.spark .t{fill:var(--muted);font:500 10px var(--f-mono)}
.overlay{position:fixed;inset:0;background:rgba(8,14,30,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(470px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.modal h3{font:400 24px/1.2 var(--f-display);margin:0 0 8px}
.modal p{line-height:1.65}
.modal ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.modal .choices .btn{text-align:left;padding:10px 12px}
.toasts{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:60;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:500;max-width:min(440px,100%);box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.toast.good{box-shadow:inset 4px 0 0 var(--good),0 6px 18px -8px rgba(0,0,0,.5)}
.toast.bad{box-shadow:inset 4px 0 0 var(--bad),0 6px 18px -8px rgba(0,0,0,.5)}
.chk{display:flex;gap:8px;font-size:13px;padding:2px 0}
.chk i{font-style:normal;font-family:var(--f-mono);width:14px;flex:none}
.modal .choices .btn small{display:block;font-weight:500;font-size:12px;opacity:.75;margin-top:2px;line-height:1.4}
.modal .sect{margin-top:12px}
.modal textarea{width:100%;font:500 11px/1.4 var(--f-mono);color:var(--ink);background:var(--surface2);border:1px solid var(--line);border-radius:7px;padding:8px;resize:vertical;margin:6px 0}
.slot{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.slot .grow{flex:1;min-width:140px;font-size:12.5px}
.slot .grow small{display:block;color:var(--muted);font-size:11.5px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:4px 0}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.badge{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface2);opacity:.55;min-width:0}
.badge.on{opacity:1;border-color:var(--accent)}
.badge b{display:block;font-size:13px}
.badge span{font-size:11.5px;color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px 14px;margin:6px 0}
.kv div{display:flex;justify-content:space-between;gap:8px;font-size:13px;border-bottom:1px dashed var(--line);padding:3px 0}
.kv b{font-family:var(--f-mono);font-weight:600}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:70}
#fx i{position:absolute;top:-16px;border-radius:2px;animation:fall 2.1s cubic-bezier(.3,.5,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}
.working .desk b{animation:bob .8s steps(2,end) infinite;animation-delay:var(--d,0s)}
@keyframes bob{50%{transform:translateY(-2px)}}
.desk b{transition:transform .5s,opacity .5s}
.desk.brk b{transform:translateX(16px);opacity:.3;animation:none}
.desk.brk::after{content:'휴식';position:absolute;top:-8px;right:-4px;font:600 9px var(--f-mono);background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:99px}
@media (prefers-reduced-motion:reduce){.working .desk b{animation:none}.desk b{transition:none}#fx{display:none}}
.row .act.h{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:270px}
.thead{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:16px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.thead .grow{flex:1;min-width:150px}
.thead b{font:600 13px var(--f-mono)}
.zone{grid-column:1/-1;font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin-top:4px}
.desk.head::before{content:'팀장';position:absolute;top:-8px;left:-4px;font:600 9px var(--f-mono);background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:99px}
.bub{position:absolute;bottom:calc(100% + 5px);left:50%;transform:translateX(-50%);width:max-content;max-width:140px;background:var(--ink);color:var(--bg);font:500 11px/1.35 inherit;font-family:inherit;padding:4px 8px;border-radius:8px;z-index:6;pointer-events:none;animation:bubin .2s ease-out}
.bub::after{content:'';position:absolute;top:100%;left:50%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--ink)}
@keyframes bubin{from{opacity:0;transform:translate(-50%,4px)}}
ul.chron{list-style:none;margin:6px 0;padding:0;font-size:12.5px}
ul.chron li{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--line)}
ul.chron time{font:500 11px var(--f-mono);color:var(--muted);min-width:76px}
.modal input[type=text]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);font:inherit;margin-top:6px}
.goals li.lh{grid-column:1/-1;font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.04em;margin-top:6px;border:0}
.tname{font:600 12px var(--f-mono);color:var(--muted);margin:12px 0 4px;letter-spacing:.04em}
.working .desk.idle b{animation:none}.working .desk.idle .mon{animation:none;opacity:.45}
.tip{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.tip .lab{font:600 11px var(--f-mono);color:var(--accent-ink);background:var(--accent);border-radius:99px;padding:2px 10px;letter-spacing:.04em;white-space:nowrap}
.tip.warn{border-color:var(--bad)}
.tip.warn .lab{background:var(--bad);color:var(--accent-ink)}
.tip .tx{flex:1;min-width:200px;font-size:13.5px}
.tip .tx small{display:block;color:var(--muted);font-size:12px;margin-top:2px;line-height:1.5}
.tab.hint::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.tab.hint::after{animation:none}}
ul.chem{margin:4px 0 0;padding-left:18px;font-size:13px}
.modal ul.help{color:var(--ink);line-height:1.6}
.modal .sect.h{margin-top:14px}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>IT 컴퍼니 타이쿤</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="ctrl" id="ctrl">
      <button class="btn sm" id="bPause" data-act="pause">일시정지</button>
      <button class="btn sm" data-act="speed" data-v="1">1x</button>
      <button class="btn sm" data-act="speed" data-v="2">2x</button>
      <button class="btn sm" data-act="speed" data-v="4">4x</button>
      <button class="btn sm" data-act="menu">저장·불러오기</button>
      <button class="btn sm" data-act="settings">설정</button>
      <button class="btn sm" data-act="help">도움말</button>
      <button class="btn sm" id="bReset" data-act="reset">새로 시작</button>
    </div>
  </header>
  <div class="mbar" aria-hidden="true"><i id="mbar"></i></div>

  <section class="stats">
    <div class="stat"><small>현금</small><b id="s-cash"></b><em id="s-cashsub"></em></div>
    <div class="stat"><small>월 수입</small><b id="s-inc"></b><em id="s-incsub"></em></div>
    <div class="stat"><small>월 지출</small><b id="s-exp"></b><em id="s-expsub"></em></div>
    <div class="stat"><small>평판</small><b id="s-rep"></b><em id="s-repsub"></em></div>
    <div class="stat"><small>인지도</small><b id="s-brand"></b><em id="s-brandsub"></em></div>
    <div class="stat"><small>팀 사기</small><b id="s-mor"></b><div class="bar thin"><i id="s-morbar"></i></div></div>
    <div class="stat"><small>직원</small><b id="s-staff"></b><em id="s-staffsub"></em></div>
    <div class="stat"><small>시장</small><b id="s-mkt"></b><em id="s-mktsub"></em></div>
    <div class="stat"><small id="s-valL">기업 가치</small><b id="s-val"></b><em id="s-valsub"></em></div>
  </section>

  <section class="tip" id="tip" aria-live="polite" hidden></section>

  <div class="main">
    <div class="col">
      <section class="plan" aria-label="사무실 평면도">
        <div class="chead"><h2 id="officeName"></h2><span class="sub" id="officeSub"></span></div>
        <div class="desks" id="desks"></div>
      </section>
      <section class="card" id="projCard"></section>
      <section class="card" id="finCard"></section>
      <section class="card"><div class="chead"><h2>목표</h2><span class="sub" id="goalSub"></span></div><ul class="goals" id="goals"></ul></section>
    </div>
    <div class="col">
      <section class="card">
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div id="panel"></div>
      </section>
      <section class="card"><div class="chead"><h2>사내 소식</h2></div><ol class="log" id="log"></ol></section>
    </div>
  </div>
</div>

<div class="overlay" id="ov" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>

<script>
(function(){
'use strict';
var SAVE_KEY='itTycoon.v1', MONTH_SEC=5;

var OFFICES=[

  {n:'중형 오피스',cap:20,rent:500,cost:6000},
  {n:'판교 사옥',cap:50,rent:2200,cost:30000},
  {n:'AI 캠퍼스',cap:120,rent:9000,cost:120000}
];
var TECHS=[
  {id:'git',n:'Git 워크플로',d:'개발 속도 +15%',cost:600,months:2,req:[],fx:{dev:.15}},
  {id:'agile',n:'애자일 스크럼',d:'전 직군 속도 +10%',cost:1200,months:3,req:[],fx:{all:.10}},
  {id:'sec',n:'보안 체계',d:'서버 장애 이벤트가 사라집니다',cost:1800,months:3,req:[]},
  {id:'brand',n:'브랜드 가이드',d:'평판 획득량 +40%',cost:2000,months:3,req:[]},

function delegPick(t,hd){
  var best=null,bs=0,spec=S.tspec[t],poor=S.cash<payroll()*4;
  S.contracts.forEach(function(c){
    var e=estMonths(c.need,t);if(e===Infinity||e>c.months*.85)return;
    var sc=c.reward/Math.max(e,1)*(spec==='ctr'?1.3:1)*(poor?1.5:1);
    if(sc>bs){bs=sc;best={k:'c',o:c}}
  });
  var keep=payroll()*3+300;
  PRODUCTS.forEach(function(d){
    if(prodLock(d)||S.cash-d.cost<keep)return;
    var e=estMonths(d.need,t);if(e===Infinity||e>20)return;
    var sc=(d.inc*18-d.cost)/Math.max(e,1)*(spec===d.id?1.3:1)*(poor?.4:1);
    if(S.products.some(function(q){return q.def===d.id})||S.projs.some(function(q){return q&&q.def===d.id}))sc*=.5;
    if(sc>bs){bs=sc;best={k:'p',o:d}}
  });
  if(!best)return;
  if(best.k==='c'){
    var i=S.contracts.indexOf(best.o);if(i>=0)S.contracts.splice(i,1);
    startContract(t,best.o);
    say('['+teamName(t)+'] 팀장 '+hd.name+'님이 \''+best.o.name+'\' 계약을 따왔습니다. (대금 '+money(best.o.reward)+')');
  }else{
    S.cash-=best.o.cost;startProduct(t,best.o);
    say('['+teamName(t)+'] 팀장 '+hd.name+'님이 \''+best.o.n+'\' 개발을 시작했습니다. (착수금 '+money(best.o.cost)+')');

}

function bgmBus(c){

function bNote(c,type,f,t,dur,v,att,send){

  o.connect(g);g.connect(BGM.bus.inp);if(send)g.connect(BGM.bus.send);

}
function bKick(c,t){

  g.gain.setValueAtTime(.16,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);

  var s=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
  s.buffer=BGM.noise;fl.type=type;fl.frequency.value=f;

function bgmStep(c,step,t,spb,M){
  var bar=Math.floor(step/16)%4,s=step%16,ch=M.ch[bar],r=M.rt[bar],k=BGM.cur;
  if(s===0)ch.forEach(function(m,i){bNote(c,i%2?'triangle':'sine',mtof(m),t,spb*15,k==='tense'?.014:.016,.4,false)});
  if(k==='tense'){
    if(s%2===0)bNote(c,'sine',mtof(r),t,spb*1.6,.06,.01,false);
    if(s===0||s===8)bKick(c,t);
    if(s===4||s===12)bNoise(c,t,.1,.045,'bandpass',2200);
    bNoise(c,t,.03,s%4===0?.03:.014,'highpass',8000);
    if(s===14&&Math.random()<.5)bNote(c,'sine',mtof(M.sc[ri(3,5)]),t,spb*3,.02,.01,true);
  }else if(k==='bright'){
    if(s===0||s===6||s===10)bNote(c,'sine',mtof(r),t,spb*(s===0?4:3),.07,.02,false);
    if(s%4===0)bKick(c,t);
    if(s===4||s===12)bNoise(c,t,.12,.05,'bandpass',2000);
    if(s%2===0){
      bNoise(c,t,.04,s%4===2?.035:.018,'highpass',7000);
      bNote(c,'triangle',mtof(ch[(s/2|0)%4]+12),t,spb*1.8,.016,.008,true);
    }
  }else{
    if(s===0||s===6||s===10)bNote(c,'sine',mtof(s===10&&bar%2?r+7:r),t,spb*(s===0?5:3),.075,.02,false);
    if(s===0||s===8||(s===10&&bar%2===1))bKick(c,t);
    if(s===4||s===12)bNoise(c,t,.13,.05,'bandpass',1800);
    if(s%2===0)bNoise(c,t,.04,s%4===2?.03:.016,'highpass',7000);
  }
  if(s%2===0&&Math.random()<M.mel){
    BGM.last=clamp(BGM.last+pick([-2,-1,-1,0,1,1,2]),0,M.sc.length-1);
    bNote(c,'triangle',mtof(M.sc[BGM.last]),t,spb*3.5,.03,.012,true);
  }
}
function bgmTick(){
  var c=ctx();if(!c||c.state!=='running'||!BGM.bus)return;
  if(BGM.next<c.currentTime)BGM.next=c.currentTime+.05;
  while(BGM.next<c.currentTime+.5){
    if(BGM.step%16===0){
      var m=moodNow();
      if(m!==BGM.cur){BGM.cur=m;BGM.bus.inp.frequency.setTargetAtTime(MOODS[m].lp,BGM.next,.4)}
    }
    var M=MOODS[BGM.cur],spb=60/M.bpm/4;
    bgmStep(c,BGM.step,BGM.next,spb,M);BGM.next+=spb;BGM.step=(BGM.step+1)%64;
  }
}

function applyScen(k){
  var s=S;
  if(k==='slump'){s.mkt.cycle='slump';s.mkt.cl=14;s.nextCycle='boom';s.cash+=500}
  else if(k==='vc'){
    s.cash+=7000;s.eq=80;s.office=1;s.rep=5;
    s.staff.push(mkStaff('dev',2));
    s.staff.push(mkStaff('des',2));
  }else if(k==='ex'){
    s.rep=25;s.cash-=500;s.morale=80;
    s.staff.push(mkStaff('dev',4));
  }else if(k==='rival'){
    s.cash+=2000;s.rivals.forEach(function(r){r.rev=Math.round(r.rev*1.7)});
  }
}
function spawnRival(inc){
  var used=S.rivals.map(function(r){return r.name}),av=RIVAL_NAMES.filter(function(n){return used.indexOf(n)<0});
  var nm=av.length?pick(av):pick(RIVAL_NAMES)+' 2',rv=Math.max(300,Math.round(inc*.35*rnd(.8,1.2))),opts=[];
  PRODUCTS.forEach(function(d,i){if(rv>=TIER_T[i])opts.push(d.id)});
  S.rivals.push({name:nm,rev:rv,focus:opts[Math.max(0,opts.length-1-ri(0,1))]});
  say('신생 경쟁사 '+nm+'이(가) 시장에 뛰어들었습니다.','bad');
}
function slotInfo(o){return monthLabel(o.month)+' · '+DIFFS[o.diff||'normal'].n+' · '+SCENS[o.scen||'std'].n+' · 현금 '+money(o.cash)+' · 직원 '+(o.staff.length+1)+'명'}
function pickSlot(cb){
  var sl=[1,2,3].map(readSlot),e=-1,i;
  for(i=0;i<3;i++)if(!sl[i]&&e<0)e=i;
  if(e>=0){cb(e+1);return}
  var ch=sl.map(function(o,i){return {t:'<b>슬롯 '+(i+1)+'</b><small>'+slotInfo(o)+'</small>',fn:function(){cb(i+1)}}});
  ch.push({t:'취소',fn:function(){if(!S||S.over)startMenu()}});
  modal({title:'덮어쓸 슬롯 선택',body:'<p>저장 슬롯 3개가 모두 차 있습니다. 새 게임을 저장할 슬롯을 고르세요. 그 슬롯의 기존 게임은 사라집니다.</p>',choices:ch});
}
function startMenu(){
  var ch=Object.keys(DIFFS).map(function(k){return {t:'<b>'+DIFFS[k].n+'</b><small>'+DIFFS[k].d+'</small>',fn:function(){scenMenu(k)}}});

}

}

function scaleNeed(p,m){var f=function(v){return Math.max(5,Math.round(v*m/5)*5)};p.need={dev:f(p.need.dev),des:f(p.need.des),pm:f(p.need.pm)}}

    if(!p||p.kind!=='contract'||(p.chg||0)>=2||p.late>0||p.left<2)return;

      {t:'기대에 부응한다 (사기 -2, 납품 시 평판 2배)',p:true,fn:function(){p.vip=true;S.morale=Math.max(0,S.morale-2);done('\''+p.name+'\' 납품 평판이 2배가 됩니다.')}},
      {t:'정중히 사양한다',fn:function(){done('평소대로 진행합니다.')}}]}
  ];

  }
  modal({title:x.t+tn,body:'<p>'+nm+' 고객사에서 연락이 왔습니다. '+x.b+'</p>',choices:x.c});
}
function advance(dt){
  var ti,nt=nTeams();
  for(ti=0;ti<nt;ti++){
    var p=S.projs[ti];if(!p)continue;
    var out=calcOut(ti);
    ROLE_KEYS.forEach(function(k){p.prog[k]=Math.min(p.need[k],p.prog[k]+out[k]*dt)});
    if(ROLE_KEYS.every(function(k){return p.prog[k]>=p.need[k]-1e-6})){completeProject(ti);delegTick();renderAll()}
  }
  if(S.research){S.research.left-=dt;if(S.research.left<=0)finishResearch()}
  S.mf+=dt;if(S.mf>=1){S.mf-=1;monthEnd()}
}
function finishResearch(){
  var t=TECHS.filter(function(x){return x.id===S.research.id})[0];
  S.techs[t.id]=true;S.research=null;
  say('연구 완료: '+t.n+' ('+t.d+')','good');toast('연구 완료: '+t.n,'good');checkGoals();renderAll();
}
function completeProject(ti){
  var p=S.projs[ti];S.projs[ti]=null;
  var sk=p.kind==='contract'?'ctr':p.def,te=S.texp[ti];te[sk]=(te[sk]||0)+1;
  if(S.tspec[ti]===sk&&te[sk]<=5)say(teamName(ti)+' 전문성이 올랐습니다. ('+specName(sk)+' Lv'+te[sk]+')','good');
  if(p.kind==='contract'){
    var mult=1,note='';
    if(p.late>0){mult=Math.max(.4,1-.2*p.late);note=' (납기 초과 '+p.late+'개월, 대금 '+Math.round(mult*100)+'%)'}
    else if(p.left>=1){var b=Math.min(.3,.1*p.left);mult=1+b;note=' (조기 납품 보너스 +'+Math.round(b*100)+'%)'}
    var pay=Math.round(p.reward*mult);
    S.cash+=pay;S.contractIncome+=pay;S.contractsDone++;
    var rg=Math.round(Math.sqrt(p.reward/60)*(1+(S.techs.brand?.4:0))*(p.late>0?.5:1)*(p.vip?2:1));
    S.rep+=rg;
    say('\''+p.name+'\' 납품 완료! +'+money(pay)+note+' · 평판 +'+rg,'good');
    toast('납품 완료: +'+money(pay),'good',false);sfx('coin');
  }else{
    var def=PRODUCTS.filter(function(d){return d.id===p.def})[0],mul=1,tag='',r=Math.random();
    if(def.risky){if(r<.2){mul=5;tag=' 대박 조짐입니다!'}else if(r>.65){mul=.5;tag=' 반응이 미지근합니다.'}}
    else mul=rnd(.9,1.15);
    var n=S.products.filter(function(x){return x.def===def.id}).length;
    var base=Math.round(def.inc*mul);
    S.products.push({id:S.nid++,def:def.id,name:def.n+(n?' '+(n+1)+'호':''),base:base,cur:base,g:def.g,born:S.month,debt:6+(S.overtime?20:0),upd:-99,ref:-99});
    S.launched++;
    var tot=p.need.dev+p.need.des+p.need.pm;
    var rg2=Math.round(Math.sqrt(tot)/1.5*(1+(S.techs.brand?.4:0)));
    S.rep+=rg2;
    say('\''+def.n+'\' 출시! 월 수익 '+money(base)+' 예상.'+tag+' · 평판 +'+rg2,'good');
    toast('제품 출시: '+def.n,'good',false);sfx('launch');confetti(26);
  }
  checkGoals();
}
function monthEnd(){
  S.month++;
  var inc=income(),exp=expense();
  S.cash+=inc-exp;
  S.loans.forEach(function(l){l.left--});S.loans=S.loans.filter(function(l){return l.left>0});
  S.hist.push(Math.round(S.cash));if(S.hist.length>60)S.hist.shift();
  recordMonth(inc,exp);S.revHist.push(inc+S.contractIncome);S.contractIncome=0;if(S.revHist.length>3)S.revHist.shift();
  S.products.forEach(function(p){
    p.debt=Math.min(100,p.debt+Math.max(1.5,(p.g<0?3:2)-perfBonus()));
    var g=p.g-.0004*p.debt;
    if(g<0)p.cur=Math.max(p.base*.15,p.cur*(1+g));
    else p.cur=Math.min(p.base*3,p.cur*(1+g));
  });
  S.branches.forEach(function(b){b.mat=Math.min(1,b.mat+.07)});
  fxTick();
  marketTick(inc);
  listedTick(inc-exp);
  S.staff.forEach(function(p){
    p.t++;
    if(p.t%12===0&&p.skill<5&&Math.random()<.6+(S.staff.some(function(m){return m!==p&&m.trait==='mentor'})?.25:0)){p.skill++;p.sal=calcSal(p);say(p.name+'님이 성장했어요 (★'+p.skill+', 월급 '+money(p.sal)+').','good')}
  });
  if(S.morale<50){
    S.staff.filter(function(p){return p.trait==='burn'&&Math.random()<.15}).forEach(function(p){
      var i=S.staff.indexOf(p);
      if(i>=0){S.staff.splice(i,1);say(p.name+'님이 번아웃으로 퇴사했습니다.','bad');toast(p.name+'님 퇴사 (번아웃)','bad')}
    });
  }
  var mp=marketPower();
  if(mp)S.rep+=.15*mp*(1+(S.techs.brand?.4:0));
  S.brand=clamp(S.brand+mp*.5*(1-S.brand/100)+(S.campaign>0?1.5:0)-S.brand*.02,0,100);
  if(S.campaign>0){S.campaign--;S.rep+=1}
  S.projs.forEach(function(p,ti){
    if(!p||p.kind!=='contract')return;
    p.left--;
    if(p.left<0){
      p.late=(p.late||0)+1;S.rep=Math.max(0,S.rep-2);
      say('\''+p.name+'\' 납기 초과 '+p.late+'개월째입니다.','bad');
      if(p.late>=3){S.rep=Math.max(0,S.rep-8);say('고객사가 \''+p.name+'\' 계약을 해지했습니다. 평판 -10','bad');toast('계약 해지: '+p.name,'bad');S.projs[ti]=null}
    }else if(p.left===1)toast('납기 1개월 전: '+p.name,'bad');
  });
  projChangeRoll();
  var perk=moodBonus();PERKS.forEach(function(x){if(S.perks[x.id])perk+=x.mor});
  var target=clamp(55+perk-(S.overtime?22:0)-(S.projs.some(function(q){return q&&q.late>0})?8:0)-(S.cash<0?10:0),0,100);
  S.morale=clamp(S.morale+(target-S.morale)*.4,0,100);
  if(S.morale<25&&S.staff.length&&Math.random()<.4){
    var q=S.staff.splice(Math.floor(Math.random()*S.staff.length),1)[0];
    say(q.name+'님이 퇴사했습니다. 사기가 너무 낮아요.','bad');toast(q.name+'님 퇴사','bad');
  }
  if(S.month%2===0)S.contracts=genContracts();
  if(S.month%3===0)S.pool=genPool();
  tcCheck();delegTick();
  say(monthLabel(S.month)+' 결산: 수익 +'+money(inc)+' / 지출 -'+money(exp)+' / 현금 '+money(S.cash),S.cash<0?'bad':'');
  if(S.cash<0){
    S.neg++;
    if(S.neg>=D().grace){gameOver('bankrupt');return}
    toast('현금이 마이너스입니다! 다음 달까지 회복하세요.','bad');
  }else{if(S.neg>0)S.st.revived=true;S.neg=0}
  checkGoals();
  if(S.month>=3&&Math.random()<.34)rollEvent();
  save();renderAll();
}
function checkGoals(){
  GOALS.forEach(function(g,i){
    if(S.goals.indexOf(i)<0&&g[1](S)){S.goals.push(i);toast('목표 달성: '+g[0],'good');say('목표 달성: '+g[0],'good');chron('목표 달성: '+g[0])}
  });
  var k=S.listed<1?1:(S.listed<2?2:0);
  if(k&&listConds(k).every(function(x){return x[1]})){
    var key='ipoN'+k;
    if(!S[key]){S[key]=true;toast((k===1?'코스닥':'코스피')+' 상장 요건을 모두 갖췄습니다! 회사 탭을 확인하세요.','good')}
  }
  if(S.listed>=1)LONGS.forEach(function(g,i){
    if(S.longs.indexOf(i)<0&&g[1](S)){
      S.longs.push(i);S.rep+=10;toast('장기 목표 달성: '+g[0],'good');say('장기 목표 달성: '+g[0]+' (평판 +10)','good');chron('장기 목표: '+g[0]);
      if(S.longs.length%3===0)lpAward(1,'장기 목표 '+S.longs.length+'개');
    }
  });
  checkAch();
}
function lpAward(n,why){META.lp=(META.lp||0)+n;saveMeta();toast('회차 포인트 +'+n+' ('+why+')','good');say('회차 포인트 +'+n+' ('+why+') · 보유 '+META.lp+'P','good')}
function checkAch(){
  ACHS.forEach(function(a){
    if(META.ach[a.id])return;
    var ok=false;try{ok=a.f()}catch(e){}
    if(ok){META.ach[a.id]=S.month+1;saveMeta();toast('업적 달성: '+a.n,'good');say('업적 달성: '+a.n+' ('+a.d+')','good')}
  });
}
function recordMonth(inc,exp){
  var tot=inc+S.contractIncome,st=S.st;
  st.rev+=tot;st.exp+=exp;
  S.rh.push(Math.round(tot));S.eh.push(Math.round(exp));
  if(S.rh.length>60){S.rh.shift();S.eh.shift()}
  if(S.overtime)st.otMonths++;
  if(S.mkt.cycle==='slump'&&tot-exp>0)st.slumpProfit++;
  st.peakCash=Math.max(st.peakCash,S.cash);
  st.peakCap=Math.max(st.peakCap,capVal());
  recRec('cap',st.peakCap,false);
}
function fxTick(){
  if(!S.branches.length)return;
  if(S.hedge>0){S.hedge--;if(S.hedge===0)say('환 헤지 기간이 끝났습니다.');return}
  REGIONS.forEach(function(R){
    var f=S.fx[R.id];
    f=f+(1-f)*.08+rnd(-.035,.035);
    if(Math.random()<.05){var sh=rnd(.1,.18)*(Math.random()<.5?-1:1);f*=1+sh;say(R.cur+' 환율 급변: '+(sh>0?'+':'')+Math.round(sh*100)+'%',sh>0?'good':'bad')}
    S.fx[R.id]=clamp(f,.7,1.35);
  });

function listConds(k){

    ['평판 120 이상',S.rep>=120,Math.floor(S.rep)+''],

}
function marketTick(inc){
  var m=S.mkt;
  m.cl--;
  if(m.cl<=0){
    var nw=pickW([['normal',50],['boom',25],['slump',25]]);
    if(S.nextCycle){nw=S.nextCycle;S.nextCycle=null}
    if(nw===m.cycle)nw=nw==='normal'?pickW([['boom',1],['slump',1]]):'normal';
    m.cycle=nw;m.cl=ri(8,14);
    var msg=nw==='boom'?'경기 호황! 제품 수익과 의뢰 단가가 오릅니다.':nw==='slump'?'경기 침체. 제품 수익과 의뢰 단가가 내려갑니다.':'경기가 평년 수준으로 돌아왔습니다.';
    var cl=nw==='boom'?'good':nw==='slump'?'bad':'';
    say(msg,cl);toast(msg,cl);
  }
  m.tl--;
  if(m.tl<=0){
    var cats=PRODUCTS.filter(function(d){return (!d.tech||S.techs[d.tech])&&d.id!==m.trend});
    if(cats.length){m.trend=pick(cats).id;m.tl=ri(10,16);say('시장 유행: '+prodName(m.trend)+' 분야가 뜨고 있습니다. 이 분야 제품 수익 +35%','good')}
    else m.tl=6;
  }
  S.rivals.forEach(function(r){
    var g=rnd(-.012,.026)+(m.cycle==='boom'?.01:m.cycle==='slump'?-.016:0)+Math.min(.035,Math.max(0,inc/r.rev-1.5)*.0025);
    r.rev=Math.max(150,r.rev*(1+g));
    var opts=[];PRODUCTS.forEach(function(d,i){if(r.rev>=TIER_T[i])opts.push(d.id)});
    if(opts.indexOf(r.focus)<0||Math.random()<.1){
      r.focus=(m.trend&&opts.indexOf(m.trend)>=0&&Math.random()<.5)?m.trend:opts[Math.max(0,opts.length-1-ri(0,1))];
    }
  });
  if(S.rq.length&&S.month>=S.rq[0]){S.rq.shift();spawnRival(inc)}
  if(S.month>=2&&S.contracts.length&&S.rivals.length&&Math.random()<.2){
    var c=S.contracts.splice(ri(0,S.contracts.length-1),1)[0];
    say(pick(S.rivals).name+'이(가) \''+c.name+'\' 의뢰를 가져갔습니다.','bad');
  }
}
function listedTick(net){

    var cur=S.revHist.reduce(function(a,b){return a+b},0);

      var chg=cur/S.qPrev-1;
      S.sent=clamp(S.sent+clamp(chg,-.3,.3)*.4,.6,1.7);
      say('분기 실적 발표: 매출 '+(chg>=0?'+':'')+Math.round(chg*100)+'% · '+(chg>=.03?'호재':chg<=-.03?'악재':'무난한 실적'),chg>=.03?'good':chg<=-.03?'bad':'');
    }
    S.qPrev=cur;
  }
}

function updateProjectBars(){
  var n=nTeams(),i;
  for(i=0;i<n;i++){
    var p=S.projs[i];if(!p)continue;
    var out=calcOut(i),worst=null,wv=-1;
    ROLE_KEYS.forEach(function(k){
      var pct=Math.min(100,p.prog[k]/p.need[k]*100);
      setW('pb-'+i+'-'+k,pct);setT('pt-'+i+'-'+k,Math.floor(p.prog[k])+'/'+p.need[k]);
      if(pct<100){var rem=(p.need[k]-p.prog[k])/Math.max(out[k],.01);if(rem>wv){wv=rem;worst=k}}
    });
    var pl=$('pdl-'+i);
    if(pl){

function kv(a,b){return '<div><span>'+a+'</span><b>'+b+'</b></div>'}
function twoLine(a,b){
  var n=a.length;
  if(n<2)return '<p class="empty">결산이 두 번 이상 쌓이면 그래프가 나타납니다.</p>';
  var W=330,H=130,pl=62,pr=8,pt=8,pb=18,mx=Math.max.apply(null,a.concat(b).concat([1]));
  var X=function(i){return pl+(W-pl-pr)*i/(n-1)},Y=function(v){return pt+(H-pt-pb)*(1-v/mx)};
  var pts=function(arr){return arr.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1)}).join(' ')};
  var g='';
  [0,.5,1].forEach(function(t){var v=mx*t,y=Y(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text class="t" x="'+(pl-5)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end">'+money(v)+'</text>'});
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="월별 수입과 지출">'+g+'<polyline points="'+pts(b)+'" fill="none" stroke="var(--bad)" stroke-width="2" stroke-linejoin="round"/><polyline points="'+pts(a)+'" fill="none" stroke="var(--good)" stroke-width="2" stroke-linejoin="round"/><circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(a[n-1]).toFixed(1)+'" r="3.5" fill="var(--good)"/><circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(b[n-1]).toFixed(1)+'" r="3.5" fill="var(--bad)"/><text class="t" x="'+pl+'" y="'+(H-3)+'">'+n+'개월 전</text><text class="t" x="'+(W-pr)+'" y="'+(H-3)+'" text-anchor="end">현재</text></svg>';
}

  buyback:function(){
    var bc=Math.round(capVal()*.01/10)*10;
    if(!S.listed||S.cash<bc||S.eq>=100)return;
    S.cash-=bc;S.eq=Math.min(100,S.eq/.99);S.sent=Math.min(1.7,S.sent+.04);
    say('자사주 매입 '+money(bc)+': 시장 심리가 좋아지고 내 지분이 늘었습니다.','good');renderAll();
  },
  update:function(id){
    var p=S.products.filter(function(x){return x.id===id})[0];if(!p)return;
    var c=updCost(p);if(S.month-p.upd<6||S.cash<c)return;
    S.cash-=c;
    if(p.cur<p.base)p.cur=Math.min(p.base*1.05,p.cur+(p.base-p.cur)*.65+p.base*.03);
    else p.cur=Math.min(p.base*3,p.cur*1.1);
    p.debt=Math.min(100,p.debt+8);p.upd=S.month;
    say(p.name+' 업데이트: 수익이 회복됐습니다 (기술 부채 +8).','good');renderAll();
  },
  refactor:function(id){
    var p=S.products.filter(function(x){return x.id===id})[0];if(!p)return;
    var c=refCost(p);if(S.month-p.ref<3||S.cash<c||p.debt<=0)return;
    S.cash-=c;p.debt=Math.max(0,p.debt-55);p.ref=S.month;S.st.refCount++;S.morale=Math.max(0,S.morale-2);
    say(p.name+' 리팩토링: 기술 부채 -55','good');renderAll();
  },
  bgm:function(){
    BGMON=!BGMON;try{localStorage.setItem('itTycoon.bgm',BGMON?'1':'0')}catch(e){}
    var c=ctx();
    if(BGMON){bgmStart()}
    else{
      if(c&&BGM.bus)BGM.bus.out.gain.setTargetAtTime(0,c.currentTime,.1);
      setTimeout(function(){if(!BGMON)bgmStop()},700);
    }
    renderTop();
  },
  hints:function(){
    HINTS=!HINTS;try{localStorage.setItem('itTycoon.hints',HINTS?'1':'0')}catch(e){}
    tipKey='';renderTip();renderTabs();renderTop();
  },
  help:function(){openHelp()},
  train:function(id){
    var p=S.staff.filter(function(x){return x.id===id})[0];if(!p||p.skill>=5)return;
    var c=trainCost(p),last=p.trainM===undefined?-99:p.trainM;
    if(S.month-last<12||S.cash<c)return;
    S.cash-=c;p.trainM=S.month;
    if(Math.random()<.7){p.skill++;p.sal=calcSal(p);say(p.name+'님이 교육을 마치고 성장했어요 (★'+p.skill+', 월급 '+money(p.sal)+').','good');sfx('hire')}
    else{S.morale=Math.min(100,S.morale+2);say(p.name+'님의 교육이 끝났지만 큰 성장은 없었어요.')}
    checkGoals();renderAll();
  },
  promote:function(id){
    var p=S.staff.filter(function(x){return x.id===id})[0];if(!p)return;
    var cp=canPromote(p);if(!cp.ok||S.cash<cp.cost)return;
    S.cash-=cp.cost;p.lead=true;p.sal=calcSal(p);S.morale=Math.min(100,S.morale+3);
    say(p.name+'님을 '+ROLES[p.role].n+' 리드로 승진시켰습니다. 해당 직군 산출 +4%.','good');sfx('hire');renderAll();
  },
  snd:function(){
    SOUND=!SOUND;try{localStorage.setItem('itTycoon.snd',SOUND?'1':'0')}catch(e){}
    if(SOUND){ctx();sfx('good')}
    renderTop();
  },
  menu:function(){openMenu()},
  slotSave:function(id){
    var o=readSlot(id);
    if(o&&S.slot!==id&&!armedClick('sv'+id)){reopenMenu();return}
    S.slot=id;writeSlot(id,S);toast('슬롯 '+id+'에 저장했습니다.','good',false);reopenMenu();
  },
  slotLoad:function(id){
    var o=readSlot(id);if(!o)return;
    save();S=o;S.slot=id;S.paused=true;closeModal();renderAll();
    toast('슬롯 '+id+'을 불러왔습니다. 재개를 누르세요.','good',false);
  },
  slotDel:function(id){
    if(!armedClick('del'+id)){reopenMenu();return}
    clearSlot(id);toast('슬롯 '+id+'을 삭제했습니다.','',false);reopenMenu();
  },
  exportCopy:function(){
    var t=$('xport');t.select();
    var ok=function(){toast('저장 코드를 복사했습니다.','good',false)},fail=function(){toast('직접 선택해서 복사해 주세요.','',false)};
    try{
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(ok,function(){try{document.execCommand('copy')?ok():fail()}catch(e){fail()}});return}
    }catch(e){}
    try{document.execCommand('copy')?ok():fail()}catch(e){fail()}
  },
  importGo:function(){
    var o=decodeSave($('imp').value);
    if(!o){toast('저장 코드가 올바르지 않습니다.','bad');return}
    o.slot=S.slot||1;o.paused=true;S=o;closeModal();renderAll();
    toast('저장 코드를 불러왔습니다. 재개를 누르세요.','good');
  },
  branch:function(id,v){
    var R=region(v);if(!R||S.branches.some(function(b){return b.id===R.id}))return;
    if(S.cash<R.cost||S.rep<R.rep||S.office<R.off)return;
    S.cash-=R.cost;S.branches.push({id:R.id,mat:.2,open:S.month});
    say(R.n+'를 열었습니다. 해외 매출이 서서히 늘어납니다.','good');toast(R.n+' 개설','good');chron(R.n+' 개설');checkGoals();renderAll();
  },
  hedge:function(){
    if(!S.branches.length||S.hedge>0)return;
    var c=hedgeCost();if(S.cash<c)return;
    S.cash-=c;S.hedge=6;say('환 헤지 계약: 6개월 동안 환율이 고정됩니다.');renderAll();
  },
  acquire:function(id){
    var r=S.rivals[id];if(!r)return;
    var pr=acqPrice(r);if(S.cash<pr)return;
    if(!armedClick('acq'+id)){renderPanel();return}
    S.cash-=pr;S.rivals.splice(id,1);S.acq++;
    var b=Math.round(r.rev*.8);
    S.products.push({id:S.nid++,def:r.focus,name:r.name+' 서비스',base:b,cur:b,g:.004,born:S.month,debt:35,upd:-99,ref:-99});
    S.rep+=8;S.morale=Math.max(0,S.morale-4);S.rq.push(S.month+ri(10,16));
    say(r.name+'을(를) '+money(pr)+'에 인수했습니다. 서비스가 우리 제품이 됐습니다.','good');toast('인수 완료: '+r.name,'good');chron(r.name+' 인수');
    checkGoals();renderAll();
  },
  sale:function(){
    if(S.month<12)return;
    if(!armedClick('sale')){renderPanel();return}
    doSale(saleOffer());
  },
  choice:function(id){
    var cfg=modal.cur,c=cfg&&cfg.choices[id];closeModal();
    if(c&&c.fn)c.fn();
  }
};
['snd','bgm','hints'].forEach(function(k){var f=ACT[k];ACT[k]=function(a,b,c){f(a,b,c);refreshSet()}});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  if(!S&&b.dataset.act!=='choice')return;
  if(SOUND){ctx();if(b.dataset.act!=='choice')sfx('click')}
  var f=ACT[b.dataset.act];if(f)f(+b.dataset.id||0,b.dataset.v,b);
});
document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&S&&!modalOpen&&!/^(BUTTON|INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();ACT.pause()}
});

/* ---------- 시작 ---------- */
var last=performance.now();
setInterval(function(){
  var now=performance.now(),d=(now-last)/1000;last=now;if(d>.5)d=.5;
  if(!S)return;
  if(S.paused||modalOpen||S.over){return}
  advance(S.speed*d/MONTH_SEC);updateLive();
  chT+=d;if(chT>2.4){chT=0;chatter()}
  if(anyProj()){brkT+=d;if(brkT>3.6){brkT=0;breakDesk()}}
},100);

function boot(){
  migrateLegacy();
  if([1,2,3].some(function(n){return !!readSlot(n)}))loadMenu();
  else startMenu();
}
boot();
})();
</script>
</body></html>
