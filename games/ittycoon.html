<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>IT 컴퍼니 타이쿤</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: 블루프린트(설계도) 느낌의 사무실 평면도가 중심. 왼쪽은 사무실·프로젝트·재무, 오른쪽은 탭으로 운영 메뉴. */
:root{
  --bg:#EAEFF6; --surface:#FFFFFF; --surface2:#F3F6FB; --ink:#0F1A33; --muted:#586682; --line:#D2DAE7; --grid:#DDE5F1;
  --accent:#F25C1F; --accent-ink:#FFFFFF; --good:#127A49; --bad:#C8243A; --warn:#A86B00;
  --dev:#3A63F0; --des:#D0397F; --pm:#0C8F87; --mkt:#B98300;
  --shadow:0 1px 0 rgba(15,26,51,.04),0 8px 20px -14px rgba(15,26,51,.35);
  --f-display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1122; --surface:#111B33; --surface2:#16223F; --ink:#E7ECF7; --muted:#9AA8C6; --line:#27365A; --grid:#1B2A4A;
    --accent:#FF7A3D; --accent-ink:#1A0B02; --good:#3FD08B; --bad:#FF6B80; --warn:#F0B73A;
    --dev:#7C98FF; --des:#F27AB4; --pm:#3CCFC4; --mkt:#F4C22E; --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1122; --surface:#111B33; --surface2:#16223F; --ink:#E7ECF7; --muted:#9AA8C6; --line:#27365A; --grid:#1B2A4A;
  --accent:#FF7A3D; --accent-ink:#1A0B02; --good:#3FD08B; --bad:#FF6B80; --warn:#F0B73A;
  --dev:#7C98FF; --des:#F27AB4; --pm:#3CCFC4; --mkt:#F4C22E; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--f-body);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
h1{font:400 30px/1.1 var(--f-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font:400 18px/1.2 var(--f-display);margin:0;letter-spacing:.01em}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between;margin-bottom:8px}
.date{font:500 13px var(--f-mono);color:var(--muted);margin-top:4px}
.ctrl{display:flex;gap:6px;flex-wrap:wrap}
.mbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.mbar i{display:block;height:100%;width:0;background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.stat small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em}
.stat b{display:block;font:600 17px/1.3 var(--f-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat em{display:block;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0}
.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.sub{font:500 12px var(--f-mono);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface2);padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:600;line-height:1.2}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.sm{padding:5px 9px;font-size:12px}
.btn.on{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.plan{background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/22px 22px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/22px 22px,var(--surface2);padding:14px;border:1px solid var(--line);border-radius:10px}
.desks{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:10px}
.desk{aspect-ratio:1/1;max-width:100%;border:1.5px solid var(--ink);background:var(--surface);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.desk .mon{width:46%;height:7px;background:var(--role);opacity:.3;border-radius:1px}
.desk b{font:400 19px/1 var(--f-display);color:var(--role)}
.desk .sk{font:500 9px var(--f-mono);color:var(--muted);letter-spacing:.05em}
.desk.empty{border:1.5px dashed var(--muted);background:transparent;color:var(--muted);font-size:18px}
.desk.ceo{border-color:var(--accent)}
.working .desk .mon{animation:blink 1.1s steps(2,end) infinite;animation-delay:var(--d,0s)}
@keyframes blink{50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.working .desk .mon{animation:none;opacity:.9}}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--role,var(--accent))}
.bar.thin{height:4px;margin-top:3px}
.ptitle{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:6px;font-size:13px}
.num{font:500 12px var(--f-mono);color:var(--muted);min-width:70px;text-align:right}
.hint,.rates,.empty{color:var(--muted);font-size:12.5px;margin:8px 0}
.empty{font-size:13.5px;line-height:1.6}
.pill{display:inline-block;font:600 11px var(--f-mono);padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 7px;border-radius:99px;color:var(--role);border:1px solid var(--role);white-space:nowrap}
.good{color:var(--good)} .bad{color:var(--bad)} .muted{color:var(--muted)} .warnc{color:var(--warn)}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:-4px 0 6px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 12px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.row{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .meta{color:var(--muted);font-size:12px;margin-top:1px}
.row .act{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.sect{font:400 15px var(--f-display);margin:14px 0 2px;color:var(--muted);letter-spacing:.04em}
.sect:first-child{margin-top:4px}
.mono{font-family:var(--f-mono)}
ol.log{list-style:none;margin:0;padding:0;font-size:13px}
ol.log li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
ol.log li:last-child{border-bottom:0}
ol.log time{font:500 11px var(--f-mono);color:var(--muted);flex:none;padding-top:2px;min-width:62px}
ul.goals{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 14px;font-size:13px}
ul.goals li{display:flex;gap:8px}
ul.goals li.done{color:var(--muted);text-decoration:line-through}
ul.goals li i{font-style:normal;font-family:var(--f-mono);color:var(--good);width:14px;flex:none}
svg.spark{display:block;width:100%;height:auto}
svg.spark .t{fill:var(--muted);font:500 10px var(--f-mono)}
.overlay{position:fixed;inset:0;background:rgba(8,14,30,.62);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{width:min(470px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.modal h3{font:400 24px/1.2 var(--f-display);margin:0 0 8px}
.modal p{line-height:1.65}
.modal ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
.modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.modal .choices .btn{text-align:left;padding:10px 12px}
.toasts{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:60;padding-inline:max(16px,env(safe-area-inset-left,0px))}
.toast{background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-weight:500;max-width:min(440px,100%);box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.toast.good{box-shadow:inset 4px 0 0 var(--good),0 6px 18px -8px rgba(0,0,0,.5)}
.toast.bad{box-shadow:inset 4px 0 0 var(--bad),0 6px 18px -8px rgba(0,0,0,.5)}
.chk{display:flex;gap:8px;font-size:13px;padding:2px 0}
.chk i{font-style:normal;font-family:var(--f-mono);width:14px;flex:none}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>IT 컴퍼니 타이쿤</h1>
      <div class="date" id="date"></div>
    </div>
    <div class="ctrl" id="ctrl">
      <button class="btn sm" id="bPause" data-act="pause">일시정지</button>
      <button class="btn sm" data-act="speed" data-v="1">1x</button>
      <button class="btn sm" data-act="speed" data-v="2">2x</button>
      <button class="btn sm" data-act="speed" data-v="4">4x</button>
      <button class="btn sm" id="bReset" data-act="reset">새로 시작</button>
    </div>
  </header>
  <div class="mbar" aria-hidden="true"><i id="mbar"></i></div>

  <section class="stats">
    <div class="stat"><small>현금</small><b id="s-cash"></b><em id="s-cashsub"></em></div>
    <div class="stat"><small>월 수입</small><b id="s-inc"></b><em id="s-incsub"></em></div>
    <div class="stat"><small>월 지출</small><b id="s-exp"></b><em id="s-expsub"></em></div>
    <div class="stat"><small>평판</small><b id="s-rep"></b><em id="s-repsub"></em></div>
    <div class="stat"><small>팀 사기</small><b id="s-mor"></b><div class="bar thin"><i id="s-morbar"></i></div></div>
    <div class="stat"><small>직원</small><b id="s-staff"></b><em id="s-staffsub"></em></div>
  </section>

  <div class="main">
    <div class="col">
      <section class="plan" aria-label="사무실 평면도">
        <div class="chead"><h2 id="officeName"></h2><span class="sub" id="officeSub"></span></div>
        <div class="desks" id="desks"></div>
      </section>
      <section class="card" id="projCard"></section>
      <section class="card" id="finCard"></section>
      <section class="card"><div class="chead"><h2>목표</h2><span class="sub" id="goalSub"></span></div><ul class="goals" id="goals"></ul></section>
    </div>
    <div class="col">
      <section class="card">
        <nav class="tabs" id="tabs" role="tablist"></nav>
        <div id="panel"></div>
      </section>
      <section class="card"><div class="chead"><h2>사내 소식</h2></div><ol class="log" id="log"></ol></section>
    </div>
  </div>
</div>

<div class="overlay" id="ov" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(function(){
'use strict';
var SAVE_KEY='itTycoon.v1', MONTH_SEC=5;

/* ---------- 데이터 ---------- */
var ROLE_KEYS=['dev','des','pm'];

];

];

function needTxt(n){return '개발 '+n.dev+' · 디자인 '+n.des+' · 기획 '+n.pm}
function salary(s){return 150+120*s}
function repTier(r){return r<10?'무명 스타트업':r<30?'동네 개발사':r<70?'알려진 IT 업체':r<120?'업계 강자':'테크 대기업'}

/* ---------- 상태 ---------- */
var S=null, TAB='contracts', modalOpen=false, mq=[], armed=null, armT=0;

function newState(){
  return {v:1,month:0,mf:0,cash:3000,rep:0,morale:70,office:0,speed:1,paused:true,
    staff:[],nid:1,pool:[],contracts:[],techs:{},research:null,products:[],project:null,perks:{},loans:[],
    overtime:false,campaign:0,log:[],hist:[],revHist:[],contractIncome:0,neg:0,contractsDone:0,launched:0,goals:[],over:null};
}
function save(){try{if(S&&!S.over)localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{var t=localStorage.getItem(SAVE_KEY);if(!t)return null;var o=JSON.parse(t);if(o&&o.v===1&&!o.over)return o}catch(e){}return null}
function clearSave(){try{localStorage.removeItem(SAVE_KEY)}catch(e){}}

/* ---------- 계산 ---------- */
function techMul(role){var m=1;TECHS.forEach(function(t){if(S.techs[t.id]&&t.fx)m+=(t.fx[role]||0)+(t.fx.all||0)});return m}
function prodTech(){var m=0;TECHS.forEach(function(t){if(S.techs[t.id]&&t.prod)m+=t.prod});return m}
function moraleMul(){return .7+.5*S.morale/100}
function calcOut(){
  var o={dev:0,des:0,pm:0},mm=moraleMul()*(S.overtime?1.3:1),ceo={dev:10,des:5,pm:5};
  ROLE_KEYS.forEach(function(k){o[k]+=ceo[k]*techMul(k)});
  S.staff.forEach(function(p){if(o[p.role]!==undefined)o[p.role]+=10*p.skill*techMul(p.role)});
  ROLE_KEYS.forEach(function(k){o[k]*=mm});
  return o;
}
function marketPower(){var s=0;S.staff.forEach(function(p){if(p.role==='mkt')s+=p.skill});return s}
function prodMul(){return 1+.04*marketPower()+prodTech()+(S.campaign>0?.3:0)}
function productIncome(p){return p.cur*prodMul()*(1+S.rep/250)}
function income(){return S.products.reduce(function(a,p){return a+productIncome(p)},0)}
function perkUpkeep(){var s=0;PERKS.forEach(function(p){if(S.perks[p.id])s+=p.up});return s}
function payroll(){return S.staff.reduce(function(a,p){return a+p.sal},0)}
function expense(){return payroll()+OFFICES[S.office].rent+perkUpkeep()+S.loans.reduce(function(a,l){return a+l.pay},0)}
function avgRev(s){var h=s.revHist;if(!h.length)return 0;return h.reduce(function(a,b){return a+b},0)/h.length}
function estMonths(need){var o=calcOut();return Math.max.apply(null,ROLE_KEYS.map(function(k){return need[k]/Math.max(o[k],.1)}))}
function cap(){return OFFICES[S.office].cap}

/* ---------- 알림 ---------- */
function say(txt,cls){S.log.unshift({m:monthLabel(S.month),t:txt,c:cls||''});if(S.log.length>60)S.log.pop();renderLog()}
function toast(msg,cls){
  var box=$('toasts');while(box.children.length>=3)box.removeChild(box.firstChild);
  var d=document.createElement('div');d.className='toast '+(cls||'');d.textContent=msg;box.appendChild(d);
  setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d)},3400);
}
function modal(cfg){
  if(modalOpen){mq.push(cfg);return}
  modalOpen=true;
  var h='<h3>'+cfg.title+'</h3><div>'+cfg.body+'</div><div class="choices">';
  cfg.choices.forEach(function(c,i){h+='<button class="btn '+(c.p?'primary':'')+'" data-act="choice" data-id="'+i+'"'+(c.dis?' disabled':'')+'>'+c.t+'</button>'});
  h+='</div>';$('modal').innerHTML=h;$('ov').hidden=false;modal.cur=cfg;
  var first=$('modal').querySelector('button:not(:disabled)');if(first)first.focus();
}
function closeModal(){$('ov').hidden=true;modalOpen=false;if(mq.length)modal(mq.shift())}
function armedClick(key){
  if(armed===key){armed=null;return true}
  armed=key;clearTimeout(armT);
  armT=setTimeout(function(){armed=null;renderPanel();renderProject();renderTop()},3000);
  return false;
}

/* ---------- 생성기 ---------- */
function genCandidate(){
  var role=pickW([['dev',40],['des',22],['pm',22],['mkt',16]]);
  var smax=Math.min(5,2+Math.floor(S.rep/45)+S.office);
  var skill=clamp(1+Math.floor(Math.pow(Math.random(),1.25)*smax),1,5);
  return {id:S.nid++,name:pick(SN)+pick(GN),role:role,skill:skill,sal:salary(skill)};
}
function genPool(){var a=[],i;for(i=0;i<4;i++)a.push(genCandidate());if(!a.some(function(c){return c.role==='dev'}))a[0].role='dev';return a}
function genContracts(){
  var E=CONTRACTS.filter(function(c){return c.rep<=S.rep}),out=[],used={},i;
  for(i=0;i<3;i++){
    var cand=[];E.forEach(function(c,ix){if(!used[c.t])cand.push([c,1+ix])});
    if(!cand.length)break;
    var c=pickW(cand);used[c.t]=1;
    var vr=function(v){return Math.max(5,Math.round(v*rnd(.92,1.1)/5)*5)};
    out.push({id:S.nid++,name:pick(CLIENTS)+' '+c.t,need:{dev:vr(c.need[0]),des:vr(c.need[1]),pm:vr(c.need[2])},reward:Math.round(c.r*rnd(.9,1.25)/10)*10,months:c.m});
  }
  return out;
}

/* ---------- 게임 흐름 ---------- */
function newGame(){
  clearSave();S=newState();S.contracts=genContracts();S.pool=genPool();
  S.log=[{m:monthLabel(0),t:'차고에서 회사를 설립했습니다. 첫 계약을 따내 보세요.',c:''}];
  armed=null;renderAll();
  modal({title:'IT 컴퍼니 타이쿤',body:'<p>차고에서 시작하는 1인 IT 회사입니다. 외주 계약으로 종잣돈을 모으고, 팀을 키워 자체 제품을 출시해 코스닥 상장까지 가 보세요.</p><ul><li>프로젝트는 개발·디자인·기획이 모두 채워져야 끝납니다.</li><li>월급과 임대료는 매달 나갑니다. 현금이 두 달 연속 마이너스면 파산합니다.</li><li>스페이스바로 일시정지할 수 있습니다.</li></ul>',choices:[{t:'창업하기',p:true,fn:function(){S.paused=false;renderTop()}}]});
}
function advance(dt){
  if(S.project){
    var out=calcOut(),p=S.project;
    ROLE_KEYS.forEach(function(k){p.prog[k]=Math.min(p.need[k],p.prog[k]+out[k]*dt)});
    if(ROLE_KEYS.every(function(k){return p.prog[k]>=p.need[k]-1e-6})){completeProject();renderAll()}
  }
  if(S.research){S.research.left-=dt;if(S.research.left<=0)finishResearch()}
  S.mf+=dt;if(S.mf>=1){S.mf-=1;monthEnd()}
}
function finishResearch(){
  var t=TECHS.filter(function(x){return x.id===S.research.id})[0];
  S.techs[t.id]=true;S.research=null;
  say('연구 완료: '+t.n+' ('+t.d+')','good');toast('연구 완료: '+t.n,'good');checkGoals();renderAll();
}
function completeProject(){
  var p=S.project;S.project=null;
  if(p.kind==='contract'){
    var mult=1,note='';
    if(p.late>0){mult=Math.max(.4,1-.2*p.late);note=' (납기 초과 '+p.late+'개월, 대금 '+Math.round(mult*100)+'%)'}
    else if(p.left>=1){var b=Math.min(.3,.1*p.left);mult=1+b;note=' (조기 납품 보너스 +'+Math.round(b*100)+'%)'}
    var pay=Math.round(p.reward*mult);
    S.cash+=pay;S.contractIncome+=pay;S.contractsDone++;
    var rg=Math.round(Math.sqrt(p.reward/60)*(1+(S.techs.brand?.4:0))*(p.late>0?.5:1));
    S.rep+=rg;
    say('\''+p.name+'\' 납품 완료! +'+money(pay)+note+' · 평판 +'+rg,'good');
    toast('납품 완료: +'+money(pay),'good');
  }else{
    var def=PRODUCTS.filter(function(d){return d.id===p.def})[0],mul=1,tag='',r=Math.random();
    if(def.risky){if(r<.2){mul=5;tag=' 대박 조짐입니다!'}else if(r>.65){mul=.5;tag=' 반응이 미지근합니다.'}}
    else mul=rnd(.9,1.15);
    var n=S.products.filter(function(x){return x.def===def.id}).length;
    var base=Math.round(def.inc*mul);
    S.products.push({id:S.nid++,def:def.id,name:def.n+(n?' '+(n+1)+'호':''),base:base,cur:base,g:def.g,born:S.month});
    S.launched++;
    var tot=p.need.dev+p.need.des+p.need.pm;
    var rg2=Math.round(Math.sqrt(tot)/1.5*(1+(S.techs.brand?.4:0)));
    S.rep+=rg2;
    say('\''+def.n+'\' 출시! 월 수익 '+money(base)+' 예상.'+tag+' · 평판 +'+rg2,'good');
    toast('제품 출시: '+def.n,'good');
  }
  checkGoals();
}
function monthEnd(){
  S.month++;
  var inc=income(),exp=expense();
  S.cash+=inc-exp;
  S.loans.forEach(function(l){l.left--});S.loans=S.loans.filter(function(l){return l.left>0});
  S.hist.push(Math.round(S.cash));if(S.hist.length>30)S.hist.shift();
  S.revHist.push(inc+S.contractIncome);S.contractIncome=0;if(S.revHist.length>3)S.revHist.shift();
  S.products.forEach(function(p){
    if(p.g<0)p.cur=Math.max(p.base*.15,p.cur*(1+p.g));
    else p.cur=Math.min(p.base*3,p.cur*(1+p.g));
  });
  S.staff.forEach(function(p){
    p.t++;
    if(p.t%12===0&&p.skill<5&&Math.random()<.6){p.skill++;p.sal=salary(p.skill);say(p.name+'님이 성장했어요 (★'+p.skill+', 월급 '+money(p.sal)+').','good')}
  });
  var mp=marketPower();
  if(mp)S.rep+=.15*mp*(1+(S.techs.brand?.4:0));
  if(S.campaign>0){S.campaign--;S.rep+=1}
  if(S.project&&S.project.kind==='contract'){
    var p=S.project;p.left--;
    if(p.left<0){
      p.late=(p.late||0)+1;S.rep=Math.max(0,S.rep-2);
      say('\''+p.name+'\' 납기 초과 '+p.late+'개월째입니다.','bad');
      if(p.late>=3){S.rep=Math.max(0,S.rep-8);say('고객사가 \''+p.name+'\' 계약을 해지했습니다. 평판 -10','bad');toast('계약 해지: '+p.name,'bad');S.project=null}
    }else if(p.left===1)toast('납기 1개월 전: '+p.name,'bad');
  }
  var perk=0;PERKS.forEach(function(x){if(S.perks[x.id])perk+=x.mor});
  var target=clamp(55+perk-(S.overtime?22:0)-(S.project&&S.project.late>0?8:0)-(S.cash<0?10:0),0,100);
  S.morale=clamp(S.morale+(target-S.morale)*.4,0,100);
  if(S.morale<25&&S.staff.length&&Math.random()<.4){
    var q=S.staff.splice(Math.floor(Math.random()*S.staff.length),1)[0];
    say(q.name+'님이 퇴사했습니다. 사기가 너무 낮아요.','bad');toast(q.name+'님 퇴사','bad');
  }
  if(S.month%2===0)S.contracts=genContracts();
  if(S.month%3===0)S.pool=genPool();
  say(monthLabel(S.month)+' 결산: 수익 +'+money(inc)+' / 지출 -'+money(exp)+' / 현금 '+money(S.cash),S.cash<0?'bad':'');
  if(S.cash<0){
    S.neg++;
    if(S.neg>=2){gameOver('bankrupt');return}
    toast('현금이 마이너스입니다! 다음 달까지 회복하세요.','bad');
  }else S.neg=0;
  checkGoals();
  if(S.month>=3&&Math.random()<.34)rollEvent();
  save();renderAll();
}
function checkGoals(){
  GOALS.forEach(function(g,i){
    if(S.goals.indexOf(i)<0&&g[1](S)){S.goals.push(i);if(i<8){toast('목표 달성: '+g[0],'good');say('목표 달성: '+g[0],'good')}}
  });
  var c=ipoConds();
  if(c.every(function(x){return x[1]})&&!S.ipoNotified){S.ipoNotified=true;toast('상장 요건을 모두 갖췄습니다! 회사 탭을 확인하세요.','good')}
}
function ipoConds(){
  return [
    ['판교 사옥 입주',S.office>=3,OFFICES[S.office].n],
    ['평판 120 이상',S.rep>=120,Math.floor(S.rep)+''],
    ['최근 3개월 월평균 매출 3억원',avgRev(S)>=30000,money(avgRev(S))],
    ['직원 20명 이상',S.staff.length>=20,S.staff.length+'명'],
    ['상장 비용 5,000만원 보유',S.cash>=5000,money(S.cash)]
  ];
}
function gameOver(type){
  S.over={type:type};clearSave();S.paused=true;checkGoals();
  var stats='<ul><li>경영 기간 '+S.month+'개월</li><li>직원 '+S.staff.length+'명 · 출시 제품 '+S.launched+'개 · 납품 '+S.contractsDone+'건</li><li>평판 '+Math.floor(S.rep)+' · 현금 '+money(S.cash)+'</li></ul>';
  if(type==='ipo'){
    var grade=S.month<=72?'전설의 창업가':S.month<=120?'유니콘 CEO':'견실한 CEO';
    say('코스닥 상장 성공!','good');
    modal({title:'코스닥 상장 성공!',body:'<p>회사가 종이 울리는 날을 맞았습니다. 등급: <b>'+grade+'</b></p>'+stats,choices:[{t:'새로 시작',p:true,fn:newGame}]});
  }else{
    say('파산했습니다.','bad');
    modal({title:'파산',body:'<p>두 달 연속 현금이 바닥났습니다. 회사는 문을 닫습니다.</p>'+stats,choices:[{t:'새로 시작',p:true,fn:newGame}]});
  }
  renderAll();
}

/* ---------- 이벤트 ---------- */
function rollEvent(){
  var list=[];
  if(!S.techs.sec)list.push([evOutage,3]);
  if(S.staff.length<cap())list.push([evScout,2]);
  if(S.month>=6&&S.loans.length<3)list.push([evInvest,2]);
  list.push([evConf,2]);list.push([evGrant,2]);
  if(S.products.length)list.push([evViral,2]);
  if(S.project&&S.project.prog.dev>20)list.push([evBug,2]);
  pickW(list)();
}
function evOutage(){
  var c=Math.round(rnd(150,400)*(1+S.office*.8)/10)*10;
  modal({title:'서버 장애 발생',body:'<p>새벽에 서비스가 멈췄다는 연락이 쏟아집니다. 고객과 이용자가 기다리고 있어요.</p>',choices:[
    {t:'긴급 복구 (-'+money(c)+')',p:true,dis:S.cash<c,fn:function(){S.cash-=c;say('긴급 복구로 장애를 막았습니다. -'+money(c));renderAll()}},
    {t:'일단 두고 본다 (평판 -3, 사기 -6)',fn:function(){S.rep=Math.max(0,S.rep-3);S.morale=Math.max(0,S.morale-6);say('장애를 방치해 평판이 떨어졌습니다.','bad');renderAll()}}
  ]});
}
function evScout(){
  var role=pick(['dev','des','pm']),skill=ri(4,5),sal=salary(skill),fee=sal*2,name=pick(SN)+pick(GN);
  modal({title:'스카우트 제안',body:'<p>대기업 출신 '+ROLES[role].full+' <b>'+name+'</b>님(★'+skill+')이 합류 의사를 밝혔습니다. 계약금 '+money(fee)+', 월급 '+money(sal)+'.</p>',choices:[
    {t:'영입한다 (-'+money(fee)+')',p:true,dis:S.cash<fee||S.staff.length>=cap(),fn:function(){S.cash-=fee;S.staff.push({id:S.nid++,name:name,role:role,skill:skill,sal:sal,t:0});say(name+'님이 합류했습니다. ('+ROLES[role].full+' ★'+skill+')','good');renderAll()}},
    {t:'정중히 거절한다',fn:function(){}}
  ]});
}
function evInvest(){
  var amt=Math.round((2500+S.rep*80)/100)*100,pay=Math.round(amt*1.25/12);
  modal({title:'투자 제안',body:'<p>벤처 캐피털이 <b>'+money(amt)+'</b> 투자를 제안했습니다. 12개월 동안 매달 '+money(pay)+'씩 상환하는 조건입니다.</p>',choices:[
    {t:'수락한다 (+'+money(amt)+')',p:true,fn:function(){S.cash+=amt;S.loans.push({left:12,pay:pay});say('투자 '+money(amt)+'을 유치했습니다.','good');renderAll()}},
    {t:'거절한다',fn:function(){}}
  ]});
}
function evConf(){
  modal({title:'개발자 컨퍼런스 초청',body:'<p>업계 컨퍼런스에서 발표해 달라는 제안이 왔습니다. 참가비와 출장비가 200만원 듭니다.</p>',choices:[
    {t:'참가한다 (-200만원, 평판 +4)',p:true,dis:S.cash<200,fn:function(){S.cash-=200;var g=Math.round(4*(1+(S.techs.brand?.4:0)));S.rep+=g;say('컨퍼런스 발표로 평판 +'+g,'good');renderAll()}},
    {t:'이번엔 패스',fn:function(){}}
  ]});
}

  var g=Math.round(rnd(600,1600)*(1+S.office*.7)/10)*10;
  modal({title:'정부 지원사업 선정',body:'<p>신청해 둔 창업 지원사업에 선정됐습니다. 지원금 <b>'+money(g)+'</b>이 입금됩니다.</p>',choices:[
    {t:'확인',p:true,fn:function(){S.cash+=g;say('정부 지원금 +'+money(g),'good');renderAll()}}

    {t:'좋아요',p:true,fn:function(){p.cur*=1.3;p.base*=1.2;say(p.name+' 수익이 30% 늘었습니다.','good');renderAll()}}

function evBug(){
  modal({title:'치명적 버그 발견',body:'<p>출시 직전 코드에서 심각한 버그가 발견됐습니다. 어떻게 수습할까요?</p>',choices:[
    {t:'야근으로 수습한다 (사기 -8)',p:true,fn:function(){S.morale=Math.max(0,S.morale-8);say('야근으로 버그를 막았습니다.');renderAll()}},
    {t:'일정 지연을 감수한다 (개발 진행 -12%)',fn:function(){if(S.project)S.project.prog.dev*=.88;say('버그 수정으로 개발 진행이 후퇴했습니다.','bad');renderAll()}}
  ]});
}

/* ---------- 렌더링 ---------- */
function renderTop(){
  var inc=income(),exp=expense(),net=inc-exp;
  setT('date',monthLabel(S.month)+' · '+(S.month+1)+'개월차');
  setT('s-cash',money(S.cash));$('s-cash').className=S.cash<0?'bad':'';
  setT('s-cashsub','월 순이익 '+(net>=0?'+':'')+money(net));
  setT('s-inc',money(inc));setT('s-incsub','제품 '+S.products.length+'개 운영');
  setT('s-exp',money(exp));setT('s-expsub','급여 '+money(payroll()));
  setT('s-rep',Math.floor(S.rep));setT('s-repsub',repTier(S.rep));
  setT('s-mor',Math.round(S.morale)+'%');setW('s-morbar',S.morale);
  setT('s-staff',(S.staff.length+1)+'명');setT('s-staffsub','자리 '+S.staff.length+'/'+cap());
  $('bPause').textContent=S.paused?'재개':'일시정지';
  var sp=document.querySelectorAll('[data-act="speed"]');

function updateProjectBars(){
  var p=S.project;if(!p)return;
  var out=calcOut(),worst=null,wv=-1;
  ROLE_KEYS.forEach(function(k){
    var pct=Math.min(100,p.prog[k]/p.need[k]*100);
    setW('pb-'+k,pct);setT('pt-'+k,Math.floor(p.prog[k])+'/'+p.need[k]);
    if(pct<100){var rem=(p.need[k]-p.prog[k])/Math.max(out[k],.01);if(rem>wv){wv=rem;worst=k}}
  });
  var pl=$('pdl');
  if(pl){
    var txt,cls='pill';
    if(p.kind==='contract'){
      if(p.late>0){txt='납기 초과 '+p.late+'개월';cls+=' bad'}
      else{txt='납기 D-'+p.left+'개월';if(p.left<=1)cls+=' warn'}
      txt+=' · 대금 '+money(p.reward);
    }else txt='자체 개발';
    if(pl.textContent!==txt)pl.textContent=txt;pl.className=cls;
  }
  setT('phint',worst?'병목: '+ROLES[worst].n+' (남은 작업 약 '+wv.toFixed(1)+'개월)':'');
}

var ACT={
  tab:function(id,v){TAB=v;renderTabs();renderPanel()},
  pause:function(){S.paused=!S.paused;renderTop()},
  speed:function(id,v){S.speed=+v;S.paused=false;renderTop()},

  ot:function(){S.overtime=!S.overtime;say(S.overtime?'야근 모드 시작: 생산량 +30%, 사기는 점점 떨어집니다.':'야근 모드를 해제했습니다.');renderProject();renderTop()},
  accept:function(id){
    if(S.project)return toast('이미 진행 중인 프로젝트가 있어요.','bad');
    var i=-1;S.contracts.forEach(function(c,ix){if(c.id===id)i=ix});if(i<0)return;
    var c=S.contracts.splice(i,1)[0];
    S.project={kind:'contract',name:c.name,need:c.need,prog:{dev:0,des:0,pm:0},reward:c.reward,left:c.months,months:c.months,late:0};
    say('\''+c.name+'\' 계약 체결 (납기 '+c.months+'개월, 대금 '+money(c.reward)+')');renderAll();
  },
  startProd:function(id,v){
    var d=PRODUCTS.filter(function(x){return x.id===v})[0];
    if(S.project||prodLock(d)||S.cash<d.cost)return;
    S.cash-=d.cost;S.project={kind:'product',def:d.id,name:d.n,need:d.need,prog:{dev:0,des:0,pm:0},late:0,left:null};
    say('\''+d.n+'\' 개발 착수 (착수금 '+money(d.cost)+')');renderAll();
  },
  abandon:function(){
    if(!S.project)return;
    if(!armedClick('abandon')){renderProject();return}
    var p=S.project;
    if(p.kind==='contract'){S.rep=Math.max(0,S.rep-3);say('\''+p.name+'\' 계약을 포기했습니다. 평판 -3','bad')}
    else say('\''+p.name+'\' 개발을 중단했습니다.','bad');
    S.project=null;renderAll();
  },
  hire:function(id){
    var i=-1;S.pool.forEach(function(c,ix){if(c.id===id)i=ix});if(i<0)return;
    var c=S.pool[i];
    if(S.staff.length>=cap())return toast('자리가 없어요. 사무실을 넓히세요.','bad');
    if(S.cash<c.sal)return;
    S.cash-=c.sal;S.pool.splice(i,1);S.staff.push({id:c.id,name:c.name,role:c.role,skill:c.skill,sal:c.sal,t:0});
    say(c.name+'님('+ROLES[c.role].full+' ★'+c.skill+')이 합류했습니다.','good');checkGoals();renderAll();
  },
  refresh:function(){if(S.cash<50)return;S.cash-=50;S.pool=genPool();renderAll()},
  fire:function(id){
    var i=-1;S.staff.forEach(function(p,ix){if(p.id===id)i=ix});if(i<0)return;
    if(!armedClick('fire'+id)){renderPanel();return}
    var p=S.staff.splice(i,1)[0];S.cash-=p.sal;S.morale=Math.max(0,S.morale-4);
    say(p.name+'님을 해고했습니다. 퇴직금 '+money(p.sal)+', 사기 -4','bad');renderAll();
  },
  research:function(id,v){
    var t=TECHS.filter(function(x){return x.id===v})[0];
    if(S.research||S.techs[t.id]||S.cash<t.cost||t.req.some(function(r){return !S.techs[r]}))return;
    S.cash-=t.cost;S.research={id:t.id,left:t.months,total:t.months};say('연구 시작: '+t.n);renderAll();
  },
  office:function(){
    var nx=OFFICES[S.office+1];if(!nx||S.cash<nx.cost)return;
    S.cash-=nx.cost;S.office++;say(nx.n+'(으)로 이전했습니다. 자리 '+nx.cap+'개','good');S.morale=Math.min(100,S.morale+6);checkGoals();renderAll();
  },
  perk:function(id,v){
    var p=PERKS.filter(function(x){return x.id===v})[0];
    if(S.perks[p.id]||S.cash<p.cost||S.office<p.office)return;
    S.cash-=p.cost;S.perks[p.id]=true;say(p.n+'을(를) 도입했습니다.','good');renderAll();
  },
  party:function(){if(S.cash<150)return;S.cash-=150;S.morale=Math.min(100,S.morale+15);say('피자 파티로 사기가 올랐습니다.','good');renderAll()},
  loan:function(){if(S.loans.length>=3)return;S.cash+=2000;S.loans.push({left:12,pay:200});say('은행 대출 2,000만원을 받았습니다.');renderAll()},
  campaign:function(){if(S.campaign>0||S.cash<400)return;S.cash-=400;S.campaign=6;say('마케팅 캠페인을 시작했습니다.','good');renderAll()},
  ipo:function(){
    var all=ipoConds().every(function(c){return c[1]});if(!all)return;
    if(!armedClick('ipo')){renderPanel();return}
    S.cash-=5000;gameOver('ipo');
  },
  choice:function(id){
    var cfg=modal.cur,c=cfg&&cfg.choices[id];closeModal();
    if(c&&c.fn)c.fn();
  }
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b||b.disabled||!S)return;
  var f=ACT[b.dataset.act];if(f)f(+b.dataset.id||0,b.dataset.v,b);
});
document.addEventListener('keydown',function(e){
  if(e.code==='Space'&&S&&!modalOpen&&!/^(BUTTON|INPUT|TEXTAREA)$/.test(document.activeElement.tagName)){e.preventDefault();ACT.pause()}
});

/* ---------- 시작 ---------- */
var last=performance.now();
setInterval(function(){
  var now=performance.now(),d=(now-last)/1000;last=now;if(d>.5)d=.5;
  if(!S)return;
  if(S.paused||modalOpen||S.over){return}
  advance(S.speed*d/MONTH_SEC);updateLive();
},100);

function boot(){
  var sv=loadSave();
  if(sv){
    S=sv;S.paused=true;renderAll();
    modal({title:'저장된 게임이 있어요',body:'<p>'+monthLabel(S.month)+' · 현금 '+money(S.cash)+' · 직원 '+(S.staff.length+1)+'명 · 평판 '+Math.floor(S.rep)+'</p>',choices:[
      {t:'이어서 하기',p:true,fn:function(){S.paused=false;renderTop()}},
      {t:'새로 시작',fn:newGame}
    ]});
  }else newGame();
}
boot();
})();
</script>

</body>
</html>
