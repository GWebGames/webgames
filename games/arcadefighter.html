<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>2인용 아케이드 파이터</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body,html{margin:0;padding:0;width:100%;height:100%;height:100dvh;overflow:hidden;background:#030712;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.char-scroll-box::-webkit-scrollbar{height:8px}
.char-scroll-box::-webkit-scrollbar-track{background:rgba(15,23,42,.9);border-radius:8px}
.char-scroll-box::-webkit-scrollbar-thumb{background:#3b82f6;border-radius:8px}
.touch-control-btn{background:rgba(255,255,255,.12);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.25);transition:transform .05s,background .05s}
.touch-control-btn:active{background:rgba(255,255,255,.4);transform:scale(.92)}
@keyframes pulseGlow{0%,100%{opacity:.6}50%{opacity:1}}
.turn-active{animation:pulseGlow 1.5s infinite}
</style>
</head>
<body class="flex items-center justify-center h-screen w-screen bg-slate-950 text-white">

<div id="char-select-screen" class="absolute inset-0 z-50 bg-slate-950 flex flex-col justify-between p-3 sm:p-5">
  <header class="text-center py-2 border-b border-slate-800">
    <h1 class="text-2xl sm:text-4xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-red-500 uppercase">2인용 아케이드 파이터</h1>
    <div id="turn-indicator" class="mt-1 inline-block px-4 py-1 rounded-full bg-blue-900/80 border border-blue-400 text-blue-200 text-xs sm:text-sm font-bold tracking-wide turn-active">PLAYER 1 캐릭터를 선택하세요</div>
  </header>
  <div class="flex flex-col gap-4 w-full max-w-5xl mx-auto my-auto overflow-y-auto min-h-0">
    <div class="grid grid-cols-2 gap-3 sm:gap-6 bg-slate-900/80 p-3 sm:p-4 rounded-2xl border border-slate-800">
      <div id="p1-select-box" class="flex flex-col items-center justify-center p-2 rounded-xl border-2 border-blue-500 bg-blue-950/30 transition-all">
        <span class="text-[10px] sm:text-xs font-black text-blue-400 tracking-wider">PLAYER 1</span>
        <span id="p1-name-display" class="text-sm sm:text-lg font-black text-white mt-1">Time Breaker</span>
        <span id="p1-status-badge" class="text-[9px] sm:text-[11px] px-2 py-0.5 mt-1 rounded bg-blue-500/20 text-blue-300 font-bold border border-blue-400/30">선택 중...</span>
      </div>
      <div id="p2-select-box" class="flex flex-col items-center justify-center p-2 rounded-xl border-2 border-slate-800 bg-slate-900/30 opacity-60 transition-all">
        <span class="text-[10px] sm:text-xs font-black text-red-400 tracking-wider">PLAYER 2</span>
        <span id="p2-name-display" class="text-sm sm:text-lg font-black text-slate-400 mt-1">대기 중</span>
        <span id="p2-status-badge" class="text-[9px] sm:text-[11px] px-2 py-0.5 mt-1 rounded bg-slate-800 text-slate-400 font-bold">대기</span>
      </div>
    </div>
    <div id="char-scroll-container" class="char-scroll-box flex flex-nowrap overflow-x-auto gap-4 py-3 px-2"></div>
  </div>
  <div class="w-full max-w-md mx-auto pb-2 flex gap-3">
    <button id="confirm-btn" onclick="handleConfirmSelection()" class="flex-1 py-3 font-black text-base sm:text-lg rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-500 text-white shadow-lg shadow-blue-900/40 border border-white/20 active:scale-95 transition-all">P1 캐릭터 확정</button>
  </div>
</div>

<div id="handoff" class="hidden absolute inset-0 z-[60] bg-slate-950 flex flex-col items-center justify-center text-center p-6">
  <div class="text-5xl mb-4">🔒</div>
  <h2 class="text-2xl sm:text-4xl font-black text-blue-400 mb-2">PLAYER 1 선택 완료</h2>
  <p class="text-slate-300 mb-1">선택한 캐릭터는 비공개입니다.</p>
  <p class="text-slate-400 text-sm mb-8">기기를 PLAYER 2에게 넘겨주세요.</p>
  <button onclick="document.getElementById('handoff').classList.add('hidden')" class="px-8 py-3.5 bg-gradient-to-r from-red-600 to-orange-500 text-white font-black text-lg rounded-2xl shadow-xl border border-white/20 active:scale-95 transition-all">PLAYER 2 선택 시작</button>
</div>

<div id="loading-screen" class="hidden absolute inset-0 z-[70] bg-slate-950 flex flex-col items-center justify-center px-4">
  <div class="flex items-center justify-center gap-6 sm:gap-12">
    <div class="flex flex-col items-center"><div id="load-p1-art" class="w-24 h-24 sm:w-32 sm:h-32"></div><span class="text-xs font-black text-blue-400 mt-1">PLAYER 1</span><span id="load-p1-name" class="text-lg font-black"></span></div>
    <span class="text-3xl sm:text-5xl font-black text-yellow-400">VS</span>
    <div class="flex flex-col items-center"><div id="load-p2-art" class="w-24 h-24 sm:w-32 sm:h-32"></div><span class="text-xs font-black text-red-400 mt-1">PLAYER 2</span><span id="load-p2-name" class="text-lg font-black"></span></div>
  </div>
  <div class="w-64 sm:w-96 h-2.5 bg-slate-800 rounded-full overflow-hidden mt-5"><div id="load-bar" class="h-full w-0 bg-gradient-to-r from-blue-500 to-red-500"></div></div>
  <span class="text-xs text-slate-400 mt-2 tracking-widest">LOADING...</span>
</div>

<div id="game-arena" class="relative w-full h-full hidden overflow-hidden bg-slate-950 flex flex-col justify-between">
  <div class="absolute top-0 left-0 right-0 z-20 flex justify-between items-start px-3 py-1.5 bg-gradient-to-b from-black/90 via-black/40 to-transparent pointer-events-none">
    <div class="w-5/12 max-w-xs">
      <div class="flex justify-between items-center text-xs font-bold text-blue-400 mb-1">
        <span id="hud-p1-name" class="font-extrabold text-sm sm:text-base">P1</span>
        <span id="hud-p1-hp-val" class="font-mono text-slate-200 text-xs sm:text-sm">500 / 500</span>
      </div>
      <div class="w-full bg-slate-900/90 rounded-full h-3 border border-blue-500/40 overflow-hidden p-0.5 shadow-inner">
        <div id="hud-p1-hp-bar" class="bg-gradient-to-r from-blue-600 to-cyan-400 h-full rounded-full w-full transition-all duration-100"></div>
      </div>
    </div>
    <div class="flex flex-col items-center justify-center">
      <div id="hud-timer" class="text-xl font-black text-yellow-400 font-mono tracking-wider drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)]">300</div>
      <span class="text-[9px] text-slate-400 font-bold uppercase tracking-widest">TIME</span>
    </div>
    <div class="w-5/12 max-w-xs text-right">
      <div class="flex justify-between items-center text-xs font-bold text-red-400 mb-1 flex-row-reverse">
        <span id="hud-p2-name" class="font-extrabold text-sm sm:text-base">P2</span>
        <span id="hud-p2-hp-val" class="font-mono text-slate-200 text-xs sm:text-sm">600 / 600</span>
      </div>
      <div class="w-full bg-slate-900/90 rounded-full h-3 border border-red-500/40 overflow-hidden p-0.5 shadow-inner flex justify-end">
        <div id="hud-p2-hp-bar" class="bg-gradient-to-r from-orange-500 to-red-600 h-full rounded-full w-full transition-all duration-100"></div>
      </div>
    </div>
  </div>

  <canvas id="stageCanvas" class="w-full h-full block"></canvas>
  <div class="absolute bottom-1 left-0 right-0 text-center text-[10px] text-slate-500 pointer-events-none hidden md:block">P1: W/A/D · F 공격 · G 스킬 &nbsp;|&nbsp; P2: ←↑→ · L 공격 · K 스킬</div>

  <div id="touch-overlay" class="absolute inset-0 z-30 pointer-events-none flex justify-between" style="padding:6px max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))"></div>

  <div id="winner-modal" class="absolute inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center hidden">
    <h2 id="winner-title" class="text-4xl sm:text-6xl font-black text-yellow-400 mb-2 tracking-wider uppercase">PLAYER 1 WINS!</h2>
    <p id="winner-desc" class="text-slate-300 text-base mb-8">상대방을 처치하였습니다.</p>
    <button onclick="backToCharSelect()" class="px-8 py-3.5 bg-gradient-to-r from-blue-600 via-indigo-600 to-red-600 text-white font-bold text-lg rounded-2xl shadow-xl border border-white/20 active:scale-95 transition-all">캐릭터 선택 창으로 돌아가기</button>
  </div>
</div>

<script>

const CHARACTERS = [
  {id:'timebreaker',name:'Time Breaker',hp:500,atk:45,speedMult:1.0,rangeMult:1.0,color:'#3b82f6',desc:'체력 500 | 공격력 45\n스킬: 시간정지 - 상대 2초간 동결 (쿨타임 18초)',skillCd:18},
  {id:'volcano',name:'Volcano',hp:600,atk:50,speedMult:1.0,rangeMult:1.0,color:'#ef4444',desc:'체력 600 | 공격력 50\n스킬: 화염폭발 - 화염 50 피해 (쿨타임 12초)',skillCd:12},
  {id:'shadow',name:'Shadow',hp:400,atk:35,speedMult:2.0,rangeMult:1.0,color:'#8b5cf6',desc:'체력 400 | 공격력 35 (이동속도 2배)\n스킬: 기습 - 순간이동 + 2배 피해 (쿨타임 8초)',skillCd:8},
  {id:'boxer',name:'Boxer',hp:300,atk:30,speedMult:1.0,rangeMult:1.5,color:'#f59e0b',desc:'체력 300 | 공격력 30 (사거리 1.5)\n스킬: 강펀치 - 평타 피해 + 상대 2초간 스턴 (쿨타임 12초)',skillCd:12},
  {id:'luckyguy',name:'Lucky Guy',hp:777,atk:0,speedMult:1.0,rangeMult:1.0,color:'#10b981',desc:'체력 777 | 공격력 1~100 (공속 1초, 공격 선딜레이 0.5초)\n스킬: 잭팟 1~50 체력 회복 (쿨타임 7초)',skillCd:7,isLuckyGuy:true},
  {id:'sky',name:'Sky',hp:400,atk:40,speedMult:1.0,rangeMult:1.0,color:'#38bdf8',desc:'체력 400 | 공격 불가 (공중에서 공격 버튼: 급강하)\n패시브: 점프 후 착지 시 근처 적에게 10 피해\n스킬: 천공낙하 - 다음 착지 적중 시 적을 2초간 에어본 (쿨타임 18초)',skillCd:18},
  {id:'matryoshka',name:'Layer',hp:400,atk:30,speedMult:1.0,rangeMult:1.0,color:'#ec4899',desc:'체력 400 | 공격력 30\n패시브: 죽을 때마다 근처 적에게 30 피해 + 절반 체력으로 부활 (체력 50에서 죽으면 피해·부활 불가)\n부활할 때마다 특정 확률로 공격 회피 (20%→40%→60%)',skillCd:0},
  {id:'ironspike',name:'Iron Spike',hp:1000,atk:35,speedMult:0.5,rangeMult:2.0,color:'#94a3b8',desc:'체력 1000 | 공격력 35 (이동속도 0.5배, 사거리 2)\n패시브: 공격자에게 3 피해 반사\n스킬: 강철가시 - 3초간 무적 (쿨타임 23초)',skillCd:23},
  {id:'joker',name:'Joker',hp:444,atk:44,speedMult:1.5,rangeMult:1.5,color:'#d946ef',desc:'체력 444 | 공격력 44 (이동속도 1.5배, 사거리 1.5)\n스킬: 랜덤 폭탄 (쿨타임 4초)',skillCd:4},
  {id:'mastersmith',name:'Mastersmith',hp:700,atk:10,speedMult:0.8,rangeMult:1.0,color:'#14b8a6',desc:'체력 700 | 공격력 10 (이동속도 0.8배)\n스킬: 강화 - 공격력을 확률적으로 올림 (최대 100, 쿨타임 3초)',skillCd:3},
  {id:'digger',name:'Digger',hp:400,atk:20,speedMult:1.5,rangeMult:1.0,color:'#ca8a04',desc:'체력 400 | 공격력 20 (이동속도 1.5배)\n스킬: 보물찾기 - 2초간 땅을 파서 보물 획득 시도 (쿨타임 7초)',skillCd:7},
  {id:'rift',name:'Rift',hp:300,atk:30,speedMult:1.0,rangeMult:7,kb:3,color:'#f43f5e',desc:'체력 300 | 공격력 30 (사거리 7, 넥백 3배)\n평타: 관통 파동\n스킬: 블링크 - 바라보는 방향으로 순간이동 (쿨타임 3초)',skillCd:3},
  {id:'jack',name:'Jack',hp:550,atk:0,speedMult:1.0,rangeMult:1.0,color:'#f97316',desc:'체력 550\n패시브: 박쥐가 따라다니며 잭이 피해를 입을 시 체력 5 회복\n스킬: 무기변경 - 무기를 랜덤으로 바꿈 (쿨타임 10초)',skillCd:10},
  {id:'berserker',name:'Berserker',hp:700,atk:4,speedMult:1.0,rangeMult:3,color:'#dc2626',desc:'체력 700 | 공격력 4 (탄환 5개, 사거리 3)\n패시브: 체력이 줄어들수록 공속이 빠르게 됨\n스킬: 분노 - 3초간 공격력 2배 (쿨타임 10초)',skillCd:10},
  {id:'hook',name:'Hook',hp:900,atk:30,speedMult:0.7,rangeMult:1.5,color:'#0e7490',desc:'체력 900 | 공격력 30 (이동속도 0.7배, 사거리 1.5, 선딜 0.5초)\n패시브: 평타를 맞출 때마다 적 0.5초 에어본\n스킬: 죽음의 갈고리 - 갈고리를 던져 맞은 적을 끌어당기고 5초간 이동속도 0.4 감소 (쿨타임 15초)',skillCd:15},
  {id:'galaxy',name:'Galaxy',hp:500,atk:0,speedMult:1.0,rangeMult:1.0,color:'#6366f1',desc:'체력 500 | 공격력 모은 운석조각 × 10 (사거리 무한)\n패시브: 맵 곳곳에 운석조각이 생성됨 (먹을 때마다 공격력 +10)\n스킬: 중력전환 - 자신과 적의 중력을 반전시킴 (쿨타임 5초)',skillCd:5}
];
CHARACTERS.push({id:'sanz',name:'Sanz',hp:99999,atk:10,speedMult:1.0,rangeMult:8,color:'#2563eb',desc:'집중력 100 | 공격력 10 (사거리 8배)\n평타: 뼈 던지기 | 피격 시 집중력 -30 + 적 뒤로 회피\n스킬: 가스터블래스터 - 레이저 50 피해 (쿨타임 10초)',skillCd:10});

const ATK_CD = {timebreaker:1.2, volcano:1.4, shadow:0.8, boxer:0.5, luckyguy:1.0, sky:1.3, matryoshka:1.0, ironspike:1.6, joker:2.0, mastersmith:1.0, digger:1.6, rift:2.0, berserker:1.0, hook:1.0, galaxy:1.0, sanz:0.5};
const WNAME = {hammer: '망치', scythe: '낫', bow: '활'};
let selectionState = {currentTurn:'p1',p1Char:CHARACTERS[0],p2Char:CHARACTERS[1],p1Confirmed:false};

// Touch pads
function padHTML(p, tc, atkCls, skCls, skTxt, rev){
  const btn = (d, sym, round) => `<button class="touch-control-btn ${round} flex items-center justify-center text-base font-black ${tc}" ontouchstart="event.preventDefault();setKey('${p}','${d}',true)" ontouchend="setKey('${p}','${d}',false)" ontouchcancel="setKey('${p}','${d}',false)" onmousedown="setKey('${p}','${d}',true)" onmouseup="setKey('${p}','${d}',false)" onmouseleave="setKey('${p}','${d}',false)">${sym}</button>`;
  return `<div class="flex items-end justify-start gap-3 w-5/12 pointer-events-auto ${rev?'flex-row-reverse':''}">
    <div class="grid grid-cols-3 gap-0.5 w-24 h-24"><div></div>${btn('up','▲','rounded-t-2xl')}<div></div>${btn('left','◀','rounded-l-2xl')}<div></div>${btn('right','▶','rounded-r-2xl')}</div>
    <div class="flex flex-col gap-1 mb-0.5">
      <button class="touch-control-btn w-11 h-11 rounded-full ${atkCls} font-black text-[10px] shadow-lg text-white" ontouchstart="event.preventDefault();doAttack('${p}')" onmousedown="doAttack('${p}')">공격</button>
      <button class="touch-control-btn w-11 h-11 rounded-full ${skCls} font-black text-[10px] shadow-lg text-white flex flex-col items-center justify-center" ontouchstart="event.preventDefault();doSkill('${p}')" onmousedown="doSkill('${p}')"><span>스킬</span><span id="${p}-cd-label" class="text-[8px] font-normal ${skTxt}">READY</span></button>
    </div></div>`;
}
document.getElementById('touch-overlay').innerHTML =
  padHTML('p1','text-blue-300','bg-blue-600/80 border-blue-400','bg-indigo-600/80 border-indigo-400','text-indigo-200',false) +
  padHTML('p2','text-red-300','bg-red-600/80 border-red-400','bg-orange-600/80 border-orange-400','text-orange-200',true);

function renderSelectionCards(){
  const box = document.getElementById('char-scroll-container');
  box.innerHTML = '';
  const cur = selectionState.currentTurn === 'p1' ? selectionState.p1Char : selectionState.p2Char;
  CHARACTERS.forEach(char => {
    const sel = cur.id === char.id;
    const card = document.createElement('div');
    const activeBorder = selectionState.currentTurn === 'p1' ? 'border-blue-500 bg-blue-900/30' : 'border-red-500 bg-red-900/30';
    card.className = `flex-none w-60 sm:w-72 min-h-[55vh] p-4 rounded-2xl border-2 cursor-pointer transition-all ${sel ? activeBorder + ' shadow-xl scale-105' : 'border-slate-800 bg-slate-900/50 hover:bg-slate-800/80'}`;
    card.innerHTML = `<div class="relative flex items-center justify-center h-32 sm:h-44 rounded-xl mb-2 overflow-hidden" style="background:radial-gradient(circle at 50% 60%, ${char.color}66, transparent 70%), linear-gradient(160deg,#0f172a,#020617);box-shadow:inset 0 0 0 1px ${char.color}55"><div class="w-24 h-24 sm:w-36 sm:h-36 drop-shadow-[0_0_14px_rgba(255,255,255,0.25)]">${ART[char.id]}</div><span class="absolute top-1 right-2 text-[10px] font-black tracking-widest" style="color:${char.color}">${char.id === 'sky' ? 'NO ATTACK' : char.id === 'jack' ? 'WEAPON' : 'ATK SPD ' + ATK_CD[char.id] + 's'}</span></div><div class="font-black text-lg sm:text-xl italic tracking-wider uppercase mb-1" style="color:${char.color}">${char.name}</div><p class="text-xs sm:text-sm text-slate-300 whitespace-pre-line leading-relaxed font-medium">${char.desc}</p>`;
    card.onclick = () => {
      if (selectionState.currentTurn === 'p1') { selectionState.p1Char = char; document.getElementById('p1-name-display').innerText = char.name; }
      else { selectionState.p2Char = char; document.getElementById('p2-name-display').innerText = char.name; }
      renderSelectionCards();
    };
    box.appendChild(card);
  });
}

function handleConfirmSelection(){
  if (selectionState.currentTurn === 'p1') {
    selectionState.p1Confirmed = true;
    selectionState.currentTurn = 'p2';
    const ti = document.getElementById('turn-indicator');
    ti.innerText = 'PLAYER 2 캐릭터를 선택하세요';
    ti.className = 'mt-1 inline-block px-4 py-1 rounded-full bg-red-900/80 border border-red-400 text-red-200 text-xs sm:text-sm font-bold tracking-wide turn-active';
    document.getElementById('p1-select-box').className = 'flex flex-col items-center justify-center p-2 rounded-xl border-2 border-blue-500/50 bg-blue-950/20 opacity-80';
    const b1 = document.getElementById('p1-status-badge');
    b1.className = 'text-[9px] sm:text-[11px] px-2 py-0.5 mt-1 rounded bg-blue-600 text-white font-bold';
    b1.innerText = '선택 완료';
    document.getElementById('p1-name-display').innerText = '??? (비공개)';
    document.getElementById('handoff').classList.remove('hidden');
    document.getElementById('p2-select-box').className = 'flex flex-col items-center justify-center p-2 rounded-xl border-2 border-red-500 bg-red-950/30';
    document.getElementById('p2-name-display').innerText = selectionState.p2Char.name;
    document.getElementById('p2-name-display').className = 'text-sm sm:text-lg font-black text-white mt-1';
    const b2 = document.getElementById('p2-status-badge');
    b2.className = 'text-[9px] sm:text-[11px] px-2 py-0.5 mt-1 rounded bg-red-500/20 text-red-300 font-bold border border-red-400/30';
    b2.innerText = '선택 중...';
    const cb = document.getElementById('confirm-btn');

function doAttack(pk){

  for (let i = meteors.length - 1; i >= 0; i--) {

function drawMeteors(){

    const sc = Math.min(1, m.age * 3), y = m.y + Math.sin(m.ph) * 4;
    ctx.save();

    ctx.fillStyle = 'rgba(129,140,248,0.22)'; ctx.beginPath(); ctx.arc(0, 0, m.r * 1.9, 0, 6.283); ctx.fill();
    ctx.rotate(m.rot);

    ctx.beginPath();

      const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr;

function drawWithHit(f){
  const hit = f.hitTime > 0;
  if (!hit && !f.gFlip) { f.draw(); return; }
  ctx.save();
  if (f.gFlip) {
    const cx = f.x + f.width / 2, cy = f.y + f.height / 2;
    ctx.translate(cx, cy); ctx.scale(1, -1); ctx.translate(-cx, -cy);
  }
  if (hit) {
    const p = f.hitTime / f.hitMax;
    const ease = Math.sin(Math.PI * (1 - p));
    const px = f.x + f.width / 2, py = f.y + f.height;
    ctx.translate(px, py);
    ctx.rotate((f.kbDir || 1) * 0.3 * ease);
    ctx.scale(1 + 0.06 * ease, 1 - 0.08 * ease);
    ctx.translate(-px, -py);

  }
  f.draw();
  ctx.restore();
}

    if (_frameAcc < 15.5) { animId = requestAnimationFrame(runGameLoop); return; }
    _frameAcc = Math.max(0, _frameAcc - 16.667);
  }
  ctx.fillStyle = '#050a14'; ctx.fillRect(0, 0, canvasWidth, canvasHeight);
  const floorY = canvasHeight - FLOOR_H;

  ctx.fillStyle = '#3b82f6'; ctx.fillRect(0, floorY, canvasWidth, 3);

  p1.update(); p2.update(); stepKnockback(p1); stepKnockback(p2); updateMeteors();
  updateProjectiles(); drawBombs(floorY);
  drawWithHit(p1); drawWithHit(p2); drawLava(); drawDust(); updateBlasters();
  for (let i = floaters.length - 1; i >= 0; i--) {

}

function sfxSeven(i){

    const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(p[1], t + 0.01); g.gain.exponentialRampToValueAtTime(0.001, t + len);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + len + 0.05);

  const k = c.createOscillator(); k.type = 'square';

let audioCtx = null;
function ac(){
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; } }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
['pointerdown', 'touchstart', 'keydown'].forEach(ev => window.addEventListener(ev, ac));

let lastHitSfx = 0;
function sfxHit(amt){
  const c = ac(); if (!c) return;
  const now = c.currentTime;
  if (now - lastHitSfx < 0.05) return;
  lastHitSfx = now;
  const p = Math.min(1, Math.max(0.35, amt / 60));
  const t = now;
  // 저음 펀치 (쿵)
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(190, t); o.frequency.exponentialRampToValueAtTime(48, t + 0.14);
  const og = c.createGain(); og.gain.setValueAtTime(0.9 * p + 0.2, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
  o.connect(og); og.connect(c.destination); o.start(t); o.stop(t + 0.2);
  // 타격 노이즈 (퍽)
  const len = 0.09;
  if (!window._hitBuf || window._hitBufCtx !== c) {
    const buf = c.createBuffer(1, Math.floor(c.sampleRate * len), c.sampleRate), dd = buf.getChannelData(0);
    for (let i = 0; i < dd.length; i++) dd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / dd.length, 2.2);
    window._hitBuf = buf; window._hitBufCtx = c;
  }
  const n = c.createBufferSource(); n.buffer = window._hitBuf;
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500; bp.Q.value = 0.8;
  const ng = c.createGain(); ng.gain.setValueAtTime(0.6 * p + 0.15, t); ng.gain.exponentialRampToValueAtTime(0.001, t + len);
  n.connect(bp); bp.connect(ng); ng.connect(c.destination); n.start(t);
  // 날카로운 임팩트 (딱)
  const k = c.createOscillator(); k.type = 'square';
  k.frequency.setValueAtTime(520, t); k.frequency.exponentialRampToValueAtTime(120, t + 0.04);
  const kg = c.createGain(); kg.gain.setValueAtTime(0.12 * p, t); kg.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  k.connect(kg); kg.connect(c.destination); k.start(t); k.stop(t + 0.06);
}

function noiseBuf(c, dur){
  const buf = c.createBuffer(1, Math.floor(c.sampleRate * dur), c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function sfxVolcano(){
  const c = ac(); if (!c) return;
  const t = c.currentTime;
  // 저음 폭발 (쿠웅)
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(95, t); o.frequency.exponentialRampToValueAtTime(32, t + 0.9);
  const og = c.createGain(); og.gain.setValueAtTime(0.0001, t); og.gain.exponentialRampToValueAtTime(0.9, t + 0.03); og.gain.exponentialRampToValueAtTime(0.001, t + 1.0);
  o.connect(og); og.connect(c.destination); o.start(t); o.stop(t + 1.05);
  // 울림 (불길 소리)
  const n = c.createBufferSource(); n.buffer = noiseBuf(c, 1.4);
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.exponentialRampToValueAtTime(120, t + 1.2);
  const ng = c.createGain(); ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.7, t + 0.05); ng.gain.exponentialRampToValueAtTime(0.001, t + 1.35);
  n.connect(lp); lp.connect(ng); ng.connect(c.destination); n.start(t);
  // 타다닥 튀는 소리
  for (let i = 0; i < 9; i++) {
    const st = t + 0.1 + Math.random() * 0.9;
    const cn = c.createBufferSource(); cn.buffer = noiseBuf(c, 0.05);
    const hp = c.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1800 + Math.random() * 2500;
    const cg = c.createGain(); cg.gain.setValueAtTime(0.25, st); cg.gain.exponentialRampToValueAtTime(0.001, st + 0.05);
    cn.connect(hp); hp.connect(cg); cg.connect(c.destination); cn.start(st);
  }
}

function tickTock(c, t0){
  // 틱(높은 소리) + 탁(낮은 소리)
  [[0, 1500], [0.11, 950]].forEach(p => {
    const st = t0 + p[0];
    const k = c.createOscillator(); k.type = 'square';
    k.frequency.setValueAtTime(p[1], st); k.frequency.exponentialRampToValueAtTime(p[1] * 0.6, st + 0.04);
    const kg = c.createGain(); kg.gain.setValueAtTime(0.15, st); kg.gain.exponentialRampToValueAtTime(0.001, st + 0.05);
    k.connect(kg); kg.connect(c.destination); k.start(st); k.stop(st + 0.06);
  });
}

function sfxTimeAtk(){
  const c = ac(); if (!c) return;
  tickTock(c, c.currentTime);
}

function sfxTimeStop(){
  const c = ac(); if (!c) return;
  const t = c.currentTime;
  // 틱탁 틱탁 틱탁
  [0, 0.3, 0.6].forEach(d => tickTock(c, t + d));
  // 멈출 때 내려치는 종소리
  [[165, 0.7], [660, 0.12]].forEach(f => {
    const b = c.createOscillator(); b.type = 'sine'; b.frequency.setValueAtTime(f[0], t + 0.95);
    const bg = c.createGain(); bg.gain.setValueAtTime(0.0001, t + 0.95); bg.gain.exponentialRampToValueAtTime(f[1], t + 0.97); bg.gain.exponentialRampToValueAtTime(0.001, t + 2.0);
    b.connect(bg); bg.connect(c.destination); b.start(t + 0.95); b.stop(t + 2.05);
  });
}

function sfxWhoosh(heavy){
  const c = ac(); if (!c) return;
  const t = c.currentTime;
  const dur = heavy ? 0.38 : 0.26;
  const n = c.createBufferSource(); n.buffer = noiseBuf(c, dur + 0.05);
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = heavy ? 1.1 : 1.4;
  const f0 = heavy ? 300 : 500, f1 = heavy ? 1500 : 2300, f2 = heavy ? 450 : 800;
  bp.frequency.setValueAtTime(f0, t);
  bp.frequency.exponentialRampToValueAtTime(f1, t + dur * 0.4);
  bp.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = c.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(heavy ? 0.7 : 0.45, t + dur * 0.35);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  n.connect(bp); bp.connect(g); g.connect(c.destination); n.start(t);
}

function sfxVolcanoAtk(){
  const c = ac(); if (!c) return;
  const t = c.currentTime;
  // 묵직한 타격
  const o = c.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(50, t + 0.18);
  const og = c.createGain(); og.gain.setValueAtTime(0.6, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
  o.connect(og); og.connect(c.destination); o.start(t); o.stop(t + 0.22);
  // 화염이 훅 번지는 소리
  const n = c.createBufferSource(); n.buffer = noiseBuf(c, 0.3);
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 0.9;
  bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(1700, t + 0.25);
  const ng = c.createGain(); ng.gain.setValueAtTime(0.0001, t); ng.gain.exponentialRampToValueAtTime(0.45, t + 0.04); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
  n.connect(bp); bp.connect(ng); ng.connect(c.destination); n.start(t);
}

function drawGlove(e){
  const p = Math.min(1, (1 - e.life / e.max) * 2.5), al = Math.max(0, e.life / e.max);
  const big = e.glove === 'blue', g = (big ? 28 : 20) * S;
  const base = e.dir > 0 ? e.x : e.x + e.w;
  const gx = base + e.dir * e.w * p, gy = e.y + e.h * 0.4;
  const main = big ? '#3b82f6' : '#ef4444', dark = big ? '#1d4ed8' : '#b91c1c';
  ctx.save();
  ctx.globalAlpha = Math.min(1, al * 1.5);
  ctx.lineCap = 'round';
  ctx.strokeStyle = main; ctx.lineWidth = 6 * S;
  ctx.beginPath(); ctx.moveTo(base, gy); ctx.lineTo(gx, gy); ctx.stroke();
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(e.dir > 0 ? gx - g * 1.6 : gx + g, gy - g * 0.6, g * 0.6, g * 1.2);
  ctx.fillStyle = main; ctx.strokeStyle = dark; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(gx, gy, g, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(gx - e.dir * g * 0.2, gy + g * 0.75, g * 0.45, g * 0.3, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(gx, gy, g * 0.65, e.dir > 0 ? -2.4 : -0.74, e.dir > 0 ? -1.4 : 0.26); ctx.stroke();
  if (big) {
    ctx.strokeStyle = '#93c5fd'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(gx + e.dir * g, gy, g * (0.7 + p * 0.5), 0, Math.PI * 2); ctx.stroke();
  } else {
    ctx.strokeStyle = '#fca5a5'; ctx.lineWidth = 3;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(gx - e.dir * g * 1.9, gy + i * g * 0.6); ctx.lineTo(gx - e.dir * g * 2.8, gy + i * g * 0.6); ctx.stroke();
    }
  }
  ctx.restore();
}

function hookHit(a, foe, dir){
  if (dodged(foe)) return;
  if (foe.invTime > 0) popText(foe.x + foe.width / 2, foe.y - 34, '무적', '#e2e8f0');
  else {
    foe.hp = Math.max(0, foe.hp - 15);
    popText(foe.x + foe.width / 2, foe.y - 34, '-15', '#94a3b8');
    updateHUD();
    if (foe.hp <= 0) { defeated(foe, a); if (matchOver) return; }
  }
  foe.x = dir > 0 ? a.x + a.width + 4 : a.x - foe.width - 4;
  foe.x = Math.max(12, Math.min(canvasWidth - 12 - foe.width, foe.x));
  foe.slowTime = 5; popText(foe.x + foe.width / 2, foe.y - 50, '둔화!', '#38bdf8');
}

  const sp = h.swingTime > 0 ? 1 - h.swingTime / h.swingDur : -1;

function berserkCd(a){
  const h = a.hp;
  return h <= 100 ? 0.2 : h <= 300 ? 0.5 : h <= 500 ? 0.8 : 1.0;
}

function fireBullets(a){
  a.atkCdTimer = berserkCd(a); const rd = Math.max(0.1, berserkCd(a) * 0.6); a.swingTime = rd; a.swingDur = rd;
  const dir = a.facingRight ? 1 : -1, dmg = 4 * (a.rageTime > 0 ? 2 : 1);
  const mx = (a.facingRight ? a.x + a.width : a.x) + dir * 50 * S, my = a.y + a.height * 0.5;
  [-0.22, -0.11, 0, 0.11, 0.22].forEach(s => {
    projectiles.push({type: 'bullet', x: mx, y: my, vx: dir * 14, vy: 14 * s, r: 3.5 * S, left: 58 * S * 3 - 50 * S, dmg, owner: a});
  });
  a.visualEffects.push({x: dir > 0 ? mx : mx - 14, y: my - 7, w: 14, h: 14, color: 'rgba(249,115,22,0.9)', life: 0.06});
}

function bulletHit(a, d, dmg){
  if (dodged(d)) return;
  if (d.invTime > 0) popText(d.x + d.width / 2, d.y - 34, '무적', '#e2e8f0');
  else {
    d.hp = Math.max(0, d.hp - dmg);
    popText(d.x + d.width / 2, d.y - 34 - Math.random() * 14, '-' + dmg, '#fca5a5');
    if (d.char.id === 'jack' && d.hp > 0) {
      d.hp = Math.min(d.maxHp, d.hp + 5); d.lastHp = d.hp;
      popText(d.x + d.width / 2, d.y - 62, '+5', '#4ade80');
    }
  }
  if (d.char.id === 'ironspike') {
    a.hp = Math.max(0, a.hp - 3);
    popText(a.x + a.width / 2, a.y - 34, '-3', '#94a3b8');
    updateHUD();
    if (a.hp <= 0) { defeated(a, d); return; }
  }
  updateHUD();
  if (d.hp <= 0) defeated(d, a);
}

function fireWave(a){
  a.atkCdTimer = a.atkCd;
  const dir = a.facingRight ? 1 : -1;
  projectiles.push({type: 'wave', x: a.facingRight ? a.x + a.width : a.x, y: a.y + a.height * 0.5, vx: dir * 9, r: 16 * S, left: 58 * S * a.rangeMult, total: 58 * S * a.rangeMult, hit: false, col: '#fb7185', owner: a});
}

function waveHit(a, d, dir){
  if (dodged(d)) return;
  if (d.invTime > 0) popText(d.x + d.width / 2, d.y - 34, '무적', '#e2e8f0');
  else {
    d.hp = Math.max(0, d.hp - a.char.atk);
    popText(d.x + d.width / 2, d.y - 34, '-' + a.char.atk, '#fde047');
  }
  if (d.char.id === 'ironspike') {
    a.hp = Math.max(0, a.hp - 3);
    popText(a.x + a.width / 2, a.y - 34, '-3', '#94a3b8');
    updateHUD();
    if (a.hp <= 0) { defeated(a, d); return; }
  }
  knockback(a, d, dir);
  d.x = Math.max(12, Math.min(canvasWidth - 12 - d.width, d.x));
  updateHUD();
  if (d.hp <= 0) defeated(d, a);
}

function hurt(v, amt, src, color){
  if (dodged(v)) return;
  v.hp = Math.max(0, v.hp - amt);
  popText(v.x + v.width / 2, v.y - 34, '-' + amt, color);
  updateHUD();
  if (v.hp <= 0) defeated(v, src);
}

  const type = types[Math.floor(Math.random() * 5)];
  const col = {fire: '#ef4444', ice: '#3b82f6', gas: '#22c55e', confuse: '#a855f7', stun: '#facc15'}[type];
  projectiles.push({x: a.facingRight ? a.x + a.width : a.x, y: a.y + a.height * 0.35, vx: (a.facingRight ? 1 : -1) * 9, r: 9 * S, type, col, owner: a});
}

function bombHit(b, foe){
  const a = b.owner;
  const inv = foe.invTime > 0;
  if (b.type === 'fire') {
    a.visualEffects.push({x: b.x - 45, y: b.y - 45, w: 90, h: 90, color: 'rgba(239,68,68,0.6)', life: 0.25});
    if (inv) popText(foe.x + foe.width / 2, foe.y - 34, '무적', '#e2e8f0'); else hurt(foe, 50, a, '#ef4444');
  } else if (b.type === 'stun') {
    foe.stunTime = 2.0;
    popText(foe.x + foe.width / 2, foe.y - 34, '기절!', '#facc15');
  } else if (b.type === 'ice') {
    if (inv) popText(foe.x + foe.width / 2, foe.y - 34, '무적', '#e2e8f0'); else hurt(foe, 20, a, '#60a5fa');
    if (!matchOver) foe.frozenTime = 2.0;
  } else if (b.type === 'gas') {
    const dir = b.vx > 0 ? 1 : -1; const rg = 58 * S * 2;
    gasZones.push({x1: dir > 0 ? foe.x : foe.x - rg, x2: dir > 0 ? foe.x + foe.width + rg : foe.x + foe.width, life: 5, tick: 0, owner: a});
  } else {
    foe.confusedTime = 4.0;
    popText(foe.x + foe.width / 2, foe.y - 34, '혼란!', '#c084fc');
  }
}

function wallBomb(b){
  const a = b.owner, foe = a.isP1 ? p2 : p1;
  if (b.type === 'fire') {

    if (foe.x < b.x + 45 && foe.x + foe.width > b.x - 45 && foe.y < b.y + 45 && foe.y + foe.height > b.y - 45) {

function updateProjectiles(){
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const b = projectiles[i];
    if (b.type === 'wave') {
      b.x += b.vx; b.left -= Math.abs(b.vx);
      b.r = (12 + 22 * (1 - b.left / b.total)) * S;
      const fw = b.owner.isP1 ? p2 : p1;
      if (!b.hit && b.x + b.r > fw.x && b.x - b.r < fw.x + fw.width && b.y + b.r > fw.y && b.y - b.r < fw.y + fw.height) {
        b.hit = true; waveHit(b.owner, fw, b.vx > 0 ? 1 : -1);
        if (matchOver) return;
      }
      if (b.left <= 0 || b.x < 0 || b.x > canvasWidth) projectiles.splice(i, 1);
      continue;
    }
    if (b.type === 'star') {
      b.x += b.vx; b.rot += 0.3;
      const fs = b.owner.isP1 ? p2 : p1;
      if (b.x + b.r > fs.x && b.x - b.r < fs.x + fs.width && b.y + b.r > fs.y && b.y - b.r < fs.y + fs.height) {
        projectiles.splice(i, 1); dealHit(b.owner, fs, b.dmg, b.vx > 0 ? 1 : -1);
        if (matchOver) return;
        continue;
      }
      if (b.x < -40 || b.x > canvasWidth + 40) projectiles.splice(i, 1);
      continue;
    }
    if (b.type === 'arrow') {
      b.x += b.vx; b.left -= Math.abs(b.vx);
      const fa = b.owner.isP1 ? p2 : p1;
      if (b.x + b.r > fa.x && b.x - b.r < fa.x + fa.width && b.y + b.r > fa.y && b.y - b.r < fa.y + fa.height) {
        projectiles.splice(i, 1); dealHit(b.owner, fa, 10, b.vx > 0 ? 1 : -1);
        if (matchOver) return;
        continue;
      }
      if (b.left <= 0 || b.x < 0 || b.x > canvasWidth) projectiles.splice(i, 1);
      continue;
    }
    if (b.type === 'bone') {
      b.x += b.vx; b.left -= Math.abs(b.vx);
      const fo = b.owner.isP1 ? p2 : p1;
      if (b.x + b.r > fo.x && b.x - b.r < fo.x + fo.width && b.y + b.r > fo.y && b.y - b.r < fo.y + fo.height) {
        projectiles.splice(i, 1); dealHit(b.owner, fo, b.owner.char.atk, b.vx > 0 ? 1 : -1);
        if (matchOver) return;
        continue;
      }
      if (b.left <= 0 || b.x < 0 || b.x > canvasWidth) projectiles.splice(i, 1);
      continue;
    }
    if (b.type === 'chain') {
      b.x += b.vx; b.left -= Math.abs(b.vx);
      const fc = b.owner.isP1 ? p2 : p1;
      b.y += Math.max(-5 * S, Math.min(5 * S, (fc.y + fc.height * 0.5) - b.y));
      if (b.x + b.r > fc.x && b.x - b.r < fc.x + fc.width && b.y + b.r > fc.y && b.y - b.r < fc.y + fc.height) {
        projectiles.splice(i, 1); hookHit(b.owner, fc, b.dir);
        if (matchOver) return;
        continue;
      }
      if (b.left <= 0 || b.x < 0 || b.x > canvasWidth) projectiles.splice(i, 1);
      continue;
    }
    if (b.type === 'bullet') {
      b.x += b.vx; b.y += b.vy; b.left -= Math.abs(b.vx);
      const fb = b.owner.isP1 ? p2 : p1;
      if (b.x + b.r > fb.x && b.x - b.r < fb.x + fb.width && b.y + b.r > fb.y && b.y - b.r < fb.y + fb.height) {
        projectiles.splice(i, 1); bulletHit(b.owner, fb, b.dmg);
        if (matchOver) return;
        continue;
      }
      if (b.left <= 0 || b.x < 0 || b.x > canvasWidth) projectiles.splice(i, 1);
      continue;
    }
    b.x += b.vx;
    if (b.x - b.r <= 0 || b.x + b.r >= canvasWidth) { projectiles.splice(i, 1); wallBomb(b); if (matchOver) return; continue; }
    const foe = b.owner.isP1 ? p2 : p1;
    if (b.x + b.r > foe.x && b.x - b.r < foe.x + foe.width && b.y + b.r > foe.y && b.y - b.r < foe.y + foe.height) {
      projectiles.splice(i, 1);
      bombHit(b, foe);
      if (matchOver) return;
    }
  }
  const floorY = canvasHeight - FLOOR_H;
  for (let i = gasZones.length - 1; i >= 0; i--) {
    const z = gasZones[i];
    z.life -= 1 / 60; z.tick += 1 / 60;
    const foe = z.owner.isP1 ? p2 : p1;
    if (z.tick >= 1) {
      z.tick -= 1;
      const inside = foe.x < z.x2 && foe.x + foe.width > z.x1 && foe.y + foe.height > floorY - 68 * S;
      if (inside && !(foe.invTime > 0)) { hurt(foe, 10, z.owner, '#4ade80'); if (matchOver) return; }
    }
    if (z.life <= 0) gasZones.splice(i, 1);
  }
}

function drawBombs(floorY){
  gasZones.forEach(z => {
    ctx.fillStyle = 'rgba(34,197,94,0.28)';
    ctx.beginPath(); ctx.ellipse((z.x1 + z.x2) / 2, floorY - 28 * S, (z.x2 - z.x1) / 2, 40 * S, 0, 0, Math.PI * 2); ctx.fill();
  });
  projectiles.forEach(b => {
    if (b.type === 'chain') { drawHookProj(b); return; }
    if (b.type === 'chain') {
      const sx = b.dir > 0 ? b.owner.x + b.owner.width : b.owner.x, sy = b.y, d = b.dir;
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 3 * S; ctx.setLineDash([6 * S, 4 * S]);
      ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(b.x, sy); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = 5 * S; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(b.x - d * 4 * S, sy); ctx.quadraticCurveTo(b.x + d * 12 * S, sy - 2 * S, b.x + d * 10 * S, sy + 12 * S); ctx.stroke();
      ctx.fillStyle = '#e2e8f0';
      ctx.beginPath(); ctx.moveTo(b.x + d * 5 * S, sy + 10 * S); ctx.lineTo(b.x + d * 10 * S, sy + 18 * S); ctx.lineTo(b.x + d * 15 * S, sy + 10 * S); ctx.fill();
      ctx.lineCap = 'butt';
      return;
    }
    if (b.type === 'bullet') {
      ctx.strokeStyle = 'rgba(253,224,71,0.6)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x - b.vx * 1.5, b.y - b.vy * 1.5); ctx.lineTo(b.x, b.y); ctx.stroke();
      ctx.fillStyle = '#fef08a';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      return;
    }
    if (b.type === 'star') {
      const s = b.vx > 0 ? 1 : -1;
      const g = ctx.createLinearGradient(b.x, b.y, b.x - s * 70 * S, b.y);
      g.addColorStop(0, 'rgba(165,180,252,0.85)'); g.addColorStop(1, 'rgba(99,102,241,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(b.x, b.y - b.r * 0.9); ctx.lineTo(b.x - s * 70 * S, b.y); ctx.lineTo(b.x, b.y + b.r * 0.9); ctx.fill();
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
      ctx.shadowColor = b.glow; ctx.shadowBlur = 14 + b.tier * 8;
      ctx.fillStyle = b.rock; ctx.strokeStyle = '#e0e7ff'; ctx.lineWidth = 2 + b.tier;
      ctx.beginPath();
      for (let i = 0; i < 7; i++) { const ang = i / 7 * Math.PI * 2, rr = b.r * (0.8 + 0.25 * Math.sin(i * 2.7)); const px = Math.cos(ang) * rr, py = Math.sin(ang) * rr; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
      return;
    }
    if (b.type === 'bone') {
      ctx.save();
      ctx.translate(b.x, b.y); ctx.rotate(b.x * 0.04);
      ctx.fillStyle = '#f8fafc';
      ctx.beginPath(); ctx.roundRect(-14 * S, -3 * S, 28 * S, 6 * S, 3 * S); ctx.fill();
      [[-14, -3.5], [-14, 3.5], [14, -3.5], [14, 3.5]].forEach(k => { ctx.beginPath(); ctx.arc(k[0] * S, k[1] * S, 3.6 * S, 0, Math.PI * 2); ctx.fill(); });
      ctx.restore();
      return;
    }
    if (b.type === 'arrow') {
      const s = b.vx > 0 ? 1 : -1;
      ctx.strokeStyle = '#f97316'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(b.x - s * 18 * S, b.y); ctx.lineTo(b.x + s * 4 * S, b.y); ctx.stroke();
      ctx.fillStyle = '#a855f7';
      ctx.beginPath(); ctx.moveTo(b.x + s * 10 * S, b.y); ctx.lineTo(b.x + s * 3 * S, b.y - 5 * S); ctx.lineTo(b.x + s * 3 * S, b.y + 5 * S); ctx.fill();
      ctx.fillStyle = '#2e1065';
      ctx.beginPath(); ctx.moveTo(b.x - s * 18 * S, b.y); ctx.lineTo(b.x - s * 25 * S, b.y - 5 * S); ctx.lineTo(b.x - s * 22 * S, b.y); ctx.lineTo(b.x - s * 25 * S, b.y + 5 * S); ctx.fill();
      return;
    }
    if (b.type === 'wave') {
      const t = performance.now() / 140, R = b.r * 1.15;
      ctx.beginPath();
      for (let i = 0; i <= 64; i++) {
        const ang = i / 64 * Math.PI * 2, rr = R * (1 + 0.14 * Math.sin(ang * 9 + t));
        const px = b.x + Math.cos(ang) * rr, py = b.y + Math.sin(ang) * rr;
        if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = '#dc2626'; ctx.fill();
      ctx.strokeStyle = '#ef4444'; ctx.lineWidth = 4; ctx.stroke();
      ctx.strokeStyle = '#fecaca'; ctx.lineWidth = 3;
      for (let k = 0; k < 4; k++) {
        ctx.beginPath();
        ctx.ellipse(b.x, b.y, R * (0.9 - k * 0.15), R * (0.6 - k * 0.08), t * (k % 2 ? -1 : 1) + k, 0, Math.PI * 2);
        ctx.stroke();
      }
      return;
    }
    drawBomb(b);
  });
}

const blasters = [];
const SANZ_BUF = 99999;

function hudFor(f, pre){
  const sz = f.char.id === 'sanz';
  hudSet('hud-' + pre + '-hp-bar', 'w', Math.max(0, sz ? f.focus : f.hp / f.maxHp * 100) + '%');

function drawSanz(f){
  const w = f.width, h = f.height, x = f.x, y = f.y;
  const cx = x + w / 2, dir = f.facingRight ? 1 : -1;
  const t = performance.now() / 1000;
  const glow = f.windupTimer > 0 || f.focus <= 30 || f.sanzGrace > 0 || blasters.some(b => b.owner === f);
  ctx.save();
  // legs + slippers
  ctx.fillStyle = '#f1f5f9';
  ctx.fillRect(x + w * 0.24, y + h * 0.88, w * 0.14, h * 0.07);
  ctx.fillRect(x + w * 0.62, y + h * 0.88, w * 0.14, h * 0.07);
  ctx.fillStyle = '#f9a8d4';
  ctx.beginPath(); ctx.roundRect(x + w * 0.14 + (dir > 0 ? w * 0.06 : 0), y + h * 0.94, w * 0.34, h * 0.06, 3 * S); ctx.fill();
  ctx.beginPath(); ctx.roundRect(x + w * 0.52 + (dir > 0 ? w * 0.06 : 0), y + h * 0.94, w * 0.34, h * 0.06, 3 * S); ctx.fill();
  // shorts with white side stripes
  ctx.fillStyle = '#111827';
  ctx.beginPath(); ctx.roundRect(x + w * 0.08, y + h * 0.7, w * 0.84, h * 0.19, 4 * S); ctx.fill();
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(x + w * 0.08, y + h * 0.7, w * 0.06, h * 0.19);
  ctx.fillRect(x + w * 0.86, y + h * 0.7, w * 0.06, h * 0.19);
  // hood (behind head), hoodie body
  ctx.fillStyle = '#1d4ed8';
  ctx.beginPath(); ctx.ellipse(cx, y + h * 0.25, w * 0.52, h * 0.24, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#2563eb';
  ctx.beginPath(); ctx.roundRect(x, y + h * 0.42, w, h * 0.3, 8 * S); ctx.fill();
  ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 2 * S;
  ctx.beginPath(); ctx.moveTo(cx, y + h * 0.46); ctx.lineTo(cx, y + h * 0.7); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + w * 0.2, y + h * 0.6, w * 0.14, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x + w * 0.8, y + h * 0.6, w * 0.14, 0.2, Math.PI - 0.2); ctx.stroke();
  // fur collar
  ctx.fillStyle = '#f1f5f9';
  ctx.beginPath(); ctx.roundRect(x - w * 0.02, y + h * 0.4, w * 1.04, h * 0.07, 5 * S); ctx.fill();
  // skull
  const hcy = y + h * 0.22, rx = w * 0.46, ry = h * 0.2;
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath(); ctx.ellipse(cx, hcy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  // eye sockets
  const ex = w * 0.2, ey = hcy - ry * 0.12;
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.ellipse(cx - ex, ey, w * 0.11, h * 0.065, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + ex, ey, w * 0.11, h * 0.065, 0, 0, Math.PI * 2); ctx.fill();
  // pupils (left eye glows when charging / low focus / just dodged)
  const px = dir * w * 0.02;
  ctx.save();
  if (glow) { ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 14 * S; ctx.fillStyle = Math.floor(t * 10) % 2 ? '#22d3ee' : '#facc15'; }
  else ctx.fillStyle = '#f8fafc';
  ctx.beginPath(); ctx.arc(cx - ex + px, ey, glow ? w * 0.055 : w * 0.028, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath(); ctx.arc(cx + ex + px, ey, w * 0.028, 0, Math.PI * 2); ctx.fill();
  // nose
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.moveTo(cx, hcy + ry * 0.12); ctx.lineTo(cx - w * 0.03, hcy + ry * 0.32); ctx.lineTo(cx + w * 0.03, hcy + ry * 0.32); ctx.closePath(); ctx.fill();
  // wide grin with teeth
  ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.6 * S;
  const gcy = hcy + ry * 0.2, grx = rx * 0.75, gry = ry * 0.65;
  ctx.beginPath(); ctx.ellipse(cx, gcy, grx, gry, 0, 0.15, Math.PI - 0.15); ctx.stroke();
  for (let i = -3; i <= 3; i++) {
    const tx = cx + i * w * 0.11, k = Math.min(1, Math.abs(tx - cx) / grx);
    const ty = gcy + gry * Math.sqrt(1 - k * k);
    ctx.beginPath(); ctx.moveTo(tx, ty - ry * 0.18); ctx.lineTo(tx, ty); ctx.stroke();
  }
  ctx.restore();
}

function fireBone(a){
  if (matchOver) return;
  a.atkCdTimer = a.atkCd;
  const dir = a.facingRight ? 1 : -1;
  projectiles.push({type: 'bone', x: a.facingRight ? a.x + a.width : a.x, y: a.y + a.height * 0.45, vx: dir * 11, r: 8 * S, left: 58 * S * a.rangeMult, owner: a});
}

const BLASTER_HALF = [
  "..........#",
  ".........##",
  "........###",
  ".##.....###",
  ".###....###",
  "..###..####",
  "..###.#####",
  "...###.####",
  "....######k",
  "...#######k",
  "..########k",
  "..########k",
  ".####kkk##k",
  ".###kkkkk#k",
  "####k###k#k",
  "####k#k#k#k",
  "####k###k#k",
  "#####kkk##k",
  ".########kk",
  ".#######kkk",
  ".########kk",
  ".#########k",
  ".##########",
  ".#k#k#k#k##",
  "..#k#k#k###",
  "..#kk#kk###",
  "...#kkkk###",
  "....#kkk###",
  ".....#k####",
  "......#####"
];
const BLASTER_FULL = BLASTER_HALF.map(h => h + h.slice(0, 10).split('').reverse().join(''));

function drawBlasterSkull(cs){
  const W = 21, H = BLASTER_FULL.length;
  const ox = -W * cs / 2, oy = -H * cs / 2;
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    const ch = BLASTER_FULL[r][c];
    if (ch === '.') continue;
    ctx.fillStyle = ch === '#' ? '#f8fafc' : '#0b1220';
    ctx.fillRect(ox + c * cs, oy + r * cs, cs + 0.6, cs + 0.6);
  }
}

function beamHits(b, f){
  const hw = b.bw / 2;
  const x0 = f.x - hw, x1 = f.x + f.width + hw, y0 = f.y - hw, y1 = f.y + f.height + hw;
  const dx = b.ex - b.mx, dy = b.ey - b.my;
  const p = [-dx, dx, -dy, dy], q = [b.mx - x0, x1 - b.mx, b.my - y0, y1 - b.my];
  let t0 = 0, t1 = 1;
  for (let i = 0; i < 4; i++) {
    if (p[i] === 0) { if (q[i] < 0) return false; }
    else {
      const r = q[i] / p[i];
      if (p[i] < 0) { if (r > t1) return false; if (r > t0) t0 = r; }
      else { if (r < t0) return false; if (r < t1) t1 = r; }
    }
  }
  return true;
}

function spawnBlaster(a, d){
  if (matchOver) return;
  const cs = 2.6 * S;
  const hx = a.x + a.width / 2, hy = Math.max(a.y - 10 * S, 42 * S);
  const tx = d.x + d.width / 2, ty = d.y + d.height / 2;
  const ang = Math.atan2(ty - hy, tx - hx);
  const ux = Math.cos(ang), uy = Math.sin(ang);
  const mx = hx + ux * 10 * cs, my = hy + uy * 10 * cs;
  blasters.push({owner: a, foe: d, x: hx, y: hy, cs, ang, mx, my, ex: mx + ux * 3000, ey: my + uy * 3000, bw: 30 * S, t: 0, fired: false, done: false});
}

function updateBlasters(){
  for (let i = blasters.length - 1; i >= 0; i--) {
    const b = blasters[i];
    b.t += 1/60;
    const p = Math.min(1, b.t / 0.5);
    if (b.t >= 0.5) b.fired = true;
    if (b.fired && !b.done && !matchOver) {
      const f = b.foe;
      if (beamHits(b, f)) {
        b.done = true;
        if (f.invTime > 0) popText(f.x + f.width / 2, f.y - 34, '\ubb34\uc801', '#e2e8f0');
        else { f.hp = Math.max(0, f.hp - 50); popText(f.x + f.width / 2, f.y - 34, '-50', '#67e8f9'); }
        updateHUD();
        if (f.hp <= 0) defeated(f, b.owner);
      }
    }
    if (b.t >= 0.9) { blasters.splice(i, 1); continue; }
    const fade = b.t > 0.75 ? Math.max(0, 1 - (b.t - 0.75) / 0.15) : 1;
    if (!b.fired) {
      ctx.save();
      ctx.strokeStyle = `rgba(103,232,249,${0.25 + 0.4 * p})`; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
      ctx.beginPath(); ctx.moveTo(b.mx, b.my); ctx.lineTo(b.ex, b.ey); ctx.stroke();
      ctx.restore();
    } else {
      const k = (b.t - 0.5) / 0.4;
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - k * 0.8);
      ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 26;
      ctx.strokeStyle = '#67e8f9'; ctx.lineWidth = b.bw * (1 - k * 0.5);
      ctx.beginPath(); ctx.moveTo(b.mx, b.my); ctx.lineTo(b.ex, b.ey); ctx.stroke();
      ctx.shadowBlur = 0; ctx.strokeStyle = '#f0fdfa'; ctx.lineWidth = b.bw * 0.55 * (1 - k * 0.5);
      ctx.beginPath(); ctx.moveTo(b.mx, b.my); ctx.lineTo(b.ex, b.ey); ctx.stroke();
      ctx.restore();
    }
    ctx.save();
    ctx.globalAlpha = fade;
    const grow = Math.min(1, 0.3 + b.t / 0.15 * 0.7);
    const shake = b.fired ? (Math.random() - 0.5) * 4 : 0;
    ctx.translate(b.x + shake, b.y + shake);
    ctx.rotate(b.ang - Math.PI / 2);
    ctx.scale(grow, grow);
    drawBlasterSkull(b.cs);
    ctx.restore();
    if (!b.fired) {
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.fillStyle = `rgba(165,243,252,${0.4 + 0.5 * p})`;
      ctx.shadowColor = '#22d3ee'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(b.mx, b.my, (4 + p * 16) * S, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
}

function drawShell(e){
  const t = 1 - e.life / e.max;
  const a = Math.max(0, 1 - t);
  const pw = e.w / 3;
  const pieces = [
    {ox: 0, dx: -1, dy: -0.3, rot: -0.9},
    {ox: pw, dx: 0.2, dy: -1, rot: 0.6},
    {ox: pw * 2, dx: 1, dy: -0.3, rot: 0.9}
  ];
  ctx.save();
  ctx.globalAlpha = a;
  pieces.forEach((p, i) => {
    const cx = e.x + p.ox + pw / 2 + p.dx * t * 46;
    const cy = e.y + e.h / 2 + p.dy * t * 46 + t * t * 40;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(p.rot * t * 2);
    ctx.fillStyle = i === 1 ? '#be185d' : '#ec4899';
    ctx.fillRect(-pw / 2, -e.h / 2, pw, e.h);
    ctx.strokeStyle = '#fde68a'; ctx.lineWidth = 2;
    ctx.strokeRect(-pw / 2, -e.h / 2, pw, e.h);
    ctx.restore();
  });
  ctx.restore();
}

function defeated(d, killer){
  const foeD = d.char.id === 'matryoshka' ? (d.isP1 ? p2 : p1) : null;
  if (foeD && d.lifeMax > 50) {
    const range = 58 * S * 2;
    const gap = Math.max(0, Math.max(d.x, foeD.x) - Math.min(d.x + d.width, foeD.x + foeD.width));
    d.visualEffects.push({x: d.x - range, y: d.y, w: d.width + range * 2, h: d.height, color: 'rgba(236,72,153,0.4)', life: 0.25});
    if (gap <= range && !(foeD.invTime > 0)) {
      foeD.hp = Math.max(0, foeD.hp - 30);
      popText(foeD.x + foeD.width / 2, foeD.y - 34, '-30', '#ec4899');
      updateHUD();
    }
  }
  if (d.char.id === 'matryoshka' && d.lifeMax > 50) {
    d.lifeMax = d.lifeMax / 2;
    d.maxHp = d.lifeMax; d.hp = d.lifeMax;
    d.dodge = Math.min(0.6, (d.dodge || 0) + 0.2);
    d.frozenTime = 0; d.stunTime = 0;
    {
      const ow = d.width * d.bodyScale, oh = d.height * d.bodyScale;
      d.visualEffects.push({shell: true, x: d.x + (d.width - ow) / 2, y: d.y + d.height - oh, w: ow, h: oh, life: 0.7, max: 0.7});
      d.reviveCount++;
    }
    popText(d.x + d.width / 2, d.y - 50, '부활!', '#fbbf24');
    updateHUD();
    if (foeD && foeD.hp <= 0) defeated(foeD, d);
    return;
  }
  if (foeD && foeD.hp <= 0) { finishMatch(d); return; }
  finishMatch(killer);
}

function finishMatch(w){
  matchOver = true; clearInterval(matchInterval);
  document.getElementById('winner-title').innerText = `${w.char.name} WINS!`;
  document.getElementById('winner-desc').innerText = `${w.isP1 ? 'PLAYER 1' : 'PLAYER 2'} 승리!`;
  document.getElementById('winner-modal').classList.remove('hidden');
}

function handleTimeOut(){
  matchOver = true; clearInterval(matchInterval);
  let desc = '무승부!';
  const effHp = f => f.char.id === 'sanz' ? f.focus : f.hp;
  if (effHp(p1) > effHp(p2)) desc = 'PLAYER 1 체력 우세 승리!';
  else if (effHp(p2) > effHp(p1)) desc = 'PLAYER 2 체력 우세 승리!';
  document.getElementById('winner-title').innerText = 'TIME UP!';
  document.getElementById('winner-desc').innerText = desc;
  document.getElementById('winner-modal').classList.remove('hidden');
}

function backToCharSelect(){
  if (matchInterval) clearInterval(matchInterval);
  if (animId) cancelAnimationFrame(animId);
  document.getElementById('winner-modal').classList.add('hidden');
  document.getElementById('game-arena').classList.add('hidden');
  document.getElementById('char-select-screen').classList.remove('hidden');
  selectionState = {currentTurn:'p1', p1Char:CHARACTERS[0], p2Char:CHARACTERS[1], p1Confirmed:false};
  const ti = document.getElementById('turn-indicator');
  ti.innerText = 'PLAYER 1 캐릭터를 선택하세요';
  ti.className = 'mt-1 inline-block px-4 py-1 rounded-full bg-blue-900/80 border border-blue-400 text-blue-200 text-xs sm:text-sm font-bold tracking-wide turn-active';
  document.getElementById('p1-select-box').className = 'flex flex-col items-center justify-center p-2 rounded-xl border-2 border-blue-500 bg-blue-950/30';
  document.getElementById('p1-name-display').innerText = selectionState.p1Char.name;
  const b1 = document.getElementById('p1-status-badge');
  b1.className = 'text-[9px] sm:text-[11px] px-2 py-0.5 mt-1 rounded bg-blue-500/20 text-blue-300 font-bold border border-blue-400/30';
  b1.innerText = '선택 중...';
  document.getElementById('p2-select-box').className = 'flex flex-col items-center justify-center p-2 rounded-xl border-2 border-slate-800 bg-slate-900/30 opacity-60';
  document.getElementById('p2-name-display').innerText = '대기 중';
  document.getElementById('p2-name-display').className = 'text-sm sm:text-lg font-black text-slate-400 mt-1';
  const b2 = document.getElementById('p2-status-badge');
  b2.className = 'text-[9px] sm:text-[11px] px-2 py-0.5 mt-1 rounded bg-slate-800 text-slate-400 font-bold';
  b2.innerText = '대기';
  const cb = document.getElementById('confirm-btn');
  cb.innerText = 'P1 캐릭터 확정';
  cb.className = 'flex-1 py-3 font-black text-base sm:text-lg rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-500 text-white shadow-lg shadow-blue-900/40 border border-white/20 active:scale-95 transition-all';
  renderSelectionCards();
}

function showLoading(){
  const L = document.getElementById('loading-screen');
  const a = selectionState.p1Char, b = selectionState.p2Char;
  document.getElementById('load-p1-art').innerHTML = ART[a.id];
  document.getElementById('load-p2-art').innerHTML = ART[b.id];
  document.getElementById('load-p1-name').innerText = a.name;
  document.getElementById('load-p2-name').innerText = b.name;
  const bar = document.getElementById('load-bar');
  bar.style.width = '0%';
  document.getElementById('char-select-screen').classList.add('hidden');
  L.classList.remove('hidden');
  let t0 = null;
  requestAnimationFrame(function tick(now){
    if (t0 === null) t0 = now;
    const r = Math.min(1, (now - t0) / 2200);
    bar.style.width = (r * 100) + '%';
    if (r < 1) requestAnimationFrame(tick);
    else {
      document.getElementById('game-arena').classList.remove('hidden');
      L.classList.add('hidden');
      initMatch();
    }
  });
}
