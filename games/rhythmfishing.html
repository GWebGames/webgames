<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:var(--tx);background:rgba(30,70,120,.7);border:1px solid var(--ln);border-radius:12px;padding:9px 13px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
button.pri{background:linear-gradient(#2fa6ff,#1c6fd6);border-color:#7cc8ff;font-weight:700}
button.gold{background:linear-gradient(#ffcf5a,#e9962b);color:#2b1700;border-color:#ffe3a0;font-weight:800}
button.dng{background:rgba(160,40,50,.7)}
button:disabled{opacity:.4;pointer-events:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;display:flex;justify-content:space-between;gap:8px;pointer-events:none;z-index:5}
.pill{background:rgba(5,16,36,.62);border:1px solid var(--ln);border-radius:20px;padding:6px 12px;font-size:13px;backdrop-filter:blur(6px);pointer-events:auto;line-height:1.35}
#chip{cursor:pointer;max-width:68vw}
#money{white-space:nowrap;font-weight:700;color:var(--ac2)}
#dock{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:7px;justify-content:center;align-items:stretch;z-index:5}
#dock button{flex:1;max-width:96px;padding:8px 2px;font-size:12px;line-height:1.25;background:rgba(5,16,36,.72);backdrop-filter:blur(6px)}
#dock button b{display:block;font-size:20px;font-weight:400}
#dock #main{flex:2.2;max-width:210px;font-size:16px;font-weight:800;background:linear-gradient(#2fa6ff,#1c6fd6);border-color:#8ad0ff}
#fightui{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#fightui .w{position:absolute;pointer-events:auto;touch-action:none}
#reel{padding-top:30px;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:radial-gradient(circle,#3a5f8f,#16304f);display:flex;align-items:center;justify-content:center;font-size:12px;text-align:center;line-height:1.1}
#reel i{position:absolute;width:6px;height:28px;left:50%;top:6px;margin-left:-3px;background:var(--ac2);border-radius:3px;transform-origin:50% 31px}
.lb{width:52px;height:52px;border-radius:50%;font-size:22px;display:flex;align-items:center;justify-content:center;background:rgba(30,70,120,.7);border:2px solid var(--ln)}
.lb.on{background:rgba(79,209,255,.6)}
#giveup{left:10px;top:calc(env(safe-area-inset-top) + 8px);padding:5px 10px;font-size:12px;border-radius:14px}
#hint{position:fixed;left:50%;top:22%;transform:translateX(-50%);padding:8px 16px;border-radius:18px;background:rgba(5,16,36,.7);border:1px solid var(--ln);font-size:15px;font-weight:700;z-index:6;pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;max-width:90vw}
#hint.on{opacity:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 52px);transform:translate(-50%,-20px);background:rgba(10,30,60,.95);border:1px solid var(--ac);padding:9px 16px;border-radius:14px;font-size:14px;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(2,8,20,.72);z-index:20;display:none;align-items:center;justify-content:center;padding:10px;touch-action:pan-y}
#modal.on{display:flex}
.panel{background:var(--pn);border:1px solid var(--ln);border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);overflow:auto;padding:16px 16px 18px;position:relative;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.panel h2{margin:0 30px 10px 0;font-size:19px}
.panel h3{margin:14px 0 6px;font-size:14px;color:var(--ac)}
.panel .x{position:absolute;right:10px;top:10px;padding:4px 10px;border-radius:50%}
.panel p,.panel li{font-size:13.5px;line-height:1.55;color:#cfe2f5}
.panel ul{padding-left:18px;margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row>*{flex:0 0 auto}.row .g{flex:1 1 auto}
.tabs{display:flex;gap:6px;margin:6px 0 10px}.tabs button{flex:1;padding:7px 4px;font-size:13px}.tabs button.on{background:linear-gradient(#2fa6ff,#1c6fd6)}
select,input[type=text],textarea{background:#0c2342;color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:8px;font:inherit;font-size:13px;-webkit-user-select:text;user-select:text}
textarea{width:100%;min-height:64px;font-family:ui-monospace,Menlo,monospace}
input[type=range]{width:140px}
.code{font-family:ui-monospace,Menlo,monospace;background:#071a33;border:1px dashed var(--ac);border-radius:10px;padding:8px 10px;font-size:15px;letter-spacing:1px;text-align:center;color:var(--ac2);-webkit-user-select:text;user-select:text;word-break:break-all}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{background:rgba(20,50,90,.55);border:1px solid var(--ln);border-radius:12px;padding:6px;text-align:center;font-size:11.5px;line-height:1.35}
.card img{width:100%;height:46px;object-fit:contain}
.card.lock{opacity:.55}.card .n{font-weight:700;font-size:12.5px}
.rk{display:flex;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;background:rgba(20,50,90,.4);margin:4px 0;font-size:13px}
.rk img{width:44px;height:30px;object-fit:contain}.rk .g{flex:1}
.mut{color:var(--mut);font-size:12px}
.gold{color:var(--ac2)}
#cgrid{display:grid;gap:2px;margin:8px auto;touch-action:none;width:max-content;padding:6px;background:#0a2545;border:2px solid #5b94c9;border-radius:10px}
#cgrid .ce{width:var(--cs);height:var(--cs);background:rgba(255,255,255,.06);border-radius:4px}
#cgrid .ce.pv-ok{outline:2px solid #6ee7a0;background:rgba(110,231,160,.45)}
#cgrid .ce.pv-bad{outline:2px solid #ff6b6b;background:rgba(255,107,107,.45)}
.tray{display:flex;gap:12px;align-items:center;background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.4);border-radius:12px;padding:8px;margin:6px 0}
.mini{display:grid;gap:1px}.mini span{width:13px;height:13px;border-radius:3px}
.bar{height:9px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac)}
@media (max-width:420px){#dock button{font-size:11px}#dock button b{font-size:18px}}

/* ---- 픽셀 스타일 ---- */
html,body{font-family:"NeoDunggeunmo","DotGothic16","Galmuri11","Apple SD Gothic Neo","Malgun Gothic",monospace}

button{border:2px solid #cfe8ff;box-shadow:0 3px 0 #08142b,inset 0 0 0 1px rgba(0,0,0,.35);text-shadow:1px 1px 0 #000}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #08142b}
.pill,#toast,#hint{border:2px solid #cfe8ff;box-shadow:0 3px 0 #08142b}
.panel{border:3px solid #cfe8ff;box-shadow:0 0 0 3px #08142b,6px 6px 0 rgba(0,0,0,.55)}
.card,.rk,.tray,.code{border-width:2px}
#reel{border:3px solid #fff}
.lb{border:2px solid #cfe8ff}
</style>
</head>

const AUTO={region:null,wx:null,temp:null,lat:null,lon:null,src:'none',msg:''};
const C={region:'S',period:1,wx:'c',season:'a',temp:null};
const periodOf=h=>h>=5&&h<8?0:h>=8&&h<17?1:h>=17&&h<20?2:3;
const seasonOf=m=>m>=2&&m<=4?'p':m>=5&&m<=7?'u':m>=8&&m<=10?'a':'w';
function regionOf(lat,lon){
 if(lat<31||lat>39.5||lon<123.5||lon>132.5)return'O';
 if(lat>=33&&lat<=33.75&&lon>=126&&lon<=127)return'J';
 if(lat>=37.35&&lat<=37.75&&lon>=126.6&&lon<=127.3)return'F';
 if(lat<35.2&&lon>=126.3)return'S';
 if(lat>=35.2&&lon>=128.4)return'E';
 if(lon<127.2&&lat>=34.4)return'W';
 if(lat<34.4)return'S';
 return'F';
}
function wxOf(code,wind){
 if(code>=95)return't';if(code===45||code===48)return'f';
 if((code>=51&&code<=67)||(code>=80&&code<=82))return wind>45?'t':'r';
 if((code>=71&&code<=77)||code===85||code===86)return's';
 if(code===2||code===3)return'o';return'c';
}
function recalc(){
 const s=S.set,d=new Date();
 C.region=s.regionMode==='auto'?(AUTO.region||'S'):s.regionMode;
 C.period=s.perMode==='auto'?periodOf(d.getHours()):+s.perMode;
 C.wx=s.wxMode==='auto'?(AUTO.wx||'c'):s.wxMode;
 C.season=seasonOf(d.getMonth());C.temp=s.wxMode==='auto'?AUTO.temp:null;
 chip();ambience();
}

function geolocate(){
 return new Promise(res=>{
  if(!navigator.geolocation){AUTO.msg='이 브라우저는 위치 기능을 지원하지 않아요.';return res(false)}
  let done=false;const to=setTimeout(()=>{if(!done){done=true;AUTO.msg='위치 확인 시간 초과';res(false)}},9000);
  navigator.geolocation.getCurrentPosition(async p=>{
   if(done)return;done=true;clearTimeout(to);
   AUTO.lat=+p.coords.latitude.toFixed(2);AUTO.lon=+p.coords.longitude.toFixed(2);AUTO.region=regionOf(AUTO.lat,AUTO.lon);AUTO.src='real';AUTO.msg='';
   try{
    const ac=new AbortController();setTimeout(()=>ac.abort(),7000);
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${AUTO.lat}&longitude=${AUTO.lon}&current=temperature_2m,weather_code,wind_speed_10m`,{signal:ac.signal});
    const j=await r.json();AUTO.wx=wxOf(j.current.weather_code,j.current.wind_speed_10m);AUTO.temp=j.current.temperature_2m;
   }catch(e){AUTO.wx=null;AUTO.msg='날씨를 못 가져와서 맑음으로 대체했어요.'}
   res(true);
  },err=>{if(done)return;done=true;clearTimeout(to);AUTO.msg=err.code===1?'위치 권한이 거부되었어요.':'위치를 가져오지 못했어요.';res(false)},{timeout:8000,maximumAge:600000});
 });
}

}

const hasBat=w=>{const c=w.charCodeAt(w.length-1)-0xAC00;return c>=0&&c<11172&&c%28!==0};
function makeLyrics(sp){
 const r=mulberry(sp.id*313+5),sub=t=>t.replace(/\{n\}/g,sp.n).replace(/\{야\}/g,hasBat(sp.n)?'아':'야').replace(/\{r\}/g,REG[C.region].n.split('·')[0]).replace(/\{w\}/g,WX[C.wx][0]).replace(/\{t\}/g,PER[C.period][0]);
 const pickN=(a,n)=>{const c=a.slice(),o=[];while(o.length<n&&c.length)o.push(c.splice(r()*c.length|0,1)[0]);return o};
 const Y=LY[sp.s]||LY.ballad,v=pickN(Y.verse,4),p=pickN(Y.pre,2),c=pickN(Y.cho,3),b=pickN(Y.bri,2);
 return{intro:['♪','♪'],verse:v.map(sub),pre:p.map(sub),chorus:[c[0],c[1],c[0],c[2]].map(sub),bridge:b.map(sub)};
}
const songTitle=sp=>sp.n+({ballad:'의 자장가',groove:' 스윙',rock:' 로큰롤',drum:' 드럼 솔로',edm:' 하우스'}[sp.s]);
function vowel(t,f,len,v,d){
 if(!A.c)return;const c=A.c,g0=c.createGain();g0.gain.setValueAtTime(0,t);g0.gain.linearRampToValueAtTime(v,t+len*.3);g0.gain.linearRampToValueAtTime(0,t+len);
 const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(f,t);const vb=c.createOscillator(),vg=c.createGain();vb.frequency.value=5.5;vg.gain.value=f*.012;vb.connect(vg);vg.connect(o.frequency);
 [[700,1],[1220,.6],[2600,.3]].forEach(x=>{const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=x[0];bp.Q.value=7;const gg=c.createGain();gg.gain.value=x[1];o.connect(bp);bp.connect(gg);gg.connect(g0)});
 g0.connect(d||A.m);if(A.revIn){const rv=c.createGain();rv.gain.value=.5;g0.connect(rv);rv.connect(A.revIn)}
 o.start(t);vb.start(t);o.stop(t+len+.1);vb.stop(t+len+.1);
}
const slotT=(F,i,k)=>F.t0+i*F.barDur+k*F.beat/4+((F.swing&&k%2)?F.beat/4*F.swing:0);
function hitSound(F,n,perf){
 if(!A.c)return;const d=F.bus,f=mf(n.p),t=A.c.currentTime;
 switch(F.sp.s){
  case'ballad':voice(t,f,.9,{type:'triangle',v:.2,a:.003,lp0:5000,lp1:1400,r:.3,dest:d,rev:.5});voice(t,f*2,.5,{type:'sine',v:.06,r:.2,dest:d,rev:.4});break;
  case'groove':voice(t,f,.35,{type:'sine',v:.22,a:.002,r:.15,dest:d,rev:.3,dly:.2});voice(t,f*2,.2,{type:'triangle',v:.07,r:.1,dest:d});break;
  case'rock':voice(t,f,.28,{type:'sawtooth',v:.12,a:.003,lp0:3800,lp1:1500,dist:1,r:.1,dest:d,rev:.2,dly:.15});break;
  case'drum':voice(t,f,.13,{type:'square',v:.1,a:.002,lp0:6000,r:.05,dest:d,dly:.25});break;
  default:voice(t,f,.22,{type:'sawtooth',det:[-12,0,12],v:.07,a:.004,lp0:7500,lp1:2500,r:.12,dest:d,rev:.35,dly:.3});
 }
 if(F.combo>=8)voice(t,f*2,.2,{type:'sine',v:.05,dest:d,rev:.4});
 if(perf)tone(f*3,.35,'sine',.04,t,d);
}

function scheduleBar(F,i){
 if(!A.c)return;const d=F.bus,M=F.mus,sty=F.sp.s,P=DRM[sty],sec=secOf(F,i),nm=sec.name,sl=F.beat/4,t0=F.t0+i*F.barDur;
 const km=M.key+(F.bgm?0:kmod(sec)),ch=M.prog[chordIdx(sec)],soft=S.set.asmr?.55:1,run=runAt(F,t0+.02),T=k=>slotT(F,i,k);
 const chordM=[0,ch.q==='m'?3:4,7,12].map(x=>km+12+ch.r+x);

 for(let k=0;k<16;k++){const t=T(k);
  if(drums){
   if(P.k[k]==='x')vKick(t,(k%4===0?1:.8)*soft,d);

   if(P.r&&P.r[k]==='x')vRim(t,.5*soft,d);
   if(P.c&&P.c[k]==='x')vClap(t,.8,d);
   if(P.h[k]==='x')vHat(t,P.hv*(k%4===0?1.1:.7)*soft,d);
   if(P.o&&P.o[k]==='x')vHat(t,.9,d,true);
   if(P.b[k]==='x'){const dg=M.bd[M.bi++%M.bd.length],f=mf(km+ch.r+dg);
    if(sty==='ballad')voice(t,f,F.beat*1.6,{type:'sine',v:.3,a:.01,r:.25,dest:d});

    else voice(t,f,sl*(sty==='edm'?2.5:2.2),{type:'sawtooth',v:sty==='edm'?.22:.2,a:.003,lp0:1100,lp1:200,r:.06,dest:d})}
  }else if(nm==='intro'){if(k%4===2)vHat(t,.35*soft,d);if(sec.bs===1&&k%8===0)vKick(t,.7*soft,d)}
  if(k===0&&(nm==='bridge'||(nm==='intro'&&sec.bs===1)))voice(t,mf(km+ch.r),F.beat*3.6,{type:'sine',v:.3,a:.02,r:.3,dest:d});
  // 후렴 코드 스탭
  if(full&&!S.set.asmr){

   if(sty==='edm'&&'x.......x.......'[k]==='x')chordM.slice(0,3).forEach(m=>voice(t,mf(m),sl*6,{type:'sawtooth',det:[-10,10],v:.04,lp0:5000,lp1:1800,dest:d,rev:.3}));
  }

  if((full||nm==='pre')&&sty==='edm')voice(t,mf(chordM[k%4]+12),sl*1.4,{type:'sawtooth',v:.03,a:.002,lp0:4000,lp1:800,r:.05,dest:d,dly:.3});
  if(nm==='bridge'&&k%4===0&&sty!=='ballad')voice(t,mf(chordM[(k/4)%4]+12),F.beat*1.5,{type:'sine',v:.07,a:.004,r:.4,dest:d,rev:.6});
 }
 // 패드
 if((sty==='ballad'||sty==='edm'||sty==='groove'||nm==='intro'||nm==='bridge')&&!(S.set.asmr&&sty==='edm'))chordM.slice(0,3).forEach(m=>voice(t0,mf(m-12),F.barDur*.97,{type:'sawtooth',det:[-8,8],v:(nm==='intro'||nm==='bridge'?.045:.03)*soft,a:.25,lp0:900,lp1:700,r:.3,dest:d,rev:.4,sus:.9}));
 // 후렴 코러스('아~')

 // 섹션 전환 장치
 if(full&&sec.bs===0&&!F.bgm){if(sty==='ballad')voice(t0,mf(km+48+ch.r),1.6,{type:'sine',v:.1,r:.8,dest:d,rev:.7});else vCrash(t0,.85*soft,d)}
 if(nm==='pre'&&lastBar){for(let k=8;k<16;k++)vSnare(T(k),(.2+(k-8)*.09)*soft,d);noise(F.barDur,'highpass',400,.11,t0,d,8000)}
 if(nm==='bridge'&&lastBar)noise(F.barDur,'highpass',300,.13,t0,d,9000);
 if((nm==='verse'||(nm==='chorus'&&sec.n!==8))&&lastBar){if(sty==='rock'||sty==='drum')[200,165,135,105].forEach((f,j)=>vTom(T(12+j),f,.9*soft,d));else vHat(T(14),1,d,true)}

 if(run){noise(F.barDur,'highpass',300,.11,t0,d,7000);for(let b=0;b<4;b++)vTom(t0+b*F.beat,90,.7,d);voice(t0,mf(km+ch.r+18),F.barDur,{type:'sine',v:.07,a:.3,r:.3,dest:d})}
}

/* ---------- 아이스박스 (테트리스 정리) ---------- */
let P=null,pv=null,dragging=false;
function occGrid(skip){const [w,h]=coolSize(),o=Array.from({length:h},()=>Array(w).fill(-1));S.cooler.forEach((it,i)=>{if(i===skip)return;it.cells.forEach(([cx,cy])=>{if(o[it.y+cy]&&o[it.y+cy][it.x+cx]!==undefined)o[it.y+cy][it.x+cx]=i})});return o}
function fits(cells,x,y){const [w,h]=coolSize(),o=occGrid();return cells.every(([cx,cy])=>{const X=x+cx,Y=y+cy;return X>=0&&Y>=0&&X<w&&Y<h&&o[Y][X]<0})}
const usedKg=()=>S.cooler.reduce((a,b)=>a+b.kg,0);
function openCooler(){
 if(G.st==='fight')return;if(!P&&S.pending&&!S.pending.big)P={item:S.pending,fresh:true};
 openModal('<div id="cw"></div>',()=>{if(P&&P.lifted){S.cooler.push(P.orig);P=null;save()}pv=null});renderCooler();
}
function itemColor(it,k){const c=hex2(SP[it.sp].c[0]);return rgb(mixc(c,[255,255,255],.1+(k%3)*.1))}
function renderCooler(){
 const [w,h]=coolSize(),o=occGrid(),panelW=Math.min(520,innerWidth-52),cs=Math.floor(Math.min(46,(panelW-24-(w-1)*2)/w));
 const used=usedKg(),cells=o.flat().filter(v=>v>=0).length,rows=o.filter(r=>r.every(v=>v>=0)).length;
 let html=`<h2>🧊 아이스박스</h2><div class="row mut"><span>적재 <b class="gold">${fmtKg(used)}</b> / ${capKg()}kg</span><span>칸 ${cells}/${w*h}</span><span>완성 줄 <b class="gold">${rows}</b> (+${rows*6}%)</span>${cells===w*h?'<span class="gold">풀 패킹 +40%!</span>':''}</div><div class="bar"><i style="width:${Math.min(100,used/capKg()*100)}%;background:${used>capKg()*.9?'#ff8a5c':''}"></i></div>`;
 if(P){const it=P.item,sp=SP[it.sp];html+=`<div class="tray"><div class="mini" style="grid-template-columns:repeat(${Math.max(...it.cells.map(c=>c[0]))+1},13px)">${miniCells(it)}</div><div class="g"><b>${sp.n}</b> ${fmtKg(it.kg)}<br><span class="mut">${P.lifted?'다시 놓을 곳을 눌러요':'아래 칸을 누르거나 끌어서 놓으세요'}</span></div><div style="display:flex;flex-direction:column;gap:5px"><button id="rr">🔄 회전(R)</button><button id="ra">🪄 자동</button>${P.fresh?'<button class="dng" id="rd">🌊 방생</button>':''}</div></div>`}
 else html+=`<p class="mut">물고기를 눌러 집어 올려 위치를 바꿀 수 있어요. 가로줄을 꽉 채울수록 판매 보너스!</p>`;
 html+=`<div id="cgrid" style="--cs:${cs}px;grid-template-columns:repeat(${w},${cs}px)">`;
 for(let y=0;y<h;y++)for(let x=0;x<w;x++){const v=o[y][x];html+=`<div class="ce" data-x="${x}" data-y="${y}" ${v>=0?`style="background:${itemColor(S.cooler[v],v)};box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)"`:''}></div>`}
 html+='</div>';
 if(S.cooler.length)html+=`<h3>실린 물고기</h3>`+S.cooler.map((it,i)=>`<div class="rk"><img src="${thumb(SP[it.sp])}"><div class="g"><b>${SP[it.sp].n}</b> ${fmtKg(it.kg)} <span class="gold">${QN[it.q]}</span></div><button data-r="${i}">방생</button></div>`).join('');
 $('#cw').innerHTML=html;
 const gr=$('#cgrid');gr.addEventListener('pointerdown',cgDown);gr.addEventListener('pointermove',cgMove);gr.addEventListener('pointerup',cgUp);gr.addEventListener('pointercancel',()=>{dragging=false;clearPv()});
 gr.addEventListener('contextmenu',e=>{e.preventDefault();rotatePending()});
 if($('#rr'))$('#rr').onclick=rotatePending;if($('#ra'))$('#ra').onclick=autoPlace;if($('#rd'))$('#rd').onclick=()=>{P=null;releasePending(false)};
 document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const it=S.cooler.splice(+b.dataset.r,1)[0];toast(`🌊 ${SP[it.sp].n} 방생`);save();renderCooler()});
}
function miniCells(it){const mw=Math.max(...it.cells.map(c=>c[0]))+1,mh=Math.max(...it.cells.map(c=>c[1]))+1;let s='';const col=SP[it.sp].c[0];for(let y=0;y<mh;y++)for(let x=0;x<mw;x++)s+=`<span style="background:${it.cells.some(c=>c[0]===x&&c[1]===y)?col:'transparent'}"></span>`;return s}
function rotatePending(){if(!P)return;P.item.cells=rotCells(P.item.cells);renderCooler()}
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);if(!el||!el.classList.contains('ce'))return null;return{x:+el.dataset.x,y:+el.dataset.y}}
function clearPv(){document.querySelectorAll('#cgrid .pv-ok,#cgrid .pv-bad').forEach(e=>e.classList.remove('pv-ok','pv-bad'));pv=null}
function showPv(c){
 clearPv();if(!P||!c)return;const it=P.item,bw=Math.max(...it.cells.map(q=>q[0]))+1,bh=Math.max(...it.cells.map(q=>q[1]))+1;const x=c.x-Math.floor(bw/2),y=c.y-Math.floor(bh/2);
 const kgOk=usedKg()+it.kg<=capKg()+1e-6,ok=fits(it.cells,x,y)&&kgOk;pv={x,y,ok};
 it.cells.forEach(([cx,cy])=>{const el=document.querySelector(`#cgrid .ce[data-x="${x+cx}"][data-y="${y+cy}"]`);if(el)el.classList.add(ok?'pv-ok':'pv-bad')});
}
function cgDown(e){
 e.preventDefault();const c=cellAt(e);if(!c)return;
 if(!P){const o=occGrid(),i=o[c.y][c.x];if(i>=0){const it=S.cooler.splice(i,1)[0];P={item:it,lifted:true,orig:{...it,cells:it.cells.map(q=>[...q])}};renderCooler();return}return}
 dragging=true;try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}showPv(c);
}
function cgMove(e){if(!dragging||!P)return;const c=cellAt(e);if(c)showPv(c)}
function cgUp(e){
 if(!dragging||!P)return;dragging=false;const c=cellAt(e);if(c)showPv(c);
 if(pv&&pv.ok){const it=P.item;it.x=pv.x;it.y=pv.y;S.cooler.push(it);if(P.fresh){S.pending=null;toast(`🧊 ${SP[it.sp].n} 보관!`)}P=null;pv=null;save();setMain();renderCooler()}
 else if(pv){toast(usedKg()+P.item.kg>capKg()?'⚖ 적재량 초과! 다른 물고기를 방생해야 해요':'여긴 안 맞아요. 회전해 보세요')}
}
function autoPlace(){
 if(!P)return;const it=P.item;if(usedKg()+it.kg>capKg()){toast('⚖ 적재량 초과! 다른 물고기를 방생해야 해요');return}
 const [w,h]=coolSize();let cells=it.cells;
 for(let r=0;r<4;r++){for(let y=h-1;y>=0;y--)for(let x=0;x<w;x++)if(fits(cells,x,y)){it.cells=cells;it.x=x;it.y=y;S.cooler.push(it);if(P.fresh){S.pending=null;toast(`🧊 ${SP[it.sp].n} 보관!`)}P=null;save();setMain();renderCooler();return}cells=rotCells(cells)}
 toast('들어갈 자리가 없어요! 재배치하거나 방생하세요');
}

 ${row('cool','🧊','아이스박스 확장','칸 수 ↑ (현재 '+coolSize().join('×')+')',S.up.cool,6,'')}
 ${row('cap','⚖','선박 적재량','총 무게 한도 (현재 '+capKg()+'kg)',S.up.cap,6,'')}`);
 document.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const k=b.dataset.u,c=UPCOST[k][S.up[k]];if(S.coins<c){toast('코인이 부족해요');return}S.coins-=c;S.up[k]++;save();updMoney();sfx.catch();openShop()});
}

/* ---------- 도감/랭킹/코드 ---------- */
let logTab=0,logAll=false;
function openLog(){
 if(G.st==='fight')return;
 const tabs=['📖 도감','🏆 랭킹','🔗 인증코드'];
 const caught=SP.filter(s=>S.log[s.id]).length;
 let body='';
 if(logTab===0){
  const list=SP.filter(s=>logAll||s.r.includes(C.region));
  body=`<div class="row"><span class="mut g">${logAll?'전체':REG[C.region].n+' 서식'} 어종 · 수집 ${caught}/${SP.length}</span><button id="la">${logAll?'현재 지역만':'전체 보기'}</button></div><div class="cards">${list.map(s=>{const l=S.log[s.id];return`<div class="card ${l?'':'lock'}"><img src="${thumb(s,!l)}"><div class="n">${l?s.n:'???'}</div>${l?`<div>최대 ${fmtKg(l.max)}<br>${l.maxCm}cm · ${l.n}회${l.imp?`+🔗${l.imp}`:''}</div><div class="gold">${stars(s.rar)} ${l.bq!=null?QN[l.bq]:''}</div>`:`<div class="mut">${s.r.split('').map(r=>REG[r].n.slice(0,2)).join('·')}<br>${s.t.length<4?s.t.split('').map(p=>PER[p][1]).join(''):''}</div>`}</div>`}).join('')}</div>`;
 }else if(logTab===1){
  body=S.records.length?`<p class="mut">희귀도 대비 체급 순 TOP ${Math.min(10,S.records.length)} (내 기록 + 인증받은 기록)</p>`+S.records.slice(0,10).map((r,i)=>`<div class="rk"><b style="width:22px">${i+1}</b><img src="${thumb(SP[r.sp])}"><div class="g"><b>${SP[r.sp].n}</b> ${fmtKg(r.kg)} / ${r.cm}cm <span class="gold">${QN[r.q]}</span><br><span class="mut">${r.own?'🙋 내 기록':'🔗 인증받음'} · ${REG[r.region]?REG[r.region].n:''} · ${dayStr(r.day)}</span></div><button data-cc="${i}">코드</button></div>`).join(''):'<p class="mut">아직 기록이 없어요. 대어를 낚아 보세요!</p>';
 }else{
  body=`<p>친구가 보낸 <b>인증 코드</b>를 입력하면 그 물고기가 내 도감과 랭킹에 등록돼요.</p><input type="text" id="ci" placeholder="RB-XXXX-XXXX-XXXX-XXXX-XX" style="width:100%"><div class="row"><button class="pri g" id="cr">등록하기</button></div><div id="cres"></div>
  <h3>내가 최근 잡은 물고기 코드</h3>${S.records.filter(r=>r.own).slice(0,5).map((r,i)=>`<div class="rk"><div class="g"><b>${SP[r.sp].n}</b> ${fmtKg(r.kg)}<br><span class="code" style="font-size:12px;padding:3px 6px;display:inline-block">${r.code}</span></div><button data-cs="${r.code}">복사</button></div>`).join('')||'<p class="mut">없음</p>'}
  <p class="mut">⚠ 서버가 없는 단일 파일이라 코드는 간이 체크섬(오타·단순 변조 방지)으로만 검증돼요. 코드 형식을 아는 사람이 위조할 수 있으니 친구끼리 즐기는 인증용으로 봐주세요.</p>`;
 }
 const el=openModal(`<h2>📖 도감 · 랭킹</h2><div class="tabs">${tabs.map((t,i)=>`<button class="${i===logTab?'on':''}" data-t="${i}">${t}</button>`).join('')}</div>${body}`);
 el.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{logTab=+b.dataset.t;openLog()});
 if($('#la'))$('#la').onclick=()=>{logAll=!logAll;openLog()};
 el.querySelectorAll('[data-cc]').forEach(b=>b.onclick=()=>copyText(S.records[+b.dataset.cc].code));
 el.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>copyText(b.dataset.cs));
 if($('#cr'))$('#cr').onclick=()=>{
  const code=$('#ci').value.trim(),o=decodeCode(code);const res=$('#cres');
  if(!o){res.innerHTML='<p style="color:var(--bad)">❌ 올바르지 않은 코드예요. 오타를 확인해 주세요.</p>';return}
  const norm=encodeNorm(code);if(S.imp.includes(norm)||S.records.some(r=>encodeNorm(r.code)===norm)){res.innerHTML='<p style="color:var(--bad)">이미 등록된 코드예요.</p>';return}
  S.imp.push(norm);const rec=registerRecord(o,code.toUpperCase(),false);save();
  res.innerHTML=`<div class="rk"><img src="${thumb(SP[o.sp])}"><div class="g"><b>✅ ${SP[o.sp].n}</b> ${fmtKg(o.kg)} / ${o.cm}cm<br><span class="mut">${dayStr(o.day)} · ${REG[o.region].n} · ${WX[o.wx][0]} · ${PER[o.per][0]} · 품질 ${QN[o.q]}${o.asmr?' · 🎧':''}</span>${rec?'<br><span class="gold">도감 최고 기록 갱신!</span>':''}</div></div>`;sfx.catch();
 };
}
function encodeNorm(c){let s=String(c).toUpperCase().replace(/\s/g,'');if(s.startsWith('RB-'))s=s.slice(3);return s.replace(/-/g,'').replace(/O/g,'0').replace(/[IL]/g,'1')}

/* ---------- 설정 ---------- */
function openSettings(fromStart){
 const s=S.set,sel=(id,opts,v)=>`<select id="${id}">${opts.map(([k,n])=>`<option value="${k}" ${String(k)===String(v)?'selected':''}>${n}</option>`).join('')}</select>`;
 const el=openModal(`<h2>⚙️ 설정</h2>
 <h3>📍 현실 연동 (위치·시간·날씨)</h3>
 <p>현재: ${REG[C.region].n} / ${WX[C.wx][0]} / ${PER[C.period][0]}${AUTO.msg?`<br><span class="mut">${AUTO.msg}</span>`:''}</p>
 <div class="row"><button class="pri" id="sg">📡 지금 위치·날씨 다시 확인</button></div>
 <div class="row"><span>지역</span>${sel('sr',[['auto','자동(현실)'],...Object.keys(REG).map(k=>[k,REG[k].n])],s.regionMode)}<span>시간</span>${sel('sp',[['auto','자동'],...PER.map((p,i)=>[i,p[0]])],s.perMode)}<span>날씨</span>${sel('sw',[['auto','자동(현실)'],...Object.keys(WX).map(k=>[k,WX[k][0]])],s.wxMode)}</div>
 <h3>🔊 사운드 · ASMR</h3>
 <div class="row"><span>볼륨</span><input type="range" id="sv" min="0" max="1" step=".05" value="${s.vol}"></div>
 <div class="row"><label><input type="checkbox" id="sa" ${s.asmr?'checked':''}> 🎧 ASMR 모드 (시각 힌트 최소·빗소리·소리로 어종 맞히기)</label></div>
 <div class="row"><label><input type="checkbox" id="sbg" ${s.bgm?'checked':''}> 🎵 항구 BGM</label><label><input type="checkbox" id="sz" ${s.viz?'checked':''}> 사운드 비주얼라이저</label><label><input type="checkbox" id="sb" ${s.vib?'checked':''}> 진동 (Android)</label></div>
 <div class="row"><span>입력 지연 보정</span><input type="range" id="sl" min="-150" max="150" step="5" value="${s.lat}"><span id="slv">${s.lat}ms</span></div>
 <h3>📱 조작</h3>
 <div class="row"><button id="sy">${s.gyro?'📱 자이로 끄기':'📱 자이로 센서 켜기'}</button><span>감도</span><input type="range" id="ss" min=".5" max="2" step=".1" value="${s.sens}"></div>
 <p class="mut">자이로: 폰을 좌우로 기울여 버티고, 화면 법선 축으로 비틀어(크랭크) 릴을 감고, 휘둘러 챔질. PC는 마우스 휠/↑키로 릴, ←→·마우스 위치로 버티기.</p>
 <h3>🕹 화면 · 모바일</h3>
 <div class="row"><span>픽셀 크기</span>${sel('spx',[[0,'자동 (촘촘)'],[2,'2 (아주 촘촘)'],[3,'3'],[4,'4'],[5,'5'],[6,'6 (굵게)']],s.px)}<button id="sfs">⛶ 전체화면</button></div>
 <p class="mut">느린 기기에선 큰 숫자가 더 부드러워요. 폰은 홈 화면에 추가하면 주소창 없이 풀스크린으로 즐길 수 있어요. 가로·세로 모두 지원.</p>
 <h3>💾 저장 데이터</h3>
 <div class="row"><button id="se">내보내기</button><button id="si">불러오기</button><button class="dng" id="sx">초기화</button></div><textarea id="sd" placeholder="내보내기 코드가 여기에 나와요. 불러올 땐 붙여넣고 '불러오기'"></textarea>
 <h3>🎮 키보드</h3><p class="mut">Space/Enter/J/F: 던지기·챔질·박자 / ↑ or R: 릴 / ←→ or A D: 버티기 / C: 아이스박스 / Esc: 닫기</p>`);
 $('#sg').onclick=async()=>{S.set.regionMode='auto';S.set.wxMode='auto';await syncReal();save();openSettings()};
 $('#sr').onchange=e=>{s.regionMode=e.target.value;recalc();save();if(fromStart)G.st==='title'&&0};
 $('#sp').onchange=e=>{s.perMode=e.target.value;recalc();save()};$('#sw').onchange=e=>{s.wxMode=e.target.value;recalc();save()};
 $('#sv').oninput=e=>{s.vol=+e.target.value;if(A.m)A.m.gain.value=s.vol;save()};
 $('#sa').onchange=e=>{s.asmr=e.target.checked;ambience();save();toast(s.asmr?'🎧 ASMR 모드 ON':'ASMR 모드 OFF')};
 $('#sz').onchange=e=>{s.viz=e.target.checked;save()};$('#sb').onchange=e=>{s.vib=e.target.checked;if(s.vib)vib(80);save()};
 $('#sl').oninput=e=>{s.lat=+e.target.value;$('#slv').textContent=s.lat+'ms';save()};
 $('#ss').oninput=e=>{s.sens=+e.target.value;save()};
 $('#spx').onchange=e=>{s.px=+e.target.value;save();resize()};
 $('#sbg').onchange=e=>{s.bgm=e.target.checked;save()};
 $('#sfs').onclick=()=>{const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)f.call(el);else toast('이 브라우저는 전체화면을 지원하지 않아요. 홈 화면에 추가해 보세요')};
 $('#sy').onclick=async()=>{if(s.gyro){s.gyro=false;setMain();save();openSettings()}else{await enableGyro();openSettings()}};
 $('#se').onclick=()=>{$('#sd').value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#sd').select();copyText($('#sd').value)};
 $('#si').onclick=()=>{try{const j=JSON.parse(decodeURIComponent(escape(atob($('#sd').value.trim()))));const d=DEF();S=Object.assign(d,j);S.set=Object.assign(d.set,j.set||{});S.up=Object.assign(d.up,j.up||{});save();recalc();updMoney();setMain();toast('✅ 불러왔어요');closeModal()}catch(e){toast('❌ 코드가 올바르지 않아요')}};
 $('#sx').onclick=()=>{if(confirm('모든 진행 상황을 초기화할까요?')){localStorage.removeItem(KEY);location.reload()}};
}

/* ============================== 시작 ============================== */
function loop(ts){const dt=Math.min(.05,(ts-(loop.l||ts))/1000);loop.l=ts;update(dt);render(dt);
 loop.a=(loop.a||0)+dt;loop.n=(loop.n||0)+1;if(loop.n>=150){const avg=loop.a/loop.n;loop.a=0;loop.n=0;if(avg>.034&&!S.set.px&&pxBump<2){pxBump++;resize()}} // 느린 기기: 자동으로 픽셀을 키워 부드럽게
 requestAnimationFrame(loop)}
resize();recalc();updMoney();setMain();
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h)};
requestAnimationFrame(loop);
setInterval(()=>{if(S.set.perMode==='auto'&&G.st!=='fight')recalc()},60000);
addEventListener('pointerdown',()=>{if(A.c&&A.c.state==='suspended')A.c.resume()},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&A.c&&G.st!=='fight')A.c.suspend();else if(A.c)A.c.resume()});
G.st='title';openTitle();
window.__game={secAt,barPlan,SEQLEN,makeLyrics,pixelize,DRM,recalc,PHY,fightPhys,G,S,SP,C,encodeCatch,decodeCode,pickFish,newFight,genBar,runAt,shapeFor,fits,harborCalc};
</script>
</body>
</html>
