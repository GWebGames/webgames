<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#8fd17a">
<title>포근농장 · 함께 가꾸는 힐링 농장</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;background:#8fd17a;font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#4a3a2a;user-select:none;-webkit-user-select:none}
canvas{position:fixed;left:0;top:0;touch-action:none;display:block}
body{position:fixed;inset:0;width:100%}
.card{background:rgba(255,250,235,.93);border:3px solid #e6cf9d;border-radius:16px;box-shadow:0 3px 0 #c9b07a,0 6px 14px rgba(0,0,0,.15)}
button{font-family:inherit;color:inherit;cursor:pointer}
.btn{background:#ffe9a8;border:3px solid #e0b95a;border-radius:12px;padding:6px 12px;font-size:15px;box-shadow:0 3px 0 #c9a04a}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9a04a}
.btn.g{background:#b9eaa0;border-color:#7cc460;box-shadow:0 3px 0 #62a84a}
.btn.r{background:#ffc2c2;border-color:#e68c8c;box-shadow:0 3px 0 #c76a6a}
.btn:disabled{opacity:.45;pointer-events:none}
#stats{position:fixed;left:10px;top:10px;padding:6px 12px;display:flex;gap:10px;align-items:center;font-size:16px;flex-wrap:wrap;max-width:62vw}
#xpbar{width:70px;height:10px;background:#e8dcc0;border-radius:6px;overflow:hidden;border:2px solid #d4c08a}
#xpbar i{display:block;height:100%;background:#7fd35c;width:0}
#topr{position:fixed;right:10px;top:10px;display:flex;gap:6px}
#where{position:fixed;left:50%;top:10px;transform:translateX(-50%);padding:6px 14px;font-size:15px}
#zoom{position:fixed;right:10px;top:58px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:36px;height:36px;padding:0;font-size:18px}
#hotbar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;padding:6px 8px}
.tb{width:58px;height:58px;border-radius:14px;border:3px solid #e0c98f;background:#fff6d8;font-size:24px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative}
.tb small{font-size:11px}
.tb.on{border-color:#6bbf4a;background:#e3f9d2;transform:translateY(-4px);box-shadow:0 4px 0 #6bbf4a}
.tb .cnt{position:absolute;right:2px;top:-6px;background:#ff8a65;color:#fff;border-radius:9px;font-size:11px;padding:1px 5px}
#pop{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);padding:8px;display:flex;gap:6px;flex-wrap:wrap;max-width:94vw;justify-content:center}
#pop button{width:74px;border:3px solid #e0c98f;background:#fff6d8;border-radius:12px;padding:4px;font-size:12px;display:flex;flex-direction:column;align-items:center}
#pop button b{font-size:22px;font-weight:normal}
#pop button.on{border-color:#6bbf4a;background:#e3f9d2}
#pop button.lock{opacity:.4}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(60,45,30,.85);color:#fff;padding:8px 16px;border-radius:20px;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#log{position:fixed;left:10px;bottom:84px;display:flex;flex-direction:column;gap:3px;max-width:44vw;pointer-events:none}
#log div{background:rgba(255,250,235,.85);border-radius:10px;padding:3px 9px;font-size:13px;animation:fade 14s forwards}
@keyframes fade{0%,85%{opacity:1}100%{opacity:0}}
#chatbar{position:fixed;left:10px;bottom:10px;display:none;gap:4px;align-items:center;padding:5px 7px}
#chatbar input{width:150px;border:2px solid #e0c98f;border-radius:10px;padding:5px 8px;font-family:inherit;font-size:14px;background:#fff}
#chatbar button{border:none;background:none;font-size:20px;padding:0 2px}
#modal{position:fixed;inset:0;background:rgba(40,30,20,.45);display:flex;align-items:center;justify-content:center;z-index:10}
#modal[hidden],[hidden]{display:none!important}
#mbox{width:min(560px,94vw);max-height:88vh;overflow:auto;padding:16px 18px;font-size:15px}
#mbox h2{margin:0 0 10px;font-size:22px}
#mbox h3{margin:14px 0 6px;font-size:16px;color:#8a6a2a}
.row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:2px dashed #eadbb0}
.row .nm{flex:1}
.row small{color:#8a7a5a}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs .btn.on{background:#b9eaa0;border-color:#7cc460}
input[type=text],textarea,select{font-family:inherit;font-size:15px;border:2px solid #e0c98f;border-radius:10px;padding:6px 10px;background:#fff;width:100%}
textarea{height:70px;font-size:11px}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #c9b07a;margin:3px;cursor:pointer}
.sw.on{box-shadow:0 0 0 3px #4a3a2a}
.code{font-size:34px;letter-spacing:6px;text-align:center;background:#fff;border-radius:12px;padding:6px;border:2px dashed #e0b95a;margin:8px 0}
#saved{position:fixed;right:12px;bottom:10px;font-size:12px;opacity:0;transition:opacity .4s;color:#3d6b2c;background:rgba(255,255,255,.7);padding:2px 8px;border-radius:8px}
#joy,#actBtn{display:none;position:fixed;z-index:5;touch-action:none;user-select:none}
#joy{left:calc(16px + env(safe-area-inset-left));bottom:calc(92px + env(safe-area-inset-bottom));width:124px;height:124px;border-radius:50%;background:rgba(255,250,235,.32);border:3px solid rgba(255,255,255,.65);align-items:center;justify-content:center}
#joy i{width:54px;height:54px;border-radius:50%;background:rgba(255,250,235,.92);border:3px solid #e0b95a;box-shadow:0 3px 0 #c9a04a;pointer-events:none}
#actBtn{right:calc(18px + env(safe-area-inset-right));bottom:calc(100px + env(safe-area-inset-bottom));width:76px;height:76px;border-radius:50%;font-size:32px;padding:0;align-items:center;justify-content:center}
body.touch #joy,body.touch #actBtn{display:flex}
body.touch #zoom{display:none}
.lb{margin-left:4px}
#stats{padding-top:max(6px,env(safe-area-inset-top))}
@media(max-width:700px),(pointer:coarse){
  #hotbar{bottom:calc(8px + env(safe-area-inset-bottom));padding:5px 6px;gap:4px}
  .tb{width:46px;height:50px;font-size:20px;border-radius:12px}.tb small{font-size:10px}.tb .cnt{font-size:10px;padding:0 4px;top:-7px}
  #stats{left:8px;top:calc(8px + env(safe-area-inset-top));font-size:13px;gap:6px;padding:5px 9px;max-width:calc(100vw - 186px)}#xpbar{width:44px;height:8px}
  #topr{right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));gap:4px}
  #topr .btn{padding:5px 8px;font-size:17px;min-width:38px}.lb{display:none}
  #where{left:8px;transform:none;top:calc(58px + env(safe-area-inset-top));font-size:13px;padding:4px 10px}
  #toast{top:calc(100px + env(safe-area-inset-top));font-size:14px}
  #chatbar{left:8px;bottom:auto;top:calc(100px + env(safe-area-inset-top));padding:4px 6px}#chatbar input{width:118px;font-size:16px}
  #log{left:8px;bottom:auto;top:calc(150px + env(safe-area-inset-top));max-width:62vw}
  #pop{bottom:calc(76px + env(safe-area-inset-bottom));padding:6px;gap:5px}#pop button{width:66px;font-size:11px}
  #mbox{padding:12px 13px;width:96vw;max-height:90vh;font-size:15px}#mbox h2{font-size:20px}
  .btn{min-height:38px}input[type=text],textarea,select{font-size:16px}
  .code{font-size:28px;letter-spacing:4px}
  #saved{bottom:calc(70px + env(safe-area-inset-bottom));right:8px}
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stats" class="card"><span id="coins">💰 0</span><span id="lvl">Lv.1</span><div id="xpbar"><i></i></div><span id="clock"></span></div>
<div id="topr"><button class="btn" id="bShop">🏪<span class="lb">상점</span></button><button class="btn" id="bNet">🌍<span class="lb">친구농장</span></button><button class="btn" id="bSet">⚙️</button><button class="btn" id="bHelp">❓</button></div>
<div id="where" class="card" hidden></div>
<div id="zoom"><button class="btn" id="zi">＋</button><button class="btn" id="zo">－</button></div>
<div id="log"></div>
<div id="chatbar" class="card"><input id="chat" maxlength="60" placeholder="채팅 (Enter)"><button data-e="👋">👋</button><button data-e="❤️">❤️</button><button data-e="😊">😊</button><button data-e="⭐">⭐</button></div>
<div id="pop" class="card" hidden></div>
<div id="hotbar" class="card"></div>
<div id="toast"></div>
<div id="saved">저장됨 ✓</div>
<div id="joy"><i></i></div><button class="btn g" id="actBtn">🤚</button>
<div id="modal" hidden><div id="mbox" class="card"></div></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
/* =========================================================
   포근농장 — 힐링 농사 + 농장 공유(멀티) + 자동 저장
   ========================================================= */
const CW=30,CH=22,W=CW*3,H=CH*3,T=48,OX=CW,OY=CH; // 맵은 처음 맵(30x22)의 3x3 = 9배까지
const KEY='pogeun_farm_v1';
const FONT='"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const idx=(x,y)=>y*W+x, inb=(x,y)=>x>=0&&y>=0&&x<W&&y<H;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- 데이터 정의 ---------- */
const WET_MS=90000, EGG_MS=100000, CAN_MAX=12;
const CROPS={
 carrot:{n:'당근',e:'🥕',seed:6,sell:18,grow:40000,lvl:1},
 strawberry:{n:'딸기',e:'🍓',seed:14,sell:30,grow:60000,lvl:2,regrow:.4},
 tomato:{n:'토마토',e:'🍅',seed:22,sell:46,grow:90000,lvl:3,regrow:.4},
 corn:{n:'옥수수',e:'🌽',seed:30,sell:80,grow:130000,lvl:4},
 pumpkin:{n:'호박',e:'🎃',seed:46,sell:130,grow:190000,lvl:5},
 sunflower:{n:'해바라기',e:'🌻',seed:38,sell:105,grow:150000,lvl:6}
};
const CK=Object.keys(CROPS);
const DECO={
 flower_pink:{n:'분홍 꽃',e:'🌸',p:8,lvl:1,solid:0},
 flower_yellow:{n:'노란 꽃',e:'🌼',p:8,lvl:1,solid:0},
 flower_blue:{n:'파란 꽃',e:'🪻',p:8,lvl:1,solid:0},
 fence:{n:'울타리',e:'🪵',p:5,lvl:1,solid:1},
 bench:{n:'벤치',e:'🪑',p:40,lvl:2,solid:1},
 lantern:{n:'등불',e:'🏮',p:35,lvl:2,solid:1},
 tree:{n:'나무',e:'🌳',p:60,lvl:2,solid:1},
 scarecrow:{n:'허수아비',e:'🧑‍🌾',p:90,lvl:3,solid:1},
 sprinkler:{n:'스프링클러',e:'💦',p:250,lvl:3,solid:0}
};
const LV=[0,40,110,230,420,700,1100];
const levelOf=xp=>{let l=1;for(let i=1;i<LV.length;i++)if(xp>=LV[i])l=i+1;return l};
const EGG_PRICE=14, MAX_CHICK=8, GIFT_COST=15;
const COLORS=['#ff8fab','#7ec8ff','#ffd166','#95e06c','#c8a2ff','#ff9f68'];

/* ---------- 정적 지형 ---------- */
const blocked=new Uint8Array(W*H), nofarm=new Uint8Array(W*H), fenceS=new Uint8Array(W*H);
const HOUSE={x:OX+22,y:OY+1,w:5,h:4}, SHOP={x:OX+16,y:OY+2,w:3,h:2}, COOP={x:OX+26,y:OY+13,w:2,h:2}, PEN={x:OX+21,y:OY+12,w:8,h:8}, POND={x:OX+2,y:OY+14,w:6,h:5,ci:4}, GATE={x:OX+21,y:OY+16};
const PCOST=[0,300,700,1200,1900,2800,4000,5500,7500]; // 확장 비용 (이미 연 청크 수 기준)
const chunkAt=(x,y)=>Math.floor(y/CH)*3+Math.floor(x/CW);
const nUnlocked=w=>w.chunks.filter(Boolean).length;
function chunkAdj(w,ci){const c=ci%3,r=(ci/3)|0;return [[c-1,r],[c+1,r],[c,r-1],[c,r+1]].some(([a,b])=>a>=0&&b>=0&&a<3&&b<3&&w.chunks[b*3+a])}
const unlockedAt=(w,x,y)=>!!w.chunks[chunkAt(x,y)];
const inRect=(r,x,y)=>x>=r.x&&y>=r.y&&x<r.x+r.w&&y<r.y+r.h;
function blockRect(r){for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)blocked[idx(x,y)]=1}
blockRect(HOUSE);blockRect(SHOP);blockRect(COOP);
const PONDS=[POND];
for(let ci=0;ci<9;ci++)if(ci!==4)PONDS.push({x:(ci%3)*CW+12,y:((ci/3)|0)*CH+9,w:5,h:4,ci});
const pondMap=new Uint8Array(W*H);
function inPond(P,x,y){const cx=P.x+P.w/2,cy=P.y+P.h/2;const dx=(x+.5-cx)/(P.w/2),dy=(y+.5-cy)/(P.h/2);return dx*dx+dy*dy<=1.05}
PONDS.forEach(P=>{for(let y=P.y;y<P.y+P.h;y++)for(let x=P.x;x<P.x+P.w;x++)if(inPond(P,x,y)){pondMap[idx(x,y)]=1;blocked[idx(x,y)]=1}});
const isPond=(x,y)=>inb(x,y)&&pondMap[idx(x,y)]===1;
for(let y=PEN.y;y<PEN.y+PEN.h;y++)for(let x=PEN.x;x<PEN.x+PEN.w;x++){
  const ring=(x===PEN.x||x===PEN.x+PEN.w-1||y===PEN.y||y===PEN.y+PEN.h-1);
  if(ring&&!(x===GATE.x&&y===GATE.y)){fenceS[idx(x,y)]=1;blocked[idx(x,y)]=1}
  nofarm[idx(x,y)]=1;
}
const pathTiles=[];
const PP=(x,y)=>pathTiles.push([x+OX,y+OY]);
for(let y=5;y<=9;y++)PP(24,y);
for(let x=17;x<=24;x++)PP(x,9);
for(let y=4;y<=9;y++)PP(17,y);
[[16,4],[18,4],[20,16],[19,16],[18,16],[18,15],[18,14],[18,13],[18,12],[18,11],[18,10]].forEach(([x,y])=>PP(x,y));
pathTiles.forEach(([x,y])=>{if(inb(x,y))nofarm[idx(x,y)]=1});
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(inRect({x:HOUSE.x-1,y:HOUSE.y,w:HOUSE.w+2,h:HOUSE.h+1},x,y)||inRect({x:SHOP.x-1,y:SHOP.y,w:SHOP.w+2,h:SHOP.h+2},x,y)||inRect({x:POND.x-1,y:POND.y-1,w:POND.w+2,h:POND.h+2},x,y)&&blocked[idx(x,y)])nofarm[idx(x,y)]=1;
const statics=[];
(function(){
  const R=rng(77);
  const addTree=(x,y,s)=>{if(!inb(x,y)||blocked[idx(x,y)])return;blocked[idx(x,y)]=1;statics.push({k:'tree',x,y,s,ph:R()*6})};
  for(let i=0;i<W;i++){addTree(i,0,1.15+R()*.3);addTree(i,H-1,1.15+R()*.3)}
  for(let j=1;j<H-1;j++){addTree(0,j,1.15+R()*.3);addTree(W-1,j,1.15+R()*.3)}
  // 처음 맵(가운데 청크) 산재 나무
  let n=0,tries=0;
  while(n<12&&tries<400){tries++;const lx=3+Math.floor(R()*(CW-6)),ly=3+Math.floor(R()*(CH-6)),x=OX+lx,y=OY+ly;
    if(lx>=6&&lx<=20&&ly>=5&&ly<=13)continue;if(nofarm[idx(x,y)]||blocked[idx(x,y)])continue;
    let near=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(nofarm[idx(x+dx,y+dy)])near=true;if(near)continue;
    addTree(x,y,.95+R()*.3);n++}
  // 새로 열리는 청크의 나무
  for(let ci=0;ci<9;ci++){if(ci===4)continue;
    const R2=rng(1000+ci*37),ox=(ci%3)*CW,oy=((ci/3)|0)*CH;let k=0,tr=0;
    while(k<16&&tr<300){tr++;const x=ox+2+Math.floor(R2()*(CW-4)),y=oy+2+Math.floor(R2()*(CH-4));
      if(blocked[idx(x,y)])continue;let nr=false;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++)if(pondMap[idx(x+dx,y+dy)])nr=true;if(nr)continue;
      addTree(x,y,.9+R2()*.35);k++}}
  for(let y=PEN.y;y<PEN.y+PEN.h;y++)for(let x=PEN.x;x<PEN.x+PEN.w;x++)if(fenceS[idx(x,y)])statics.push({k:'fence',x,y});
})();

/* ---------- 월드/저장 ---------- */
function newWorld(empty){
  const w={chunks:[false,false,false,false,true,false,false,false,false],tiles:new Array(W*H).fill(null),deco:[],dm:new Map(),chickens:[],rainUntil:0,rain:false,dv:0,spk:null,spv:-1};
  if(!empty)w.chickens.push(mkChicken());
  return w;
}
function mkChicken(){const x=PEN.x+2+Math.random()*(PEN.w-4),y=PEN.y+2+Math.random()*(PEN.h-4);return{x,y,tx:x,ty:y,egg:false,dir:1,timer:EGG_MS*(.5+Math.random()*.5),wait:Math.random()*2}}
function addDeco(w,id,x,y){w.deco.push({id,x,y});w.dm.set(idx(x,y),id);w.dv++}
function removeDeco(w,x,y){const i=w.deco.findIndex(o=>o.x===x&&o.y===y);if(i>=0){const id=w.deco[i].id;w.deco.splice(i,1);w.dm.delete(idx(x,y));w.dv++;return id}return null}
function packWorld(w,forSave){
  const t=[];w.tiles.forEach((o,i)=>{if(o)t.push([i,o.c?CK.indexOf(o.c)+1:0,Math.round(o.p),Math.round(o.w)])});
  return{t,d:w.deco.map(o=>[o.id,o.x,o.y]),ch:w.chickens.map(c=>[+c.x.toFixed(2),+c.y.toFixed(2),c.egg?1:0,c.dir,Math.round(c.timer)]),rain:w.rain?1:0,ck:w.chunks.map((v,i)=>v?i:-1).filter(i=>i>=0),v2:1};
}
function unpackWorld(o){
  const w=newWorld(true);
  const old=!o.v2,ox=old?OX:0,oy=old?OY:0;
  w.chunks=[false,false,false,false,true,false,false,false,false];
  if(o.v2&&o.ck)o.ck.forEach(i=>{if(i>=0&&i<9)w.chunks[i]=true});
  (o.t||[]).forEach(([i0,c,p,wt])=>{let i=i0;if(old){i=idx((i0%30)+OX,((i0/30)|0)+OY)}if(i>=0&&i<W*H&&!blocked[i]){w.tiles[i]={c:c?CK[c-1]:null,p,w:wt};w.chunks[chunkAt(i%W,(i/W)|0)]=true}});
  (o.d||[]).forEach(([id,x0,y0])=>{const x=x0+ox,y=y0+oy;if(DECO[id]&&inb(x,y)&&!w.dm.has(idx(x,y))&&!blocked[idx(x,y)]){addDeco(w,id,x,y);w.chunks[chunkAt(x,y)]=true}});
  w.chickens=(o.ch||[]).map(([x0,y0,e,d,t])=>({x:x0+ox,y:y0+oy,tx:x0+ox,ty:y0+oy,egg:!!e,dir:d||1,timer:t,wait:Math.random()*2}));
  w.rain=!!o.rain;return w;
}
function newState(){
  return{v:1,name:'농부'+Math.floor(Math.random()*900+100),color:COLORS[Math.floor(Math.random()*COLORS.length)],coins:80,xp:0,
    inv:{seeds:{carrot:5},crops:{},eggs:0,deco:{flower_pink:3}},water:CAN_MAX,world:newWorld(),px:OX+14,py:OY+8.5,
    code:genCode(),set:{vol:.5,time:'fast',allow:true,sfx:true},t0:Date.now(),lastSeen:Date.now(),seen:false};
}

function sprinklerSet(w){
  if(w.spv===w.dv&&w.spk)return w.spk;
  const s=new Set();
  w.deco.forEach(o=>{if(o.id==='sprinkler')for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){if(dx*dx+dy*dy<=5&&inb(o.x+dx,o.y+dy))s.add(idx(o.x+dx,o.y+dy))}});
  w.spk=s;w.spv=w.dv;return s;
}
function tickWorld(w,ms,catchup){
  const sp=sprinklerSet(w),rain=w.rain;
  for(let i=0;i<w.tiles.length;i++){
    const t=w.tiles[i];if(!t||!t.c)continue;
    const c=CROPS[t.c];if(t.p>=c.grow){if(sp.has(i)||rain)t.w=WET_MS;continue}
    let g;
    if(sp.has(i)||rain||(catchup&&false)){t.w=WET_MS;g=ms}else{g=Math.min(ms,t.w);t.w=Math.max(0,t.w-ms)}
    t.p=Math.min(c.grow,t.p+g);
  }
  w.chickens.forEach(c=>{if(!c.egg){c.timer-=ms;if(c.timer<=0)c.egg=true}});
}

}
function wanderChickens(w,dt,remote){

    if(remote){c.x=lerp(c.x,c.tx,Math.min(1,dt*6));c.y=lerp(c.y,c.ty,Math.min(1,dt*6));return}
    c.wait-=dt;
    if(c.wait<=0){c.tx=PEN.x+1.5+Math.random()*(PEN.w-3);c.ty=PEN.y+1.7+Math.random()*(PEN.h-3.2);if(Math.random()<.3){c.tx=c.x;c.ty=c.y}c.wait=1.5+Math.random()*3}

  });
}

function tone(f,dur,type,g,slide,wet){
  if(!AU.ctx)return;const c=AU.ctx,o=c.createOscillator(),v=c.createGain(),t=c.currentTime;
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(v);v.connect(AU.master);if(wet)v.connect(AU.delay);o.start(t);o.stop(t+dur+.05);
}

  if(!AU.ctx)return;const c=AU.ctx,len=c.sampleRate*dur,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=c.createBufferSource();s.buffer=buf;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f;const v=c.createGain();v.gain.setValueAtTime(g,c.currentTime);v.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);

}
function movePlayer(dt){
  let dx=0,dy=0;
  if(keys.ArrowLeft||keys.a)dx--;if(keys.ArrowRight||keys.d)dx++;if(keys.ArrowUp||keys.w)dy--;if(keys.ArrowDown||keys.s)dy++;
  if(Math.hypot(joy.x,joy.y)>.25){dx=joy.x;dy=joy.y}
  const w=world();
  if(dx||dy){pending=null}
  else if(pending){
    const d=Math.hypot(pending.wx-me.x,pending.wy-me.y);
    if(d<=1.75){const p=pending;pending=null;perform(p)}
    else{
      pending.t+=dt;dx=(pending.wx-me.x)/d;dy=(pending.wy-me.y)/d;
      if(pending.t>.8){if(pending.last-d<.05*pending.t){if(d<2.6){const p=pending;pending=null;perform(p)}else{pending=null;toast('길이 막혀 있어요. 방향키(WASD)로 돌아가 보세요')}}pending&&(pending.t=0);}
      if(pending)pending.last=d;

  if(len){
    dx/=len;dy/=len;me.fx=dx;me.fy=dy;if(Math.abs(dx)>.1)me.dir=dx>0?1:-1;
    const sp=4.3*dt;
    let nx=me.x+dx*sp,ny=me.y+dy*sp;

  gainXp(Math.round(c.sell/2));net.dirty=true;refreshHUD();
}
function performVisit(p){
  const w=net.rw,tx=p.tx,ty=p.ty,i=idx(tx,ty);
  if(p.ch){sfx('cluck');fx(p.ch.x,p.ch.y-.8,'heart',{n:3,sp:40,col:'#ff7aa2'});return}
  if(isPond(tx,ty)){if(tool==='can'){S.water=CAN_MAX;sfx('water');fx(tx+.5,ty+.5,'drop',{n:10,col:'#7ec8ff',sp:90});refreshHUD();toast('물뿌리개를 채웠어요 💧')}return}
  const t=w.tiles[i];
  if(tool==='can'){
    if(t&&t.c){if(S.water<=0){sfx('no');toast('물이 없어요! 연못에서 채워요 🌊');return}
      S.water--;refreshHUD();sfx('water');fx(tx+.5,ty+.4,'drop',{n:9,col:'#7ec8ff',sp:70});sendV({t:'act',k:'water',x:tx,y:ty})}
    else toast('작물이 있는 곳에 물을 줘요');
  }else if(tool==='gift'){
    if(S.coins<GIFT_COST){sfx('no');toast('꽃 선물에는 '+GIFT_COST+'코인이 필요해요');return}
    if(!freeForDeco(w,tx,ty)){sfx('no');toast('여기에는 놓을 수 없어요');return}
    sendV({t:'act',k:'flower',x:tx,y:ty});
  }else{if(t&&t.c){const c=CROPS[t.c];toast(c.e+' '+c.n+' '+Math.floor(t.p/c.grow*100)+'%')}else{toast('친구 농장에서는 물주기 🚿와 꽃 선물 🌸을 할 수 있어요')}}
}

function openExpand(ci){
  const w=S.world,n=nUnlocked(w),cost=PCOST[n],adj=chunkAdj(w,ci);
  let h='<h2>🌾 땅 넓히기</h2><p>처음 맵(집·상점이 있는 땅)과 같은 크기의 땅을 이웃에 하나씩 넓혀서, 최대 <b>9배(3×3)</b>까지 키울 수 있어요. 지금 <b>'+n+'/9</b></p>';
  if(n>=9)h+='<p>모든 땅을 열었어요!</p>';
  else if(!adj)h+='<p>🔒 이미 연 땅과 맞닿은 곳부터 열 수 있어요. 가까운 땅부터 넓혀 보세요.</p>';
  else h+='<div class="row"><span style="font-size:26px">🌾</span><div class="nm">이 땅 열기 <small>(넓은 초원 + 작은 연못)<br>보유 💰 '+S.coins+'</small></div><button class="btn g" data-a="expand" data-v="'+ci+'"'+(S.coins<cost?' disabled':'')+'>'+cost+'💰</button></div>'+(S.coins<cost?'<small>코인이 부족해요</small>':'');
  h+='<div style="margin-top:12px;text-align:right"><button class="btn" data-a="close">닫기</button></div>';
  openModal(h);
}
function doExpand(ci){
  const w=S.world,n=nUnlocked(w),cost=PCOST[n];
  if(n>=9||w.chunks[ci]||!chunkAdj(w,ci))return;
  if(S.coins<cost){sfx('no');toast('코인이 부족해요');return}
  S.coins-=cost;w.chunks[ci]=true;net.dirty=true;
  const c=ci%3,r=(ci/3)|0;
  for(let k=0;k<10;k++)fx(c*CW+Math.random()*CW,r*CH+Math.random()*CH,'star',{n:3,col:'#fff1a8',sp:120,max:1.8});
  sfx('lvl');toast('🌾 땅이 넓어졌어요! ('+(n+1)+'/9)');refreshHUD();save(true);closeModal();
}

function openShop(tab){
  tab=tab||'seed';const lv=levelOf(S.xp);let h='<h2>🏪 포근상점 <small style="font-size:14px">💰 '+S.coins+' · Lv.'+lv+'</small></h2><div class="tabs">';

  h+='</div>';
  if(tab==='seed'){
    CK.forEach(id=>{const c=CROPS[id],lock=lv<c.lvl;
      h+='<div class="row"><span style="font-size:26px">'+c.e+'</span><div class="nm">'+c.n+' 씨앗 <small>(보유 '+(S.inv.seeds[id]||0)+')<br>판매가 '+c.sell+'💰 · '+Math.round(c.grow/1000)+'초 '+(c.regrow?'· 여러 번 수확':'')+'</small></div>'+
      (lock?'<small>Lv.'+c.lvl+' 해금</small>':'<button class="btn g" data-a="buySeed" data-v="'+id+'" data-n="1">'+c.seed+'💰</button><button class="btn g" data-a="buySeed" data-v="'+id+'" data-n="5">×5</button>')+'</div>'});
  }else if(tab==='animal'){
    const n=S.world.chickens.length;
    h+='<div class="row"><span style="font-size:26px">🐔</span><div class="nm">닭 <small>(보유 '+n+'/'+MAX_CHICK+')<br>달걀을 낳아줘요. 닭을 클릭해서 모으세요</small></div>'+(n>=MAX_CHICK?'<small>가득 참</small>':'<button class="btn g" data-a="buyChick">'+chickPrice()+'💰</button>')+'</div>';
  }else if(tab==='deco'){
    Object.keys(DECO).forEach(id=>{const d=DECO[id],lock=lv<d.lvl;
      h+='<div class="row"><span style="font-size:26px">'+d.e+'</span><div class="nm">'+d.n+' <small>(보유 '+(S.inv.deco[id]||0)+')'+(id==='sprinkler'?'<br>주변 작물에 자동으로 물을 줘요':'')+'</small></div>'+
      (lock?'<small>Lv.'+d.lvl+' 해금</small>':'<button class="btn g" data-a="buyDeco" data-v="'+id+'" data-n="1">'+d.p+'💰</button>'+(d.p<=40?'<button class="btn g" data-a="buyDeco" data-v="'+id+'" data-n="5">×5</button>':''))+'</div>'});
  }else{
    let tot=0,any=false;
    CK.forEach(id=>{const n=S.inv.crops[id]||0;if(n){any=true;tot+=n*CROPS[id].sell;h+='<div class="row"><span style="font-size:26px">'+CROPS[id].e+'</span><div class="nm">'+CROPS[id].n+' ×'+n+'</div><button class="btn" data-a="sell" data-v="'+id+'">'+n*CROPS[id].sell+'💰 판매</button></div>'}});
    if(S.inv.eggs){any=true;tot+=S.inv.eggs*EGG_PRICE;h+='<div class="row"><span style="font-size:26px">🥚</span><div class="nm">달걀 ×'+S.inv.eggs+'</div><button class="btn" data-a="sell" data-v="egg">'+S.inv.eggs*EGG_PRICE+'💰 판매</button></div>'}
    h+=any?'<div style="margin-top:10px;text-align:right"><button class="btn g" data-a="sellAll">전부 판매 '+tot+'💰</button></div>':'<p>팔 수 있는 수확물이 없어요. 작물을 키워 보세요 🌱</p>';
  }
  h+='<div style="margin-top:12px;text-align:right"><button class="btn" data-a="close">닫기</button></div>';
  openModal(h);
}
function shopAction(a,v,n){
  n=+n||1;
  if(a==='tab')return openShop(v);
  if(a==='buySeed'){const c=CROPS[v],cost=c.seed*n;if(S.coins<cost){sfx('no');toast('코인이 부족해요');return}S.coins-=cost;S.inv.seeds[v]=(S.inv.seeds[v]||0)+n;sfx('coin')}
  if(a==='buyDeco'){const cost=DECO[v].p*n;if(S.coins<cost){sfx('no');toast('코인이 부족해요');return}S.coins-=cost;S.inv.deco[v]=(S.inv.deco[v]||0)+n;sfx('coin')}
  if(a==='buyChick'){const c=chickPrice();if(S.coins<c){sfx('no');toast('코인이 부족해요');return}S.coins-=c;S.world.chickens.push(mkChicken());sfx('cluck');net.dirty=true;toast('새 닭이 왔어요 🐣')}
  if(a==='sell'||a==='sellAll'){
    let g=0;
    const sellOne=id=>{if(id==='egg'){g+=S.inv.eggs*EGG_PRICE;S.inv.eggs=0}else{g+=(S.inv.crops[id]||0)*CROPS[id].sell;S.inv.crops[id]=0}};
    if(a==='sell')sellOne(v);else{CK.forEach(sellOne);sellOne('egg')}
    S.coins+=g;sfx('coin');toast('+'+g+'💰 판매 완료!');
  }
  refreshHUD();save(true);
  const act=document.querySelector('#mbox .tabs .on');openShop(act?act.dataset.v:'seed');
}

$('mbox').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;audioInit();
  const a=b.dataset.a,v=b.dataset.v,n=b.dataset.n;
  if(a==='close')return closeModal();
  if(a==='expand'){doExpand(+v);return}
  if(a==='buySeed'||a==='buyDeco'||a==='buyChick'||a==='sell'||a==='sellAll'||a==='tab')return shopAction(a,v,n);
  if(a==='color'){S.color=v;openSettings();return}
  if(a==='hostToggle'){net.hosting?hostStop():hostStart();return}
  if(a==='copy'){const link=shareLink();(navigator.clipboard?navigator.clipboard.writeText(link):Promise.reject()).then(()=>toast('링크를 복사했어요 📋')).catch(()=>{window.prompt('링크를 복사하세요',link)});return}
  if(a==='join'){const c=($('joinCode').value||'').trim().toUpperCase();if(c.length<4){toast('코드를 입력해 주세요');return}closeModal();visitStart(c);return}
  if(a==='leave'){closeModal();visitLeave(true);return}
  if(a==='allow'){S.set.allow=!S.set.allow;openNet();return}
  if(a==='export'){const s=btoa(unescape(encodeURIComponent(JSON.stringify(serialize()))));$('xfer').value=s;toast('저장 코드를 만들었어요. 복사해서 보관하세요');return}
  if(a==='import'){try{const o=JSON.parse(decodeURIComponent(escape(atob($('xfer').value.trim()))));if(!o||o.v!==1)throw 0;localStorage.setItem(KEY,JSON.stringify(o));location.reload()}catch(e){toast('저장 코드가 올바르지 않아요')}return}
  if(a==='reset'){if(confirm('정말 모든 농장 데이터를 지울까요?')){localStorage.removeItem(KEY);S._noSave=true;location.reload()}return}
  if(a==='saveName'){}
});

    glow((HOUSE.x+1.2)*T,(HOUSE.y+2.8)*T,90,.5);glow((HOUSE.x+3.8)*T,(HOUSE.y+2.8)*T,90,.5);glow((SHOP.x+1.5)*T,(SHOP.y+1.5)*T,110,.35);
    w.deco.forEach(o=>{if(o.id==='lantern')glow(o.x*T+T/2,o.y*T+T*.4,110,.55)});
    flies.forEach(f=>{const wl=cx-vwW/2,wt=cy-vwH/2,fx_=wl+((((f.x-wl)%vwW)+vwW)%vwW)+Math.sin(time*f.s+f.a)*30,fy_=wt+((((f.y-wt)%vwH)+vwH)%vwH)+Math.cos(time*f.s*1.3+f.a)*20;if(fx_<cx-vwW/2||fx_>cx+vwW/2||fy_<cy-vwH/2||fy_>cy+vwH/2)return;glow(fx_,fy_,10,.5*(.5+.5*Math.sin(time*3+f.a)))});
    ctx.globalCompositeOperation='source-over';ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  if(w.rain){ctx.strokeStyle='rgba(200,225,255,.55)';ctx.lineWidth=1.5;ctx.beginPath();drops.forEach(d=>{const x=((d.x*VW+time*60*d.s)%VW),y=((d.y*VH+time*700*d.s)%VH);ctx.moveTo(x,y);ctx.lineTo(x-3,y+14)});ctx.stroke()}
}

/* ---------- 업데이트 ---------- */
let lastTick=Date.now(),autoSave=0,hudT=0;
function update(dt){
  time+=dt;
  const now=Date.now(),ms=Math.min(now-lastTick,60000);lastTick=now;
  tickWorld(S.world,ms,false);weatherTick();
  wanderChickens(S.world,dt,false);
  if(net.visiting)wanderChickens(net.rw,dt,true);
  movePlayer(dt);
  me.t+=dt;if(me.sayT>0)me.sayT-=dt;
  netTick(dt);
  cam.x=lerp(cam.x,me.x*T,Math.min(1,dt*5));cam.y=lerp(cam.y,me.y*T-20,Math.min(1,dt*5));
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind!=='text')p.vy+=(p.kind==='heart'||p.kind==='star'?-10:200)*dt;if(p.life>=p.max)particles.splice(i,1)}
  autoSave+=dt;if(autoSave>10){autoSave=0;save()}
  hudT+=dt;if(hudT>.5){hudT=0;const h=gameHour(),hh=Math.floor(h),mm=Math.floor((h-hh)*60);$('clock').textContent=(world().rain?'🌧️':(h>=6&&h<19?'☀️':'🌙'))+' '+String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');updateRainSound();if(!$('pop').hidden){}}
}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;try{update(dt);render()}catch(e){console.error(e)}requestAnimationFrame(frame)}

/* ---------- 입력 ---------- */
let down=null;const ptrs=new Map();let pinch0=0,zm0=1;
cv.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(e.pointerType==='mouse')mouse={x:e.clientX,y:e.clientY};else if(!isTouchUI()){document.body.classList.add('touch')}
  if(ptrs.size===1)down={x:e.clientX,y:e.clientY,id:e.pointerId};else{down=null;const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zm0=zm}
  $('pop').hidden=true;audioInit();
});
cv.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size>=2&&pinch0>0){const [a,b]=[...ptrs.values()];zm=clamp(zm0*Math.hypot(a.x-b.x,a.y-b.y)/pinch0,.6,2.2)}
  else if(e.pointerType==='mouse')mouse={x:e.clientX,y:e.clientY};
});
function endPtr(e){
  if(e.type==='pointerup'&&down&&down.id===e.pointerId&&Math.hypot(e.clientX-down.x,e.clientY-down.y)<(e.pointerType==='mouse'?12:18))onTap(e.clientX,e.clientY);
  ptrs.delete(e.pointerId);if(ptrs.size<2)pinch0=0;down=null;if(e.pointerType!=='mouse')mouse=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')mouse=null});
// 가상 조이스틱 / 행동 버튼
(function(){
  const el=$('joy'),knob=el.firstElementChild;let jid=null,c=null;
  const upd=e=>{let dx=e.clientX-c.x,dy=e.clientY-c.y;const R=el.offsetWidth/2*.75,d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d}knob.style.transform='translate('+dx+'px,'+dy+'px)';joy.x=dx/R;joy.y=dy/R};
  const off=()=>{jid=null;joy.x=joy.y=0;knob.style.transform=''};
  el.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();jid=e.pointerId;try{el.setPointerCapture(jid)}catch(_){}const r=el.getBoundingClientRect();c={x:r.left+r.width/2,y:r.top+r.height/2};pending=null;upd(e)});
  el.addEventListener('pointermove',e=>{if(e.pointerId===jid)upd(e)});
  el.addEventListener('pointerup',e=>{if(e.pointerId===jid)off()});el.addEventListener('pointercancel',off);
  $('actBtn').addEventListener('pointerdown',e=>{e.preventDefault();audioInit();if($('modal').hidden)actFront()});
  document.addEventListener('gesturestart',e=>e.preventDefault());
  document.addEventListener('touchend',()=>audioInit(),{passive:true});
})();
cv.addEventListener('wheel',e=>{e.preventDefault();zm=clamp(zm*(e.deltaY<0?1.1:.9),.6,2)},{passive:false});
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'))return;
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  audioInit();
  if(!$('modal').hidden){if(k==='Escape')closeModal();return}
  keys[k]=true;
  if(k===' '||k==='e')actFront();
  if(k==='Enter'){if($('chatbar').style.display!=='none')$('chat').focus()}
  const n=parseInt(k);if(n>=1&&n<=6){const list=net.visiting?VTOOLS:TOOLS;if(list[n-1])setTool(list[n-1][0],true)}
  if(k==='Escape')$('pop').hidden=true;
});
addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden){S.px=me.x;S.py=me.y;if(!net.visiting){save(true)}}else{lastTick=Date.now()}});
addEventListener('pagehide',()=>{if(net.visiting){me.x=home.x;me.y=home.y}S.px=me.x;S.py=me.y;if(!S._noSave)save(true)});
addEventListener('beforeunload',()=>{if(net.visiting){me.x=home.x;me.y=home.y}S.px=me.x;S.py=me.y;if(!S._noSave)save(true)});

/* ---------- 시작 ---------- */
refreshHUD();showMultiUI();
if(S._away>60000){const m=Math.round(S._away/60000);setTimeout(()=>toast('🌿 '+(m>=60?Math.floor(m/60)+'시간 ':'')+(m%60?m%60+'분 ':'')+'동안 농장이 쑥쑥 자랐어요!'),600)}
if(!S.seen){S.seen=true;setTimeout(openHelp,400)}
const qv=new URLSearchParams(location.search).get('visit');
if(qv){const go=()=>{if(typeof Peer!=='undefined')visitStart(qv.trim().toUpperCase());else toast('멀티플레이 라이브러리를 불러오지 못했어요')};setTimeout(go,800)}
window.__farm={S,net,me,perform,onTap,world,CROPS};
requestAnimationFrame(frame);
</script>
