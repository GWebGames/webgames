<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 체스 - AI, 온라인 1:1, 로컬 2인용</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chess.js (체스 규칙 및 이동 검증) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <!-- PeerJS (서버 없이 1:1 온라인 대전용 P2P WebRTC) -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- FontAwesome 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .piece { user-select: none; cursor: grab; transition: transform 0.1s ease; }
        .piece:active { cursor: grabbing; }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-2 sm:p-4">

    <!-- 상단 헤더 -->
    <header class="w-full max-w-2xl flex justify-between items-center py-2.5 px-4 bg-slate-800 rounded-xl shadow-lg mb-3 border border-slate-700">
        <h1 class="text-lg sm:text-xl font-bold flex items-center gap-2">
            <i class="fa-solid fa-chess text-amber-400"></i> 웹 체스 (Chess)
        </h1>
        <div class="flex items-center gap-2">
            <button onclick="openSettings()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-xs sm:text-sm font-semibold transition flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-gear"></i> 설정 및 모드
            </button>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="w-full max-w-2xl flex flex-col items-center gap-3">
        
        <!-- 상태 표시줄 & 액션 버튼 -->
        <div class="w-full flex justify-between items-center px-1">
            <div id="gameStatus" class="text-xs sm:text-sm font-semibold text-amber-300 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 shadow flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span>게임 준비 완료</span>
            </div>
            <div class="flex gap-2">
                <button onclick="undoMove()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm rounded-lg border border-slate-700 transition">
                    <i class="fa-solid fa-rotate-left"></i> 무르기
                </button>
                <button onclick="resetGame()" class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-xs sm:text-sm font-semibold rounded-lg transition shadow">
                    <i class="fa-solid fa-rotate"></i> 리셋
                </button>
            </div>
        </div>

        <!-- 체스판 및 정보 사이드바 -->
        <div class="w-full flex flex-col md:flex-row gap-4 items-center justify-center">
            
            <!-- 체스판 프레임 -->
            <div class="relative w-full max-w-[420px] aspect-square bg-slate-800 p-2.5 rounded-2xl shadow-2xl border border-slate-700">
                <div id="board" class="board-grid w-full h-full rounded-lg overflow-hidden shadow-inner select-none"></div>
            </div>

            <!-- 사이드 패널 (획득 기물 및 수 기록) -->
            <div class="w-full md:w-64 flex flex-col gap-3">
                <!-- 상대방 잡은 기물 -->
                <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                    <div class="text-xs text-slate-400 mb-1 flex justify-between">
                        <span>상대방 획득 기물</span>
                        <span id="opponentLabel" class="text-amber-400 font-bold"></span>
                    </div>
                    <div id="capturedByOpponent" class="min-h-[28px] flex flex-wrap gap-1 text-lg"></div>
                </div>

                <!-- 수 기록 -->
                <div class="bg-slate-800 p-3 rounded-xl border border-slate-700 flex flex-col h-40 md:h-56">
                    <div class="text-xs text-slate-400 mb-1 font-semibold">기보 기록</div>
                    <div id="moveHistory" class="flex-1 overflow-y-auto text-xs font-mono space-y-1 pr-1"></div>
                </div>

                <!-- 내 잡은 기물 -->
                <div class="bg-slate-800 p-3 rounded-xl border border-slate-700">
                    <div class="text-xs text-slate-400 mb-1 flex justify-between">
                        <span>내가 획득한 기물</span>
                        <span id="myLabel" class="text-indigo-400 font-bold"></span>
                    </div>
                    <div id="capturedByMe" class="min-h-[28px] flex flex-wrap gap-1 text-lg"></div>
                </div>
            </div>

        </div>
    </main>

    <!-- 설정 및 모드 선택 모달 -->
    <div id="settingsModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
            <h2 class="text-lg font-bold flex items-center gap-2 text-white">
                <i class="fa-solid fa-gamepad text-indigo-400"></i> 게임 설정 및 대전 모드
            </h2>
            
            <div class="flex flex-col gap-2">
                <label class="text-sm text-slate-300 font-semibold">대전 모드</label>
                <select id="settingMode" onchange="onModeChange()" class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <option value="pvp">한 기기 2인용 (로컬 대전)</option>
                    <option value="online">온라인 1:1 대전 (WebRTC P2P)</option>
                    <option value="ai">AI 컴퓨터 대전</option>
                </select>
            </div>

            <!-- AI 옵션 -->
            <div id="aiOptions" class="flex-col gap-3 hidden">
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs text-slate-400">AI 난이도</label>
                    <select id="settingDifficulty" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-sm text-white">
                        <option value="easy">쉬움 (Easy)</option>
                        <option value="medium" selected>보통 (Medium)</option>
                        <option value="hard">어려움 (Hard)</option>
                    </select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs text-slate-400">플레이할 진영</label>
                    <select id="settingAiColor" class="bg-slate-900 border border-slate-700 rounded-xl p-2 text-sm text-white">
                        <option value="w">백색 (선공)</option>
                        <option value="b">흑색 (후공)</option>
                    </select>
                </div>
            </div>

            <!-- 온라인 대전 옵션 -->
            <div id="onlineOptions" class="flex-col gap-3 hidden">
                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700 space-y-2">
                    <div class="text-xs font-semibold text-slate-300">내 방 코드 (상대방에게 전달):</div>
                    <div class="flex gap-2">
                        <input type="text" id="myPeerId" readonly placeholder="코드 생성 중..." class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2.5 py-1.5 text-xs text-amber-300 font-mono">
                        <button onclick="copyMyCode()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-xs rounded-lg whitespace-nowrap">복사</button>
                    </div>
                </div>

                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700 space-y-2">
                    <div class="text-xs font-semibold text-slate-300">상대방 방 코드로 접속:</div>
                    <div class="flex gap-2">
                        <input type="text" id="targetPeerId" placeholder="상대방 코드를 입력하세요" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono focus:outline-none focus:border-indigo-500">
                        <button onclick="connectToPeer()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-xs font-semibold rounded-lg whitespace-nowrap">접속</button>
                    </div>
                </div>
                <div id="onlineConnectionStatus" class="text-xs text-center font-medium text-amber-400">온라인 대기 중...</div>
            </div>

            <div class="flex justify-end gap-2 mt-2">
                <button onclick="closeSettings()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-xl text-sm font-semibold transition">취소</button>
                <button onclick="applySettings()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold transition">적용 및 시작</button>
            </div>
        </div>
    </div>

    <!-- 승패 결과 알림 모달 -->
    <div id="gameOverModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-sm rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-4 text-center">
            <div class="text-4xl text-amber-400 mb-1">
                <i class="fa-solid fa-trophy"></i>
            </div>
            <h2 id="gameOverTitle" class="text-xl font-bold">게임 종료</h2>
            <p id="gameOverMessage" class="text-sm text-slate-300"></p>
            <button onclick="closeGameOverModal(); resetGame();" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 rounded-xl font-semibold text-sm transition">
                다시 시작하기
            </button>
        </div>
    </div>

    <footer class="text-xs text-slate-500 my-2">
        웹 체스 (AI / WebRTC P2P 대전 / 로컬 플레이 지원)
    </footer>

    <!-- 자바스크립트 전체 구현 -->
    <script>
        let game = new Chess();
        let boardEl = document.getElementById('board');
        let selectedSquare = null;
        let possibleMoves = [];

        // 대전 설정
        let gameMode = 'pvp'; // 'pvp', 'ai', 'online'
        let aiDifficulty = 'medium'; // easy, medium, hard
        let playerColor = 'w'; // 'w' 또는 'b'
        let isFlipped = false;

        // WebRTC P2P 연결 객체
        let peer = null;
        let conn = null;

        const pieceUnicode = {
            w: { p: '♙', r: '♖', n: '♘', b: '♗', q: '♕', k: '♔' },
            b: { p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚' }
        };

        // 사운드 효과 (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            let freq = 400; let duration = 0.08;
            if (type === 'capture') freq = 600;
            if (type === 'check') freq = 800;
            if (type === 'gameover') { freq = 300; duration = 0.3; }

            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // WebRTC PeerJS 설정
        function initPeer() {
            if (peer) return;
            peer = new Peer();
            
            peer.on('open', (id) => {
                document.getElementById('myPeerId').value = id;
            });

            peer.on('connection', (connection) => {
                conn = connection;
                playerColor = 'w'; // 방을 만든 주인이 백색
                isFlipped = false;
                setupConnection();
                document.getElementById('onlineConnectionStatus').textContent = '상대방 연결됨! (내가 백색/선공)';
            });
        }

        function connectToPeer() {
            const targetId = document.getElementById('targetPeerId').value.trim();
            if (!targetId) return alert('상대방 코드를 입력해주세요.');
            
            initPeer();
            document.getElementById('onlineConnectionStatus').textContent = '상대방에게 접속 중...';
            conn = peer.connect(targetId);
            playerColor = 'b'; // 접속한 사람이 흑색
            isFlipped = true;
            setupConnection();
        }

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById('onlineConnectionStatus').textContent = '온라인 연결 완료! 게임을 진행하세요.';
                closeSettings();
                resetGame();
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    const move = game.move(data.move);
                    if (move) {
                        if (move.captured) playSound('capture');
                        else playSound('move');
                        if (game.in_check()) playSound('check');
                        renderBoard();
                        checkGameOver();
                    }
                } else if (data.type === 'undo') {
                    game.undo();
                    renderBoard();
                } else if (data.type === 'reset') {
                    game.reset();
                    renderBoard();
                }
            });

            conn.on('close', () => {
                alert('상대방과의 온라인 연결이 종료되었습니다.');
            });
        }

        function copyMyCode() {
            const copyText = document.getElementById('myPeerId');
            copyText.select();
            document.execCommand('copy');
            alert('방 코드가 복사되었습니다: ' + copyText.value);
        }

        // 보드 UI 렌더링
        function renderBoard() {
            boardEl.innerHTML = '';
            const boardState = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const actualRow = isFlipped ? 7 - r : r;
                    const actualCol = isFlipped ? 7 - c : c;
                    const squareId = String.fromCharCode(97 + actualCol) + (8 - actualRow);
                    
                    const isLight = (actualRow + actualCol) % 2 === 0;
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `board-square flex items-center justify-center relative ${isLight ? 'bg-amber-100 text-slate-900' : 'bg-amber-800 text-slate-100'} w-full h-full`;
                    squareDiv.dataset.square = squareId;

                    // 선택된 위치 하이라이트
                    if (selectedSquare === squareId) {
                        squareDiv.classList.add('ring-4', 'ring-indigo-500', 'z-10');
                    }

                    // 이동 가능 칸 힌트
                    if (possibleMoves.includes(squareId)) {
                        const indicator = document.createElement('div');
                        indicator.className = 'absolute w-3.5 h-3.5 bg-indigo-500/70 rounded-full pointer-events-none z-20';
                        squareDiv.appendChild(indicator);
                    }

                    // 기물 배치
                    const piece = boardState[actualRow][actualCol];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        pieceSpan.className = `piece text-3xl md:text-4xl font-bold ${piece.color === 'w' ? 'text-white drop-shadow-[0_1px_2px_rgba(0,0,0,0.8)]' : 'text-slate-900 drop-shadow-[0_1px_1px_rgba(255,255,255,0.3)]'}`;
                        pieceSpan.textContent = pieceUnicode[piece.color][piece.type];
                        squareDiv.appendChild(pieceSpan);
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareId));
                    boardEl.appendChild(squareDiv);
                }
            }
            updateStatusText();
            updateCapturedPieces();
            updateMoveHistory();
        }

        // 클릭 이벤트 핸들러
        function handleSquareClick(square) {
            if (game.game_over()) return;

            // AI/온라인 턴 체크
            if (gameMode === 'ai' && game.turn() !== playerColor) return;
            if (gameMode === 'online') {
                if (!conn || !conn.open) return alert('상대방이 연결되지 않았습니다.');
                if (game.turn() !== playerColor) return;
            }

            const piece = game.get(square);

            if (selectedSquare === null) {
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    possibleMoves = game.moves({ square: square, verbose: true }).map(m => m.to);
                    renderBoard();
                }
            } else {
                if (selectedSquare === square) {
                    selectedSquare = null;
                    possibleMoves = [];
                    renderBoard();
                    return;
                }

                const moveData = { from: selectedSquare, to: square, promotion: 'q' };
                const move = game.move(moveData);

                if (move) {
                    if (move.captured) playSound('capture');
                    else playSound('move');
                    if (game.in_check()) playSound('check');

                    // 온라인 대전 상대에게 이동 송신
                    if (gameMode === 'online' && conn && conn.open) {
                        conn.send({ type: 'move', move: moveData });
                    }

                    selectedSquare = null;
                    possibleMoves = [];
                    renderBoard();

                    checkGameOver();

                    // AI 턴 호출
                    if (!game.game_over() && gameMode === 'ai' && game.turn() !== playerColor) {
                        setTimeout(makeAIMove, 250);
                    }
                } else {
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        possibleMoves = game.moves({ square: square, verbose: true }).map(m => m.to);
                        renderBoard();
                    } else {
                        selectedSquare = null;
                        possibleMoves = [];
                        renderBoard();
                    }
                }
            }
        }

        // AI 체스 알고리즘 (Minimax)
        function makeAIMove() {
            const moves = game.moves({ verbose: true });
            if (moves.length === 0) return;

            let chosenMove;
            if (aiDifficulty === 'easy') {
                chosenMove = moves[Math.floor(Math.random() * moves.length)];
            } else if (aiDifficulty === 'medium') {
                const goodMoves = moves.filter(m => m.captured || m.san.includes('+'));
                chosenMove = goodMoves.length > 0 ? goodMoves[Math.floor(Math.random() * goodMoves.length)] : moves[Math.floor(Math.random() * moves.length)];
            } else {
                chosenMove = getBestMove(2);
            }

            const moveRes = game.move(chosenMove);
            if (moveRes.captured) playSound('capture');
            else playSound('move');
            if (game.in_check()) playSound('check');

            renderBoard();
            checkGameOver();
        }

        function getBestMove(depth) {
            const moves = game.moves({ verbose: true });
            let bestScore = -9999;
            let bestMove = moves[0];
            for (let i = 0; i < moves.length; i++) {
                game.move(moves[i]);
                let score = -minimax(depth - 1, -10000, 10000, false);
                game.undo();
                if (score > bestScore) {
                    bestScore = score;
                    bestMove = moves[i];
                }
            }
            return bestMove;
        }

        function minimax(depth, alpha, beta, isMaximizing) {
            if (depth === 0 || game.game_over()) return evaluateBoard();
            const moves = game.moves({ verbose: true });
            if (isMaximizing) {
                let maxEval = -9999;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let evalScore = minimax(depth - 1, alpha, beta, false);
                    game.undo();
                    maxEval = Math.max(maxEval, evalScore);
                    alpha = Math.max(alpha, evalScore);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = 9999;
                for (let i = 0; i < moves.length; i++) {
                    game.move(moves[i]);
                    let evalScore = minimax(depth - 1, alpha, beta, true);
                    game.undo();
                    minEval = Math.min(minEval, evalScore);
                    beta = Math.min(beta, evalScore);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function evaluateBoard() {
            const pieceValues = { p: 10, r: 50, n: 30, b: 30, q: 90, k: 900 };
            let total = 0;
            const board = game.board();
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        const val = pieceValues[piece.type];
                        total += (piece.color === 'w' ? val : -val);
                    }
                }
            }
            return game.turn() === 'w' ? total : -total;
        }

        // 상태 문구 업데이트
        function updateStatusText() {
            const statusEl = document.getElementById('gameStatus');
            if (game.in_checkmate()) {
                statusEl.innerHTML = `<span class="text-rose-400">체크메이트! ${game.turn() === 'w' ? '흑색' : '백색'} 승리!</span>`;
            } else if (game.in_draw()) {
                statusEl.innerHTML = `<span>무승부 경기입니다.</span>`;
            } else {
                const turnStr = game.turn() === 'w' ? '백색' : '흑색';
                if (gameMode === 'online') {
                    statusEl.innerHTML = game.turn() === playerColor ? `<span class="text-emerald-400 font-bold">내 차례입니다 (${turnStr})</span>` : `<span>상대방 차례 (${turnStr})</span>`;
                } else if (gameMode === 'ai') {
                    statusEl.innerHTML = game.turn() === playerColor ? `<span class="text-emerald-400 font-bold">내 차례입니다</span>` : `<span>AI 계산 중...</span>`;
                } else {
                    statusEl.innerHTML = `<span>현재 차례: ${turnStr}</span>`;
                }
            }
        }

        // 잡은 기물 현황 표시
        function updateCapturedPieces() {
            const history = game.history({ verbose: true });
            let whiteCaptured = [];
            let blackCaptured = [];
            history.forEach(m => {
                if (m.captured) {
                    const char = pieceUnicode[m.color === 'w' ? 'b' : 'w'][m.captured];
                    if (m.color === 'w') whiteCaptured.push(char);
                    else blackCaptured.push(char);
                }
            });
            document.getElementById('capturedByMe').innerHTML = isFlipped ? whiteCaptured.join(' ') : blackCaptured.join(' ');
            document.getElementById('capturedByOpponent').innerHTML = isFlipped ? blackCaptured.join(' ') : whiteCaptured.join(' ');
        }

        // 수 기보 리스트
        function updateMoveHistory() {
            const historyEl = document.getElementById('moveHistory');
            const history = game.history();
            let html = '';
            for (let i = 0; i < history.length; i += 2) {
                const moveNum = Math.floor(i / 2) + 1;
                html += `<div class="flex justify-between text-slate-300 py-0.5 border-b border-slate-700/50">
                    <span class="text-slate-500 w-6">${moveNum}.</span>
                    <span class="w-20 font-medium">${history[i] || ''}</span>
                    <span class="w-20 font-medium">${history[i + 1] || ''}</span>
                </div>`;
            }
            historyEl.innerHTML = html;
            historyEl.scrollTop = historyEl.scrollHeight;
        }

        // 게임 종료 판정
        function checkGameOver() {
            if (game.game_over()) {
                playSound('gameover');
                let msg = '무승부 경기입니다.';
                if (game.in_checkmate()) {
                    const winner = game.turn() === 'w' ? '흑색' : '백색';
                    msg = `체크메이트! ${winner}의 완벽한 승리입니다.`;
                }
                document.getElementById('gameOverTitle').textContent = '게임 종료';
                document.getElementById('gameOverMessage').textContent = msg;
                document.getElementById('gameOverModal').classList.remove('hidden');
                document.getElementById('gameOverModal').classList.add('flex');
            }
        }

        function closeGameOverModal() {
            document.getElementById('gameOverModal').classList.add('hidden');
            document.getElementById('gameOverModal').classList.remove('flex');
        }

        // 무르기
        function undoMove() {
            if (gameMode === 'online') {
                if (conn && conn.open) {
                    game.undo();
                    conn.send({ type: 'undo' });
                }
            } else if (gameMode === 'ai') {
                game.undo(); game.undo();
            } else {
                game.undo();
            }
            selectedSquare = null; possibleMoves = [];
            renderBoard();
        }

        // 리셋
        function resetGame() {
            game.reset();
            selectedSquare = null; possibleMoves = [];
            if (gameMode === 'online' && conn && conn.open) {
                conn.send({ type: 'reset' });
            }
            if (gameMode === 'ai' && playerColor === 'b') {
                isFlipped = true;
                setTimeout(makeAIMove, 250);
            }
            renderBoard();
        }

        // 설정 패널 조작
        function openSettings() {
            document.getElementById('settingMode').value = gameMode;
            onModeChange();
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('settingsModal').classList.add('flex');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('settingsModal').classList.remove('flex');
        }

        function onModeChange() {
            const mode = document.getElementById('settingMode').value;
            document.getElementById('aiOptions').classList.toggle('hidden', mode !== 'ai');
            document.getElementById('aiOptions').classList.toggle('flex', mode === 'ai');
            document.getElementById('onlineOptions').classList.toggle('hidden', mode !== 'online');
            document.getElementById('onlineOptions').classList.toggle('flex', mode === 'online');

            if (mode === 'online') {
                initPeer();
            }
        }

        function applySettings() {
            gameMode = document.getElementById('settingMode').value;
            if (gameMode === 'ai') {
                aiDifficulty = document.getElementById('settingDifficulty').value;
                playerColor = document.getElementById('settingAiColor').value;
                isFlipped = (playerColor === 'b');
            } else if (gameMode === 'pvp') {
                isFlipped = false;
            }
            closeSettings();
            resetGame();
        }

        // 앱 초기화
        renderBoard();
    </script>
</body>
</html>
