<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>픽셀 던전 로그라이크</title>
<style>
:root{--bg:#0c0a14;--fg:#efe9d8;--pn:#1c1830;--ln:#3b3560;--ac:#ffb454;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--sl:46px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Noto Sans KR",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 0%,#241a44,var(--bg) 65%) fixed;display:flex;justify-content:center}
#app{width:100%;max-width:960px;padding:4px 6px;text-align:center}
h1{font-size:1.3rem;margin:.1em 0;color:var(--ac);text-shadow:3px 3px 0 #000,0 0 14px #ffb45466;letter-spacing:.04em}
canvas{width:min(100%,calc(52vh*5/3));image-rendering:pixelated;border:4px solid var(--ln);box-shadow:0 0 0 2px #000,0 0 26px #ffb45433;background:#000;display:block;margin:0 auto;touch-action:none}
button{font:inherit;color:inherit;background:var(--pn);border:2px solid var(--ln);border-radius:4px;padding:9px;cursor:pointer;box-shadow:0 3px 0 #000;transition:transform .1s,border-color .15s}
button:hover{border-color:var(--ac)}button:active{transform:translateY(3px);box-shadow:none}button:disabled{opacity:.4}
input{font:inherit;background:#000;color:#fff;border:2px solid var(--ln);padding:8px;width:100%;text-transform:uppercase}
small{display:block;opacity:.7;font-size:.7rem;margin-top:2px}
.bars{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:5px 0 3px}
.bar{width:calc(25% - 6px);min-width:120px;height:15px;background:#000;border:2px solid var(--ln);position:relative;overflow:hidden}.bar i{display:block;height:100%;transition:width .2s}.bar b{position:absolute;left:4px;top:-1px;font-size:.68rem;text-shadow:1px 1px 0 #000;white-space:nowrap}
#log{font-size:.78rem;opacity:.9;min-height:1.2em}
#rl{margin:2px 0;max-height:46px;overflow:auto}
#hotbar{display:flex;justify-content:center;gap:2px;margin:4px 0;flex-wrap:nowrap}
.sl{width:var(--sl);height:var(--sl);border:3px solid #6b6b6b;background:#2b2b2bdd;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #00000088}
.sl.sel{border-color:#fff}.sl.eq{box-shadow:inset 0 0 0 2px #ffd34d}
.sl b{position:absolute;right:2px;bottom:-1px;font-size:12px;color:#fff;text-shadow:1px 1px 0 #000}.sl small{position:absolute;left:2px;top:-2px;font-size:9px;opacity:.9;margin:0}
.ic{display:inline-block;width:32px;height:32px;background-image:var(--atlas);background-repeat:no-repeat;image-rendering:pixelated;flex:none}
#ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px;min-height:60px}
#joy{width:128px;height:128px;border-radius:50%;border:3px solid var(--ln);background:#ffffff0a;position:relative;touch-action:none;flex:none;display:none}
#knob{position:absolute;left:38px;top:38px;width:48px;height:48px;border-radius:50%;background:var(--ac);opacity:.75;box-shadow:0 0 10px #000}
@media(pointer:coarse){#joy{display:block}}
#acts{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;flex:1}#acts button{min-width:58px;font-weight:700;padding:8px 6px}
#acts #atk{min-width:84px;min-height:84px;font-size:1.5rem;background:#7a2a2a;border-color:#ff7a5a;border-radius:50%}
#ui{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:5}[hidden]{display:none!important}
.pp{background:var(--pn);border:3px solid var(--ln);box-shadow:0 0 0 2px #000,0 0 30px #ffb45444;padding:14px;width:min(94vw,480px);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:7px;animation:pi .2s steps(4)}
@keyframes pi{from{transform:scale(.9);opacity:0}}
.g{display:grid;grid-template-columns:1fr 1fr;gap:7px}.sp{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:.78rem}.sp span{border:1px solid var(--ln);padding:2px 7px}
.it{display:flex;align-items:center;gap:8px;text-align:left}.it button{margin-left:auto;white-space:nowrap}
@media(max-width:560px){:root{--sl:8.4vw}.sl .ic{transform:scale(.8)}.bar{min-width:46%}#acts button{min-width:50px}}
</style></head><body><div id="app">

function tinted(k,col,white){const key=k+col+(white?'W':'');if(tc[key])return tc[key];const im=ATL[k];if(!im)return null;const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.drawImage(im,0,0);if(white){x.globalCompositeOperation='source-atop';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}else if(col){x.globalCompositeOperation='source-atop';x.globalAlpha=.38;x.fillStyle=col;x.fillRect(0,0,c.width,c.height)}return tc[key]=c}
