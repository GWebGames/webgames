<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>38°선 — 6·25 전쟁 전략 시뮬레이션</title>
<style>
:root{--un:#4b8bff;--com:#ff5a52;--bg:#05090e;--panel:rgba(9,15,23,.88);--line:#2a3a4e;--txt:#d9e4f0;--dim:#7f92a7;--gold:#e8c35a;--grn:#5ad08a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas{display:block}
#map,#tcv{position:absolute;left:0;top:0;width:100%;height:100%}
.hidden{display:none!important}
button{font:inherit;color:var(--txt);background:#14202e;border:1px solid var(--line);padding:7px 12px;cursor:pointer;border-radius:3px;transition:.12s}
button:hover:not(:disabled){background:#1e3248;border-color:#4a6a8c}
button:disabled{opacity:.35;cursor:default}
button.pri{background:#7c2a22;border-color:#d4574c;font-weight:700;letter-spacing:.05em}
button.pri:hover:not(:disabled){background:#a1372d}
button.blue{background:#1d3f75;border-color:#4b8bff}
button.blue:hover:not(:disabled){background:#27519a}
#banner{position:absolute;top:0;left:calc((100% - 330px)/2);transform:translateX(-50%);background:linear-gradient(#20301f,#141f14);border:1px solid #3d5a3a;border-top:0;padding:7px 28px;font-size:15px;font-weight:600;letter-spacing:.06em;white-space:nowrap;box-shadow:0 4px 18px #000a}
#banner span+span{margin-left:14px;color:var(--gold)}
#hudL{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);padding:10px 14px;min-width:250px}
#hudL .title{font-size:20px;font-weight:800;letter-spacing:.1em}
#hudL .title small{display:block;font-size:11px;font-weight:400;color:var(--dim);letter-spacing:.04em;margin-top:2px}
#vp{margin-top:9px;font-size:12px}
.vbar{display:flex;height:9px;margin:4px 0;background:#000;border:1px solid #223}
.vbar i{display:block;height:100%}.vbar .un{background:var(--un)}.vbar .com{background:var(--com)}
.vrow{display:flex;justify-content:space-between}
.vrow b.un{color:var(--un)}.vrow b.com{color:var(--com)}
.hbtns{margin-top:8px;display:flex;gap:6px}.hbtns button{padding:4px 10px;font-size:12px}
#tip{position:absolute;pointer-events:none;background:#0b121cee;border:1px solid var(--line);padding:6px 9px;font-size:12px;line-height:1.5;display:none;z-index:5;max-width:240px}
#log{position:absolute;left:10px;bottom:10px;width:360px;max-height:150px;overflow:hidden;background:rgba(5,9,14,.72);border:1px solid var(--line);padding:7px 10px;font-size:12px;line-height:1.55;display:flex;flex-direction:column;justify-content:flex-end}
#log div{opacity:.82}#log div:last-child{opacity:1}
#log .un{color:#8fb6ff}#log .com{color:#ff9a94}#log .sys{color:var(--gold)}
#panel{position:absolute;right:0;top:0;bottom:0;width:330px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#pHead{padding:12px 14px;border-bottom:1px solid var(--line);background:linear-gradient(#162231,#0d1620)}
#pHead .nm{font-size:18px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
#pHead .tag{font-size:11px;padding:2px 7px;border-radius:2px;font-weight:700}
.tag.un{background:#1d3f75;color:#bcd5ff}.tag.com{background:#6d211c;color:#ffc9c5}
#pHead .st{margin-top:5px;font-size:12px;color:var(--dim)}
#pBody{flex:1;overflow-y:auto;padding:8px 10px}
#pBody .hint{color:var(--dim);font-size:12.5px;line-height:1.7;padding:6px 4px}
.sec{font-size:11px;color:var(--dim);letter-spacing:.12em;margin:8px 2px 4px;border-bottom:1px solid #1b2a3b;padding-bottom:2px}
.u{display:grid;grid-template-columns:30px 1fr auto;gap:2px 8px;align-items:center;padding:5px 6px;border:1px solid transparent;border-bottom-color:#16222f;font-size:12.5px}
.u.mine{cursor:pointer}.u.mine:hover{background:#142234}
.u.sel{background:#1c3350;border-color:var(--gold)}
.u.moved{opacity:.55}
.u .sy{grid-row:1/3}
.u .nm{font-weight:600}.u .nm small{color:var(--dim);font-weight:400;margin-left:4px}
.u .sb{height:5px;background:#05090e;border:1px solid #223;grid-column:2}
.u .sb i{display:block;height:100%}
.u.UN .sb i{background:var(--un)}.u.COM .sb i{background:var(--com)}
.u b{grid-row:1/3;grid-column:3;font-size:13px}
.u em{font-style:normal;font-size:10.5px;color:var(--gold);margin-left:5px}
#pBtns{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}#pBtns button{flex:1;padding:6px 4px;font-size:12px}
#endBtn{margin:0 10px 12px;padding:13px;font-size:16px}
#tac{position:fixed;inset:0;background:#070a0c;z-index:20}
#tTop{position:absolute;top:0;left:calc((100% - 320px)/2);transform:translateX(-50%);background:linear-gradient(#2c1f1f,#1a1212);border:1px solid #5a3a3a;border-top:0;padding:7px 24px;font-size:14px;font-weight:600;white-space:nowrap;box-shadow:0 4px 18px #000a;display:flex;gap:18px;align-items:center}
#tTop .pts i{display:inline-block;width:11px;height:11px;border-radius:50%;margin:0 2px;border:1px solid #fff8;vertical-align:-1px}
#tSide{position:absolute;right:0;top:0;bottom:0;width:320px;background:var(--panel);border-left:1px solid var(--line);padding:14px 14px 214px;font-size:12.5px;overflow:auto}
#tSide h3{font-size:16px;margin-bottom:3px}
#tSide .row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #16222f}
#tSide .row span:first-child{color:var(--dim)}
#tSide .hp{height:7px;background:#000;border:1px solid #223;margin:6px 0}
#tSide .hp i{display:block;height:100%}
#tSide .box{margin-top:12px;padding:8px;background:#0c1520;border:1px solid var(--line);line-height:1.6}
#tMini{position:absolute;right:10px;bottom:10px;width:300px;height:188px;border:1px solid var(--line);background:#000;cursor:crosshair;z-index:2}
#tLog{position:absolute;left:10px;bottom:62px;width:380px;max-height:130px;overflow:hidden;background:rgba(5,9,14,.7);border:1px solid var(--line);padding:6px 9px;font-size:12px;line-height:1.5;display:flex;flex-direction:column;justify-content:flex-end}
#tBtns{position:absolute;left:calc((100% - 320px)/2);transform:translateX(-50%);bottom:12px;display:flex;gap:8px}
#tBtns button{padding:9px 16px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:50;display:flex;align-items:center;justify-content:center}
#mbox{background:#0d1620;border:1px solid #3a5472;border-top:3px solid var(--gold);padding:22px 26px;max-width:620px;width:92%;max-height:90vh;overflow:auto;font-size:14px;line-height:1.7;box-shadow:0 12px 50px #000}
#mbox h2{font-size:22px;margin-bottom:8px;letter-spacing:.05em}
#mbox h4{margin:10px 0 3px;color:var(--gold);font-size:13px}
#mbox .mb{display:flex;gap:10px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
#mbox .mb button{padding:10px 18px}
#mbox .two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
#mbox .two>div{background:#09111a;border:1px solid #1d2c3d;padding:8px 10px;font-size:12.5px}
#mbox .two b.un{color:var(--un)}#mbox .two b.com{color:var(--com)}
#mbox ul{margin-left:18px;font-size:13px}
html,body{touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
.mobonly{display:none}
body.mob .mobonly{display:inline-block}
body.mob button{min-height:38px}
body.mob #hudL{left:6px;top:6px;padding:5px 8px;min-width:0;max-width:56vw}
body.mob #hudL .title{font-size:15px}body.mob #hudL .title small,body.mob #objs{display:none}
body.mob #vp{margin-top:4px;font-size:11px}body.mob #vp>div:nth-child(n+3){display:none}
body.mob .hbtns{margin-top:4px;gap:4px}body.mob .hbtns button{padding:3px 7px;font-size:11px;min-height:30px}
body.mob #banner{left:auto;right:6px;transform:none;font-size:11px;padding:4px 8px;letter-spacing:0;white-space:normal;max-width:42vw;text-align:right}
body.mob #banner span+span{margin-left:0;display:block}
body.mob #log,body.mob #tLog{display:none}
body.mob #tip{display:none!important}
body.mob.portrait #panel{left:0;right:0;top:auto;bottom:0;width:100%;height:40vh;border-left:0;border-top:1px solid var(--line)}
body.mob:not(.portrait) #panel{width:min(260px,34vw)}
body.mob #pBtns{flex-wrap:wrap}body.mob #pBtns button{flex:1 1 22%;min-height:36px;font-size:12px}
body.mob #endBtn{margin:0 8px 8px;padding:10px;font-size:15px}
body.mob #pBody{padding:6px 8px}body.mob .u{padding:8px 6px}body.mob #pHead{padding:8px 10px}
body.mob #tTop{left:0;transform:none;padding:4px 10px;gap:8px;font-size:11px;white-space:normal;max-width:calc(100vw - 142px);flex-wrap:wrap;justify-content:flex-start}
body.mob #tTitle{display:none}
body.mob #tSide{display:none;width:min(78vw,320px);padding-bottom:16px;z-index:6}
body.mob.tside #tSide{display:block}
body.mob #tMini{width:128px;height:80px;right:6px;top:50px;bottom:auto}
body.mob #tBtns{left:50%;bottom:6px;width:98vw;flex-wrap:wrap;justify-content:center;gap:5px}
body.mob #tBtns button{padding:7px 9px;font-size:12px;min-height:38px}
body.mob #tBtns button.on{background:#7a5a10;border-color:#e8c35a}
body.mob:not(.portrait) #tBtns{left:4px;top:42px;bottom:auto;transform:none;width:auto;display:grid;grid-template-columns:repeat(2,66px);gap:4px}
body.mob:not(.portrait) #tBtns button{min-height:30px;padding:3px 2px;font-size:10.5px}
body.mob #mbox{padding:14px 14px;font-size:13px}body.mob #mbox h2{font-size:18px}body.mob #mbox .two{grid-template-columns:1fr}
@media(max-width:900px){#panel{width:250px}#banner{left:calc((100% - 250px)/2);font-size:12px;padding:5px 12px}#log{width:240px;font-size:11px}#hudL{min-width:0;padding:6px 9px}#tSide{width:230px}}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="banner"><span id="bTurn"></span><span id="bPhase"></span></div>
<div id="hudL">
  <div class="title">38°선<small>6·25 전쟁 전략 시뮬레이션</small></div>
  <div id="vp"></div>
  <div id="objs"></div>
  <div class="hbtns"><button id="bView">3D 보기</button><button id="bSnd">🔊 소리</button><button id="helpBtn">도움말</button></div>
</div>
<div id="tip"></div>
<div id="log"></div>
<div id="panel">
  <div id="pHead"></div>
  <div id="pBody"></div>
  <div id="pBtns"><button id="bAll">전체 선택</button><button id="bNone">선택 해제</button><button id="bUndo">이동 취소</button><button id="bAI">추천 이동</button></div>
  <button id="endBtn" class="pri">턴 종료</button>
</div>

<div id="tac" class="hidden">
  <canvas id="tcv"></canvas>
  <div id="tTop"><span id="tTitle"></span><span id="tInfo"></span><span class="pts" id="tPts"></span></div>
  <div id="tSide"></div>
  <canvas id="tMini" width="300" height="188"></canvas>
  <div id="tLog"></div>
  <div id="tBtns">
    <button id="tView">3D 보기</button><button id="tInfoB" class="mobonly">ⓘ 정보</button><button id="tMulti" class="mobonly">＋다중</button><button id="tBox" class="mobonly">▭ 박스</button><button id="tAllB" class="mobonly">전체</button><button id="tNoneB" class="mobonly">해제</button>
    <button id="tSnd">🔊</button>
    <button id="tFM" class="blue">포격 지시 (G)</button>
    <button id="tSmk" class="blue">연막 (X)</button>
    <button id="tAir" class="blue">공습</button>
    <button id="tNav" class="blue">함포</button>
    <button id="tAuto">자동 지휘</button>
    <button id="tSpd">배속 ×1</button>
    <button id="tRet">후퇴</button>
    <button id="tEnd" class="pri">▶ 시작 (Space)</button>
  </div>
</div>
<div id="modal" class="hidden"><div id="mbox"></div></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const opp=s=>s==='UN'?'COM':'UN';
const SQ3=Math.sqrt(3);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// <<DATA>>
const FAC={
  ROK:{n:'국군',side:'UN',q:.88},USA:{n:'미군',side:'UN',q:1.15},UNF:{n:'유엔군',side:'UN',q:1.0},
  PRK:{n:'북한군',side:'COM',q:1.0},CHN:{n:'중공군',side:'COM',q:.95},SOV:{n:'소련군',side:'COM',q:1.12}
};
const SIDE_N={UN:'유엔군',COM:'공산군'};
const TY={inf:{n:'보병',pw:1,land:1},arm:{n:'기갑',pw:1.6,land:1},art:{n:'포병',pw:1.3,land:1},mar:{n:'해병',pw:1.25,land:1},air:{n:'공군',pw:0,land:0},nav:{n:'해군',pw:0,land:0}};
const P=[
 {k:'hb',n:'함경북도',sn:'함경북도',vp:1,coast:1,def:1.15,ter:{m:.3,f:.35,h:.15}},
 {k:'ry',n:'량강도',sn:'량강도',vp:1,coast:0,def:1.3,ter:{m:.55,f:.4,h:.1}},
 {k:'hn',n:'함경남도',sn:'함경남도',vp:1,coast:1,def:1.1,ter:{m:.35,f:.25,h:.2}},
 {k:'hh',n:'함흥',sn:'함흥',vp:2,coast:1,def:1.15,ter:{u:.35,f:.1,h:.15},port:1,lo:[0,0],bo:[-4,16]},
 {k:'pb',n:'평안북도',sn:'평안북도',vp:1,coast:1,def:1.1,ter:{m:.2,f:.2,h:.25,r:1}},
 {k:'pn',n:'평안남도',sn:'평안남도',vp:1,coast:1,def:1.1,ter:{m:.2,f:.2,h:.25}},
 {k:'py',n:'평양직할시',sn:'평양',vp:5,coast:0,def:1.2,ter:{u:.4,h:.1,r:1},lo:[-6,-4],bo:[-6,12]},
 {k:'hbk',n:'황해북도',sn:'황해북도',vp:1,coast:0,def:1.05,ter:{h:.25,f:.15,r:1}},
 {k:'hsn',n:'황해남도',sn:'황해남도',vp:1,coast:1,def:1.0,ter:{f:.1,h:.1,paddy:1}},
 {k:'gw',n:'강원도',sn:'강원도',vp:1,coast:1,def:1.25,ter:{m:.5,f:.35,h:.1}},
 {k:'se',n:'서울특별시',sn:'서울',vp:5,coast:0,def:1.2,ter:{u:.55,h:.1,r:1},lo:[30,-4],bo:[14,14]},
 {k:'ic',n:'인천',sn:'인천',vp:2,coast:1,def:1.0,ter:{u:.4,paddy:1},port:1,lo:[-30,8],bo:[-16,24]},
 {k:'gg',n:'경기도',sn:'경기도',vp:1,coast:0,def:1.0,ter:{h:.2,f:.15,u:.1,r:1},lo:[4,-10],bo:[4,6]},
 {k:'cb',n:'충청북도',sn:'충청북도',vp:1,coast:0,def:1.15,ter:{m:.3,f:.35,h:.2}},
 {k:'cn',n:'충청남도',sn:'충청남도',vp:1,coast:1,def:1.0,ter:{h:.2,f:.15,paddy:1}},
 {k:'jb',n:'전라북도',sn:'전라북도',vp:1,coast:1,def:1.0,ter:{h:.2,f:.15,paddy:1}},
 {k:'jn',n:'전라남도',sn:'전라남도',vp:1,coast:1,def:1.0,ter:{h:.2,f:.25,m:.1,paddy:1}},
 {k:'gb',n:'경상북도',sn:'경상북도',vp:1,coast:1,def:1.15,ter:{m:.4,f:.3,h:.15,r:1}},
 {k:'gn',n:'경상남도',sn:'경상남도',vp:1,coast:1,def:1.1,ter:{m:.25,f:.25,h:.2,r:1}},
 {k:'bs',n:'부산',sn:'부산',vp:4,coast:1,def:1.3,ter:{u:.45,h:.25,r:1},port:1,lo:[6,-8],bo:[8,10]},
 {k:'dg',n:'대구광역시',sn:'대구',vp:2,coast:0,def:1.15,ter:{u:.45,h:.2,r:1},lo:[-4,-2],bo:[-6,8]},
 {k:'dj',n:'대전광역시',sn:'대전',vp:2,coast:0,def:1.05,ter:{u:.4,h:.15,r:1},lo:[14,6],bo:[-8,8]},
 {k:'gj',n:'광주광역시',sn:'광주',vp:2,coast:0,def:1.0,ter:{u:.4,paddy:1},lo:[-4,0],bo:[-8,8]},
 {k:'us',n:'울산광역시',sn:'울산',vp:2,coast:1,def:1.1,ter:{u:.4,h:.2,r:1},port:1,lo:[8,-2],bo:[10,8]}
];
const PK={};P.forEach((p,i)=>{p.id=i;PK[p.k]=i;});
const COM_START=['hb','ry','hn','hh','pb','pn','py','hbk','hsn','gw'];
const CHAIN=['hb','hn','hh','gw','gb','bs','gn','jn','jb','cn','ic','hsn','pn','pb'].map(k=>PK[k]);
const CI=P.map(()=>-1);CHAIN.forEach((p,i)=>CI[p]=i);
// 지도 데이터: Natural Earth 행정구역(10m) 기반 래스터 (0.015° 격자)

const hasNavy=side=>G.units.some(u=>u.side===side&&u.type==='nav');
function reach(u){
  const side=u.side,res=new Map();
  if(u.moved||u.engaged)return res;
  const Tp=u.type;
  if(Tp==='air'){
    const seen=new Map([[u.prov,0]]),q=[u.prov];
    while(q.length){const p=q.shift(),d=seen.get(p);if(d>=3)continue;for(const n of ADJ[p]){if(seen.has(n))continue;seen.set(n,d+1);q.push(n);}}
    for(const [p,d] of seen)if(p!==u.prov&&G.own[p]===side&&!enemyLand(p,side))res.set(p,{att:false,cost:d});
    return res;
  }
  if(Tp==='nav'){
    const ci=CI[u.prov];if(ci<0)return res;
    for(let k=0;k<CHAIN.length;k++)if(k!==ci&&Math.abs(k-ci)<=6)res.set(CHAIN[k],{att:false,sea:true,cost:Math.abs(k-ci)});
    return res;
  }
  const mv=Tp==='arm'?3:2;
  const seen=new Map([[u.prov,0]]),q=[u.prov];
  while(q.length){const p=q.shift(),d=seen.get(p);
    for(const n of ADJ[p]){if(seen.has(n)||d+1>mv)continue;
      const hostile=G.own[n]!==side||enemyLand(n,side);
      seen.set(n,d+1);
      if(hostile)res.set(n,{att:true,cost:d+1});
      else{res.set(n,{att:false,cost:d+1});q.push(n);}
    }}
  if(Tp==='mar'&&hasNavy(side)&&CI[u.prov]>=0){
    const ci=CI[u.prov];
    for(let k=0;k<CHAIN.length;k++){if(k===ci||Math.abs(k-ci)>5)continue;const p=CHAIN[k];
      if(res.has(p))continue;
      const hostile=G.own[p]!==side||enemyLand(p,side);
      res.set(p,{att:hostile,sea:true,cost:Math.abs(k-ci)});}
  }
  return res;
}

}

function recalcTargets(){

  fillX.putImageData(img,0,0);
  const bi=brdX.createImageData(NX,NY),bd=bi.data;
  for(let j=0;j<NY;j++)for(let i=0;i<NX;i++){const idx=j*NX+i,a=ID[idx];if(a<0)continue;
    let front=false,line=false,coast=false;
    const nb=[i+1<NX?ID[idx+1]:-1,j+1<NY?ID[idx+NX]:-1,i>0?ID[idx-1]:-1,j>0?ID[idx-NX]:-1];
    for(let k=0;k<4;k++){const b=nb[k];if(b<0)coast=true;else if(b!==a&&k<2){line=true;if(G.own[a]!==G.own[b])front=true;}}
    const o=idx*4;
    if(coast){bd[o]=190;bd[o+1]=215;bd[o+2]=232;bd[o+3]=255;}
    else if(front){bd[o]=255;bd[o+1]=222;bd[o+2]=110;bd[o+3]=255;}

function arrow(c,x1,y1,x2,y2,col,dash,att,time){

<h4>모바일 · 태블릿 (터치)</h4><ul><li>자동으로 터치 화면을 감지해 레이아웃이 바뀝니다 (세로: 아래쪽 패널 / 가로: 오른쪽 패널). 폰·태블릿(iPad 포함)을 자동 인식하며, 화면을 돌리거나 창 크기를 바꾸면 즉시 다시 맞춰집니다. 주소 뒤에 <b>?m=1</b>=강제 모바일, <b>?m=0</b>=강제 PC 모드.</li><li><b>전략 지도</b>: 탭=지역 선택(이동 가능한 부대 자동 선택) → 초록/빨강 지역 탭=이동 · 한 손가락 드래그=이동(3D는 회전) · 두 손가락=확대/축소.</li><li><b>세부 전투</b>: 유닛 탭=선택, 두 번 탭=같은 병종 전체, 선택 후 땅 탭=이동, 적 탭=공격. ＋다중 / ▭박스 / 전체 / 해제 버튼, ⓘ=정보 패널, 우상단 미니맵 터치로 이동. 포격·연막·공습·함포는 버튼 후 목표 지점을 탭.</li></ul>

// ============== 턴 진행 ==============
function beginPhase(side){
  for(const u of G.units)if(u.side===side){u.moved=false;u.engaged=false;}
  G.sel.clear();G.targets=new Map();G.dirtyHi=true;
}
async function gameLoop(){
  while(!G.over){
    spawnScript(G.turn);G.dirtyFill=true;
    await runEvents();if(G.over)return;
    for(const u of G.units){u.mvFrom=undefined;u.attacking=false;u.from=undefined;u.mvSea=false;}
    updateHUD();
    // 이동 단계: 공산군 → 유엔군 순서로 각자 한 번씩 이동
    for(const side of ['COM','UN']){
      beginPhase(side);updateHUD();
      if(side===G.player)await playerPhase(side);else await aiPhase(side);
      if(G.over)return;
    }
    // 전투 단계: 양쪽 이동이 끝난 뒤 교전 지역 중 직접 들어갈 곳을 고른다
    await battlePhase();
    if(G.over)return;
    endOfTurn();
    if(G.over)return;
    await settleObjectives();
    if(G.turn>=G.max){await finalScore();return;}
    G.turn++;
  }
}
async function playerPhase(side){
  G.phase='orders';setPhase(`내 이동 단계 — ${SIDE_N[side]} 부대를 이동시키세요`);
  $('endBtn').textContent='이동 완료';$('endBtn').disabled=false;renderPanel();
  await new Promise(r=>G.endResolve=r);
  G.phase='waiting';G.sel.clear();G.targets=new Map();G.dirtyHi=true;$('endBtn').disabled=true;
  renderPanel();
}
async function aiPhase(side){
  G.phase='ai';$('endBtn').disabled=true;setPhase(`컴퓨터의 턴 — ${SIDE_N[side]} 이동 중…`);
  renderPanel();await sleep(700);
  aiMove(side);G.dirtyHi=true;renderPanel();
  await sleep(1300);
}
function battleAttacker(pid){
  const ca=landIn(pid,'COM').some(x=>x.attacking),ua=landIn(pid,'UN').some(x=>x.attacking);
  if(ca&&!ua)return 'COM';if(ua&&!ca)return 'UN';
  return G.own[pid]==='COM'?'UN':'COM';
}
const contested=()=>P.filter(p=>landIn(p.id,'COM').length&&landIn(p.id,'UN').length).sort((a,b)=>b.vp-a.vp).map(p=>p.id);
async function battlePhase(){
  G.phase='battle';G.sel.clear();G.targets=new Map();G.hover=-1;
  // 무저항 점령 (양측 이동이 끝난 뒤 한꺼번에)
  for(const s of ['COM','UN'])for(const p of P){
    const a=landIn(p.id,s);
    if(a.length&&!landIn(p.id,opp(s)).length&&G.own[p.id]!==s){a.forEach(u=>u.fought=true);capture(p.id,s);}}
  if(checkVictory())return;
  while(true){
    const list=contested();
    G.battles=list;G.dirtyHi=true;G.dirtyFill=true;updateHUD();
    if(!list.length)break;
    setPhase(`전투 단계 — 교전 지역 ${list.length}곳 (직접 들어갈 지역을 선택)`);
    $('endBtn').textContent='남은 전투 모두 자동 처리';$('endBtn').disabled=false;
    G.selProv=-1;renderPanel();
    const choice=await new Promise(r=>G.battleResolve=r);
    G.battleResolve=null;
    if(choice==='auto'){
      for(const pid of list){if(landIn(pid,'COM').length&&landIn(pid,'UN').length){const att=battleAttacker(pid);applyBattle(pid,att,autoBattle(pid,att),false);if(checkVictory())return;}}
      continue;
    }
    G.selProv=choice;renderPanel();
    await fightBattle(choice);
    if(checkVictory())return;
  }
  G.battles=[];G.dirtyHi=true;$('endBtn').disabled=true;G.phase='resolving';renderPanel();
}
function endOfTurn(){
  calcSupply();let cutMe=0,cutEn=0;
  for(const u of G.units){
    const ok=inSupply(u);
    if(!ok){if(u.side===G.player)cutMe++;else cutEn++;if(u.str>1&&Math.random()<.65)u.str--;}
    else if(!u.fought&&G.own[u.prov]===u.side&&u.str<u.max){u.str=Math.min(u.max,u.str+(P[u.prov].vp>=2?2:1));}
    u.fought=false;
  }
  if(cutMe||cutEn)glog(`보급 단절: 아군 ${cutMe}개 · 적 ${cutEn}개 부대 — 회복 불가, 병력 감소`,'sys');
  updateHUD();G.dirtyFill=true;
}
function checkVictory(){
  const nu=G.own.filter(o=>o==='UN').length,nc=P.length-nu;
  if(nu>=22||nc>=22){endGame(nu>=22?'UN':'COM','total');return true;}
  return false;
}
async function finalScore(){
  const a=vpOf('UN'),b=vpOf('COM');
  G.over=true;G.phase='over';setPhase('휴전');
  const w=a===b?null:(a>b?'UN':'COM');
  await modal(`<h2>1953년 7월 27일 — 정전 협정</h2><p>3년 1개월에 걸친 전쟁이 휴전으로 끝났습니다.</p><div class="two"><div><b class="un">유엔군</b><br>승점 ${a} · ${G.own.filter(o=>o==='UN').length}개 지역</div><div><b class="com">공산군</b><br>승점 ${b} · ${G.own.filter(o=>o==='COM').length}개 지역</div></div><h2 style="color:${w===G.player?'#5ad08a':w?'#ff6a60':'#e8c35a'}">${w===null?'무승부':(w===G.player?'승리!':'패배…')}</h2>`,[{t:'다시 시작',v:1,cls:'pri'}]);
  location.reload();
}
async function endGame(winner,why){
  G.over=true;G.phase='over';setPhase('전쟁 종결');
  const win=winner===G.player;
  await modal(`<h2 style="color:${win?'#5ad08a':'#ff6a60'}">${win?'결정적 승리':'결정적 패배'}</h2><p>${SIDE_N[winner]}이(가) 한반도 대부분(${G.own.filter(o=>o===winner).length}/${P.length} 지역)을 장악하며 전쟁을 끝냈습니다.</p><p style="color:var(--dim)">${G.turn}턴(${dateStr(G.turn)})에 종료</p>`,[{t:'다시 시작',v:1,cls:'pri'}]);
  location.reload();
}

// ============== 점령 · 전투 처리 ==============
function displaceSupport(pid,side){
  for(const u of G.units.filter(u=>u.prov===pid&&u.side===side&&u.type==='air')){
    const c=[...ADJ[pid]].filter(n=>G.own[n]===side&&!enemyLand(n,side));
    if(c.length)u.prov=c[ri(0,c.length-1)];else{G.units.splice(G.units.indexOf(u),1);glog(`${u.name} 소실(비행장 상실)`,side==='UN'?'un':'com');}
  }
}
function capture(pid,side){
  G.own[pid]=side;G.dirtyFill=true;
  displaceSupport(pid,opp(side));
  glog(`${P[pid].n} ${side===G.player?'점령!':'함락…'} (${SIDE_N[side]})`,side==='UN'?'un':'com');
  addFx(pid,side===G.player?'점령!':'함락…',side==='UN'?'#6aa5ff':'#ff6a60',true);
  if(side===G.player)SFX.chime();
  updateHUD();
}
function supUnits(side,pid,type){
  return G.units.filter(u=>u.side===side&&u.type===type&&(type==='air'?(u.prov===pid||ADJ[pid].has(u.prov)):(P[pid].coast&&CI[u.prov]>=0&&Math.abs(CI[u.prov]-CI[pid])<=2)));
}
function supCount(side,pid,type){return supUnits(side,pid,type).reduce((s,u)=>s+1+Math.floor(u.str/4),0);}
function supStr(side,pid,type){return supUnits(side,pid,type).reduce((s,u)=>s+u.str,0);}
function supQ(side,pid,type){const l=supUnits(side,pid,type);return l.length?l.reduce((s,u)=>s+FAC[u.fac].q,0)/l.length:1;}
function autoBattle(pid,att){
  const def=opp(att),A=landIn(pid,att),D=landIn(pid,def);
  const bonus=s=>Math.min(.5,supStr(s,pid,'air')*.04+supStr(s,pid,'nav')*.035);
  const am=autoMods(pid,att);
  const pa=A.reduce((s,u)=>s+upow(u),0)*(1+bonus(att))*am.pa;
  const pd=D.reduce((s,u)=>s+upow(u),0)*P[pid].def*(1+bonus(def))*am.pd;
  const ra=pa*rnd(.8,1.25),rd=pd*rnd(.8,1.25);
  const winner=ra>rd?att:def;
  const ratio=Math.min(pa,pd)/Math.max(pa,pd,.01);
  const lossL=rnd(.38,.62),lossW=clamp(rnd(.08,.18)+.18*ratio,.05,.4);
  const map={};
  for(const u of A)map[u.id]=Math.round(u.str*(1-(winner===att?lossW:lossL)));
  for(const u of D)map[u.id]=Math.round(u.str*(1-(winner===def?lossW:lossL)));
  const xp={};for(const u of A.concat(D))xp[u.id]=winner===u.side?1:0;
  return {winner,map,retreat:null,xp};
}
function fmtList(l){return l.map(u=>`${u.name} <small style="color:var(--dim)">(${FAC[u.fac].n} ${TY[u.type].n} ${u.str})</small>`).join('<br>')||'—';}
async function fightBattle(pid){
  const att=battleAttacker(pid),def=opp(att),A=landIn(pid,att),D=landIn(pid,def);
  const pa=A.reduce((s,u)=>s+upow(u),0),pd=D.reduce((s,u)=>s+upow(u),0)*P[pid].def;
  const sup=s=>`공습 ${supCount(s,pid,'air')} · 함포 ${supCount(s,pid,'nav')}`;
  const mode=await modal(`<h2>${att===G.player?'공격':'방어'} 전투 — ${P[pid].n}</h2><p style="color:var(--dim);font-size:13px">${att===G.player?'아군이 적 지역에 진입했습니다.':'적이 아군 지역을 공격해 왔습니다.'} 지형 방어 보너스 +${Math.round((P[pid].def-1)*100)}%</p>
  <div class="two"><div><b class="${att.toLowerCase()}">${SIDE_N[att]} (공격)</b><br>전력 ${pa.toFixed(0)}<br><small style="color:var(--dim)">${sup(att)}</small><hr style="border:0;border-top:1px solid #1d2c3d;margin:5px 0">${fmtList(A)}</div><div><b class="${def.toLowerCase()}">${SIDE_N[def]} (방어)</b><br>전력 ${pd.toFixed(0)}<br><small style="color:var(--dim)">${sup(def)}</small><hr style="border:0;border-top:1px solid #1d2c3d;margin:5px 0">${fmtList(D)}</div></div>`,
    [{t:'돌아가기',v:'cancel'},{t:'자동 전투',v:'auto'},{t:'세부 전투 지휘',v:'tac',cls:'pri'}]);
  if(mode==='cancel')return false;
  const res=mode==='tac'?await runTactical(pid,att,A,D):autoBattle(pid,att);
  applyBattle(pid,att,res,mode==='tac');
  return true;
}
function pickRetreat(u,pid){
  const side=u.side;
  const c=[...ADJ[pid]].filter(n=>G.own[n]===side&&!enemyLand(n,side));
  if(!c.length)return -1;
  if(u.from!==undefined&&c.includes(u.from))return u.from;
  c.sort((a,b)=>{const ea=[...ADJ[a]].filter(x=>G.own[x]!==side).length,eb=[...ADJ[b]].filter(x=>G.own[x]!==side).length;return ea-eb;});
  return c[0];
}
function applyBattle(pid,att,res,tac){
  const def=opp(att),winner=res.winner,loser=opp(winner);
  const land=G.units.filter(u=>u.prov===pid&&isLand(u));
  let lossW=0,lossL=0;
  for(const u of land){if(res.map[u.id]!==undefined){const ns=res.map[u.id];if(u.side===winner)lossW+=u.str-ns;else lossL+=u.str-ns;u.str=ns;}u.fought=true;}
  if(res.xp)for(const u of land){const g=res.xp[u.id];if(g&&u.str>0){const r0=rankOf(u);u.xp=(u.xp||0)+g;const r1=rankOf(u);if(r1>r0){glog(`${u.name} — ${RANKN[r1]} 부대로 승급!${'★'.repeat(r1)}`,u.side==='UN'?'un':'com');if(u.side===G.player)SFX.chime();}}}
  for(const u of land){if(u.str<=0){G.units.splice(G.units.indexOf(u),1);}}
  // 패자 후퇴
  let lost=0;
  for(const u of G.units.filter(u=>u.prov===pid&&u.side===loser&&isLand(u))){
    const d=pickRetreat(u,pid);
    if(d>=0){u.prov=d;u.moved=true;u.engaged=true;u.attacking=false;}
    else{u.str=Math.ceil(u.str*.4);lost++;if(u.str<=0)G.units.splice(G.units.indexOf(u),1);else{u.str=0;G.units.splice(G.units.indexOf(u),1);}}
  }
  if(winner===att&&G.own[pid]!==att){G.own[pid]=att;G.dirtyFill=true;displaceSupport(pid,loser);}
  else if(winner===def)displaceSupport(pid,att);
  for(const u of G.units)if(u.prov===pid&&u.side===winner&&isLand(u)){u.moved=true;u.engaged=true;u.attacking=false;}
  const wn=SIDE_N[winner];
  glog(`${P[pid].n} 전투${tac?'(세부)':''}: ${wn} 승리 — 아군 손실 ${winner===G.player?lossW:lossL} / 적 손실 ${winner===G.player?lossL:lossW}${winner===att?' · 점령':''}`,winner==='UN'?'un':'com');
  addFx(pid,`${wn} 승리${winner===att?' · 점령':''}\n손실 아군 ${winner===G.player?lossW:lossL} · 적 ${winner===G.player?lossL:lossW}`,winner==='UN'?'#6aa5ff':'#ff6a60',false);
  updateHUD();G.dirtyFill=true;
}

function distToEnemy(side){
  const d=P.map(()=>99),q=[];
  P.forEach((p,i)=>{if(G.own[i]!==side){d[i]=0;q.push(i);}});
  while(q.length){const a=q.shift();for(const b of ADJ[a])if(d[b]>d[a]+1){d[b]=d[a]+1;q.push(b);}}
  return d;
}
function aiMove(side){
  const en=opp(side),de=distToEnemy(side);
  const mine=G.units.filter(u=>u.side===side&&isLand(u));
  const opts=new Map();for(const u of mine)opts.set(u.id,reach(u));
  const threat=P.map((p,i)=>{let s=0;for(const n of ADJ[i])s+=landPow(n,en);return s;});
  const left=P.map((p,i)=>landPow(i,side));
  const tset=new Set();
  for(const m of opts.values())for(const [p,i] of m)if(i.att)tset.add(p);
  const plan=[];
  for(const t of tset){
    const E=landPow(t,en)*P[t].def;
    const val=P[t].vp*1.5+(E===0?5:3)+(G.own[t]!==side?2:0)+rnd(0,1);
    plan.push({t,E,val});
  }
  plan.sort((a,b)=>b.val-a.val);
  const used=new Set();
  const canLeave=u=>{const p=u.prov;const thr=threat[p];if(thr===0)return true;return left[p]-upow(u)>=thr*.5;};
  const assign=(u,t)=>{doMove(u,t,opts.get(u.id).get(t));used.add(u.id);left[u.from]-=upow(u);};
  const aggr=[1.25,1.1,.95][G.diff];
  for(const pl of plan){
    const cand=mine.filter(u=>!used.has(u.id)&&opts.get(u.id).get(pl.t)&&opts.get(u.id).get(pl.t).att).sort((a,b)=>upow(b)-upow(a));
    if(!cand.length)continue;
    if(pl.E===0){const c=cand.filter(canLeave);if(c.length)assign(c[c.length-1],pl.t);continue;}
    let sum=0;const pick=[];
    for(const u of cand){if(!canLeave(u))continue;pick.push(u);sum+=upow(u);left[u.prov]-=upow(u);if(sum>=pl.E*1.5)break;}
    for(const u of pick)left[u.prov]+=upow(u);
    if(sum>=pl.E*aggr)for(const u of pick)assign(u,pl.t);
  }
  const score=(p)=>-de[p]*3.5+Math.min(threat[p],24)*.3-left[p]*.12+(threat[p]>0?P[p].vp*.8:0);
  for(const u of mine){
    if(used.has(u.id)||u.moved)continue;
    const opt=opts.get(u.id);let bp=u.prov,bs=score(u.prov);
    for(const [p,i] of opt){if(i.att)continue;const s=score(p)+rnd(0,.3);if(s>bs+.3){bs=s;bp=p;}}
    if(bp!==u.prov){left[u.prov]-=upow(u);left[bp]+=upow(u);doMove(u,bp,opt.get(bp));}
  }
  for(const u of G.units.filter(u=>u.side===side&&(u.type==='air'||u.type==='nav'))){
    const r=reach(u);if(!r.size)continue;
    const sc=p=>{if(u.type==='nav'&&!P[p].coast)return -99;let s=0;for(const n of [p,...ADJ[p]])s+=landPow(n,side)*.4+landPow(n,en)*.7;return s-(u.type==='air'&&de[p]>2?5:0);};
    let bp=u.prov,bs=sc(u.prov);
    for(const [p] of r){const s=sc(p);if(s>bs+.5){bs=s;bp=p;}}
    if(bp!==u.prov)doMove(u,bp,r.get(bp));
  }
}

function tacStep(dt){

      else if(isSeen(u.side,e)||dist(u,e)<TT[u.key].vis){
        const d=dist(u,e),w=TT[u.key].w;

        else if(d<=w.rng*.85&&hasLOS(u,e)){u.path=[];u.halt=true;}

      }else{ // 시야를 잃으면 마지막 위치로
        const lp=e.lastPos&&e.lastPos[u.side];

        else if(!lp)u.order=null;

const tacLeft=()=>MOB&&VW>VH?140:0;
function tacCenter(){const pw=tacPW(),L=tacLeft();return[L+(VW-pw-L)/2,VH*(MOB?.5:.48)];}
let CAMT=null;
function tacCam(){const [cx,cy]=tacCenter();CAMT=camMat(T.c3,cx,cy,VH*1.15);return CAMT;}
function w2s(x,y,z){ // 월드(셀,높이) → 화면
  z=z||0;
  if(PREF.tac){const p=proj(CAMT,x,y,gH(x,y)+z);return p?[p[0],p[1],CAMT.f/p[2]]:null;}
  const [cx,cy]=tacCenter(),s=T.cam.s;return[cx+(x-T.cam.x)*s,cy+(y-T.cam.y)*s-z*s*.5,s];
}
function s2w(px,py){
  if(PREF.tac){if(!CAMT)return null;let g=unproj(CAMT,px,py,0);if(!g)return null;for(let i=0;i<3;i++){const g2=unproj(CAMT,px,py,gH(g[0],g[1]));if(!g2)break;g=g2;}return g;}
  const [cx,cy]=tacCenter(),s=T.cam.s;return[T.cam.x+(px-cx)/s,T.cam.y+(py-cy)/s];
}
function unitAt(px,py,mine){
  let best=null,bd=1e9;
  for(const u of T.units){if(!u.alive)continue;
    if(mine?u.side!==G.player:(u.side===G.player||!isSeen(G.player,u)))continue;
    const q=w2s(u.x,u.y,PREF.tac?.5:0);if(!q)continue;
    const r=Math.max(MOB?24:12,Math.min(34,q[2]*TT[u.key].r*(PREF.tac?1.1:1.0)));const d=Math.hypot(q[0]-px,q[1]-py);
    if(d<r&&d<bd){bd=d;best=u;}}
  return best;
}

function formation(n,tx,ty,face){
  const cols=Math.ceil(Math.sqrt(n*1.3)),sp=2.2,out=[];
  for(let i=0;i<n;i++){const r=Math.floor(i/cols),c=i%cols,cn=Math.min(cols,n-r*cols);const ox=(c-(cn-1)/2)*sp,oy=r*sp*.9;
    out.push([tx+ox*Math.cos(face)-oy*Math.sin(face),ty+ox*Math.sin(face)+oy*Math.cos(face)]);}
  return out;
}
function cmdMove(sel,tx,ty){
  const cx=sel.reduce((a,u)=>a+u.x,0)/sel.length,cy=sel.reduce((a,u)=>a+u.y,0)/sel.length;
  const face=Math.atan2(ty-cy,tx-cx)-1.5708;
  if(sel.length===1){orderMove(sel[0],tx,ty);}
  else{const pos=formation(sel.length,tx,ty,face);
    // 가까운 슬롯끼리 배정 (정렬)
    const s2=[...sel].sort((a,b)=>(a.x-b.x)*Math.cos(face)+(a.y-b.y)*Math.sin(face));
    const p2=[...pos].sort((a,b)=>(a[0]-b[0])*Math.cos(face)+(a[1]-b[1])*Math.sin(face));
    s2.forEach((u,i)=>orderMove(u,clamp(p2[i][0],1,GW-1),clamp(p2[i][1],1,GH-1)));}
  T.rings.push({x:tx,y:ty,t0:performance.now(),col:'#58a6ff'});
}
function tacCommand(px,py){ // 우클릭 / 탭 명령
  const sel=selUnits().filter(u=>u.side===G.player);if(!sel.length)return false;
  const g=s2w(px,py);if(!g)return false;
  if(T.deploy){
    if(!inDeploy(G.player,g[1]))return false;
    const pos=formation(sel.length,g[0],g[1],G.player==='COM'?0:3.1416);
    sel.forEach((u,i)=>{const [nx,ny]=pos[i];if(!inDeploy(G.player,ny)||!moveCost(clsOf(u),gc(nx,ny)))return;u.x=clamp(nx,1,GW-1);u.y=ny;u.path=[];u.order=null;});
    SFX.hit();return true;}
  const en=unitAt(px,py,false);
  if(en){for(const u of sel){if(TT[u.key].ind)orderFire(u,en.x,en.y);else orderAttack(u,en);}T.rings.push({x:en.x,y:en.y,t0:performance.now(),col:'#ff4a3d'});return true;}
  cmdMove(sel,g[0],g[1]);return true;
}

const tang=t=>Math.atan2(t[1].clientY-t[0].clientY,t[1].clientX-t[0].clientX);

function drawTac(time){
  const c=ctc;c.setTransform(DPR,0,0,DPR,0,0);c.fillStyle='#070a0c';c.fillRect(0,0,VW,VH);
  const dt=Math.min(.05,(time-(T.lastDraw||time))/1000);T.lastDraw=time;camKeys(dt);clampCam();
  const s=T.cam.s,[cx,cy]=tacCenter();
  const X=x=>cx+(x-T.cam.x)*s,Y=y=>cy+(y-T.cam.y)*s;
  c.save();const [shx,shy]=getShake();c.translate(shx,shy);
  c.imageSmoothingEnabled=true;c.imageSmoothingQuality='high';
  c.drawImage(T_TEX,X(0),Y(0),GW*s,GH*s);
  // 지형 오브젝트
  const vx0=T.cam.x-cx/s-2,vx1=T.cam.x+(VW-cx)/s+2,vy0=T.cam.y-cy/s-2,vy1=T.cam.y+(VH-cy)/s+2;
  if(s>=7){
    for(const h of T.houses){if(h.x<vx0||h.x>vx1||h.y<vy0||h.y>vy1)continue;
      c.save();c.translate(X(h.x),Y(h.y));c.rotate(h.a);const w=h.w*s,d=h.d*s;
      c.fillStyle='rgba(0,0,0,.3)';c.fillRect(-w/2+2,-d/2+3,w,d);

      c.strokeStyle='rgba(255,255,255,.18)';c.beginPath();c.moveTo(-w/2,0);c.lineTo(w/2,0);c.stroke();c.restore();}
    if(s>=9)for(const t of T.trees){if(t[0]<vx0||t[0]>vx1||t[1]<vy0||t[1]>vy1)continue;
      const r=s*.42*t[2];c.fillStyle='rgba(0,0,0,.25)';c.beginPath();c.arc(X(t[0])+r*.35,Y(t[1])+r*.45,r,0,6.28);c.fill();
      c.fillStyle=t[3]<.5?'#2c5230':'#34603a';c.beginPath();c.arc(X(t[0]),Y(t[1]),r,0,6.28);c.fill();
      c.fillStyle='rgba(150,200,120,.25)';c.beginPath();c.arc(X(t[0])-r*.25,Y(t[1])-r*.28,r*.5,0,6.28);c.fill();}
  }

    if(w.veh){c.fillStyle='rgba(60,56,50,.8)';c.save();c.translate(x,y);c.rotate(w.face);c.fillRect(-s*.7,-s*.4,s*1.4,s*.8);c.restore();}}
  // 안개
  if(T.fog&&!T.deploy){c.imageSmoothingEnabled=true;c.drawImage(T.fog,X(0),Y(0),GW*s,GH*s);}
  else if(T.deploy){/* 배치 중엔 전체 시야 */}
  // 유닛
  const order=T.units.filter(u=>u.alive&&(u.side===G.player||isSeen(G.player,u)||T.deploy&&false)).sort((a,b)=>a.y-b.y);
  for(const u of order)drawUnit2D(c,u,X(u.x),Y(u.y),s,T.selSet.has(u.id));
  drawCommon(c,false);
  drawParts(c,(x,y,z)=>{const q=w2s(x,y,z*1.6);return q?[q[0],q[1],Math.min(q[2],26)*1.35]:null;});
  c.restore();
  tacOverlay2(c);
  drawMini();
}

function drawTriT(c,img,s0,s1,s2,t0,t1,t2){
  const cx=(s0[0]+s1[0]+s2[0])/3,cy=(s0[1]+s1[1]+s2[1])/3;
  const ex=q=>{const dx=q[0]-cx,dy=q[1]-cy,L=Math.hypot(dx,dy)||1;return[q[0]+dx/L*.9,q[1]+dy/L*.9];};
  const a=ex(s0),b=ex(s1),d=ex(s2);
  const det=(t1[0]-t0[0])*(t2[1]-t0[1])-(t2[0]-t0[0])*(t1[1]-t0[1]);if(Math.abs(det)<1e-6)return;
  const A=((s1[0]-s0[0])*(t2[1]-t0[1])-(s2[0]-s0[0])*(t1[1]-t0[1]))/det;
  const B=((s1[1]-s0[1])*(t2[1]-t0[1])-(s2[1]-s0[1])*(t1[1]-t0[1]))/det;
  const Cc=((s2[0]-s0[0])*(t1[0]-t0[0])-(s1[0]-s0[0])*(t2[0]-t0[0]))/det;
  const D=((s2[1]-s0[1])*(t1[0]-t0[0])-(s1[1]-s0[1])*(t2[0]-t0[0]))/det;
  const E=s0[0]-A*t0[0]-Cc*t0[1],Fv=s0[1]-B*t0[0]-D*t0[1];
  c.save();c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.lineTo(d[0],d[1]);c.closePath();c.clip();
  c.transform(A,B,Cc,D,E,Fv);
  const sx=Math.max(0,Math.min(t0[0],t1[0],t2[0])-1),sy=Math.max(0,Math.min(t0[1],t1[1],t2[1])-1);
  const ex2=Math.min(img.width,Math.max(t0[0],t1[0],t2[0])+1),ey2=Math.min(img.height,Math.max(t0[1],t1[1],t2[1])+1);
  c.drawImage(img,sx,sy,ex2-sx,ey2-sy,sx,sy,ex2-sx,ey2-sy);
  c.restore();
}
function tacModel2(F,M,u){

  if(k==='INF'||k==='MAR'){const kd=k==='MAR'?'mar':'inf';const offs=[[-.25,-.4],[.2,0],[-.25,.4],[.35,-.35],[-.5,.1],[.1,.5]];for(let i=0;i<Math.min(offs.length,n+1);i++)soldier3(F,M,offs[i][0],offs[i][1],u.fac,kd);}

  else if(k==='MG'){soldier3(F,M,0,-.2,u.fac,'inf');soldier3(F,M,-.2,.3,u.fac,'inf');beam(F,M,[.1,-.2,.22],[.62,-.2,.26],.03,.03,[30,32,34]);box(F,M,.1,-.2,.14,.05,.14,.07,[40,42,44]);}

  else if(k==='RECON'){const vc=VEHC[u.side];box(F,M,0,0,.18,.36,.2,.1,vc);box(F,M,-.05,0,.34,.2,.17,.07,dk(vc,.85));for(const sx of [-.24,.24])for(const sy of [-.22,.22])box(F,M,sx,sy,.08,.08,.03,.08,[30,30,32]);}
  else if(tt.sym==='arm'){tank3(F,M,k==='SU76'?'M24':k,u.side);}
  else if(k==='KAT')rocket3(F,M,u.side);
  else if(k==='ATG'||k==='A105'||k==='A122'||k==='A155')gun3(F,M,k==='A155'?'A122':k,u.side);
  else gun3(F,M,'A105',u.side);
}

    if(!a||!b||!d||!e)continue;

  for(const h of T.houses){if(Math.abs(h.x-tx)>lim||Math.abs(h.y-ty)>lim)continue;
    const M=mkM(h.x,h.y,gH(h.x,h.y),h.a,1.1),wall=h.roof<.4?[190,176,150]:[176,170,160],roofc=h.roof<.4?[132,70,52]:h.roof<.75?[96,100,106]:[150,124,88];
    box(F,M,0,0,h.h*.5,h.w*.5,h.d*.5,h.h*.5,wall);prism(F,M,0,0,h.h,h.h+.32,h.w*.78,.04,4,roofc,.785);}

    for(const t of T.trees){if((n++)%step)continue;if(Math.abs(t[0]-tx)>lim||Math.abs(t[1]-ty)>lim)continue;
      const M=mkM(t[0],t[1],gH(t[0],t[1]),0,1);const k=t[2];
      prism(F,M,0,0,0,.4*k,.07,.06,4,[84,60,38],0);prism(F,M,0,0,.25*k,1.5*k,.6*k,.05,6,t[3]<.5?[40,84,46]:[52,100,56],0);}}

  const FU=[],halos=[];

    const bob=u.moving&&TT[u.key].cls==='inf'?Math.abs(Math.sin(time/90+u.id))*.05:0;

    if(TT[u.key].cls==='inf')for(let k=n0;k<FU.length;k++){const f=FU[k];f.col=[Math.min(255,f.col[0]*1.3+18),Math.min(255,f.col[1]*1.3+18),Math.min(255,f.col[2]*1.3+14)];}

  c.restore();
  tacOverlay2(c);
  drawMini();

let SHK={t0:0,m:0};
function shake(m){const now=performance.now();SHK.m=Math.max(SHK.m*Math.max(0,1-(now-SHK.t0)/380),m);SHK.t0=now;}
function getShake(){const t=(performance.now()-SHK.t0)/380;if(t>=1||SHK.m<=0)return[0,0];const a=SHK.m*(1-t);return[(Math.random()-.5)*2*a,(Math.random()-.5)*2*a];}
function drawParts(c,toS){
  const now=performance.now();
  for(let i=PART.length-1;i>=0;i--)if(now-PART[i].t0>PART[i].life)PART.splice(i,1);
  c.save();
  for(const p of PART){
    const t=(now-p.t0)/1000,f=(now-p.t0)/p.life;
    const x=p.x+p.vx*t,y=p.y+p.vy*t;let z=p.z+p.vz*t+.5*p.g*t*t;if(z<0)z=0;
    const q=toS(x,y,z);if(!q)continue;
    const sz=Math.max(.9,p.s*(1+p.gr*f)*q[2]),al=p.a*Math.pow(Math.max(0,1-f),1.15);

    if(p.k==='deb')c.fillRect(q[0]-sz/2,q[1]-sz/2,sz,sz);

  }

}

function calcSupply(){
  const S={UN:new Set(),COM:new Set()};
  for(const side of ['UN','COM']){
    const q=[];for(const k of SUPSRC[side]){const p=PK[k];if(G.own[p]===side){S[side].add(p);q.push(p);}}
    while(q.length){const a=q.shift();for(const b of ADJ[a])if(G.own[b]===side&&!S[side].has(b)){S[side].add(b);q.push(b);}}
  }

  return false;
}

function flankOf(a,d){
  const dx=a.x-d.x,dy=a.y-d.y;if(Math.hypot(dx,dy)<.01)return 0;
  let df=Math.atan2(dy,dx)-(d.face||0);df=Math.abs(((df+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI);
  return df<1.05?0:df>2.1?2:1;
}

  text:'협상이 마지막 조율 단계에 들어갔습니다. 정전 시 현재의 점령선이 곧 군사분계선이 되므로 양측 모두 마지막 한 뼘의 땅을 위해 총력전을 폅니다.',
  run(){return['정전 협정 시 지배 지역에 따라 승점이 결정됩니다'];}}
];
async function runEvents(){
  const newObjs=objsStarting();
  const evs=EVENTS.filter(e=>e.t===G.turn&&(!e.cond||e.cond()));
  if(!evs.length&&!newObjs.length)return;
  let first=true;
  for(const ev of evs){
    SFX.event();
    const asked=ev.ask&&G.player===ev.ask.side;
    const objHtml=first&&newObjs.length?'<h4>🎯 새 목표</h4><ul>'+newObjs.map(o=>`<li>${objLine(o)}</li>`).join('')+'</ul>':'';
    first=false;
    let go=true;
    if(asked){
      go=await modal(`<h2>${ev.ic} ${ev.title}</h2><p>${ev.text}</p><p style="color:var(--gold);margin-top:6px">${ev.ask.q}</p>${objHtml}`,[{t:ev.ask.yes,v:true,cls:'pri'},{t:ev.ask.no,v:false}]);
      const lines=ev.run(go);lines.forEach(l=>glog(`[사건] ${l}`,'sys'));
    }else{
      if(ev.ask)go=true; // AI는 항상 감행
      const lines=ev.run(go);
      await modal(`<h2>${ev.ic} ${ev.title}</h2><p>${ev.text}</p>${lines.length?'<h4>영향</h4><ul>'+lines.map(l=>`<li>${l}</li>`).join('')+'</ul>':''}${objHtml}`,[{t:'확인',v:1,cls:'pri'}]);
      lines.forEach(l=>glog(`[사건] ${l}`,'sys'));
    }
  }
  if(first&&newObjs.length){
    await modal('<h2>🎯 새 목표</h2><ul>'+newObjs.map(o=>`<li>${objLine(o)}</li>`).join('')+'</ul>',[{t:'확인',v:1,cls:'pri'}]);
  }
  for(const o of newObjs)glog(`[목표] ${o.t} — ${o.end}턴 말 결산`,'sys');
  updateHUD();renderPanel();
}

// ============== 렌더 루프 ==============
let lastT=0;
function frame(t){
  const dt=Math.min(.1,(t-lastT)/1000||0);lastT=t;
  if(G){
    if(TAC.on&&T){tacUpdate(dt*T.speed);T.uiT-=dt;if(T.uiT<=0){T.uiT=.25;tacRefresh();}if(PREF.tac)drawTac3D(t);else drawTac(t);}
    else if(!TAC.on){if(PREF.map)drawMap3D(t);else drawMap(t);}
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);

// ============== 시작 ==============
async function boot(){
  resize();
  G=null;
  const side=await modal(`<h2>38°선 — 6·25 전쟁</h2><p style="color:var(--dim);font-size:13px">1950년 6월 25일부터 1953년 7월 27일까지, 38턴(월 단위)의 전략 시뮬레이션.<br>전략 지도에서 부대를 이동시키고, 양측이 한 번씩 이동한 뒤 교전 지역을 골라 실시간(일시정지 가능) 세부 전투를 직접 지휘합니다.</p>
   <div class="two"><div><b class="un">유엔군</b><br>국군 · 미군 · 유엔군<br><small style="color:var(--dim)">초기엔 열세, 해·공군 우위와 증원으로 반격. 상륙작전 가능.</small></div><div><b class="com">공산군</b><br>북한군 · 중공군 · 소련군<br><small style="color:var(--dim)">초기 기습 공세, 중공군 개입(1950.10)과 소련 MiG 지원.</small></div></div>`,
   [{t:'유엔군으로 플레이',v:'UN',cls:'blue'},{t:'공산군으로 플레이',v:'COM',cls:'pri'}]);
  const diff=await modal('<h2>난이도</h2><p style="color:var(--dim);font-size:13px">컴퓨터의 증원 규모와 공격성에 영향을 줍니다.</p>',[{t:'쉬움',v:0},{t:'보통',v:1,cls:'blue'},{t:'어려움',v:2,cls:'pri'}]);
  newGame(side,diff);
  G.selProv=side==='UN'?PK.se:PK.hbk;
  updateHUD();renderPanel();renderLog();
  await gameLoop();
}
requestAnimationFrame(frame);
boot();
</script>
