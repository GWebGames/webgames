<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1424">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>스매시 코트 · 전국 배드민턴 선수권</title>
<style>
:root{--bg:#0b1424;--card:#13233b;--card2:#1b3052;--ac:#3ee6a8;--ac2:#4aa8ff;--hot:#ff5d73;--tx:#eaf2ff;--mut:#8fa6c8;--gold:#ffd23f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-touch-callout:none;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;overflow:hidden;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;display:none;-webkit-overflow-scrolling:touch}
#ui.on{display:block}
.wrap{max-width:760px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
.glass{background:rgba(11,20,36,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(120,170,255,.16);border-radius:18px;padding:16px}
h1{font-size:44px;line-height:1;margin:6px 0 4px;letter-spacing:-1px;font-weight:900;background:linear-gradient(90deg,#3ee6a8,#4aa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 10px;font-size:20px}
h3{margin:14px 0 8px;font-size:14px;color:var(--mut);font-weight:700;letter-spacing:.5px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.btn{display:block;width:100%;padding:15px 16px;margin:9px 0;border:1px solid rgba(120,170,255,.25);border-radius:14px;background:var(--card2);color:var(--tx);font-size:17px;font-weight:700;text-align:left;cursor:pointer;transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn:hover{background:#244070}
.btn.pri{background:linear-gradient(90deg,#1fb98a,#2d86e0);border-color:transparent;text-align:center}
.btn.pri:hover{filter:brightness(1.1)}
.btn small{display:block;font-weight:400;color:var(--mut);font-size:12.5px;margin-top:3px}
.btn.dis{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1;min-width:90px;text-align:center;margin:4px 0}
.chip{padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid rgba(120,170,255,.2);color:var(--tx);font-size:14px;font-weight:700;cursor:pointer}
.chip.on{background:var(--ac);color:#04281d;border-color:transparent}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:4px 0 8px}
.cc{position:relative;background:var(--card);border:2px solid transparent;border-radius:14px;padding:10px;cursor:pointer;min-width:0}
.cc.sel{border-color:var(--col,#fff)}
.cc b{display:block;font-size:15px}.cc small{color:var(--mut);font-size:12px}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#08121f;font-size:18px;float:left;margin-right:9px}
.br{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);margin-top:3px;clear:both}
.br span{width:38px;flex:none}.br i{flex:1;height:6px;background:#0b1424;border-radius:4px;overflow:hidden}.br u{display:block;height:100%;background:linear-gradient(90deg,#3ee6a8,#4aa8ff)}.br em{width:22px;text-align:right;font-style:normal;color:var(--tx);font-weight:700}
.br.c u{background:#b36bff}.br.p u{background:#ff6a5a}.br.a u{background:#ffd23f}
.br button{width:28px;height:24px;border:0;border-radius:7px;background:var(--ac);color:#04281d;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.teams .t{background:rgba(255,255,255,.04);border-radius:14px;padding:10px}
.teams .t h4{margin:0 0 8px;font-size:13px;color:var(--mut)}
.teams .cc{margin-bottom:8px}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;background:#0b1424;color:var(--ac);margin-left:4px;vertical-align:middle}
.tag.h{color:var(--gold)}
input[type=text]{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(120,170,255,.3);background:#0b1424;color:var(--tx);font-size:18px;-webkit-user-select:text;user-select:text;touch-action:auto}
.code{font-size:44px;font-weight:900;letter-spacing:10px;text-align:center;color:var(--ac);margin:8px 0}
.list{padding-left:18px;color:#cfe0ff;font-size:14px;line-height:1.7;margin:6px 0}
.rd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--card);margin:6px 0;font-size:15px}
.rd.cur{outline:2px solid var(--ac)}.rd.done{opacity:.55}.rd.lock{opacity:.4}
.rd b{flex:1}.rd small{color:var(--mut)}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:none;pointer-events:none;padding:max(6px,env(safe-area-inset-top)) 8px 0}
#hud.on{display:block}
.sb{display:flex;align-items:stretch;justify-content:center;gap:6px;max-width:640px;margin:0 auto}
.tm{flex:1;display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(8,16,30,.78);border-radius:12px;padding:5px 10px;border:1px solid rgba(255,255,255,.1);min-width:0}
.tm.b{flex-direction:row-reverse}
.tm .nm{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .sv{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin:0 4px;vertical-align:middle;visibility:hidden}
.tm .sv.on{visibility:visible}
.tm .sc{font-size:28px;font-weight:900;line-height:1;min-width:34px;text-align:center}
.mid{width:84px;flex:none;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:center;background:rgba(8,16,30,.6);border-radius:12px}
#pauseBtn{position:fixed;top:max(64px,calc(env(safe-area-inset-top) + 58px));right:8px;z-index:6;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(8,16,30,.7);color:#fff;font-size:16px;display:none;cursor:pointer}
#pauseBtn.on{display:block}
#badge{position:fixed;left:50%;top:max(66px,calc(env(safe-area-inset-top) + 60px));transform:translateX(-50%);z-index:6;font-weight:900;font-size:13px;letter-spacing:1px;padding:3px 12px;border-radius:999px;background:linear-gradient(90deg,#ff5d73,#ff9a3c);color:#fff;display:none;pointer-events:none;animation:bl2 1s infinite}
@keyframes bl2{50%{filter:brightness(1.4)}}
#rallyc{position:fixed;left:50%;top:max(90px,calc(env(safe-area-inset-top) + 84px));transform:translateX(-50%);z-index:6;font-weight:800;font-size:14px;color:#fff;text-shadow:0 1px 6px #000;display:none;pointer-events:none}
#dlgAv{position:absolute;left:14px;top:-34px;width:64px;height:64px;border-radius:50%;border:3px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;color:#08121f;box-shadow:0 4px 14px #0008}
.stt{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}.stt td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.08)}.stt td:nth-child(2){color:var(--mut);text-align:center}.stt td:nth-child(1){text-align:right;font-weight:800}.stt td:nth-child(3){text-align:left;font-weight:800}
.ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--card);margin:6px 0}.ach.off{opacity:.45}.ach i{font-size:22px;font-style:normal}
#msg{position:fixed;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:46px;z-index:7;pointer-events:none;opacity:0;text-shadow:0 3px 14px rgba(0,0,0,.7);letter-spacing:-1px}
#msg.show{animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1.12)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
#msg small{display:block;font-size:17px;font-weight:700;margin-top:4px;color:#dff}
#hint{position:fixed;left:0;right:0;bottom:max(215px,calc(env(safe-area-inset-bottom) + 205px));text-align:center;font-size:13px;color:#fff;z-index:6;pointer-events:none;text-shadow:0 1px 6px #000;display:none}
body.pc #hint{bottom:18px}
body.land #hint{bottom:10px}
body.land #joy{top:52px}
body.land #btns{width:300px}
/* controls */
#joy{position:fixed;left:0;top:70px;bottom:0;width:56%;z-index:4;display:none;touch-action:none}
#joyBase,#joyKnob{position:fixed;border-radius:50%;pointer-events:none;display:none}
#joyBase{width:116px;height:116px;border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.07);z-index:4}
#joyKnob{width:52px;height:52px;background:rgba(255,255,255,.45);z-index:4}
#btns{position:fixed;right:0;bottom:0;width:260px;height:260px;z-index:5;display:none;pointer-events:none}
.ab{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(20,40,70,.55);color:#fff;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;font-size:15px;backdrop-filter:blur(3px)}
.ab small{font-size:10px;font-weight:600;opacity:.75}
.ab.act{background:rgba(62,230,168,.6);transform:scale(.93)}
#bS{width:96px;height:96px;right:max(18px,env(safe-area-inset-right));bottom:max(26px,env(safe-area-inset-bottom));border-color:#ff6a5a}
#bC{width:76px;height:76px;right:calc(max(18px,env(safe-area-inset-right)) + 108px);bottom:max(20px,env(safe-area-inset-bottom));border-color:#4aa8ff}
#bD{width:76px;height:76px;right:max(24px,env(safe-area-inset-right));bottom:calc(max(26px,env(safe-area-inset-bottom)) + 108px);border-color:#ffd23f}
#bL{width:68px;height:68px;right:calc(max(18px,env(safe-area-inset-right)) + 118px);bottom:calc(max(26px,env(safe-area-inset-bottom)) + 100px);border-color:#c88bff;font-size:13px}
input[type=range]{width:100%;height:34px;touch-action:auto;accent-color:#3ee6a8}
body.in-match #joy,body.in-match #btns{display:block}
body.pc #joy{display:none!important}
body.pc #btns{width:460px;height:140px}
body.pc #bL{width:62px;height:62px;right:252px;bottom:20px}
body.pc #bS{width:74px;height:74px;right:20px;bottom:20px}
body.pc #bC{width:62px;height:62px;right:104px;bottom:20px}
body.pc #bD{width:62px;height:62px;right:178px;bottom:20px}
/* dialog */
#dlg{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.45);touch-action:manipulation}
#dlg.on{display:block}
#dlgBox{position:absolute;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));width:min(720px,calc(100% - 24px));background:rgba(8,16,30,.95);border:1px solid rgba(120,170,255,.3);border-radius:18px;padding:16px 18px 20px;min-height:140px}
#dlgName{margin-left:70px;display:inline-block;font-weight:900;padding:3px 12px;border-radius:8px;background:#fff;color:#08121f;font-size:14px;margin-bottom:8px}
#dlgTx{font-size:17px;line-height:1.6;min-height:56px}
#dlgNx{position:absolute;right:16px;bottom:8px;color:var(--ac);font-size:13px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.7);display:none;touch-action:pan-y;overflow:auto}
#modal.on{display:block}
#modal .box{max-width:720px;margin:max(20px,env(safe-area-inset-top)) auto 30px;padding:16px;background:#0f1d33;border-radius:18px;border:1px solid rgba(120,170,255,.25)}
body.in-match #toast{bottom:auto!important;top:112px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;display:none}
</style>

<body>
<canvas id="cv"></canvas>
<div id="hud"><div class="sb">
 <div class="tm a"><div class="nm" id="nmA"></div><div><span class="sv" id="svA"></span><span class="sc" id="scA">0</span></div></div>
 <div class="mid"><div id="midT">11점</div><div id="midS"></div></div>
 <div class="tm b"><div class="nm" id="nmB"></div><div><span class="sv" id="svB"></span><span class="sc" id="scB">0</span></div></div>
</div></div>
<div id="badge"></div><div id="rallyc"></div>
<button id="pauseBtn">❚❚</button>
<div id="msg"></div><div id="hint"></div>
<div id="joy"></div><div id="joyBase"></div><div id="joyKnob"></div>
<div id="btns"><div class="ab" id="bC" data-s="clear">클리어<small>K</small></div><div class="ab" id="bD" data-s="drop">드롭<small>L</small></div><div class="ab" id="bL" data-s="slide">슬라이딩<small>Shift</small></div><div class="ab" id="bS" data-s="smash">스매시<small>J / Space</small></div></div>
<div id="ui" class="on"></div>
<div id="dlg"><div id="dlgBox"><div id="dlgAv"></div><div id="dlgName"></div><div id="dlgTx"></div><div id="dlgNx">탭하여 계속 ▶</div></div></div>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
/* =====================================================================
   스매시 코트 · 전국 배드민턴 선수권  (single-file)
   ===================================================================== */
//==SIM START==
const W=6.1,L=13.4,NET=6.7,NETH=1.55,CX=3.05,EXP=1.7;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const nz=v=>clamp((v-30)/70,0,1);
const rnd=(a,b)=>a+Math.random()*(b-a);
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
/* 스탯 → 실제 효과 */
const stat={
  speed:a=>lerp(4.1,6.4,nz(a)),      // 이동속도
  accel:a=>lerp(20,40,nz(a)),        // 가속
  reach:a=>lerp(1.0,1.42,nz(a)),     // 라켓 닿는 범위
  lunge:a=>lerp(0.45,0.95,nz(a)),    // 런지(다이빙) 추가 범위
  sigma:c=>lerp(1.0,0.12,nz(c)),     // 샷 오차
  clearCap:p=>lerp(3.8,6.1,nz(p)),   // 클리어 최대 비거리(네트로부터)
  smashT:p=>lerp(0.74,0.42,nz(p)),   // 스매시 체공시간(작을수록 빠름)
  clearT:p=>lerp(1.6,1.2,nz(p))
};
function pathAt(sh,t){
  const s=clamp(t/sh.T,0,1),p=1-Math.pow(1-s,EXP);
  return {x:sh.sx+(sh.tx-sh.sx)*p,y:sh.sy+(sh.ty-sh.sy)*p,z:Math.max(0,sh.sz*(1-s)+4*sh.H*s*(1-s))};
}
function startSlide(p,dx,dy){
  if(p.slideCD>0||p.slideT>0)return false;const m=Math.hypot(dx,dy);if(m<.01)return false;
  const a=p.ch.a,sp=stat.speed(a)*lerp(2.0,2.6,nz(a));
  p.sdx=dx/m;p.sdy=dy/m;p.vx=p.sdx*sp;p.vy=p.sdy*sp;p.slideT=.3;p.slideCD=lerp(1.7,1.0,nz(a));p.buf=null;return true;
}
function guidePos(v,p){
  const sh=v.sh,dir=p.team===0?-1:1;
  if(v.mode==='S')return {x:CX+(sh.x-CX)*.1,y:NET-dir*3.9};
  const mate=v.players.find(q=>q.team===p.team&&q!==p);
  if(!mate)return {x:CX,y:NET-dir*3.9};
  const lt=sh.lastType||'clear';
  // 정석: 공격(스매시·드롭을 쳤거나, 상대가 올려줬을 때)=톱앤백(앞뒤) / 수비=사이드바이사이드(좌우)
  const attack=(sh.team===p.team)?(lt!=='clear'):(lt==='clear'||lt==='drop');
  if(attack){
    const dnP=Math.abs(p.y-NET),dnM=Math.abs(mate.y-NET);
    const rear=dnP>dnM||(dnP===dnM&&p.slot>mate.slot);
    if(rear)return {x:CX+(sh.x-CX)*.3,y:NET-dir*4.8,form:'back'};
    return {x:CX+(mate.x<CX?1:-1)*.9,y:NET-dir*2.3,form:'front'};
  }
  const lane=(p.x<mate.x||(p.x===mate.x&&p.slot<mate.slot))?-1:1;
  return {x:CX+lane*1.5+(sh.x-CX)*.1,y:NET-dir*3.9,form:'side'};
}
function movePlayer(p,dt){
  p.slideCD=Math.max(0,(p.slideCD||0)-dt);
  if(p.slideT>0){
    p.slideT-=dt;const f=Math.max(0,p.slideT/.3);const sp=stat.speed(p.ch.a)*lerp(2.0,2.6,nz(p.ch.a));
    p.vx=p.sdx*sp*(.25+.75*f);p.vy=p.sdy*sp*(.25+.75*f);p.x+=p.vx*dt;p.y+=p.vy*dt;clampPlayer(p);
    if(p.slideT<=0){p.slideT=0;p.rec=.32;}return;
  }
  const a=p.ch.a,spd=stat.speed(a)*(p.rec>0?0.68:1);
  let mx=p.mx,my=p.my;const m=Math.hypot(mx,my);if(m>1){mx/=m;my/=m;}
  const ax=mx*spd,ay=my*spd,mxv=stat.accel(a)*dt;
  let dx=ax-p.vx,dy=ay-p.vy;const d=Math.hypot(dx,dy);if(d>mxv){dx*=mxv/d;dy*=mxv/d;}
  p.vx+=dx;p.vy+=dy;p.x+=p.vx*dt;p.y+=p.vy*dt;clampPlayer(p);
}
function clampPlayer(p){
  p.x=clamp(p.x,-0.9,W+0.9);
  if(p.team===0)p.y=clamp(p.y,NET+0.4,L+1.0);else p.y=clamp(p.y,-1.0,NET-0.4);
}
class Game{
  constructor(cfg,hooks){
    this.mode=cfg.mode;this.points=cfg.points;this.cap=cfg.points+(cfg.points>=21?9:4);
    this.hooks=hooks||{};this.events=[];this.time=0;this.pt=0;this.sc=[0,0];
    this.serving=cfg.firstServe!=null?cfg.firstServe:(Math.random()<.5?0:1);
    this.players=[];
    cfg.slots.forEach((s,i)=>{if(!s)return;const t=i<2?0:1;
      this.players.push({slot:i,team:t,ch:s.ch,name:s.name||s.ch.name,ctrl:s.ctrl,skill:s.skill==null?.5:s.skill,
        x:CX,y:t===0?L-2:2,vx:0,vy:0,mx:0,my:0,side:i%2,rec:0,swing:0,swingType:'',buf:null,tx:CX,ty:0,slideT:0,slideCD:0,sdx:0,sdy:0,
        chaser:false,eta:99,_it:1,
        ai:{sw:rnd(.8,1.4),react:lerp(.42,.1,s.skill==null?.5:s.skill)+rnd(0,.06),it:null}});});
    this.sh={mode:'held',x:CX,y:L/2,z:1,sx:0,sy:0,sz:0,tx:0,ty:0,T:1,t:0,H:0,team:0,vz:0,isServe:false,sign:1,lastType:'clear',hitter:-1};
    this.stats=[{sm:0,sl:0},{sm:0,sl:0}];this.maxRally=0;this.deficit=[0,0];
    this.leave=[false,false];this.phase='intro';this.server=null;this.receiver=null;this.winner=-1;this.rallyHits=0;
    this.setupServe(true);
  }
  team(t){return this.players.filter(p=>p.team===t);}
  emit(ev){this.events.push(ev);if(this.hooks.onEvent)this.hooks.onEvent(ev);}
  hw(){return this.mode==='S'?2.59:3.05;}
  inCourt(x,y,m){m=m||0;const h=this.hw()+m;return Math.abs(x-CX)<=h&&y>=-m&&y<=L+m;}
  inBox(x,y,m){m=m||0;const h=this.hw()+m,dnL=(this.mode==='S'?6.7:5.94)+m,dn=Math.abs(y-NET);
    const xr=this.sh.sign>0?(x>=CX-m&&x<=CX+h):(x<=CX+m&&x>=CX-h);return xr&&dn>=1.98-m&&dn<=dnL;}
  setupServe(snap){
    const sv=this.serving,rv=1-sv,ss=this.sc[sv]%2,tp=this.team(sv),rp=this.team(rv);
    if(this.mode==='S'){tp.forEach(p=>p.side=ss);rp.forEach(p=>p.side=ss);}
    this.server=tp.find(p=>p.side===ss)||tp[0];this.receiver=rp.find(p=>p.side===ss)||rp[0];
    for(const p of this.players){
      const dir=p.team===0?-1:1,rs=p.team===0?1:-1;let off,dn;
      if(p===this.server){off=.85;dn=2.3;}
      else if(p.team===sv){off=1.5;dn=4.2;}
      else if(p===this.receiver){off=.9;dn=this.mode==='S'?3.6:3.0;}
      else{off=1.5;dn=2.3;}
      p.tx=CX+rs*(p.side===0?1:-1)*off;p.ty=NET-dir*dn;
      p.buf=null;p.chaser=false;p.vx=p.vy=p.mx=p.my=0;p.slideT=0;
      if(snap){p.x=p.tx;p.y=p.ty;}
    }
    this.phase=snap?'intro':'reset';this.pt=0;this.leave=[false,false];this.sh.mode='held';this.rallyHits=0;
    this.holdShuttle();
  }
  holdShuttle(){const s=this.server,sh=this.sh;if(!s)return;const dir=s.team===0?-1:1;sh.x=s.x+0.28;sh.y=s.y+dir*0.35;sh.z=0.95;sh.mode='held';sh.team=s.team;}
  press(slot,type,aim){
    const p=this.players.find(q=>q.slot===slot);if(!p)return;
    p.swing=.25;p.swingType=type;this.emit({e:'sw',slot});
    if(this.phase==='serve'){if(p===this.server&&this.pt>.3)this.doServe(p,type);return;}
    p.buf={type,aim:aim||{x:null,dd:0},age:0};
  }
  doServe(p,type){
    const ch=p.ch,sh=this.sh,dir=p.team===0?-1:1,rec=this.receiver;
    const rs=rec.team===0?1:-1;sh.sign=rs*(rec.side===0?1:-1);
    const S=this.mode==='S',dnL=S?6.7:5.94,sig=stat.sigma(ch.c)*.6;
    let dn,T,H,minClear=NETH+.15;
    if(type==='drop'){dn=2.55;T=.8;H=1.4;}
    else if(type==='smash'){dn=4.3;T=.62;H=.6;minClear=NETH+.1;}
    else{dn=dnL-.5;T=1.35;H=6.2;}
    const xt=CX+sh.sign*(type==='clear'?.7:.95);
    sh.sx=sh.x;sh.sy=sh.y;sh.sz=sh.z;
    sh.tx=xt+gauss()*sig*.9;
    const dnT=dn+gauss()*sig*.6;
    sh.ty=NET+dir*dnT;this.solveArc(sh,minClear+gauss()*sig*.08,H,T);
    sh.t=0;sh.team=p.team;sh.mode='fly';sh.isServe=true;this.phase='rally';this.pt=0;this.rallyHits=1;
    this.afterLaunch(p,type,false);
  }
  solveArc(sh,clear,H,T){
    const f=(NET-sh.sy)/(sh.ty-sh.sy);
    if(f>0&&f<1){const s=1-Math.pow(1-f,1/EXP);const need=(clear-sh.sz*(1-s))/(4*s*(1-s));H=Math.max(H,Math.min(need,10));}
    sh.H=H;sh.T=T;
  }
  afterLaunch(p,type,lunge){
    const sh=this.sh;sh.lastType=type;sh.hitter=p.slot;if(type==='smash'&&!sh.isServe)this.stats[p.team].sm++;
    const out=sh.isServe?!this.inBox(sh.tx,sh.ty,.3):!this.inCourt(sh.tx,sh.ty,.3);
    const o=1-p.team,ot=this.team(o);const sk=ot.reduce((a,q)=>a+q.skill,0)/(ot.length||1);
    this.leave[o]=out&&Math.random()<.4+.55*sk;this.leave[p.team]=false;
    this.emit({e:'hit',slot:p.slot,type,x:sh.sx,y:sh.sy,z:sh.sz,lunge:!!lunge,serve:sh.isServe,
      fl:[sh.sx,sh.sy,sh.sz,sh.tx,sh.ty,sh.T,sh.H]});
  }
  planShot(p,type,aim,lunge,q){
    const ch=p.ch,sh=this.sh,dir=p.team===0?-1:1,hx=sh.x,hy=sh.y,hz=sh.z,hw=this.hw();
    const dn=Math.abs(hy-NET);
    let sig=stat.sigma(ch.c)*(1+(1-q)*.9+(lunge?.6:0));
    let T,H,dt,minClear=NETH+.14;
    let ax=aim.x;
    if(ax==null){ // 자동 조준: 상대 반대쪽으로
      const ops=this.team(1-p.team);const mx=ops.reduce((a,o)=>a+o.x,0)/(ops.length||1);
      ax=(mx<CX?CX+rnd(.3,.85)*hw:CX-rnd(.3,.85)*hw);
    }
    ax=clamp(ax,CX-hw+.45,CX+hw-.45);
    const dist=Math.hypot(ax-hx,NET+dir*3-hy);
    if(type==='smash'){
      const sf=clamp((hz-1.1)/1.3,0,1);
      sig*=1.15*(1+(1-sf));
      dt=3.5+aim.dd*1.5;T=stat.smashT(ch.p)*(1+(1-sf)*.7)*clamp(dist/6,.8,1.1);H=0;minClear=NETH+.08;
    }else if(type==='clear'){
      const cap=Math.min(stat.clearCap(ch.p),6.7-.6);
      dt=cap+aim.dd*.3;T=stat.clearT(ch.p)*clamp(dist/9,.72,1.1);H=5.5;
    }else{
      dt=(dn<2.6?.7+aim.dd*.3:1.15+aim.dd*.7);T=.95*clamp(dist/6,.62,1.1);H=2.0;minClear=NETH+.17;
    }
    dt=clamp(dt,.3,6.4);
    sh.sx=hx;sh.sy=hy;sh.sz=hz;
    sh.tx=ax+gauss()*sig*.7;
    sh.ty=NET+dir*Math.max(.15,dt+gauss()*sig*.75);
    this.solveArc(sh,minClear+gauss()*sig*.1,H,T);
  }
  onSide(team,y){return team===0?y>=NET-.25:y<=NET+.25;}
  tryHit(p){
    const sh=this.sh,b=p.buf;if(!b)return;
    if(this.phase!=='rally'||sh.mode!=='fly'||sh.team===p.team||!this.onSide(p.team,sh.y))return;
    if(sh.z>3.0||sh.z<.08)return;
    const dist=Math.hypot(sh.x-p.x,sh.y-p.y),R=stat.reach(p.ch.a),Lg=stat.lunge(p.ch.a);
    let lunge=false,q;const Rs=R+(p.slideT>0?.5:0);
    if(dist<=Rs)q=clamp(1-.5*dist/R,.4,1);
    else if(dist<=R+Lg&&b.age>=.1){lunge=true;q=.35;}
    else return;
    this.planShot(p,b.type,b.aim,lunge,q);
    sh.t=0;sh.team=p.team;sh.isServe=false;this.rallyHits++;
    if(lunge){p.x+=(sh.sx-p.x)*.5;p.y+=(sh.sy-p.y)*.5;clampPlayer(p);}
    p.rec=lunge?.3:.14;p.swing=.25;p.buf=null;
    this.afterLaunch(p,b.type,lunge);
  }
  intercept(p){
    const sh=this.sh,spd=stat.speed(p.ch.a),R=stat.reach(p.ch.a);
    for(let s=clamp(sh.t/sh.T,0,1)+.03;s<=1.0001;s+=.03){
      const q=pathAt(sh,s*sh.T);
      if(q.z>2.7||!this.onSide(p.team,q.y))continue;
      const dist=Math.hypot(q.x-p.x,q.y-p.y),need=Math.max(0,dist-R*.75)/spd+.04,avail=s*sh.T-sh.t;
      if(need<=avail)return {x:q.x,y:q.y,z:q.z,eta:avail,ok:true};
    }
    const dist=Math.hypot(sh.tx-p.x,sh.ty-p.y);
    return {x:sh.tx,y:sh.ty,z:0,eta:dist/spd,ok:false};
  }
  assign(dt){
    const sh=this.sh;
    for(const team of [0,1]){
      const tp=this.team(team),inc=this.phase==='rally'&&sh.mode==='fly'&&sh.team!==team;
      if(!inc){tp.forEach(p=>{p.chaser=false;});continue;}
      for(const p of tp){p._it+=dt;if(p._it>.08||!p.ai.it){p._it=0;p.ai.it=this.intercept(p);p.eta=p.ai.it.ok?p.ai.it.eta:50+p.ai.it.eta;}}
      let best=null,bs=1e9;
      for(const p of tp){const sc=p.eta-(p.ctrl!=='ai'?.15:0)-(p.chaser?.2:0);if(sc<bs){bs=sc;best=p;}}
      if(best.ctrl==='ai'){const hm=tp.find(p=>p.ctrl!=='ai'&&p.ai.it&&p.ai.it.ok);if(hm&&hm.eta<=best.eta+.25)best=hm;}
      tp.forEach(p=>{p.chaser=p===best;});
    }
  }
  aiBase(p){return guidePos(this,p);}
  aiPick(p){
    const sh=this.sh,dn=Math.abs(p.y-NET),z=sh.z,c=p.ch,sk=p.skill;
    const ops=this.team(1-p.team),od=ops.reduce((a,o)=>a+Math.abs(o.y-NET),0)/(ops.length||1);
    const w={smash:0,clear:0,drop:0};
    if(z>=1.8&&dn<7.6)w.smash=(.5+.5*nz(c.p))*(dn>5.6?.55:1)*(sk*.5+.55);
    w.clear=dn>4.3?(z<1?1.2:.5):.12;
    w.drop=dn>3.2?.3:.7;if(z<.9&&dn<3.5)w.drop=.95;
    w.drop*=od>4.5?1.7:.8;w.clear*=od<3.5?1.6:1;
    let t=w.smash+w.clear+w.drop,r=Math.random()*t;
    if((r-=w.smash)<0)return 'smash';if((r-=w.clear)<0)return 'clear';return 'drop';
  }
  aiAim(p,type){
    const hw=this.hw(),ops=this.team(1-p.team),mx=ops.reduce((a,o)=>a+o.x,0)/(ops.length||1);
    let x;if(Math.random()<.35+.6*p.skill)x=mx<CX?CX+rnd(.3,.85)*hw:CX-rnd(.3,.85)*hw;else x=CX+rnd(-.8,.8)*hw;
    return {x,dd:rnd(-.3,.6)};
  }
  aiStep(p,dt){
    const sh=this.sh,team=p.team;let b=this.aiBase(p),gx=b.x,gy=b.y,ease=.35;
    if(this.phase==='rally'&&sh.mode==='fly'&&sh.team!==team&&sh.t>=p.ai.react){
      if(p.chaser&&!this.leave[team]){
        const it=p.ai.it;if(it){gx=it.x;gy=it.y;ease=.15;}
        if(!p.buf&&sh.z<=2.9&&sh.z>.08&&this.onSide(team,sh.y)){
          const dist=Math.hypot(sh.x-p.x,sh.y-p.y),R=stat.reach(p.ch.a),Lg=stat.lunge(p.ch.a);
          if(dist<=R*.92||(dist<=R+Lg*.9&&sh.T-sh.t<.32)){const ty=this.aiPick(p);this.press(p.slot,ty,this.aiAim(p,ty));}
        }
      }
    }
    if(p.chaser&&!this.leave[team]&&this.phase==='rally'&&sh.mode==='fly'&&sh.team!==team&&p.slideCD<=0&&p.slideT<=0){
      const sd=Math.hypot(gx-p.x,gy-p.y);
      if(sd>1.4&&sd<4.2&&sh.T-sh.t<.65&&Math.random()<dt*(2+14*p.skill)){if(startSlide(p,gx-p.x,gy-p.y)){this.stats[p.team].sl++;this.emit({e:'slide',slot:p.slot,x:p.x,y:p.y});}}
    }
    const dx=gx-p.x,dy=gy-p.y,d=Math.hypot(dx,dy),f=clamp(d/ease,0,1);
    if(d>.02){p.mx=dx/d*f;p.my=dy/d*f;}else{p.mx=p.my=0;}
  }
  updatePlayers(dt){
    const lock=this.phase==='serve';
    this.assign(dt);
    for(const p of this.players){
      if(p.buf){p.buf.age+=dt;if(p.buf.age>.22)p.buf=null;}
      if(lock){p.vx=p.vy=0;continue;}
      if(p.ctrl==='ai'){if(this.phase==='rally')this.aiStep(p,dt);else{p.mx=p.my=0;}}
      if(p.ctrl==='remote'){continue;}
      movePlayer(p,dt);
    }
    for(const p of this.players)if(p.buf)this.tryHit(p);
  }
  winRally(team,reason,why){
    if(this.phase==='point'||this.phase==='over')return;
    this.sc[team]++;this.maxRally=Math.max(this.maxRally,this.rallyHits);
    for(const t of [0,1])this.deficit[t]=Math.max(this.deficit[t],this.sc[1-t]-this.sc[t]);
    if(team===this.serving&&this.mode==='D')this.team(team).forEach(p=>{p.side=1-p.side;});
    this.serving=team;this.phase='point';this.pt=0;
    this.emit({e:'point',team,reason,why:why||'',sc:this.sc.slice(),hits:this.rallyHits});
  }
  updateShuttle(dt){
    const sh=this.sh;
    if(sh.mode==='fly'){
      const py=sh.y;sh.t+=dt;const q=pathAt(sh,Math.min(sh.t,sh.T));sh.x=q.x;sh.y=q.y;sh.z=q.z;
      if(this.phase==='rally'&&(py-NET)*(sh.y-NET)<0&&sh.z<NETH){
        sh.mode='netfall';sh.y=NET+(py>NET?.07:-.07);sh.vz=0;this.emit({e:'net',x:sh.x,y:sh.y});this.winRally(1-sh.team,'net','');return;
      }
      if(sh.t>=sh.T){
        sh.mode='landed';sh.x=sh.tx;sh.y=sh.ty;sh.z=0;
        if(this.phase==='rally'){
          const inn=sh.isServe?this.inBox(sh.x,sh.y,.02):this.inCourt(sh.x,sh.y,.02);
          let why='';
          if(!inn){const dn=Math.abs(sh.y-NET);
            if(sh.isServe){why=dn<1.98?'short':(dn>(this.mode==='S'?6.7:5.94)?'long':'side');}
            else why=(sh.y<0||sh.y>L)?'long':'side';}
          this.emit({e:'land',x:sh.x,y:sh.y,in:inn});
          this.winRally(inn?sh.team:1-sh.team,inn?'in':(sh.isServe?'fault':'out'),why);
        }
      }
    }else if(sh.mode==='netfall'){
      sh.vz-=9.8*dt;sh.z+=sh.vz*dt;if(sh.z<=0){sh.z=0;sh.mode='landed';}
    }
  }
  step(dt){
    this.time+=dt;this.pt+=dt;
    for(const p of this.players){p.rec=Math.max(0,p.rec-dt);p.swing=Math.max(0,p.swing-dt);if(p.ctrl==='remote'){p.slideCD=Math.max(0,p.slideCD-dt);p.slideT=Math.max(0,p.slideT-dt);}}
    if(this.phase==='intro'){if(this.pt>1.8){this.phase='serve';this.pt=0;this.emit({e:'ready'});}this.holdShuttle();return;}
    if(this.phase==='reset'){
      for(const p of this.players){const k=Math.min(1,dt*5);p.x+=(p.tx-p.x)*k;p.y+=(p.ty-p.y)*k;}
      if(this.pt>1.2){for(const p of this.players){p.x=p.tx;p.y=p.ty;}this.phase='serve';this.pt=0;this.emit({e:'ready'});}
      this.holdShuttle();return;
    }
    if(this.phase==='over'){this.updateShuttle(dt);return;}
    this.updatePlayers(dt);
    if(this.phase==='serve'){
      this.holdShuttle();
      const s=this.server;
      if(s.ctrl==='ai'&&this.pt>s.ai.sw){
        const r=Math.random();let t;
        if(this.mode==='S')t=r<.5?'clear':(r<.9?'drop':'smash');else t=r<.55?'drop':(r<.8?'smash':'clear');
        this.doServe(s,t);
      }
    }else{
      this.updateShuttle(dt);
      if(this.phase==='point'&&this.pt>1.6){
        const [a,b]=this.sc,N=this.points;
        if(((a>=N||b>=N)&&Math.abs(a-b)>=2)||a>=this.cap||b>=this.cap){
          this.phase='over';this.winner=a>b?0:1;this.emit({e:'over',winner:this.winner,sc:this.sc.slice(),stats:this.stats,maxRally:this.maxRally,deficit:this.deficit});
        }else this.setupServe(false);
      }
    }
  }
  snap(){
    const sh=this.sh,r=v=>Math.round(v*1000)/1000;
    const o={p:this.players.map(p=>[p.slot,r(p.x),r(p.y),r(p.swing),r(p.slideT)]),
      sh:{m:sh.mode,x:r(sh.x),y:r(sh.y),z:r(sh.z),sx:r(sh.sx),sy:r(sh.sy),sz:r(sh.sz),tx:r(sh.tx),ty:r(sh.ty),T:r(sh.T),t:r(sh.t),H:r(sh.H),team:sh.team,lt:sh.lastType},
      sc:this.sc,ph:this.phase,srv:this.serving,ss:this.server?this.server.slot:-1,rs:this.receiver?this.receiver.slot:-1,rh:this.rallyHits,ev:this.events};
    this.events=[];return o;
  }
}

    if(p&&typeof m.x==='number'){const nx=clamp(m.x,-0.9,W+0.9),ny=m.y;const d=Math.hypot(nx-p.x,ny-p.y);
      if(d<4){p.x=nx;p.y=ny;clampPlayer(p);}else{p.x+=(nx-p.x)*.3;p.y+=(ny-p.y)*.3;}}}
  else if(m.t==='sl'){if(!G)return;const p=G.players.find(q=>q.ctrl==='remote'&&q.pid===pid);
    if(p&&typeof m.dx==='number'){if(startSlide(p,m.dx,m.dy)){G.stats[p.team].sl++;G.emit({e:'slide',slot:p.slot,x:p.x,y:p.y});}}}
  else if(m.t==='sw'){if(!G)return;const p=G.players.find(q=>q.ctrl==='remote'&&q.pid===pid);
    if(p){if(typeof m.x==='number'&&G.phase!=='serve'){const d=Math.hypot(m.x-p.x,m.y-p.y);if(d<3){p.x=clamp(m.x,-0.9,W+0.9);p.y=m.y;clampPlayer(p);}}
      if(['smash','clear','drop'].includes(m.type))G.press(p.slot,m.type,m.aim);}}
}
function hostLeave(pid){
  const l=Net.lobby;delete Net.conns[pid];if(!l)return;
  const i=l.slots.findIndex(s=>s.pid===pid);if(i<0)return;
  l.slots[i]={k:'empty'};
  if(G&&inMatch&&role==='host'){const p=G.players.find(q=>q.pid===pid);if(p){p.ctrl='ai';p.skill=.5;toast(p.name+' 님이 나갔습니다 (AI가 대신합니다)');}}
  lobbySync();
}
function joinRoom(code){
  if(typeof Peer==='undefined'){toast('PeerJS 로드 실패 — 인터넷 연결을 확인하세요.');return;}
  if(!/^\d{5}$/.test(code)){toast('5자리 숫자 코드를 입력하세요.');return;}
  Net.close();Net.busy=true;UI.wait('방에 접속하는 중…');
  const peer=new Peer({config:Net.ICE,debug:0});Net.peer=peer;
  const fail=msg=>{if(!Net.busy)return;Net.close();toast(msg,3000);UI.online();};
  const to=setTimeout(()=>fail('접속 시간 초과 — 코드를 확인하세요.'),12000);
  peer.on('open',id=>{
    Net.myId=id;const conn=peer.connect('scb-'+code,{reliable:true});Net.hostConn=conn;
    conn.on('open',()=>{clearTimeout(to);Net.busy=false;role='client';Net.code=code;conn.send({t:'join',name:Net.name});});
    conn.on('data',clientData);
    conn.on('close',()=>{if(role==='client'){toast('방장과 연결이 끊겼습니다.',3000);endMatchUI();Net.close();UI.title();}});
    conn.on('error',()=>{clearTimeout(to);fail('접속 실패');});
  });
  peer.on('error',err=>{clearTimeout(to);fail(err.type==='peer-unavailable'?'그런 방이 없습니다. 코드를 확인하세요.':'연결 오류: '+err.type);});
}
function clientData(m){
  if(m.t==='lobby'){Net.lobby={mode:m.mode,points:m.points,diff:m.diff,slots:m.slots};if(!inMatch)UI.lobby();}
  else if(m.t==='full'){toast('방이 가득 찼습니다.',3000);Net.close();UI.online();}
  else if(m.t==='busy'){toast('이미 경기가 진행 중입니다.',3000);Net.close();UI.online();}
  else if(m.t==='start'){
    const slots=m.slots.map(s=>s?{ch:ROSTER[s.ci]?withBonus(ROSTER[s.ci],s.b||0):ROSTER[0],name:s.name,ctrl:s.pid===Net.myId?'local':'x',pid:s.pid}:null);
    const local=slots.findIndex(s=>s&&s.pid===Net.myId);
    startMatch({mode:m.mode,points:m.points,slots,role:'client',local,title:'온라인',
      onEnd:(w,sc)=>UI.result(w,sc,{online:true})});
  }
  else if(m.t==='snap'){clientSnap(m.s);}
  else if(m.t==='over'){if(inMatch)setTimeout(()=>finishMatch(m.winner,m.sc),1200);}
  else if(m.t==='quit'){if(inMatch){toast('방장이 경기를 종료했습니다.',3000);endMatchUI();UI.lobby();}}
}
function hostStart(){
  const l=Net.lobby,act=activeSlots(l.mode),d=DIFFS[l.diff];
  const slots=[null,null,null,null],pub=[null,null,null,null];
  for(const i of act){
    const s=l.slots[i];let ci,name,ctrl,pid=null,b=0,skill=.5;
    if(s.k==='host'){ci=s.ci;name=s.name;ctrl='local';pid='host';}
    else if(s.k==='human'){ci=s.ci;name=s.name;ctrl='remote';pid=s.pid;}
    else{ci=(s.ci!=null?s.ci:Math.floor(Math.random()*ROSTER.length));name=ROSTER[ci].name;ctrl='ai';b=(i===1)?0:d.bonus;skill=(i===1)?.55:d.skill;}
    slots[i]={ch:withBonus(ROSTER[ci],b),name,ctrl,skill,pid};
    pub[i]={ci,name,pid:pid||'ai',b};
  }
  Net.bc({t:'start',mode:l.mode,points:l.points,slots:pub});
  startMatch({mode:l.mode,points:l.points,slots,role:'host',local:0,title:'온라인',
    onEnd:(w,sc)=>UI.result(w,sc,{online:true}),onQuit:()=>UI.lobby()});
  for(const p of G.players)if(p.ctrl==='remote')p.pid=slots[p.slot].pid;
}

 hub(){
  const s=SAVE,arc=ARCS[s.arc],h=heroCh();
  const rounds=arc.rounds.map((r,i)=>`<div class="rd ${i<s.round?'done':(i===s.round?'cur':'lock')}"><span>${i<s.round?'✔':(i===s.round?'▶':'🔒')}</span><b>${r.t}</b><small>${r.m==='S'?'단식':'복식'} · ${r.pts}점 · vs ${r.opp.map(o=>o.name).join('·')}</small></div>`).join('');
  this.set(`<div class="glass"><h3>${s.loop?'회차 +'+s.loop+' · ':''}${arc.short}</h3><h2>${arc.title}</h2>${rounds}
   <h3>다음 상대</h3><div class="teams">${arc.rounds[s.round].opp.map(o=>charCard(withBonus(o,s.loop*6),{tag:'<span class="tag">'+arc.rounds[s.round].t+'</span>'})).join('')}</div>
   <h3>내 선수 ${s.pts>0?`<span class="tag h">남은 포인트 ${s.pts}</span>`:''}</h3>${charCard(h,{edit:s.pts>0})}
   <p class="sub">장비: ${EQ.map(e=>e.n+' Lv'+eqLv(e.k)).join(' · ')} · 코인 🪙 ${s.coins}</p>
   <div class="row"><button class="btn" onclick="UI.shop()">🛒 장비점</button><button class="btn" onclick="UI.achs()">🏆 업적 ${Object.keys(ach()).length}/${ACH.length}</button></div>
   <button class="btn pri" onclick="UI.storyNext()">${s.round===0&&!s.intro[s.arc]?'대회 시작':'다음 경기'}: ${arc.rounds[s.round].t}</button>
   <button class="btn" onclick="UI.title()">메뉴로</button></div>`,'hub');
 },
 shop(){
  const s=SAVE;
  const items=EQ.map(e=>{const lv=eqLv(e.k),next=lv<3?EQ_COST[lv+1]:0;
   return `<div class="rd"><span>${e.k==='racket'?'🏸':e.k==='shoes'?'👟':'🧵'}</span><b>${e.nm[lv]} <small>Lv${lv} · ${e.d} +${lv*4}</small></b>${lv<3?`<button class="chip ${s.coins>=next?'on':''}" onclick="UI.buy('${e.k}')">🪙 ${next}</button>`:'<small>MAX</small>'}</div>`;}).join('');
  this.set(`<div class="glass"><h2>장비점</h2><p class="sub">경기에서 이기면 코인을 얻습니다. 장비 1레벨당 해당 스탯 +4.</p><h3>보유 코인 🪙 ${s.coins}</h3>${items}<button class="btn pri" onclick="UI.hub()">돌아가기</button></div>`,'shop');
 },
 buy(k){const s=SAVE,lv=eqLv(k);if(lv>=3)return;const c=EQ_COST[lv+1];if(s.coins<c){toast('코인이 부족합니다.');return;}s.coins-=c;s.eq[k]=lv+1;saveStory();Snd.fan(true);this.shop();},
 achs(){const a=ach();this.set(`<div class="glass"><h2>업적 ${Object.keys(a).length}/${ACH.length}</h2>${ACH.map(x=>`<div class="ach ${a[x.id]?'':'off'}"><i>${a[x.id]?'🏆':'🔒'}</i><div><b>${x.n}</b><br><small style="color:var(--mut)">${x.d}</small></div></div>`).join('')}<button class="btn pri" onclick="${SAVE?'UI.hub()':'UI.title()'}">돌아가기</button></div>`,'ach');},
 addStat(k){if(!SAVE||SAVE.pts<=0||SAVE.st[k]>=99)return;SAVE.st[k]++;SAVE.pts--;saveStory();Snd.ui();const y=$('ui').scrollTop;this.hub();$('ui').scrollTop=y;},
 storyNext(){
  const s=SAVE,arc=ARCS[s.arc],r=arc.rounds[s.round];
  const go=()=>playDialog(r.pre,()=>this.storyMatch());
  if(s.round===0&&!s.intro[s.arc]){s.intro[s.arc]=true;saveStory();playDialog(arc.prologue,go);}else go();
 },
 storyMatch(){
  const s=SAVE,arc=ARCS[s.arc],r=arc.rounds[s.round],hero=heroCh();
  const bonus=s.loop*6;
  const slots=[{ch:hero,name:s.name,ctrl:'local',skill:.5},null,null,null];
  if(r.m==='D'){const pa=arc.partner;slots[1]={ch:withBonus(pa,0),name:pa.name,ctrl:'ai',skill:pa.skill};}
  const idx=r.m==='D'?[2,3]:[2];
  r.opp.forEach((o,k)=>{slots[idx[k]]={ch:withBonus(o,bonus),name:o.name,ctrl:'ai',skill:clamp(o.skill+s.loop*.03,0,.98)};});
  startMatch({mode:r.m,points:r.pts,slots,role:'solo',local:0,title:arc.short+' '+r.t,
    onEnd:(w,sc)=>this.storyDone(w===0,sc),onQuit:()=>this.hub()});
 },
 storyDone(win,sc){
  const s=SAVE,arc=ARCS[s.arc],r=arc.rounds[s.round];
  this.result(win?0:1,sc,{story:true,after:()=>{
    if(!win){s.pts+=2;s.coins+=8;saveStory();playDialog(r.lose,()=>{toast('패배 보너스: 포인트 +2 · 코인 +8');this.hub();});return;}
    const lo=Math.min(sc[0],sc[1]),hi=Math.max(sc[0],sc[1]),coin=20+5*s.round+(lo*2<=hi?10:0);s.coins+=coin;
    if(r.opp.some(o=>o.name==='강하준')&&s.arc===1)unlock('boss');
    s.pts+=5;s.round++;toast('코인 +'+coin,2000);
    playDialog(r.win,()=>{
      if(s.round>=arc.rounds.length){
        s.pts+=10;s.coins+=60;unlock('arc'+s.arc);playDialog(arc.epilogue,()=>{
          s.arc++;s.round=0;
          if(s.arc>=ARCS.length){s.arc=0;s.loop++;s.intro=[false,false];playDialog([['','🏆 모든 대회를 제패했습니다! 다음 회차는 상대가 더 강해집니다.']],()=>{saveStory();this.hub();});}
          else{saveStory();this.hub();}
        });
      }else{saveStory();toast('포인트 +5 획득! 스탯을 올리세요');this.hub();}
    });
  }});
 },
 /* ---------- 샌드박스 ---------- */
 sandbox(){
  const sb=this.sb,d=sb.mode==='D';
  const card=(i,label)=>charCard(ROSTER[sb.slots[i]],{on:`UI.sbPick(${i})`,tag:`<span class="tag">${label}</span>`});
  this.set(`<div class="glass"><h2>샌드박스</h2>
   <h3>경기 방식</h3><div class="chips"><span class="chip ${sb.mode==='S'?'on':''}" onclick="UI.sb.mode='S';UI.sandbox()">단식</span><span class="chip ${sb.mode==='D'?'on':''}" onclick="UI.sb.mode='D';UI.sandbox()">복식 (나 + AI 파트너)</span></div>
   <h3>점수</h3><div class="chips">${[7,11,15,21].map(p=>`<span class="chip ${sb.points===p?'on':''}" onclick="UI.sb.points=${p};UI.sandbox()">${p}점</span>`).join('')}</div>
   <h3>AI 난이도</h3><div class="chips">${DIFFS.map((x,i)=>`<span class="chip ${sb.diff===i?'on':''}" onclick="UI.sb.diff=${i};UI.sandbox()">${x.n}</span>`).join('')}</div>
   <h3>선수 (카드를 눌러 변경)</h3>
   <div class="teams"><div class="t"><h4>내 팀</h4>${card(0,'나')}${d?card(1,'AI 파트너'):''}</div>
   <div class="t"><h4>상대 팀</h4>${card(2,'AI')}${d?card(3,'AI'):''}</div></div>
   <button class="btn pri" onclick="UI.sbStart()">경기 시작</button><button class="btn" onclick="UI.title()">뒤로</button></div>`,'sb');
 },
 sbPick(i){pickChar(this.sb.slots[i],id=>{this.sb.slots[i]=id;this.sandbox();});},
 sbStart(){
  const sb=this.sb,df=DIFFS[sb.diff],d=sb.mode==='D';
  const mk=(i,ctrl,b,sk)=>({ch:withBonus(ROSTER[sb.slots[i]],b),ctrl,skill:sk});
  const slots=[mk(0,'local',0,.5),d?mk(1,'ai',0,.55):null,mk(2,'ai',df.bonus,df.skill),d?mk(3,'ai',df.bonus,df.skill):null];
  const run=()=>startMatch({mode:sb.mode,points:sb.points,slots,role:'solo',local:0,title:'샌드박스',
    onEnd:(w,sc)=>UI.result(w,sc,{again:()=>UI.sbStart()}),onQuit:()=>UI.sandbox()});
  run();
 },
 /* ---------- 온라인 ---------- */
 online(){
  Net.close();
  const nm=store.get('scb_name','');
  this.set(`<div class="glass"><h2>온라인 대전</h2><p class="sub">방장이 방을 만들면 5자리 코드가 생성됩니다. 친구는 코드만 입력하면 입장! (단식 1v1 / 복식 2v2, 빈 자리는 AI)</p>
   <h3>내 이름</h3><input id="oname" type="text" maxlength="8" placeholder="이름" value="${nm}">
   <button class="btn pri" onclick="UI.onHost()">방 만들기</button>
   <h3>방 코드로 입장</h3><input id="ocode" type="text" inputmode="numeric" maxlength="5" placeholder="5자리 코드">
   <button class="btn" onclick="UI.onJoin()" style="text-align:center">입장하기</button>
   <button class="btn" onclick="UI.title()">뒤로</button></div>`,'online');
 },
 onName(){const n=($('oname')&&$('oname').value.trim())||('플레이어'+Math.floor(Math.random()*90+10));Net.name=n.slice(0,8);store.set('scb_name',Net.name);},
 onHost(){this.onName();hostRoom();},
 onJoin(){this.onName();joinRoom(($('ocode').value||'').trim());},
 lobby(){
  const l=Net.lobby;if(!l){return this.online();}
  const isHost=role==='host',act=activeSlots(l.mode),mySlot=l.slots.findIndex(s=>s.pid===(isHost?'host':Net.myId));
  const slotCard=i=>{
    const s=l.slots[i];
    if(!act.includes(i))return '';
    if(s.k==='empty')return `<div class="cc" style="min-height:92px;opacity:.7" ${mySlot>=0?`onclick="UI.seat(${i})"`:''}><b>빈 자리 (AI)</b><small>${mySlot>=0?'눌러서 이 자리로 이동':''}</small></div>`;
    const ch=ROSTER[s.ci],me=i===mySlot;
    return charCard(ch,{sel:me,on:me?`UI.lobPick()`:'',tag:`<span class="tag h">${s.name}${s.k==='host'?' · 방장':''}</span>`});
  };
  const teamHint=l.mode==='S'?'':'';
  this.set(`<div class="glass"><h2>대기실</h2><div class="code">${Net.code}</div><p class="sub" style="text-align:center">친구에게 이 코드를 알려주세요 · 내 카드를 누르면 선수 변경</p>
   <div class="teams"><div class="t"><h4>팀 A</h4>${slotCard(0)}${slotCard(1)}</div><div class="t"><h4>팀 B</h4>${slotCard(2)}${slotCard(3)}</div></div>
   <h3>방 설정 ${isHost?'':'(방장만 변경)'}</h3>
   <div class="chips"><span class="chip ${l.mode==='S'?'on':''}" onclick="UI.lobSet('mode','S')">단식</span><span class="chip ${l.mode==='D'?'on':''}" onclick="UI.lobSet('mode','D')">복식</span>
   ${[7,11,15,21].map(p=>`<span class="chip ${l.points===p?'on':''}" onclick="UI.lobSet('points',${p})">${p}점</span>`).join('')}</div>
   <div class="chips">${DIFFS.map((x,i)=>`<span class="chip ${l.diff===i?'on':''}" onclick="UI.lobSet('diff',${i})">AI ${x.n}</span>`).join('')}</div>
   ${isHost?`<button class="btn pri" onclick="hostStart()">경기 시작</button>`:`<p class="sub" style="text-align:center">방장이 시작하길 기다리는 중…</p>`}
   <button class="btn" onclick="UI.leaveLobby()">나가기</button></div>`,'lobby');
 },
 lobSet(k,v){if(role!=='host')return;const l=Net.lobby;l[k]=v;if(k==='mode')normalizeLobby();lobbySync();},
 lobPick(){
  const l=Net.lobby,isHost=role==='host',i=l.slots.findIndex(s=>s.pid===(isHost?'host':Net.myId));if(i<0)return;
  pickChar(l.slots[i].ci,id=>{if(isHost){l.slots[i].ci=id;lobbySync();}else{Net.send({t:'pick',ci:id});}});
 },
 seat(i){const l=Net.lobby;if(role==='host'){const me=l.slots.findIndex(s=>s.pid==='host');if(l.slots[i].k==='empty'){l.slots[i]=l.slots[me];l.slots[me]={k:'empty'};lobbySync();}}else Net.send({t:'seat',slot:i});},
 leaveLobby(){if(role==='host')Net.bc({t:'quit'});Net.close();this.title();},
 /* ---------- 결과 ---------- */
 result(winner,sc,o){
  o=o||{};const me=V&&V.players.find(p=>p.slot===LOC),myT=me?me.team:0,win=myT===winner;
  const names=V?[slotName(V,0),slotName(V,1)]:['A','B'];
  const btns=o.story?`<button class="btn pri" onclick="UI.storyCont()">계속</button>`:
   o.online?`<button class="btn pri" onclick="UI.lobby()">대기실로</button>`:
   `<button class="btn pri" onclick="UI.again()">한 번 더</button><button class="btn" onclick="UI.title()">메뉴로</button>`;
  UI._again=o.again;UI._after=o.after;
  let table='',got=[];
  const st=LASTST;
  if(st&&st.stats){
    const m=st.stats[myT],e=st.stats[1-myT];
    const row=(a,l,b)=>`<tr><td>${a}</td><td>${l}</td><td>${b}</td></tr>`;
    table=`<table class="stt">${row(m.sm,'스매시',e.sm)}${row(m.sl,'슬라이딩',e.sl)}${row(st.maxRally,'최장 랠리 (양팀)',st.maxRally)}</table>`;
    const ctxA={win,sc,myT,my:m,maxRally:st.maxRally,deficit:st.deficit,mode:V.mode,points:V.points};
    for(const x of ACH)if(x.f&&x.f(ctxA)){const d=unlock(x.id);if(d)got.push(d);}
  }
  this.set(`<div style="height:8vh"></div><div class="glass" style="text-align:center"><h1 style="font-size:52px">${win?'VICTORY':'DEFEAT'}</h1>
   <p class="sub">${win?'멋진 경기였습니다!':'아쉽게 패배했습니다.'}</p>
   <div style="font-size:54px;font-weight:900;margin:8px 0">${sc[0]} : ${sc[1]}</div><p class="sub">${names[0]} vs ${names[1]}</p>${table}
   ${got.map(d=>`<div class="ach"><i>🏆</i><div><b>업적 달성: ${d.n}</b><br><small style="color:var(--mut)">${d.d}</small></div></div>`).join('')}${btns}</div>`,'result');
  Snd.fan(win);if(win)Snd.cheer(1);
  if(role==='host'&&o.online)lobbySync();
 },
 storyCont(){const f=this._after;this._after=null;if(f)f();else this.hub();},
 again(){if(this._again)this._again();else this.title();}
};
window.UI=UI;

/* =====================================================================
   데모(타이틀 배경) & 메인 루프
   ===================================================================== */
function startDemo(){
  const pick=()=>ROSTER[Math.floor(Math.random()*ROSTER.length)];
  DEMO=new Game({mode:Math.random()<.5?'S':'D',points:5,slots:[{ch:pick(),ctrl:'ai',skill:.8},{ch:pick(),ctrl:'ai',skill:.8},{ch:pick(),ctrl:'ai',skill:.8},{ch:pick(),ctrl:'ai',skill:.8}]},{});
  if(DEMO.mode==='S'){DEMO=new Game({mode:'S',points:5,slots:[{ch:pick(),ctrl:'ai',skill:.8},null,{ch:pick(),ctrl:'ai',skill:.8},null]},{});}
}
let lastT=performance.now(),demoAcc=0;
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  if(inMatch&&V){
    updateMatch(dt);render(V,dt);
  }else{
    layout.k=0;
    if(DEMO){demoAcc+=dt;let n=0;while(demoAcc>=1/60&&n<5){DEMO.step(1/60);demoAcc-=1/60;n++;}
      if(DEMO.phase==='over'&&DEMO.pt>2)startDemo();
      flip=false;LOC=-1;render(DEMO,dt);}
    else render(null,dt);
  }
  requestAnimationFrame(frame);
}
applyMode();UI.title();requestAnimationFrame(frame);
</script>
