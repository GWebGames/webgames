<title>한산도 해전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
/* Layout: 한 장의 먹빛 바다 — 중앙 캔버스 하나, 위에 제목, 아래에 조작법. 단일 테마(밤바다). */
:root{
  --ink:#0d1b24;      /* 먹빛 배경 */
  --sea:#17323f;      /* 바다 */
  --foam:#e9e2cf;     /* 한지 글자 */
  --cinnabar:#c8402b; /* 단청 붉은색 */
  --gold:#d9a441;     /* 단청 황금색 */
  --muted:#8fa4ad;
  --f-display:"Nanum Myeongjo","Batang","Noto Serif KR",serif;
  --f-body:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--foam);font-family:var(--f-body);padding-inline:16px;padding-block:12px;box-sizing:border-box}
.wrap{width:min(100%,calc((100vh - 96px)*1.6));min-width:min(100%,520px);margin:0 auto;display:flex;flex-direction:column;gap:10px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:.08em;text-wrap:balance}
h1 small{font-size:.8rem;color:var(--gold);letter-spacing:.2em;margin-left:8px;font-weight:700}
.hint{color:var(--muted);font-size:.85rem;display:flex;gap:14px;flex-wrap:wrap}
kbd{font-family:var(--f-body);background:#22404e;border:1px solid #35586a;border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--foam);font-size:.8rem}
canvas{width:100%;height:auto;aspect-ratio:8/5;display:block;border:2px solid #35586a;border-radius:4px;background:var(--sea);outline:none}
canvas:focus-visible{border-color:var(--gold)}
/* 터치 조작: 터치 기기에서만 보이고, 게임 화면 위에 겹쳐 놓는다 */
.stage{position:relative}
#touch{position:absolute;inset:0;pointer-events:none;touch-action:none;-webkit-user-select:none;user-select:none}
#touch button{pointer-events:auto;font:inherit;color:var(--foam);background:rgba(34,64,78,.72);border:1px solid rgba(160,190,200,.5);border-radius:12px;font-size:1rem;touch-action:none;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(2px)}
#touch button.on,#touch button:active{background:rgba(217,164,65,.9);color:var(--ink)}
.pad{position:absolute;left:3%;bottom:4%;display:grid;grid-template-columns:repeat(3,clamp(36px,8vw,58px));grid-template-rows:repeat(2,clamp(36px,8vw,58px));gap:5px;grid-template-areas:". up ." "left down right"}
.pad [data-k=w]{grid-area:up}.pad [data-k=a]{grid-area:left}.pad [data-k=s]{grid-area:down}.pad [data-k=d]{grid-area:right}
.mid{position:absolute;left:57%;bottom:3%;transform:translateX(-50%);display:flex;flex-wrap:nowrap;gap:4px}
#touch .mid button{min-width:clamp(26px,4.6vw,44px);height:clamp(26px,5.4vw,36px);font-size:clamp(.55rem,1.5vw,.76rem);padding:0 3px;white-space:nowrap}
#touch .fire{position:absolute;right:3%;bottom:26%;width:clamp(64px,14vw,100px);height:clamp(64px,14vw,100px);font-size:clamp(.95rem,2.6vw,1.2rem);font-weight:700;background:rgba(138,47,33,.82);border-radius:50%}
#touch .fire.on{background:rgba(217,164,65,.92)}
@media (pointer:coarse){.hint{display:none}h1{font-size:1.1rem}header{gap:4px}.wrap{width:min(100%,calc((100vh - 70px)*1.6));gap:6px}body{padding-block:6px}}
</style>
<div class="wrap">
  <header>
    <h1>한산도 해전<small>閑山島</small></h1>
    <div class="hint">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span>
      <span><kbd>Space</kbd> 포격</span>
      <span><kbd>1</kbd>–<kbd>4</kbd> 진형 · <kbd>5</kbd> 대기</span>
      <span><kbd>M</kbd> 음악</span>
      <span><kbd>P</kbd> 일시정지</span>
    </div>
  </header>
  <div class="stage">
  <canvas id="c" width="960" height="600" tabindex="0" aria-label="해전 게임 화면"></canvas>
  <div id="touch" hidden>
    <div class="pad">
      <button data-k="w" aria-label="전진">▲</button>
      <button data-k="a" aria-label="좌선회">◀</button>
      <button data-k="s" aria-label="후진">▼</button>
      <button data-k="d" aria-label="우선회">▶</button>
    </div>
    <div class="mid">
      <button data-f="0">학익</button><button data-f="1">장사</button><button data-f="2">일자</button><button data-f="3">어린</button><button data-f="4">대기</button><button data-act="pause">정지</button><button data-act="mute">음악</button>
    </div>
    <button class="fire" data-k="space" aria-label="포격">포격</button>
  </div>
  </div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=960,H=600;
/* 월드(바다)는 화면보다 훨씬 넓고, 카메라가 기함을 따라간다 */
const WW=2400,HH=1500,ZOOM=.8,VW=W/ZOOM,VH=H/ZOOM;
const cam={x:0,y:0};
let SC=1;
function fit(){const r=cv.getBoundingClientRect();if(!r.width)return;SC=Math.max(1,Math.min(3,(r.width/W)*(window.devicePixelRatio||1)));cv.width=Math.round(W*SC);cv.height=Math.round(H*SC);}
try{new ResizeObserver(fit).observe(cv);}catch(e){addEventListener('resize',fit);}
fit();
const keys={};
let state='title',wave=0,score=0,best=0,bannerT=0,shake=0,time=0,waitNext=0;
try{best=+localStorage.getItem('hansan-best')||0}catch(e){}
let player,enemies=[],shots=[],parts=[],wrecks=[];
let gold=0,allies=[],upg={reload:0,dmg:0,maxhp:0,ahp:0,asol:0,agun:0},shopT=0;
const SLOTS=[[-70,-62],[-70,62],[-135,-115],[-135,115],[-200,-168],[-200,168]];
/* 진형: [앞뒤, 좌우] 기준 위치 (기함 기준, 앞이 +) */
const FORMS=[
  {n:'학익진',s:[[25,-85],[25,85],[65,-175],[65,175],[100,-265],[100,265]]},
  {n:'장사진',s:[[-70,0],[-140,0],[-210,0],[-280,0],[-350,0],[-420,0]]},
  {n:'일자진',s:[[0,-85],[0,85],[0,-170],[0,170],[0,-255],[0,255]]},
  {n:'어린진',s:SLOTS}
];
let formation=0,hold=false,fmsg='',fmsgT=0,sinkT=0,overMsg='',bannerSub='',terrainSub='';
let islands=[],reefs=[],currents=[];
const links=[];
/* ===== 기록 · 업적 (브라우저에 저장) ===== */
let bestWave=0,stats={kills:0,captures:0,bosses:0,fireKills:0,runs:0},achDone={},toasts=[],showAch=false,achT=0,recDirty=false;
try{const r=JSON.parse(localStorage.getItem('hansan-rec')||'{}');bestWave=r.bestWave||0;Object.assign(stats,r.stats||{});achDone=r.ach||{};}catch(e){}
function saveRec(){try{localStorage.setItem('hansan-rec',JSON.stringify({bestWave,stats,ach:achDone}));}catch(e){}}
const ACH=[
  {id:'kill1',n:'첫 격침',d:'적선을 처음으로 격침한다',t:()=>stats.kills>=1},
  {id:'cap1',n:'첫 나포',d:'백병전으로 적선을 빼앗는다',t:()=>stats.captures>=1},
  {id:'cap10',n:'나포의 달인',d:'적선을 누적 10척 나포한다',t:()=>stats.captures>=10,p:()=>stats.captures+' / 10'},
  {id:'kill50',n:'백전노장',d:'적선을 누적 50척 격침한다',t:()=>stats.kills>=50,p:()=>stats.kills+' / 50'},
  {id:'kill200',n:'무적함대',d:'적선을 누적 200척 격침한다',t:()=>stats.kills>=200,p:()=>stats.kills+' / 200'},
  {id:'w5',n:'5차 전투 도달',d:'5차 전투까지 간다',t:()=>bestWave>=5,p:()=>bestWave+' / 5'},
  {id:'w10',n:'10차 전투 도달',d:'10차 전투까지 간다',t:()=>bestWave>=10,p:()=>bestWave+' / 10'},
  {id:'w15',n:'15차 전투 도달',d:'15차 전투까지 간다',t:()=>bestWave>=15,p:()=>bestWave+' / 15'},
  {id:'boss',n:'대장선 격침',d:'적 대장선을 침몰시킨다',t:()=>stats.bosses>=1},
  {id:'fire5',n:'화공 방어',d:'화공선 5척을 폭발 전에 격침한다',t:()=>stats.fireKills>=5,p:()=>stats.fireKills+' / 5'},
  {id:'turtle',n:'거북선 출진',d:'기함을 거북선으로 개조한다',t:()=>!!(player&&player.turtle&&state!=='title')},
  {id:'fleet',n:'대함대',d:'부하 판옥선 6척을 거느린다',t:()=>state!=='title'&&allies.length>=6},
  {id:'rich',n:'군자금 1000냥',d:'한 번에 1000냥을 모은다',t:()=>state!=='title'&&gold>=1000}
];
function checkAch(){
  for(const a of ACH)if(!achDone[a.id]&&a.t()){achDone[a.id]=true;toasts.push({t:3.8,txt:a.n});snd(660,.3,'triangle',.12);recDirty=true;}
  if(recDirty){saveRec();recDirty=false;}
}
function drawToasts(){
  toasts.forEach((t,i)=>{
    const x=W/2-150,y=12+i*42;
    ctx.globalAlpha=Math.min(1,t.t*2);
    ctx.fillStyle='rgba(31,66,82,.96)';ctx.fillRect(x,y,300,34);
    ctx.strokeStyle='#d9a441';ctx.lineWidth=1.5;ctx.strokeRect(x,y,300,34);
    ctx.textAlign='center';ctx.fillStyle='#d9a441';ctx.font='700 12px "Noto Sans KR",sans-serif';ctx.fillText('업적 달성',x+52,y+21);
    ctx.fillStyle='#e9e2cf';ctx.font='700 15px "Nanum Myeongjo",serif';ctx.fillText(t.txt,x+196,y+22);
    ctx.textAlign='left';ctx.globalAlpha=1;
  });
}
function drawAch(){
  ctx.fillStyle='rgba(8,18,24,.95)';ctx.fillRect(0,0,W,H);
  const got=ACH.filter(a=>achDone[a.id]).length;
  ctx.textAlign='center';ctx.fillStyle='#e9e2cf';ctx.font='800 32px "Nanum Myeongjo",serif';ctx.fillText('업적',W/2,48);
  ctx.fillStyle='#d9a441';ctx.font='700 16px "Nanum Myeongjo",serif';ctx.fillText(got+' / '+ACH.length+' 달성  ·  최고 웨이브 '+bestWave+'  ·  최고 점수 '+best,W/2,76);
  ctx.fillStyle='#8fa4ad';ctx.font='13px "Noto Sans KR",sans-serif';ctx.fillText('누적 격침 '+stats.kills+'  ·  누적 나포 '+stats.captures+'  ·  출전 '+stats.runs+'회',W/2,98);
  ACH.forEach((a,i)=>{
    const x=40+(i%2)*450,y=116+Math.floor(i/2)*62,done=!!achDone[a.id];
    ctx.fillStyle=done?'#1f4252':'#14252d';ctx.fillRect(x,y,430,54);
    ctx.strokeStyle=done?'#d9a441':'#2c4652';ctx.lineWidth=1.5;ctx.strokeRect(x,y,430,54);
    ctx.textAlign='left';ctx.fillStyle=done?'#e9e2cf':'#6f858e';ctx.font='700 16px "Nanum Myeongjo",serif';ctx.fillText(a.n,x+14,y+23);
    ctx.fillStyle='#8fa4ad';ctx.font='12px "Noto Sans KR",sans-serif';ctx.fillText(a.d,x+14,y+42);
    ctx.textAlign='right';ctx.font='700 14px "Nanum Myeongjo",serif';
    ctx.fillStyle=done?'#d9a441':'#6f858e';ctx.fillText(done?'달성':(a.p?a.p():'미달성'),x+416,y+23);
  });
  ctx.textAlign='center';ctx.fillStyle='#8fa4ad';ctx.font='13px "Noto Sans KR",sans-serif';ctx.fillText('T 키 또는 화면을 눌러 닫기',W/2,H-14);
  ctx.textAlign='left';
}
const ITEMS=[
 {n:'부하 판옥선 충원',no:'최대',d:()=>'아군 판옥선이 따라다니며 자동으로 포격합니다 ('+allies.length+'/6척)',c:()=>150+Math.max(0,allies.length-2)*50,ok:()=>allies.length<6,buy(){spawnAlly();}},
 {n:'선체 수리',no:'온전',d:()=>'선체 5칸 회복',c:()=>60,ok:()=>player.hp<player.max,buy(){player.hp=Math.min(player.max,player.hp+5);}},
 {n:'선체 보강',no:'최대',d:()=>'최대 선체 +2, 2칸 회복 ('+upg.maxhp+'/5)',c:()=>120+upg.maxhp*40,ok:()=>upg.maxhp<5,buy(){upg.maxhp++;player.max+=2;player.hp=Math.min(player.max,player.hp+2);}},
 {n:'화약 개량',no:'최대',d:()=>'장전 시간 단축 ('+upg.reload+'/4)',c:()=>100+upg.reload*50,ok:()=>upg.reload<4,buy(){upg.reload++;}},
 {n:'포탄 강화',no:'최대',d:()=>'포탄 피해 +1 ('+upg.dmg+'/3)',c:()=>150+upg.dmg*100,ok:()=>upg.dmg<3,buy(){upg.dmg++;}},
 {n:'거북선 개조',no:'완료',d:()=>'기함 개조: 선체 +5 · 좌우 3발 · 전방 화염',c:()=>500,ok:()=>!player.turtle,buy(){player.turtle=true;player.sc=1.3;player.max+=5;player.hp=Math.min(player.max,player.hp+5);}},
 {n:'병사 증원',no:'최대',d:()=>'기함 병사 +3명 ('+player.solMax+' / 22명)',c:()=>100+(player.solMax-10)*10,ok:()=>player.solMax<22,buy(){player.solMax+=3;player.sol+=3;}},
 {n:'부하 수리',no:'온전',d:()=>'모든 부하 선체 완전 수리 (부서진 선체 '+allies.reduce((n,a)=>n+Math.max(0,Math.ceil(a.max-a.hp)),0)+'칸)',c:()=>Math.max(20,allies.reduce((n,a)=>n+Math.max(0,Math.ceil(a.max-a.hp)),0)*12),ok:()=>allies.some(a=>a.hp<a.max),buy(){allies.forEach(a=>{a.hp=a.max;});}},
 {n:'부하 선체 강화',no:'최대',d:()=>'모든 부하 선체 +2 · 2칸 회복 ('+upg.ahp+'/4)',c:()=>100+upg.ahp*50,ok:()=>upg.ahp<4,buy(){upg.ahp++;allies.forEach(a=>{a.max+=2;a.hp=Math.min(a.max,a.hp+2);});}},
 {n:'부하 병사 훈련',no:'최대',d:()=>'모든 부하 병사 +2명 ('+upg.asol+'/4)',c:()=>80+upg.asol*40,ok:()=>upg.asol<4,buy(){upg.asol++;allies.forEach(a=>{a.solMax+=2;a.sol+=2;});}},
 {n:'부하 화포 개량',no:'최대',d:()=>'부하 장전 단축 · 2단계부터 위력 +1 ('+upg.agun+'/3)',c:()=>120+upg.agun*70,ok:()=>upg.agun<3,buy(){upg.agun++;}}
];

/* 소리 */
let AC;
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
function snd(f,d,type,vol){try{ac();
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sawtooth';o.frequency.setValueAtTime(f,AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(30,AC.currentTime+d);g.gain.setValueAtTime(vol||.15,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if([' ','arrowup','arrowdown'].includes(k)||e.code==='Space')e.preventDefault();
  keys[k==='' ?'space':k]=true; if(e.code==='Space')keys.space=true;
  if(e.code==='Space'&&!e.repeat&&!showAch&&(state==='title'||state==='over'))start();
  if(k==='t'&&!e.repeat&&state!=='play'&&state!=='sinking')showAch=!showAch;
  if(k==='escape')showAch=false;
  if(k==='m'&&!e.repeat){bgm.mute=!bgm.mute;fmsg=bgm.mute?'음악 끔':'음악 켬';fmsgT=1.2;}
  if(state==='play'&&!e.repeat&&k.length===1&&k>='1'&&k<='5')setForm(+k-1);
  if(state==='shop'&&!e.repeat&&shopT<=0){
    if(/^[0-9]$/.test(k))buy(k==='0'?9:+k-1);else if(k==='-')buy(10);
    if(e.code==='Space'||k==='enter')leaveShop();
  }
  if(k==='p'&&(state==='play'||state==='pause'))state=state==='play'?'pause':'play';
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;if(e.code==='Space')keys.space=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')state='pause';});
cv.addEventListener('pointerdown',e=>{cv.focus();
  if(showAch){showAch=false;return;}
  {const rc=cv.getBoundingClientRect(),mx=(e.clientX-rc.left)*W/rc.width,my=(e.clientY-rc.top)*H/rc.height;
   if((state==='title'||state==='over')&&mx>=W/2-75&&mx<=W/2+75&&my>=H-58&&my<=H-24){showAch=true;return;}}
  if(state==='title'||state==='over')start();
  else if(state==='pause')state='play';
  else if(state==='shop'&&shopT<=0){
    const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
    for(let i=0;i<ITEMS.length;i++){const R=itemRect(i);if(x>=R.x&&x<=R.x+R.w&&y>=R.y&&y<=R.y+R.h){buy(i);return;}}
    const S=startRect();if(x>=S.x&&x<=S.x+S.w&&y>=S.y&&y<=S.y+S.h)leaveShop();
  }
});

function start(){
  player={x:WW/2,y:HH-260,a:-Math.PI/2,v:0,hp:10,max:10,cd:0,hit:0,sol:10,solMax:10};
  enemies=[];shots=[];parts=[];wrecks=[];wave=0;score=0;gold=0;allies=[];upg={reload:0,dmg:0,maxhp:0,ahp:0,asol:0,agun:0};stats.runs++;recDirty=true;waitNext=0;formation=0;hold=false;links.length=0;overMsg='';state='play';spawnAlly();spawnAlly();nextWave();updateCam(0,true);bgmStart();
}
function nextWave(){
  wave++;bannerT=2.2;
  if(wave>bestWave){bestWave=wave;recDirty=true;}
  player.sol=player.solMax;allies.forEach(a=>{a.sol=a.solMax;});
  player.fire=0;allies.forEach(x=>{x.fire=0;});
  genTerrain();
  const n=Math.min(3+wave,11),list=[];
  if(wave%5===0)list.push('boss');else if(wave>=3)list.push('big');
  if(wave>=2)for(let i=0;i<Math.min(1+Math.floor((wave-2)/2),4);i++)list.push('gun');
  if(wave>=3)for(let i=0;i<Math.min(1+Math.floor((wave-3)/2),3);i++)list.push('fire');
  if(wave>=4)for(let i=0;i<Math.min(1+Math.floor((wave-4)/2),3);i++)list.push('scout');
  const ships=Math.max(2,n-list.length);
  for(let i=0;i<ships;i++)list.push('ship');
  list.forEach(spawnEnemy);
  const cnt=t=>enemies.filter(e=>e.type===t).length;
  bannerSub='적선 '+enemies.length+'척'+(cnt('boss')?' · 대장선 출현!':'')+(cnt('gun')?' · 조총선 '+cnt('gun'):'')+(cnt('fire')?' · 화공선 '+cnt('fire'):'')+(cnt('scout')?' · 정찰선 '+cnt('scout'):'');
}
function spawnPos(){
  let x=WW/2,y=40;
  for(let k=0;k<14;k++){
    const an=Math.random()*6.283,r=640+Math.random()*260;
    x=Math.max(40,Math.min(WW-40,player.x+Math.cos(an)*r));
    y=Math.max(40,Math.min(HH-40,player.y+Math.sin(an)*r));
    if(Math.abs(x-player.x)>VW/2+60||Math.abs(y-player.y)>VH/2+60)break;
  }
  return {x,y,a:Math.atan2(player.y-y,player.x-x)};
}
function updateCam(dt,snap){
  const p=player;if(!p)return;
  let tx=p.x+Math.cos(p.a)*p.v*.6-VW/2,ty=p.y+Math.sin(p.a)*p.v*.6-VH/2;
  tx=Math.max(0,Math.min(WW-VW,tx));ty=Math.max(0,Math.min(HH-VH,ty));
  const k=snap?1:Math.min(1,dt*4);
  cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
}

function ship(s,pl){

  glow(s,L,B);

  if(s.boss){ctx.strokeStyle='#d9a441';ctx.lineWidth=2;ctx.strokeRect(-L*.8,-B*.5,L*.3,B);}

  if(!pl){ctx.fillStyle='#b32a2a';ctx.fillRect(L*.08,-4,4,8);}

}

function drawArrows(){

  }

  const nc=Math.min(1+Math.floor(wave/2),5);
  for(let i=0;i<nc;i++){
    const ang=[0,Math.PI,Math.PI/2,-Math.PI/2][Math.floor(Math.random()*4)];
    const w=260+Math.random()*120,h=120+Math.random()*60;
    const vert=Math.abs(Math.sin(ang))>.5,ew=vert?h:w,eh=vert?w:h;
    currents.push({x:ew/2+60+Math.random()*(WW-ew-120),y:eh/2+60+Math.random()*(HH-eh-120),w,h,a:ang,str:55+Math.min(wave*3,35)});
  }
  terrainSub=['섬 '+islands.length,reefs.length?'암초 '+reefs.length:'',currents.length?'조류 '+currents.length:''].filter(Boolean).join(' · ');
}
function avoidTerrain(a,ta){
  let adj=ta;
  const chk=(o,lim)=>{
    const dx=o.x-a.x,dy=o.y-a.y,d=Math.hypot(dx,dy);
    if(d>lim)return;
    const diff=norm(Math.atan2(dy,dx)-a.a);
    if(Math.abs(diff)<1.1)adj-=Math.sign(diff||1)*(1.1-Math.abs(diff))*1.3*(1.3-d/lim);
  };
  for(const o of islands)chk(o,o.r+100);
  for(const o of reefs)chk(o,o.r+65);
  return adj;
}
function shipRad(sh){return 20*(sh.big?1.3:1)*(sh.sc||1);}
function terrainStep(dt){
  for(const sh of [player,...allies,...enemies]){
    if(sh.hp<=0||sh.dead)continue;
    const R=shipRad(sh);
    for(const c of currents){
      const ca=Math.cos(c.a),sa=Math.sin(c.a),dx=sh.x-c.x,dy=sh.y-c.y;
      const lx=dx*ca+dy*sa,ly=-dx*sa+dy*ca;
      if(Math.abs(lx)<c.w/2&&Math.abs(ly)<c.h/2){sh.x+=ca*c.str*dt;sh.y+=sa*c.str*dt;}
    }
    for(const o of islands){
      const dx=sh.x-o.x,dy=sh.y-o.y,d=Math.hypot(dx,dy)||1,lim=o.r*.92+R*.8;
      if(d<lim){
        const nx=dx/d,ny=dy/d;
        sh.x=o.x+nx*lim;sh.y=o.y+ny*lim;
        if(sh.v>20)sh.v*=.9;
        if(sh!==player){ /* 섬을 끼고 돌아가도록 옆으로 밀어준다 */
          const t=(Math.cos(sh.a)*-ny+Math.sin(sh.a)*nx)>=0?1:-1;
          sh.x+=-ny*t*70*dt;sh.y+=nx*t*70*dt;
        }
      }
    }
    for(const o of reefs){
      const dx=sh.x-o.x,dy=sh.y-o.y,d=Math.hypot(dx,dy)||1,lim=o.r+R*.7;
      if(d<lim){
        sh.x=o.x+dx/d*lim;sh.y=o.y+dy/d*lim;
        if(time>(sh.rt||0)){
          sh.rt=time+1.5;sh.hp-=1;sh.hit=.2;
          for(let i=0;i<8;i++)smoke(o.x,o.y,(Math.random()-.5)*110,(Math.random()-.5)*110,.4,'#dfeef2',3);
          snd(90,.2,'square',.08);if(sh===player)shake=6;
        }
      }
    }
  }
}
function shotBlocked(sh){
  for(const o of islands){
    if(Math.hypot(sh.x-o.x,sh.y-o.y)<o.r*.85){
      for(let i=0;i<4;i++)smoke(sh.x,sh.y,(Math.random()-.5)*70,(Math.random()-.5)*70,.3,'#c9b98a',2.5);
      return true;
    }
  }
  return false;
}
function drawTerrain(){
  for(const c of currents){
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
    ctx.fillStyle='rgba(120,190,210,.06)';ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.beginPath();ctx.rect(-c.w/2,-c.h/2,c.w,c.h);ctx.clip();
    ctx.strokeStyle='rgba(200,230,240,.24)';ctx.lineWidth=2;ctx.lineCap='round';
    const sp=46,off=(time*c.str*.9)%sp;
    for(let gx=-c.w/2-sp;gx<c.w/2+sp;gx+=sp)for(let gy=-c.h/2+14;gy<c.h/2;gy+=34){
      const x=gx+off+((gy*7)%13);
      ctx.beginPath();ctx.moveTo(x-8,gy-6);ctx.lineTo(x,gy);ctx.lineTo(x-8,gy+6);ctx.stroke();
    }
    ctx.restore();
    ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.a);
    ctx.setLineDash([6,8]);ctx.strokeStyle='rgba(200,230,240,.2)';ctx.lineWidth=1;ctx.strokeRect(-c.w/2,-c.h/2,c.w,c.h);
    ctx.restore();
  }
  for(const o of islands){
    const pts=k=>{
      ctx.beginPath();
      for(let i=0;i<14;i++){const an=i/14*6.283,rr=o.r*k*o.n[i],x=o.x+Math.cos(an)*rr,y=o.y+Math.sin(an)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.closePath();
    };
    pts(1.25);ctx.fillStyle='rgba(160,210,220,.14)';ctx.fill();
    pts(1.08);ctx.fillStyle='#cdbd8f';ctx.fill();
    pts(.9);ctx.fillStyle='#3f5e3b';ctx.fill();
    pts(.55);ctx.fillStyle='#2e4a30';ctx.fill();
    ctx.fillStyle='#1f3a24';
    for(let i=0;i<5;i++){
      const an=o.seed+i*1.26,rr=o.r*(.12+.3*((i*37)%10)/10);
      ctx.beginPath();ctx.arc(o.x+Math.cos(an)*rr,o.y+Math.sin(an)*rr,5,0,6.28);ctx.fill();
    }
  }
  for(const o of reefs){
    ctx.strokeStyle='rgba(233,226,207,'+(.25+.15*Math.sin(time*3+o.x))+')';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(o.x,o.y,o.r+5,0,6.28);ctx.stroke();
    ctx.fillStyle='#2b3338';ctx.beginPath();
    for(let i=0;i<7;i++){
      const an=i/7*6.283,rr=o.r*(i%2?.7:1.05),x=o.x+Math.cos(an)*rr,y=o.y+Math.sin(an)*rr;
      i?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.closePath();ctx.fill();ctx.strokeStyle='#4a565c';ctx.lineWidth=1.2;ctx.stroke();
  }
}
/* ===== 백병전 ===== */
const isP=sh=>sh===player||allies.includes(sh);
function endLink(l,broke){
  l.a.link=null;l.b.link=null;
  if(broke){l.a.nl=l.b.nl=time+1.5;}
  const i=links.indexOf(l);if(i>=0)links.splice(i,1);
}
function capture(loser,winner,l){
  endLink(l,false);loser.nl=winner.nl=time+1.2;
  boom(loser.x,loser.y,25);snd(200,.4,'triangle',.15);shake=6;
  if(loser===player){
    state='over';overMsg='기함이 적에게 나포되었다';
    if(score>best){best=score;try{localStorage.setItem('hansan-best',best)}catch(e){}}
    return;
  }
  if(enemies.includes(loser)){
    enemies=enemies.filter(e=>e!==loser);
    Object.assign(loser,{ally:true,sc:loser.big?1:.9,sol:3,hx:undefined,v:0,cd:1});
    loser.solMax=Math.max(loser.solMax,6);
    allies.push(loser);stats.captures++;recDirty=true;score+=150;gold+=60;
    fmsg='적선 나포!  +150점 · +60냥';fmsgT=2.2;
  }else{
    allies=allies.filter(a=>a!==loser);
    Object.assign(loser,{ally:false,sc:1,sol:3,spd:60,boarder:true,cd:1.5,v:0});
    enemies.push(loser);
    fmsg='부하 판옥선이 나포되었다!';fmsgT=2.2;
  }
}
function updateLinks(dt){
  /* 접현(배가 맞닿음) 판정 */
  for(const x of [player,...allies]){
    if(x.link||x.hp<=0)continue;
    for(const y of enemies){
      if(y.link||y.dead||y.hp<=0||y.type==='fire')continue;
      const dx=y.x-x.x,dy=y.y-x.y,d=Math.hypot(dx,dy);
      if(x.turtle){ /* 거북선: 백병전 불가, 밀어낸다 */
        if(d<46&&d>0){const k=(46-d)*4*dt;y.x+=dx/d*k;y.y+=dy/d*k;}
        continue;
      }
      if(time<(x.nl||0)||time<(y.nl||0))continue;
      if(d<50){
        const l={a:x,b:y,t:0,tick:.45};links.push(l);x.link=l;y.link=l;
        snd(170,.25,'square',.1);fmsg='접현! 백병전 개시';fmsgT=1.2;
        break;
      }
    }
  }
  for(const l of links.slice()){
    const a=l.a,b=l.b,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    if(a.dead||b.dead||a.hp<=0||b.hp<=0||d>80||state!=='play'){endLink(l,d>80);continue;}
    const ux=dx/d,uy=dy/d,k=(d-40)*2*dt;
    a.x+=ux*k*.5;a.y+=uy*k*.5;b.x-=ux*k*.5;b.y-=uy*k*.5;
    l.tick-=dt;
    if(l.tick<=0){
      l.tick=.55;
      const nA=Math.min(a.sol,4),nB=Math.min(b.sol,4);let la=0,lb=0;
      for(let i=0;i<nB;i++)if(Math.random()<.42)la++;
      for(let i=0;i<nA;i++)if(Math.random()<.42)lb++;
      a.sol=Math.max(0,a.sol-la);b.sol=Math.max(0,b.sol-lb);
      const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
      for(let i=0;i<5;i++)smoke(mx,my,(Math.random()-.5)*90,(Math.random()-.5)*90,.25,'#fff0b0',2);
      snd(300+Math.random()*250,.08,'square',.05);
      if(a.sol<=0&&b.sol<=0){if(Math.random()<.5)a.sol=1;else b.sol=1;}
      if(a.sol<=0)capture(a,b,l);else if(b.sol<=0)capture(b,a,l);
    }
  }
}
function drawLinks(){
  for(const l of links){
    const a=l.a,b=l.b,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,nx=-uy,ny=ux;
    const sx=a.x+ux*12,sy=a.y+uy*12,ex=b.x-ux*12,ey=b.y-uy*12;
    ctx.lineCap='butt';
    ctx.strokeStyle='#4a3119';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.strokeStyle='#b58a55';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
    ctx.strokeStyle='#7a5a35';ctx.lineWidth=1;
    for(let i=1;i<6;i++){const u=i/6,px=sx+(ex-sx)*u,py=sy+(ey-sy)*u;ctx.beginPath();ctx.moveTo(px+nx*3.5,py+ny*3.5);ctx.lineTo(px-nx*3.5,py-ny*3.5);ctx.stroke();}
    const front=.5+(a.sol-b.sol)/(a.sol+b.sol+1)*.22,pa=isP(a);
    const man=(u,i,mine)=>{
      const w=u+Math.sin(time*9+i*1.7)*.018,lat=((i%3)-1)*2.4;
      const px=sx+(ex-sx)*w+nx*lat,py=sy+(ey-sy)*w+ny*lat;
      ctx.fillStyle=mine?'#8ec5ea':'#d9604f';ctx.beginPath();ctx.arc(px,py,2.7,0,6.28);ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,.55)';ctx.lineWidth=.8;ctx.stroke();
    };
    for(let i=0;i<Math.min(a.sol,7);i++)man(Math.max(.03,front-.05-i*.06),i,pa);
    for(let i=0;i<Math.min(b.sol,7);i++)man(Math.min(.97,front+.05+i*.06),i+9,!pa);
    const mx=sx+(ex-sx)*front,my=sy+(ey-sy)*front;
    ctx.strokeStyle='#ffe9a8';ctx.lineWidth=1.6;
    for(let k=0;k<3;k++){const an=time*20+k*2.1;ctx.beginPath();ctx.moveTo(mx-Math.cos(an)*6,my-Math.sin(an)*6);ctx.lineTo(mx+Math.cos(an)*6,my+Math.sin(an)*6);ctx.stroke();}
    ctx.fillStyle='#fff';ctx.font='700 11px "Noto Sans KR",sans-serif';ctx.textAlign='center';
    ctx.fillText('백병전',(a.x+b.x)/2,(a.y+b.y)/2+34);ctx.textAlign='left';
  }
}
function shipBars(sh,mine){
  const sc=(sh.big?1.3:1)*(sh.sc||1),w=44,x0=sh.x-w/2,y0=sh.y-(22*sc+22);
  const hp=Math.max(0,Math.min(1,sh.hp/sh.max));
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x0-1,y0-1,w+2,6);
  ctx.fillStyle=hp>.5?'#c8402b':hp>.25?'#d9822b':'#e0b13a';ctx.fillRect(x0,y0,w*hp,4);
  const rd=sh.cd>0?Math.max(0,Math.min(1,1-sh.cd/(sh.cdMax||1))):1;
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x0-1,y0+6,w+2,5);
  ctx.fillStyle=sh.cd>0?'#f0c23a':'#fbeaa0';ctx.fillRect(x0,y0+7,w*rd,3);
  ctx.font='700 10px "Noto Sans KR",sans-serif';ctx.textAlign='center';
  if(sh.fire>0){ctx.fillStyle='#ff8a30';ctx.fillText('화재',sh.x,y0-4);}
  ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillText('병 '+sh.sol+'/'+sh.solMax,sh.x+.7,y0+21.7);
  ctx.fillStyle=mine?'#9ed0f0':'#f0a090';ctx.fillText('병 '+sh.sol+'/'+sh.solMax,sh.x,y0+21);
  ctx.textAlign='left';
}
/* ===== 배경음악: 평조풍 5음 선율 + 북·징 리듬 (모두 합성) ===== */
const bgm={mute:false,on:false,step:0,next:0,master:null,noise:null,timer:null};
const N={D2:73.42,A1:55,C2:65.41,D4:293.66,F4:349.23,G4:392,A4:440,C5:523.25,D5:587.33,D3:146.83,A3:220};
const MEL=[ /* [마디][ [스텝,음,길이(16분음표)] ] */
  [[0,'D4',4],[4,'F4',2],[6,'G4',2],[8,'A4',6],[14,'G4',2]],
  [[0,'F4',4],[4,'G4',2],[6,'A4',2],[8,'C5',6],[14,'A4',2]],
  [[0,'D5',4],[4,'C5',2],[6,'A4',2],[8,'G4',4],[12,'F4',4]],
  [[0,'G4',2],[2,'F4',2],[4,'D4',8],[12,'D4',4]]
];
const BASS=[[0,'D2'],[6,'D2'],[8,'A1'],[11,'C2'],[14,'D2']];
function bgmStart(){
  if(bgm.on)return;
  try{
    const A=ac();
    bgm.master=A.createGain();bgm.master.gain.value=0;bgm.master.connect(A.destination);
    const len=A.sampleRate*.4,buf=A.createBuffer(1,len,A.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    bgm.noise=buf;bgm.next=A.currentTime+.15;bgm.step=0;bgm.on=true;
    bgm.timer=setInterval(bgmTick,50);
  }catch(e){}
}
function bgmTick(){
  try{
    const A=AC;if(!A||!bgm.on)return;
    const tgt=bgm.mute?0:({play:.85,shop:.45,pause:.12,sinking:.3,over:.12,title:0})[state]??0;
    bgm.master.gain.setTargetAtTime(tgt,A.currentTime,.25);
    const dur=60/(88+Math.min(wave,8)*2)/4;
    if(bgm.next<A.currentTime-.2)bgm.next=A.currentTime+.05;
    while(bgm.next<A.currentTime+.3){bgmStep(bgm.step,bgm.next,dur);bgm.next+=dur;bgm.step++;}
  }catch(e){}
}
function tone(t,f,len,type,vol,opt){
  const A=AC,o=A.createOscillator(),g=A.createGain();
  o.type=type;o.frequency.setValueAtTime(opt&&opt.from?opt.from:f,t);
  if(opt&&opt.from)o.frequency.exponentialRampToValueAtTime(f,t+(opt.glide||.06));
  let out=g;
  if(opt&&opt.lp){const lp=A.createBiquadFilter();lp.type='lowpass';lp.frequency.value=opt.lp;g.connect(lp);out=lp;}
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+(opt&&opt.atk||.01));
  g.gain.exponentialRampToValueAtTime(.0001,t+len);
  o.connect(g);out.connect(bgm.master);
  if(opt&&opt.vib){const l=A.createOscillator(),lg=A.createGain();l.frequency.value=5.2;lg.gain.value=f*.012;l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+len+.05);}
  o.start(t);o.stop(t+len+.05);
}
function hit(t,f0,f1,len,vol){
  const A=AC,o=A.createOscillator(),g=A.createGain();
  o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+len);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
  o.connect(g);g.connect(bgm.master);o.start(t);o.stop(t+len+.02);
}
function noiseHit(t,freq,len,vol){
  const A=AC,s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();
  s.buffer=bgm.noise;f.type='bandpass';f.frequency.value=freq;f.Q.value=1.2;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+len);
  s.connect(f);f.connect(g);g.connect(bgm.master);s.start(t);s.stop(t+len+.02);
}
function bgmStep(n,t,dur){
  const bar=Math.floor(n/16)%4,s=n%16,loop=Math.floor(n/64),battle=state==='play';
  /* 북·장구 */
  if(battle){
    if([0,6,8,11].includes(s))hit(t,130,45,.28,.55);
    if(s===14)hit(t,110,50,.2,.3);
    if(s===4||s===12)noiseHit(t,1400,.09,.22);
    if(s%2===0&&s!==0)noiseHit(t,5000,.03,.05);
    if(bar===3&&s>=8&&s%2===0)hit(t,150,60,.14,.3); /* 마디 끝 북 몰아치기 */
  }else if(s===0||s===8)hit(t,100,45,.35,.25);
  /* 징 */
  if(s===0&&bar%2===0){
    const g=[0.26,0.33,0.4];
    tone(t,165,1.6,'triangle',.18,{atk:.005});tone(t,247,1.2,'sine',.08,{atk:.005});
  }
  /* 저음 */
  for(const b of BASS)if(b[0]===s)tone(t,N[b[1]],dur*4,'square',battle?.09:.05,{lp:420,atk:.01});
  /* 화음(장음 깔기) */
  if(s===0){tone(t,N.D3,dur*15,'sine',.07,{atk:.4});tone(t,N.A3,dur*15,'sine',.05,{atk:.5});}
  /* 선율: 대금/태평소 느낌 */
  for(const m of MEL[bar])if(m[0]===s){
    const f=N[m[1]]*(loop%2===1&&bar>=2?2:1);
    tone(t,f,Math.max(.2,m[2]*dur*.95),battle?'sawtooth':'triangle',battle?.07:.06,{lp:2200,vib:true,from:f*.96,glide:.07,atk:.03});
  }
}
let last=performance.now();
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(state==='play')update(dt);
  else if(state==='over'||state==='sinking'){time+=dt;if(state==='sinking'){sinkT-=dt;if(sinkT<=0)state='over';}for(const e of enemies){e.cd-=dt;}for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;}}
  else if(state==='shop'){time+=dt;shopT-=dt;}
  else time+=dt;
  fx(dt);
  if(state==='title'){player=player||{x:WW/2,y:HH-260,a:-Math.PI/2,v:0,hp:10,max:10,cd:0,hit:0,sol:10,solMax:10};}
  achT-=dt;if(achT<=0){achT=.7;checkAch();}
  toasts.forEach(t=>{t.t-=dt;});toasts=toasts.filter(t=>t.t>0);
  updateCam(dt);draw();requestAnimationFrame(loop);
}
player={x:WW/2,y:HH-260,a:-Math.PI/2,v:0,hp:10,max:10,cd:0,hit:0,sol:10,solMax:10};
updateCam(0,true);
/* 터치 조작 */
const touchUI=document.getElementById('touch');
try{if(matchMedia('(pointer: coarse)').matches||'ontouchstart' in window)touchUI.hidden=false;}catch(e){}
touchUI.querySelectorAll('[data-k]').forEach(b=>{
