<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>게임 로비</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#0d1b24;--sea:#17323f;--panel:#1f4252;--line:#35586a;
  --foam:#e9e2cf;--cinnabar:#c8402b;--gold:#d9a441;--muted:#8fa4ad;
  --f-display:"Nanum Myeongjo","Batang",serif;
  --f-body:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--foam);font-family:var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}

/* ===== 로비 ===== */
#lobby{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:40px 16px 32px;
  background:radial-gradient(1200px 500px at 50% -10%,#1b3a49 0%,transparent 70%),var(--ink)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:.12em;margin:0;text-wrap:balance;text-align:center}
.sub{color:var(--gold);font-family:var(--f-display);font-weight:700;letter-spacing:.3em;font-size:.85rem;margin:8px 0 0;text-align:center}
.grid{width:min(100%,980px);margin-top:36px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;
  background:var(--panel);border:2px solid var(--line);border-radius:6px;transition:transform .15s,border-color .15s}
.card:hover:not(:disabled),.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
.card:disabled{cursor:not-allowed;background:#14252d;border-style:dashed}
.thumb{aspect-ratio:16/9;width:100%;display:block;background:var(--sea)}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.06em}
.name small{color:var(--gold);font-size:.7rem;letter-spacing:.2em;margin-left:6px}
.desc{color:var(--muted);font-size:.88rem;line-height:1.5;margin:0}
.keys{margin-top:auto;padding-top:8px;color:var(--muted);font-size:.78rem}
.play{margin-top:10px;align-self:flex-start;background:var(--cinnabar);color:var(--foam);font-family:var(--f-display);font-weight:800;
  padding:7px 18px;border-radius:3px;letter-spacing:.1em;font-size:.95rem}
.card:disabled .play{background:#2c4652;color:#6f858e}
.badge{position:absolute;top:10px;right:10px;background:rgba(13,27,36,.85);border:1px solid var(--gold);color:var(--gold);
  font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:3px}
.last{margin-top:22px;color:var(--muted);font-size:.85rem;min-height:1.2em}
footer{margin-top:auto;padding-top:36px;color:#5d747d;font-size:.78rem;text-align:center}

/* ===== 플레이 화면 ===== */
#stage{position:fixed;inset:0;display:none;flex-direction:column;background:var(--ink);z-index:10}
#stage.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#0a151c;border-bottom:1px solid var(--line);flex:none}
.bar button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 12px;font-size:.85rem}
.bar button:hover{border-color:var(--gold)}
#title{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frame{flex:1;width:100%;border:0;background:var(--ink)}
@media (pointer:coarse){.bar{padding:4px 8px}}
</style>
</head>
<body>

<main id="lobby">
  <h1>게임 로비</h1>
  <p class="sub">GAME LOBBY</p>
  <div class="grid" id="grid"></div>
  <p class="last" id="last"></p>
  <footer>게임을 추가하려면 코드 안의 GAMES 배열에 항목을 한 줄 추가하세요.</footer>
</main>

<section id="stage" aria-label="게임 화면">
  <div class="bar">
    <button id="back">← 로비로</button>
    <span id="title"></span>
    <button id="reload" title="게임 다시 시작">↻ 새로고침</button>
    <button id="full" title="전체 화면">⛶ 전체화면</button>
  </div>
  <iframe id="frame" title="게임" allow="autoplay; fullscreen; gamepad"></iframe>
</section>

<script>

    thumb:`<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

      <rect x="24" y="24" width="272" height="132" fill="none" stroke="#0F1A33" stroke-width="3"/>
      <path d="M170 24V92M24 92H120M150 92H296" stroke="#0F1A33" stroke-width="3" fill="none"/>
      <g fill="#fff" stroke="#0F1A33" stroke-width="2"><rect x="40" y="40" width="34" height="20"/><rect x="90" y="40" width="34" height="20"/><rect x="40" y="108" width="34" height="20"/><rect x="90" y="108" width="34" height="20"/><rect x="190" y="40" width="34" height="20"/><rect x="238" y="40" width="34" height="20"/><rect x="190" y="108" width="34" height="20"/></g>

      <g fill="#F25C1F"><rect x="240" y="112" width="42" height="28" rx="3"/></g>
      <path d="M246 132l9-9 8 6 12-12" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`
  },
  {
    id:'battleground',
    title:'3D Battleground', hanja:'',
    desc:'3D 배틀로얄 서바이벌 슈터. 맵을 뒤져 총기를 찾고 마지막까지 살아남아라. 방 코드로 친구와 멀티플레이도 가능, PC와 모바일 모두 지원.',
    keys:'WASD 이동 · 마우스 시점 · Shift 달리기 · Space 점프',
    src:'games/battleground3d.html',
    ready:true,
    thumb:`<svg viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

      <rect width="320" height="110" fill="url(#bgsky)"/><rect y="110" width="320" height="70" fill="#3b4a2c"/>
      <path d="M0 110L40 92 70 104 110 84 150 106 190 88 240 104 280 86 320 100V110Z" fill="#26323a"/>

      <g fill="#c9a36a" opacity=".6"><rect x="220" y="86" width="6" height="6"/><rect x="232" y="86" width="6" height="6"/></g>
      <path d="M0 180L110 128 160 126 210 128 320 180Z" fill="#4a5a38" opacity=".55"/>
      <g stroke="#fff" stroke-width="2" opacity=".9"><path d="M160 104v8M160 120v8M146 116h8M166 116h8" /></g>
      <circle cx="160" cy="116" r="1.5" fill="#ff4637"/>
      <path d="M236 180L256 142 278 138 300 180Z" fill="#161a1d"/><rect x="268" y="138" width="40" height="8" fill="#0d0f10" transform="rotate(-14 268 138)"/>

  {

        <g fill="#e2483a"><rect x="150" y="132" width="20" height="20"/><rect x="150" y="112" width="20" height="20"/><rect x="170" y="112" width="20" height="20"/></g>
        <g fill="#3a63f0"><rect x="130" y="28" width="20" height="20"/><rect x="130" y="48" width="20" height="20"/><rect x="150" y="48" width="20" height="20"/><rect x="170" y="48" width="20" height="20"/></g>
      </g>
      <g fill="none" stroke="#3a63f0" stroke-width="2" opacity=".4"><rect x="130" y="92" width="20" height="20"/><rect x="150" y="92" width="20" height="20"/><rect x="170" y="92" width="20" height="20"/><rect x="190" y="92" width="20" height="20"/></g>
    </svg>`

];

/* ---------- 렌더링 ---------- */
const $=id=>document.getElementById(id);
const grid=$('grid'),stage=$('stage'),frame=$('frame');
let current=null;
let lastId=null;
try{lastId=localStorage.getItem('lobby-last');}catch(e){}

const defaultThumb=`<svg viewBox="0 0 320 180" xmlns="http://www.w3.org/2000/svg"><rect width="320" height="180" fill="#14252d"/>
  <g stroke="#35586a" stroke-width="2" fill="none" stroke-dasharray="6 6"><rect x="110" y="50" width="100" height="80" rx="6"/></g>
  <text x="160" y="102" text-anchor="middle" font-size="30" fill="#6f858e" font-family="serif">?</text></svg>`;

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

GAMES.forEach(g=>{
  const b=document.createElement('button');
  b.className='card';b.type='button';b.disabled=!g.ready;
  b.innerHTML=
    `<span class="thumb">${g.thumb||defaultThumb}</span>`+
    `<span class="info">`+
      `<span class="name">${esc(g.title)}${g.hanja?`<small>${esc(g.hanja)}</small>`:''}</span>`+
      `<p class="desc">${esc(g.desc)}</p>`+
      (g.keys?`<span class="keys">${esc(g.keys)}</span>`:'')+
      `<span class="play">${g.ready?'플레이':'준비 중'}</span>`+
    `</span>`+
    (g.ready?'':'<span class="badge">COMING SOON</span>');
  if(g.ready)b.addEventListener('click',()=>open(g));
  grid.appendChild(b);
});

const lastGame=GAMES.find(g=>g.id===lastId&&g.ready);
if(lastGame)$('last').textContent='최근 플레이: '+lastGame.title;

/* ---------- 게임 열기 / 닫기 ---------- */
function open(g){
  current=g;
  try{localStorage.setItem('lobby-last',g.id);}catch(e){}
  $('title').textContent=g.title;
  frame.src=g.src;
  stage.classList.add('on');
  document.body.style.overflow='hidden';
  frame.addEventListener('load',focusGame,{once:true});
}
function focusGame(){try{frame.focus();frame.contentWindow.focus();}catch(e){}}
function close(){
  stage.classList.remove('on');
  frame.src='about:blank'; /* 게임(소리·타이머)을 완전히 종료 */
  document.body.style.overflow='';
  current=null;
  const g=GAMES.find(x=>x.id===lastId)||null;
  try{lastId=localStorage.getItem('lobby-last');}catch(e){}
  const lg=GAMES.find(x=>x.id===lastId);
  if(lg)$('last').textContent='최근 플레이: '+lg.title;
}
$('back').addEventListener('click',close);
$('reload').addEventListener('click',()=>{if(current){frame.src='about:blank';setTimeout(()=>{frame.src=current.src;frame.addEventListener('load',focusGame,{once:true});},50);}});
$('full').addEventListener('click',()=>{
  const el=stage;
  if(document.fullscreenElement)document.exitFullscreen();
  else if(el.requestFullscreen)el.requestFullscreen().then(focusGame).catch(()=>{});
});
/* 게임 안에서 Esc 는 게임이 쓰므로, 로비 복귀는 상단 버튼으로만 */
</script>
</body>
</html>
