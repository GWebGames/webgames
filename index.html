<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>게임 로비</title>
<script>try{var __t=localStorage.getItem('lobby-theme');document.documentElement.setAttribute('data-theme',__t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#0d1b24;--sea:#17323f;--panel:#1f4252;--line:#35586a;
  --foam:#e9e2cf;--cinnabar:#c8402b;--gold:#d9a441;--muted:#8fa4ad;
  /* 테마용 추가 변수 (다크 값 = 기존 로비 디자인) */
  --on-accent:#e9e2cf;--gold-on:#10202a;--glow:#1b3a49;--shade:rgba(13,27,36,.55);--chip:rgba(13,27,36,.85);--chip2:rgba(13,27,36,.88);
  --dis-bg:#14252d;--dis-play-bg:#2c4652;--dis-play-fg:#6f858e;--meter-bg:rgba(255,255,255,.08);
  --ok:#8fd6a8;--warn:#f0a89c;--foot:#5d747d;--card-shadow:none;--bar:#0a151c;
  --f-display:"Nanum Myeongjo","Batang",serif;
  --f-body:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
/* ===== 라이트 모드 (기본) — 다크 모드는 위 :root 값 = 기존 디자인 ===== */
:root[data-theme="light"]{
  --ink:#f7f3e8;--sea:#e1ebee;--panel:#ffffff;--line:#d3dbd9;
  --foam:#17323f;--gold:#96690f;--muted:#587079;
  --on-accent:#ffffff;--gold-on:#ffffff;--glow:#fff0c9;--shade:rgba(23,50,63,.22);--chip:rgba(255,255,255,.92);--chip2:rgba(255,255,255,.92);
  --dis-bg:#ece7da;--dis-play-bg:#ddd8c9;--dis-play-fg:#8a9a9f;--meter-bg:rgba(23,50,63,.1);
  --ok:#1f8a4c;--warn:#b3392a;--foot:#7d8e94;--card-shadow:0 2px 10px -4px rgba(23,50,63,.2);--bar:#ece6d5;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--foam);font-family:var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer}

/* ===== 로비 ===== */
#lobby{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:40px 16px 32px;
  background:radial-gradient(1200px 500px at 50% -10%,var(--glow) 0%,transparent 70%),var(--ink)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,5vw,2.6rem);letter-spacing:.12em;margin:0;text-wrap:balance;text-align:center}
.sub{color:var(--gold);font-family:var(--f-display);font-weight:700;letter-spacing:.3em;font-size:.85rem;margin:8px 0 0;text-align:center}
.grid{width:min(100%,980px);margin-top:36px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;
  background:var(--panel);border:2px solid var(--line);border-radius:6px;transition:transform .15s,border-color .15s}
.card:hover:not(:disabled),.card:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
.card:disabled{cursor:not-allowed;background:#14252d;border-style:dashed}
.thumb{position:relative;overflow:hidden;aspect-ratio:16/9;width:100%;display:block;background:var(--sea)}
.thumb svg{display:block;width:100%;height:100%}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s}
.card:hover:not(:disabled) .thumb img{transform:scale(1.05)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgba(13,27,36,.55));pointer-events:none}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:.06em}
.name small{color:var(--gold);font-size:.7rem;letter-spacing:.2em;margin-left:6px}
.desc{color:var(--muted);font-size:.88rem;line-height:1.5;margin:0}
.keys{margin-top:auto;padding-top:8px;color:var(--muted);font-size:.78rem}
.play{margin-top:10px;align-self:flex-start;background:var(--cinnabar);color:var(--foam);font-family:var(--f-display);font-weight:800;
  padding:7px 18px;border-radius:3px;letter-spacing:.1em;font-size:.95rem}
.card:disabled .play{background:#2c4652;color:#6f858e}
.badge{position:absolute;top:10px;right:10px;background:rgba(13,27,36,.85);border:1px solid var(--gold);color:var(--gold);
  font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:3px}
.last{margin-top:22px;color:var(--muted);font-size:.85rem;min-height:1.2em}
footer{margin-top:auto;padding-top:36px;color:#5d747d;font-size:.78rem;text-align:center}


/* ===== 실시간 인기 TOP 3 ===== */
.hot{width:min(100%,980px);margin-top:30px}
.hot-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.hot-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.hot-head h2 b{background:var(--cinnabar);color:var(--foam);font-size:.72rem;letter-spacing:.14em;padding:3px 8px;border-radius:3px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--muted)}
.live i{width:8px;height:8px;border-radius:50%;background:#6f858e}
.live.on{color:#8fd6a8}.live.on i{background:#4fd186;box-shadow:0 0 0 0 rgba(79,209,134,.6);animation:ping 1.8s infinite}
.live.demo{color:var(--gold)}.live.demo i{background:var(--gold)}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(79,209,134,0)}100%{box-shadow:0 0 0 0 rgba(79,209,134,0)}}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pod{position:relative;display:flex;flex-direction:column;text-align:left;padding:0;overflow:hidden;background:var(--panel);border:2px solid var(--line);border-radius:6px;transition:transform .15s,border-color .15s}
.pod:hover,.pod:focus-visible{transform:translateY(-3px);border-color:var(--gold);outline:none}
.pod.r1{border-color:var(--gold);box-shadow:0 0 0 1px rgba(217,164,65,.35),0 10px 30px -12px rgba(217,164,65,.45)}
.pod .thumb{aspect-ratio:16/9}
.rank{position:absolute;top:10px;left:10px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:#10202a;border:2px solid rgba(13,27,36,.7)}
.r1 .rank{background:var(--gold)}.r2 .rank{background:#c3ccd1}.r3 .rank{background:#c98a5c}
.pod .info{gap:4px;padding:12px 14px 14px}
.pod .pname{font-family:var(--f-display);font-weight:800;font-size:1.1rem;letter-spacing:.05em}
.pod .pcnt{display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:.8rem}
.pod .pcnt strong{color:var(--foam);font-family:var(--f-display);font-size:1.25rem;letter-spacing:.03em}
.pod .meter{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:6px;overflow:hidden}
.pod .meter span{display:block;height:100%;background:var(--cinnabar);transition:width .6s}
.pod.r1 .meter span{background:var(--gold)}
.flash{animation:flash .9s}
@keyframes flash{0%{color:var(--gold);transform:scale(1.12)}100%{color:var(--foam);transform:none}}
.hot-empty{padding:22px;border:2px dashed var(--line);border-radius:6px;color:var(--muted);text-align:center;font-size:.92rem;line-height:1.6}
.cnt{font-size:.74rem;color:var(--muted);margin-left:auto;align-self:center}
.cardfoot{display:flex;align-items:center;margin-top:10px}
.cardfoot .play{margin-top:0}
.now[hidden]{display:none}
.authbar{width:min(100%,980px);display:flex;justify-content:flex-end;align-items:center;gap:10px;min-height:34px;margin-bottom:6px}
.authbar[hidden]{display:none}
.authbar .abtn{font:inherit;font-size:.82rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--foam);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.authbar .abtn:hover{border-color:var(--gold)}
.authbar .abtn svg{width:16px;height:16px}
.authbar .who{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:var(--foam)}
.authbar .who img{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--sea)}
.authbar .amsg{font-size:.76rem;color:#f0a89c}
.authbar .out{background:none;border:0;color:var(--muted);font-size:.78rem;text-decoration:underline;cursor:pointer;padding:0}
.mine{font-size:.74rem;color:var(--gold);white-space:nowrap}
.mine:empty{display:none}
.sortbar{width:min(100%,980px);margin-top:30px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sortbar .lab{font-size:.8rem;color:var(--muted);margin-right:4px}
.sortbar button{font:inherit;font-size:.82rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line,#35586a);background:transparent;color:var(--muted);cursor:pointer;transition:.15s}
.sortbar button:hover{color:#fff;border-color:#6f9db3}
.sortbar button[aria-pressed="true"]{background:#e8c36a;border-color:#e8c36a;color:#10202a;font-weight:700}
.sortbar+.grid{margin-top:14px}
.now.zero{color:var(--muted)}
.now.zero::before{background:#5b6b78;animation:none}
.now{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;color:#8fd6a8;white-space:nowrap}
.now::before{content:"";width:7px;height:7px;border-radius:50%;background:#4fd186;animation:ping 1.8s infinite}
.cardfoot{flex-wrap:wrap;gap:6px 12px}
.pod .now{margin-top:2px}
.mini{position:absolute;top:10px;left:10px;z-index:2;background:rgba(13,27,36,.88);border:1px solid var(--gold);color:var(--gold);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:3px}
@media (max-width:760px){.podium{grid-template-columns:1fr}.pod{flex-direction:row}.pod .thumb{width:44%;flex:none;aspect-ratio:16/10}.pod .info{justify-content:center}}
@media (prefers-reduced-motion:reduce){.live.on i,.flash,.now::before{animation:none}.pod,.card,.thumb img{transition:none}}

/* ===== 테마 보정 (하드코딩 색 → 변수) ===== */
.card,.pod{box-shadow:var(--card-shadow)}
.card:disabled{background:var(--dis-bg)}
.card:disabled .play{background:var(--dis-play-bg);color:var(--dis-play-fg)}
.thumb::after{background:linear-gradient(180deg,transparent 60%,var(--shade))}
.badge{background:var(--chip)}
.mini{background:var(--chip2)}
.play,.hot-head h2 b{color:var(--on-accent)}
.pod .meter{background:var(--meter-bg)}
.live.on{color:var(--ok)}
.now{color:var(--ok)}
.authbar .amsg{color:var(--warn)}
.sortbar button:hover{color:var(--foam)}
footer{color:var(--foot)}
footer b{color:var(--muted);font-weight:700}
/* 게임 플레이 화면도 선택한 라이트/다크 모드를 따라가요 */
#stage{color:var(--foam)}

/* ===== 테마 전환 버튼 ===== */
.themebtn{position:fixed;top:12px;right:12px;z-index:5;display:inline-flex;align-items:center;gap:7px;font-size:.8rem;padding:7px 13px;
  border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--foam);box-shadow:var(--card-shadow);transition:border-color .15s}
.themebtn:hover,.themebtn:focus-visible{border-color:var(--gold);outline:none}
.themebtn svg{width:16px;height:16px;flex:none}

/* ===== 공지 · 패치노트 게시판 ===== */
.board{width:min(100%,980px);margin-top:30px}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.board-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.board-head h2 b{background:var(--gold);color:var(--gold-on);font-size:.72rem;letter-spacing:.14em;padding:3px 8px;border-radius:3px}
.board-cnt{font-size:.78rem;color:var(--muted)}
.notes{display:flex;flex-direction:column;gap:8px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--card-shadow);overflow:hidden;transition:border-color .15s}
.note:hover,.note[open]{border-color:var(--gold)}
.note.pinned{border-left:4px solid var(--gold)}
.note summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px 10px;padding:12px 14px;flex-wrap:wrap}
.note summary::-webkit-details-marker{display:none}
.note summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
.note[open] summary::after{transform:rotate(180deg)}
.note summary:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.ntag{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:3px;color:#fff;background:#587079;white-space:nowrap}
.ntag[data-t="패치"]{background:#c8402b}
.ntag[data-t="공지"]{background:var(--gold);color:var(--gold-on)}
.ntag[data-t="이벤트"]{background:#2f9e5f}
.ntag[data-t="점검"]{background:#3a63f0}
.nnew,.npin{font-size:.66rem;font-weight:700;padding:1px 6px;border-radius:3px;letter-spacing:.08em;white-space:nowrap}
.nnew{background:var(--cinnabar);color:var(--on-accent)}
.npin{border:1px solid var(--gold);color:var(--gold)}
.ntitle{font-weight:700;flex:1 1 200px;min-width:0;line-height:1.4}
.nver{font-size:.74rem;color:var(--gold);font-weight:700;white-space:nowrap}
.ndate{font-size:.76rem;color:var(--muted);white-space:nowrap}
.nbody{padding:4px 16px 16px;border-top:1px dashed var(--line);font-size:.9rem;line-height:1.7}
.nbody h4{margin:14px 0 2px;font-size:.82rem;letter-spacing:.08em;color:var(--gold)}
.nbody ul{margin:4px 0 0;padding-left:1.15em}
.nbody li::marker{color:var(--gold)}
.nbody p{margin:10px 0 0}
.morebtn{display:block;margin:12px auto 0;font:inherit;font-size:.82rem;padding:7px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);transition:.15s}
.morebtn:hover{border-color:var(--gold);color:var(--foam)}
.morebtn[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.note,.themebtn,.note summary::after{transition:none}}

/* ===== 플레이어 랭킹 ===== */
.lb{width:min(100%,980px);margin-top:30px}
.lb[hidden]{display:none}
.lb-head{display:flex;align-items:center;justify-content:space-between;gap:6px 12px;margin-bottom:12px;flex-wrap:wrap}
.lb-head h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.lb-head h2 b{background:var(--gold);color:var(--gold-on);font-size:.72rem;letter-spacing:.14em;padding:3px 8px;border-radius:3px}
.lb-note{font-size:.76rem;color:var(--muted)}
.rk-list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(5,auto);grid-auto-flow:column;gap:8px 16px}
.rk{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:4px 12px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--card-shadow)}
.rk.me{border-color:var(--gold)}
.rk-no{grid-row:1/3;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--sea);color:var(--foam)}
.rk.r1 .rk-no{background:#d9a441;color:#10202a}.rk.r2 .rk-no{background:#c3ccd1;color:#10202a}.rk.r3 .rk-no{background:#c98a5c;color:#10202a}
.rk-name{font-weight:700;letter-spacing:.08em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-name i{font-style:normal;margin-left:8px;font-size:.66rem;font-weight:800;letter-spacing:.06em;background:var(--cinnabar);color:var(--on-accent);padding:2px 6px;border-radius:3px}
.rk-n{font-size:.8rem;color:var(--muted);white-space:nowrap}
.rk-n strong{color:var(--foam);font-family:var(--f-display);font-size:1.1rem;margin-right:2px}
.rk-bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--meter-bg);overflow:hidden}
.rk-bar span{display:block;height:100%;background:var(--cinnabar);transition:width .6s}
.rk.r1 .rk-bar span{background:var(--gold)}
.rk-list .hot-empty{grid-column:1/-1;grid-row:1}
@media (max-width:760px){.rk-list{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}}
@media (prefers-reduced-motion:reduce){.rk-bar span{transition:none}}

/* ===== 검색 · 태그 필터 · 즐겨찾기 ===== */
.card[hidden]{display:none}
.filterbar{width:min(100%,980px);margin-top:12px;display:flex;flex-direction:column;gap:10px}
.filterbar+.grid{margin-top:14px}
.searchbox{position:relative;display:flex;align-items:center}
.searchbox svg{position:absolute;left:13px;width:17px;height:17px;color:var(--muted);pointer-events:none}
.searchbox input{width:100%;font:inherit;font-size:.92rem;padding:10px 38px 10px 38px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--foam);box-shadow:var(--card-shadow)}
.searchbox input::placeholder{color:var(--muted)}
.searchbox input:focus{outline:2px solid var(--gold);outline-offset:1px}
.searchbox input::-webkit-search-cancel-button{display:none}
.searchbox .qx{position:absolute;right:8px;width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1}
.searchbox .qx:hover{color:var(--foam)}
.searchbox .qx[hidden]{display:none}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chips button{font:inherit;font-size:.8rem;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);transition:.15s}
.chips button small{margin-left:5px;font-size:.72rem;opacity:.75}
.chips button:hover{border-color:var(--gold);color:var(--foam)}
.chips button[aria-pressed="true"]{background:var(--foam);border-color:var(--foam);color:var(--ink);font-weight:700}
.chips button[data-k="__fav"][aria-pressed="true"]{background:#e8c36a;border-color:#e8c36a;color:#10202a}
.fcount{font-size:.76rem;color:var(--muted)}
.nores{width:min(100%,980px);margin:18px 0 0}
.nores[hidden]{display:none}
.nores button{font:inherit;font-size:.82rem;margin-top:8px;padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--foam)}
.nores button:hover{border-color:var(--gold)}
.fav{position:absolute;right:10px;bottom:10px;z-index:3;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--chip);border:1px solid var(--line);color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;transition:transform .15s,color .15s,border-color .15s}
.fav:hover,.fav:focus-visible{color:var(--gold);border-color:var(--gold);outline:none;transform:scale(1.1)}
.fav.on{color:#f5b301;border-color:#f5b301}
@media (prefers-reduced-motion:reduce){.fav{transition:none}}

/* ===== 닉네임 설정 창 ===== */
/* ---------- 빠른 이동 · 프로필 · 안 읽은 공지 ---------- */
.quick{width:min(100%,980px);margin-top:26px;display:flex;gap:8px;flex-wrap:wrap}
.quick button{font:inherit;font-size:.86rem;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--foam);cursor:pointer;transition:.15s}
.quick button:hover{border-color:var(--gold)}
.quick button[hidden]{display:none}
.quick .qgo{background:var(--cinnabar);border-color:var(--cinnabar);color:var(--on-accent);font-weight:700}
.quick .qgo:hover{filter:brightness(1.08);border-color:var(--cinnabar)}
.quick+.sortbar{margin-top:14px}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cinnabar);margin-left:6px;vertical-align:middle}
.authbar .out{position:relative}
.authbar .udot{position:absolute;top:2px;right:2px;margin:0}
.note .udot{margin:0 6px 0 0}
#profDlg{background:var(--panel);color:var(--foam);border:2px solid var(--line);border-radius:8px;padding:22px;width:min(94vw,520px);max-height:88vh;overflow:auto;box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
#profDlg::backdrop{background:rgba(5,12,18,.6)}
#profDlg h3{margin:0 0 4px;font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:.06em}
#profDlg h4{margin:18px 0 8px;font-size:.9rem;color:var(--gold)}
#profDlg .pf-sub{margin:0;color:var(--muted);font-size:.82rem}
#profDlg .pf-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
#profDlg .pf-stat{border:1px solid var(--line);border-radius:6px;padding:10px 8px;text-align:center}
#profDlg .pf-stat b{display:block;font-size:1.25rem}
#profDlg .pf-stat span{font-size:.74rem;color:var(--muted)}
#profDlg .pf-games{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#profDlg .pf-games li{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:.82rem}
#profDlg .pf-bar{height:8px;border-radius:4px;background:var(--ink);overflow:hidden}
#profDlg .pf-bar i{display:block;height:100%;background:var(--gold)}
#profDlg .pf-games em{font-style:normal;text-align:right;color:var(--muted)}
#profDlg .pf-badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
#profDlg .bd{border:1px solid var(--line);border-radius:6px;padding:10px;font-size:.78rem;opacity:.55;position:relative}
#profDlg .bd.on{opacity:1;border-color:var(--gold)}
#profDlg .bd b{display:block;font-size:.88rem;margin-bottom:2px}
#profDlg .bd span{color:var(--muted)}
#profDlg .bd .bdn{position:absolute;top:6px;right:8px;font-size:.66rem;font-weight:800;color:var(--on-accent);background:var(--cinnabar);padding:1px 6px;border-radius:999px}
#profDlg .bd .bdp{display:block;height:4px;border-radius:2px;background:var(--ink);margin-top:6px;overflow:hidden}
#profDlg .bd .bdp i{display:block;height:100%;background:var(--muted)}
#profDlg .pf-close{margin-top:16px;text-align:right}
#profDlg .pf-close button{font:inherit;font-size:.86rem;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
footer .flinks{margin-top:6px}
footer .flinks a{color:inherit;text-decoration:underline;margin:0 6px}
footer .flinks a:hover{color:var(--foam)}
#nickDlg{background:var(--panel);color:var(--foam);border:2px solid var(--line);border-radius:8px;padding:22px;width:min(92vw,380px);box-shadow:0 20px 50px -10px rgba(0,0,0,.5)}
#nickDlg::backdrop{background:rgba(5,12,18,.6)}
#nickDlg h3{margin:0 0 6px;font-family:var(--f-display);font-weight:800;font-size:1.2rem;letter-spacing:.06em}
#nickDlg .nd-sub{margin:0 0 14px;color:var(--muted);font-size:.82rem;line-height:1.55}
#nickDlg input{width:100%;font:inherit;font-size:1rem;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--ink);color:var(--foam)}
#nickDlg input:focus{outline:2px solid var(--gold);outline-offset:1px}
#nickDlg .nd-err{min-height:1.2em;margin:6px 0 0;color:var(--warn);font-size:.8rem}
#nickDlg .nd-btns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
#nickDlg .nd-btns button{font:inherit;font-size:.86rem;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted)}
#nickDlg .nd-btns button:hover{border-color:var(--gold);color:var(--foam)}
#nickDlg .nd-btns .primary{background:var(--cinnabar);border-color:var(--cinnabar);color:var(--on-accent);font-weight:700}
#nickDlg .nd-btns .primary:hover{color:var(--on-accent);filter:brightness(1.08)}

/* ===== 게임 이름 옆 라벨 (NEW / UPDATE / BIG UPDATE) ===== */
.glabel{display:inline-block;vertical-align:middle;margin-left:8px;font-family:var(--f-body);font-size:.66rem;font-weight:800;letter-spacing:.08em;
  line-height:1;padding:4px 7px;border-radius:3px;color:#fff;white-space:nowrap;text-transform:uppercase}
.glabel[data-l="new"]{background:#2f9e5f}
.glabel[data-l="update"]{background:#3a63f0}
.glabel[data-l="beta"],.glabel[data-l="beta_test"]{background:#7c3aed;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.glabel[data-l="big_update"]{background:linear-gradient(135deg,#c8402b,#e0791f);box-shadow:0 0 0 1px rgba(217,164,65,.7),0 0 12px -2px rgba(224,121,31,.7);animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 1px rgba(217,164,65,.9),0 0 18px 0 rgba(224,121,31,.95)}}
@media (prefers-reduced-motion:reduce){.glabel{animation:none!important}}

/* ===== 플레이 화면 ===== */
#stage{position:fixed;inset:0;display:none;flex-direction:column;background:var(--ink);z-index:10}
#stage.on{display:flex}
.bar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.bar button{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:5px 12px;font-size:.85rem}
.bar button:hover{border-color:var(--gold)}
#title{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#frame{flex:1;width:100%;border:0;background:var(--ink)}
@media (pointer:coarse){.bar{padding:4px 8px}}
</style>
</head>

<button type="button" class="themebtn" id="themeBtn" aria-label="화면 모드 전환"></button>

<main id="lobby">
  <div class="authbar" id="authbar" hidden></div>
  <h1>게임 로비</h1>

  <section class="hot" id="hot" aria-label="실시간 인기 게임 TOP 3">

  </section>

    <ol class="rk-list" id="rkList"></ol>
  </section>
  <div class="quick" id="quick">
    <button type="button" class="qgo" id="btnContinue" hidden></button>
    <button type="button" id="btnRandom">🎲 랜덤 게임</button>
  </div>
  <div class="sortbar" id="sortbar" role="group" aria-label="게임 정렬">
    <span class="lab">정렬</span>
    <button type="button" data-sort="default" aria-pressed="true">기본순</button>
    <button type="button" data-sort="total" aria-pressed="false">누적 인기순</button>
    <button type="button" data-sort="live" aria-pressed="false">실시간 인기순</button>
  </div>
  <div class="filterbar" id="filterbar">
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="게임 검색 (이름 · 설명 · 태그)" aria-label="게임 검색" autocomplete="off" enterkeyhint="search">
      <button type="button" class="qx" id="qClear" aria-label="검색어 지우기" hidden>×</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="태그로 거르기"></div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="nores hot-empty" id="noRes" hidden></div>
  <p class="last" id="last"></p>
  <footer>게임 관련 오류 제보/자기 게임 업로드 신청은 <b>dolgodora7942@gmail.com</b>으로<div class="flinks" id="flinks" hidden></div></footer>
</main>

<dialog id="profDlg" aria-labelledby="profTitle"><h3 id="profTitle">내 프로필</h3><div id="profBody"></div><div class="pf-close"><button type="button" id="profClose">닫기</button></div></dialog>

<dialog id="nickDlg" aria-labelledby="nickTitle">
  <form id="nickForm" autocomplete="off">
    <h3 id="nickTitle">닉네임 설정</h3>
    <p class="nd-sub" id="nickSub">순위표와 로비에 표시돼요. 2~12자, 한글·영문·숫자·공백·_ - . 만 쓸 수 있어요.</p>
    <input id="nickInput" type="text" maxlength="12" placeholder="닉네임" aria-label="닉네임">
    <p class="nd-err" id="nickErr" role="alert"></p>
    <div class="nd-btns">
      <button type="button" id="nickReset">기본 이름 사용</button>
      <button type="button" id="nickCancel">취소</button>
      <button type="submit" class="primary">저장</button>
    </div>
  </form>
</dialog>

<section id="stage" aria-label="게임 화면">
  <div class="bar">
    <button id="back">← 로비로</button>

</section>

const LABELS={new:'NEW',update:'UPDATE',big_update:'BIG UPDATE',beta:'BETA TEST',beta_test:'BETA TEST'};
const LABEL_KEEP={beta:1,beta_test:1}; /* 이 라벨들은 labelDate 와 상관없이 사라지지 않아요 (베타가 끝나면 label 에서 직접 지우세요) */ /* 'none' 은 여기에 없으므로 라벨 없음 */
const LABEL_DAYS=3; /* 라벨을 단 날(labelDate)부터 며칠 동안 보여줄지 */
function labelAlive(g){
  const m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(g.labelDate||'').trim());
  if(!m)return true; /* 날짜가 없으면 계속 표시 */
  const start=new Date(+m[1],+m[2]-1,+m[3]).getTime();
  return Date.now()<start+LABEL_DAYS*864e5;
}
function labelHTML(g){
  const alive=labelAlive(g);
  const raw=Array.isArray(g.label)?g.label:String(g.label||'').split(/[,|+]/); /* 'new,update' 또는 ['new','update'] */
  const seen={};
  return raw.map(x=>String(x).trim().toLowerCase().replace(/[\s-]+/g,'_')).filter(k=>LABELS[k]&&(alive||LABEL_KEEP[k])&&!seen[k]&&(seen[k]=1))
    .map(k=>`<span class="glabel" data-l="${k}">${LABELS[k]}</span>`).join('');
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  const bodyHTML=b=>{
    const lines=(Array.isArray(b)?b:String(b||'').split('\n')).map(s=>String(s).trim()).filter(Boolean);

    for(const ln of lines){

  };
  const nid=n=>String(n.date||'')+'|'+String(n.title||'');

  const unread=()=>list.filter(n=>!seenN.includes(nid(n))).length;
  const paintCnt=()=>{const u=unread();$('boardCnt').textContent='총 '+list.length+'건'+(u?' · 안 읽은 공지 '+u:'');};
  paintCnt();
  list.forEach((n,k)=>{

    const isUn=!seenN.includes(nid(n));
    d.className='note'+(n.pin?' pinned':'');if(k===0)d.open=true;if(k>=NOTICE_VISIBLE){d.hidden=true;d.dataset.extra='1';}

      `<div class="nbody">${bodyHTML(n.body)}</div>`;

/* ============================================================
   실시간 인기 TOP 3 — 모든 방문자의 "플레이" 횟수를 서버(Firebase Realtime Database)에 모아서 보여줘요.
   FIREBASE_URL 에 데이터베이스 주소를 넣으면 켜져요. (예: 'https://내프로젝트-default-rtdb.firebaseio.com')
   비워두면 순위 대신 안내 문구만 보이고, 주소 뒤에 ?demo 를 붙이면(예: index.html?demo) 가짜 데이터로 미리 볼 수 있어요.
   ============================================================ */
const FIREBASE_URL='https://game-user-traffic-default-rtdb.asia-southeast1.firebasedatabase.app';
const DEMO=/[?&]demo(=|&|$)/.test(location.search);
const COUNT_COOLDOWN=5*60*1000; /* 같은 사람이 같은 게임을 5분 안에 다시 눌러도 1번만 집계 */
const liveEl=$('liveState'),podium=$('podium');
let plays={},podKey='';
const fmt=n=>(+n||0).toLocaleString('ko-KR');
function setLive(cls,text){liveEl.className='live'+(cls?' '+cls:'');liveEl.lastElementChild.textContent=text;}

function ranked(){
  return GAMES.map((g,i)=>({g,n:+plays[g.id]||0,i})).filter(x=>x.g.ready&&x.n>0)
    .sort((a,b)=>b.n-a.n||a.i-b.i).slice(0,3);
}
function thumbHTML(g){return `<span class="thumb">${g.thumb||defaultThumb}<img src="thumbs/${g.id}.jpg" alt="" onerror="this.remove()"></span>`;}

function renderStats(){
  /* 카드마다 플레이 횟수 + TOP3 표시 */
  document.querySelectorAll('[data-cnt]').forEach(el=>{const n=+plays[el.dataset.cnt]||0;el.textContent=n?'▶ '+fmt(n)+'회 플레이':'';});
  sortGrid();
  const top=ranked();
  document.querySelectorAll('.card .mini').forEach(m=>m.remove());
  top.forEach((x,k)=>{const c=grid.querySelector(`[data-id="${x.g.id}"] .thumb`);if(c){const m=document.createElement('span');m.className='mini';m.textContent='TOP '+(k+1);c.appendChild(m);}});

  /* 맨 위 TOP 3 */
  if(!top.length){
    podKey='';
    podium.innerHTML=`<div class="hot-empty" style="grid-column:1/-1">${(FIREBASE_URL||DEMO)
      ?'아직 플레이 기록이 없어요.<br>첫 번째 플레이어가 되어 1위를 차지해 보세요!'
      :'실시간 인기 순위가 곧 열려요.<br>모두가 가장 많이 플레이한 게임 TOP 3가 여기에 표시됩니다.'}</div>`;
    updateNow();
    return;
  }
  const key=top.map(x=>x.g.id).join('|'),max=top[0].n;
  if(key!==podKey){
    podKey=key;
    podium.innerHTML='';
    top.forEach((x,k)=>{
      const b=document.createElement('button');b.type='button';b.className='pod r'+(k+1);b.dataset.id=x.g.id;
      b.innerHTML=`<span class="rank">${k+1}</span>${thumbHTML(x.g)}`+
        `<span class="info"><span class="pname">${esc(x.g.title)}${labelHTML(x.g)}</span>`+
        `<span class="pcnt"><strong data-n>${fmt(x.n)}</strong>회 플레이</span>`+`<span class="now" data-now="${x.g.id}" hidden></span>`+
        `<span class="meter"><span style="width:${Math.max(6,x.n/max*100)}%"></span></span></span>`;
      b.addEventListener('click',()=>openGame(x.g));
      podium.appendChild(b);
    });
  }else{
    top.forEach(x=>{
      const b=podium.querySelector(`[data-id="${x.g.id}"]`);if(!b)return;
      const st=b.querySelector('[data-n]'),t=fmt(x.n);
      if(st.textContent!==t){st.textContent=t;st.classList.remove('flash');void st.offsetWidth;st.classList.add('flash');}
      b.querySelector('.meter span').style.width=Math.max(6,x.n/max*100)+'%';
    });
  }
  updateNow();
}

/* 플레이 시작할 때 서버 숫자를 +1 (서버가 직접 더해서 동시에 눌러도 정확해요) */
function track(g){
  if(!DEMO&&!FIREBASE_URL)return;
  let seen={};try{seen=JSON.parse(localStorage.getItem('lobby-seen')||'{}');}catch(e){}
  const now=Date.now();if(now-(seen[g.id]||0)<COUNT_COOLDOWN)return;
  seen[g.id]=now;try{localStorage.setItem('lobby-seen',JSON.stringify(seen));}catch(e){}
  plays[g.id]=(+plays[g.id]||0)+1;renderStats();
  if(me){mine[g.id]=(+mine[g.id]||0)+1;renderMine();if(typeof renderAuth==='function')renderAuth();userPut('/plays/'+encodeURIComponent(g.id),{'.sv':{increment:1}});userPut('/seen/'+encodeURIComponent(g.id),now);pushRank();}
  if(DEMO)return;
  fetch(`${FIREBASE_URL}/plays/${encodeURIComponent(g.id)}.json`,{method:'PUT',body:JSON.stringify({'.sv':{increment:1}}),keepalive:true}).catch(()=>{});
}

const G_ICON='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.5 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';

      Promise.resolve(authApi.signIn()).catch(e=>{
        const c=(e&&e.code)||'';
        if(c==='auth/popup-closed-by-user'||c==='auth/cancelled-popup-request')return;

function renderMine(){
  document.querySelectorAll('[data-mine]').forEach(el=>{const n=me?(+mine[el.dataset.mine]||0):0;el.textContent=n?'내 '+fmt(n)+'회':'';});
}
async function userReq(path,method,body){
  if(!me)return null;
  const t=await me.getToken();
  const payload=body===undefined?undefined:JSON.stringify(body);
  const r=await fetch(`${FIREBASE_URL}/users/${encodeURIComponent(me.uid)}${path}.json?auth=${encodeURIComponent(t)}`,{method:method||'GET',body:payload,keepalive:!!payload&&payload.length<60000});
  if(!r.ok)throw 0;return r.json();
}
function userPut(path,body){userReq(path,'PUT',body).catch(()=>{});}
async function loadMine(){
  try{
    const d=(await userReq(''))||{};
    mine=d.plays||{};
    /* 계정에 저장된 "마지막 집계 시각"을 이 브라우저 기록과 합쳐요 → 기기를 바꿔도 연속 집계가 안 돼요 */
    let seen={};try{seen=JSON.parse(localStorage.getItem('lobby-seen')||'{}');}catch(e){}
    for(const k in d.seen||{})seen[k]=Math.max(+seen[k]||0,+d.seen[k]||0);
    try{localStorage.setItem('lobby-seen',JSON.stringify(seen));}catch(e){}
  }catch(e){mine={};}
  renderMine();
  pushRank();
}
/* ---------- 게임 기록 동기화 (로그인한 사람만) ----------
   게임들은 최고 기록·저장 데이터를 이 브라우저(localStorage)에 저장해요. 로비와 게임은 같은 주소라서 로비가 그걸 읽어
   내 계정에 백업하고, 다른 기기·브라우저에서 로그인하면 내려받아요.
   ※ 새 게임이 localStorage 에 저장하는 키가 있으면 아래 SYNC_KEYS 에 이름을 추가하세요. */
const SYNC_KEYS=['hansan-best','hansan-rec','exam_stock_best_score','bg3d_nick','bg3d_mode','tetris-muted','tetris-best','sb-unlocked','itTycoon.v1','gwanak_story_v1','hb_pv','hb_fv','lobby-nick','lobby-favs','pd_save2','pd_sb','rest_in_server_v1','rhythm_boat_fishing_v1','lobby-badges-seen','pogeun_farm_v1'];
const SYNC_MAX=300000; /* 키 하나당 최대 글자 수 */
const encKey=k=>k.replace(/\./g,'__dot__');
const hashStr=v=>{if(v==null)return null;let h=5381;for(let i=0;i<v.length;i++)h=((h<<5)+h+v.charCodeAt(i))|0;return v.length+':'+h;};
function loadMeta(){try{const m=JSON.parse(localStorage.getItem('lobby-syncmeta')||'null');if(m&&m.h)return m;}catch(e){}return {uid:null,t:0,h:{}};}
function saveMeta(m){try{localStorage.setItem('lobby-syncmeta',JSON.stringify(m));}catch(e){}}
const lget=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
function wipeLocal(){SYNC_KEYS.forEach(k=>{try{localStorage.removeItem(k);}catch(e){}});try{localStorage.removeItem('lobby-syncmeta');}catch(e){}try{refreshFavs();}catch(e){}}
let syncing=false,pushTimer=null;
async function syncDown(){
  if(!me||syncing)return;syncing=true;
  try{
    const remote=(await userReq('/save'))||{};
    let meta=loadMeta();
    if(meta.uid&&meta.uid!==me.uid){wipeLocal();meta={uid:null,t:0,h:{}};} /* 다른 계정이 쓰던 기기 → 그 기록은 지우고 내 기록만 */
    const same=meta.uid===me.uid,push={};
    for(const k of SYNC_KEYS){
      const r=remote[encKey(k)],l=lget(k),lh=hashStr(l),mh=same?meta.h[k]:undefined;
      if(r&&typeof r.v==='string'){
        const rh=hashStr(r.v);
        if(l==null){
          if(same&&mh!==undefined){push[k]=null;} /* 이 기기에서 지운 기록 → 계정에서도 삭제 */
          else{try{localStorage.setItem(k,r.v);}catch(e){}meta.h[k]=rh;}
        }else if(lh===rh){meta.h[k]=rh;}
        else if(same&&mh!==undefined&&lh!==mh&&(rh===mh||(+r.t||0)<=meta.t)){push[k]=l;} /* 이 기기에서만 바뀜(또는 더 최근) → 올리기 */
        else{try{localStorage.setItem(k,r.v);}catch(e){}meta.h[k]=rh;} /* 계정 기록이 기준 */
      }else if(l!=null){push[k]=l;} /* 계정에 없고 이 기기에만 있음 → 올리기 */
    }
    meta.uid=me.uid;saveMeta(meta);
    await pushKeys(push);
  }catch(e){}
  syncing=false;
}
async function pushKeys(push){
  const keys=Object.keys(push);if(!keys.length||!me)return true;
  const body={},now=Date.now();
  for(const k of keys){
    const v=push[k];
    if(v===null)body[encKey(k)]=null;
    else if(v.length<=SYNC_MAX)body[encKey(k)]={v,t:now};
  }
  if(!Object.keys(body).length)return true;
  try{
    await userReq('/save','PATCH',body);
    const meta=loadMeta();meta.uid=me.uid;meta.t=now;
    for(const k of keys){if(push[k]===null)delete meta.h[k];else if(push[k].length<=SYNC_MAX)meta.h[k]=hashStr(push[k]);}
    saveMeta(meta);return true;
  }catch(e){return false;}
}
async function pushDirty(){
  if(!me||syncing)return true;
  const meta=loadMeta();if(meta.uid!==me.uid)return true;
  const push={};
  for(const k of SYNC_KEYS){const l=lget(k),lh=hashStr(l),mh=meta.h[k];if(lh!==(mh===undefined?null:mh))push[k]=l;}
  return pushKeys(push);
}
function schedulePush(){clearTimeout(pushTimer);pushTimer=setTimeout(pushDirty,2500);}
addEventListener('storage',e=>{if(me&&(e.key===null||SYNC_KEYS.includes(e.key)))schedulePush();});
addEventListener('pagehide',()=>{pushDirty();});
async function doLogout(){
  const ok=await pushDirty(); /* 마지막으로 백업 → 성공했을 때만 이 기기의 기록을 지워요(공용 컴퓨터 보호) */
  if(ok)wipeLocal();
  authApi.signOut();
}
function onUser(u){
  me=u||null;mine={};
  renderAuth();renderMine();
  if(me&&FIREBASE_URL&&!DEMO){Promise.all([loadMine(),syncDown()]).then(afterLogin);}
}
async function initAuth(){
  if(window.LOBBY_AUTH_STUB){authApi=window.LOBBY_AUTH_STUB;authApi.onChange(onUser);return;} /* 테스트용 */
  if(!FIREBASE_WEB.apiKey||DEMO||!FIREBASE_URL){renderAuth();return;}
  try{
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    const [App,A]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js')]);
    const auth=A.getAuth(App.initializeApp(FIREBASE_WEB));
    authApi={
      signIn:()=>A.signInWithPopup(auth,new A.GoogleAuthProvider()),
      signOut:()=>A.signOut(auth),
      onChange:cb=>A.onAuthStateChanged(auth,u=>cb(u&&{uid:u.uid,name:u.displayName,photo:u.photoURL,getToken:()=>u.getIdToken()}))
    };
    authApi.onChange(onUser);
  }catch(e){authApi=null;renderAuth();} /* 로그인 모듈을 못 불러와도 로비는 그대로 동작 */
}

/* ---------- "지금 N명 플레이 중" ----------
   게임을 여는 동안 15초마다 서버에 "나 여기 있어요" 도장(서버 시각)을 찍고, 나가면 지워요.
   60초 안에 도장이 찍힌 사람만 "플레이 중"으로 세요. */
const BEAT_MS=15000,ALIVE_MS=60000;
let live={},mySid=null,beatTimer=null,myGame=null;
const newSid=()=>Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>(b%36).toString(36)).join('');
function beat(){
  if(!myGame||!FIREBASE_URL)return;
  fetch(`${FIREBASE_URL}/live/${encodeURIComponent(myGame)}/${mySid}.json`,{method:'PUT',body:JSON.stringify({'.sv':'timestamp'}),keepalive:true}).catch(()=>{});
}
function startPresence(g){
  stopPresence();
  myGame=g.id;mySid=newSid();
  if(DEMO){live[g.id]=(live[g.id]||0)+1;updateNow();return;}
  if(!FIREBASE_URL)return;
  beat();beatTimer=setInterval(beat,BEAT_MS);
  live[g.id]=(live[g.id]||0)+1;updateNow(); /* 내 화면에는 바로 반영 */
}
function stopPresence(){
  clearInterval(beatTimer);beatTimer=null;
  if(myGame&&mySid){
    if(DEMO)live[myGame]=Math.max(0,(live[myGame]||1)-1);
    else if(FIREBASE_URL){live[myGame]=Math.max(0,(live[myGame]||1)-1);fetch(`${FIREBASE_URL}/live/${encodeURIComponent(myGame)}/${mySid}.json`,{method:'DELETE',keepalive:true}).catch(()=>{});}
    updateNow();
  }
  myGame=null;mySid=null;
}
addEventListener('pagehide',stopPresence);
/* ---------- 검색 · 태그 필터 · 즐겨찾기 ----------
   · 즐겨찾기(★): 카드 오른쪽 아래 별을 누르면 그 게임이 맨 위로 올라와요. 이 브라우저에 저장되고,
     로그인하면 SYNC_KEYS 덕분에 계정에 백업돼서 다른 기기에서도 따라와요. (로그아웃하면 이 기기 기록과 함께 지워져요)
   · 태그: GAMES 의 tags 로 칩이 자동 생성돼요. 여러 개를 고르면 "모두 가진" 게임만 보여줘요. */
const FAV_KEY='lobby-favs';
const TAG_ORDER=['멀티','2인용','액션','전략','시뮬','스포츠','퍼즐','보드','호러','서바이벌','스토리','로그라이크','리듬'];
let favSet=new Set();
const activeTags=new Set();let favOnly=false;
function loadFavs(){
  let a=[];try{a=JSON.parse(localStorage.getItem(FAV_KEY)||'[]');}catch(e){}
  favSet=new Set((Array.isArray(a)?a:[]).filter(id=>GAMES.some(g=>g.id===id&&g.ready)));
}
function saveFavs(){
  try{if(favSet.size)localStorage.setItem(FAV_KEY,JSON.stringify([...favSet]));else localStorage.removeItem(FAV_KEY);}catch(e){}
  schedulePush();
}
function paintFav(el){
  const id=el.dataset.fav,on=favSet.has(id),g=GAMES.find(x=>x.id===id);
  el.textContent=on?'★':'☆';el.classList.toggle('on',on);el.setAttribute('aria-pressed',String(on));
  const t=(g?g.title:'게임')+' 즐겨찾기 '+(on?'해제':'추가');el.setAttribute('aria-label',t);el.title=t;
}
function paintFavs(){document.querySelectorAll('.fav').forEach(paintFav);}
function toggleFav(id){
  if(favSet.has(id))favSet.delete(id);else favSet.add(id);
  saveFavs();paintFavs();sortGrid();applyFilter();
}
function refreshFavs(){loadFavs();paintFavs();sortGrid();applyFilter();}
GAMES.forEach(g=>{
  if(!g.ready)return;
  const th=grid.querySelector(`[data-id="${g.id}"] .thumb`);if(!th)return;
  const el=document.createElement('span');el.className='fav';el.dataset.fav=g.id;el.setAttribute('role','button');el.tabIndex=0;
  const act=e=>{e.preventDefault();e.stopPropagation();toggleFav(g.id);};
  el.addEventListener('click',act);
  el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')act(e);});
  th.appendChild(el);
});

const qInput=$('q'),qClear=$('qClear'),chipsBox=$('chips'),noRes=$('noRes');
function tagsOf(g){return Array.isArray(g.tags)?g.tags.map(String):[];}
function buildChips(){
  const cnt={};GAMES.forEach(g=>tagsOf(g).forEach(t=>{cnt[t]=(cnt[t]||0)+1;}));
  const names=Object.keys(cnt).sort((a,b)=>{const ia=TAG_ORDER.indexOf(a),ib=TAG_ORDER.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);});
  chipsBox.innerHTML=`<button type="button" data-k="__all">전체</button><button type="button" data-k="__fav">★ 즐겨찾기</button>`+
    names.map(t=>`<button type="button" data-k="${esc(t)}">${esc(t)}<small>${cnt[t]}</small></button>`).join('');
}
chipsBox.addEventListener('click',e=>{
  const b=e.target.closest('button[data-k]');if(!b)return;
  const k=b.dataset.k;
  if(k==='__all'){activeTags.clear();favOnly=false;}
  else if(k==='__fav')favOnly=!favOnly;
  else if(activeTags.has(k))activeTags.delete(k);else activeTags.add(k);
  applyFilter();
});
function applyFilter(){
  const terms=qInput.value.toLowerCase().split(/\s+/).filter(Boolean);
  qClear.hidden=!qInput.value;
  let shown=0;
  GAMES.forEach(g=>{
    const c=grid.querySelector(`[data-id="${g.id}"]`);if(!c)return;
    const tg=tagsOf(g),hay=(g.title+' '+(g.hanja||'')+' '+g.desc+' '+tg.join(' ')).toLowerCase();
    const ok=(!favOnly||favSet.has(g.id))&&[...activeTags].every(t=>tg.includes(t))&&terms.every(t=>hay.includes(t));
    c.hidden=!ok;if(ok)shown++;
  });
  chipsBox.querySelectorAll('button[data-k]').forEach(b=>{
    const k=b.dataset.k;
    b.setAttribute('aria-pressed',String(k==='__all'?(!favOnly&&!activeTags.size):k==='__fav'?favOnly:activeTags.has(k)));
  });
  if(shown){noRes.hidden=true;}
  else{
    noRes.hidden=false;
    noRes.innerHTML=(favOnly&&!favSet.size&&!terms.length&&!activeTags.size)
      ?'즐겨찾기한 게임이 아직 없어요.<br>카드 오른쪽 아래의 ☆ 를 눌러 추가해 보세요.'
      :'조건에 맞는 게임이 없어요.<br><button type="button" id="resetFilter">필터 초기화</button>';
    const r=$('resetFilter');if(r)r.addEventListener('click',()=>{qInput.value='';activeTags.clear();favOnly=false;applyFilter();});
  }
}
qInput.addEventListener('input',applyFilter);
qInput.addEventListener('keydown',e=>{if(e.key==='Escape'){qInput.value='';applyFilter();}});
qClear.addEventListener('click',()=>{qInput.value='';applyFilter();qInput.focus();});
addEventListener('storage',e=>{if(e.key===FAV_KEY)refreshFavs();});
buildChips();loadFavs();paintFavs();applyFilter();

/* ---------- 정렬: 기본순 / 누적 인기순 / 실시간 인기순 ---------- */
let sortMode='default';
try{const m=localStorage.getItem('lobby-sort');if(['default','total','live'].includes(m))sortMode=m;}catch(e){}
function sortGrid(){
  const idx=Object.fromEntries(GAMES.map((g,i)=>[g.id,i]));
  const ready=id=>{const g=GAMES[idx[id]];return g&&g.ready?0:1;};
  const P=id=>+plays[id]||0,L=id=>+(typeof live!=='undefined'&&live[id])||0;
  const cmp={
    default:(a,b)=>idx[a]-idx[b],
    total:(a,b)=>P(b)-P(a)||L(b)-L(a)||idx[a]-idx[b],
    live:(a,b)=>L(b)-L(a)||P(b)-P(a)||idx[a]-idx[b]
  }[sortMode];
  const cards=[...grid.children];
  const fv=id=>favSet.has(id)?0:1; /* 즐겨찾기한 게임을 맨 위로 */
  const sorted=cards.slice().sort((x,y)=>ready(x.dataset.id)-ready(y.dataset.id)||fv(x.dataset.id)-fv(y.dataset.id)||cmp(x.dataset.id,y.dataset.id));
  if(sorted.some((c,i)=>c!==cards[i]))sorted.forEach(c=>grid.appendChild(c));
}
document.querySelectorAll('#sortbar [data-sort]').forEach(b=>{
  b.addEventListener('click',()=>{
    sortMode=b.dataset.sort;
    try{localStorage.setItem('lobby-sort',sortMode);}catch(e){}
    syncSortBtns();sortGrid();
  });
});
function syncSortBtns(){document.querySelectorAll('#sortbar [data-sort]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sort===sortMode)));}
syncSortBtns();

function updateNow(){
  document.querySelectorAll('[data-now]').forEach(el=>{const n=live[el.dataset.now]||0;const al=el.hasAttribute('data-always');el.hidden=!n&&!al;el.classList.toggle('zero',!n);el.textContent=n?n.toLocaleString('ko-KR')+'명 플레이 중':'현재 0명';});
  if(sortMode==='live')sortGrid();
}
function readLive(d){
  const now=Date.now(),out={},stale=[];
  for(const g in d||{})for(const sid in d[g]){
    const ts=+d[g][sid]||0,age=now-ts;
    if(age<ALIVE_MS&&age>-ALIVE_MS)out[g]=(out[g]||0)+1;
    else if(age>10*60*1000&&stale.length<5)stale.push(`${g}/${sid}`); /* 비정상 종료로 남은 오래된 기록 청소 */
  }
  stale.forEach(k=>fetch(`${FIREBASE_URL}/live/${k}.json`,{method:'DELETE'}).catch(()=>{}));
  live=out;updateNow();
}

/* 연결을 계속 열어 두지 않고 10초마다 숫자만 가져와요 → 동시에 몇 명이 있어도 Firebase 무료 연결 한도(100)에 안 걸려요 */
const POLL_MS=10000;
let pollTimer=null;
function poll(){
  clearTimeout(pollTimer);
  if(document.hidden){return;} /* 탭이 가려져 있으면 쉬었다가 다시 보일 때 바로 갱신 */
  const get=u=>fetch(FIREBASE_URL+u,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();});
  get('/plays.json').then(d=>{
    d=d||{};
    for(const k in d){plays[k]=Math.max(+d[k]||0,+plays[k]||0);} /* 방금 내가 올린 +1이 잠깐 사라져 보이지 않게 */
    setLive('on','실시간');renderStats();
  }).catch(()=>setLive('','재연결 중…'))
  .then(()=>get('/live.json')).then(readLive).catch(()=>{}) /* 접속자 집계가 막혀 있어도(규칙 미설정 등) 순위는 계속 동작 */
  .finally(()=>{pollTimer=setTimeout(poll,POLL_MS);});
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&FIREBASE_URL&&!DEMO)poll();});
function startLive(){
  if(DEMO){
    plays={hansan:1280,silentbreach:960,ittycoon:430,battleground:2140,tetris:1760,stickduel:880,korea38:610,zerozone:1495,baseball:1210,ilgito:1530,segryeok:790,stockexam:1340,groupproject:1620,omokbaduk:980,chess:1150};
    live={hansan:3,silentbreach:2,ittycoon:1,battleground:12,tetris:7,stickduel:2,korea38:4,zerozone:5,baseball:6,ilgito:9,segryeok:3,stockexam:8,groupproject:11,omokbaduk:4,chess:6};
    setLive('demo','데모 데이터');renderStats();updateNow();
    setInterval(()=>{const r=GAMES.filter(g=>g.ready);const g=r[Math.floor(Math.random()*r.length)];plays[g.id]=(+plays[g.id]||0)+1+Math.floor(Math.random()*3);const h=r[Math.floor(Math.random()*r.length)].id;live[h]=Math.max(0,(live[h]||0)+(Math.random()<.5?-1:1));renderStats();},2200);
    return;
  }
  renderStats();
  if(!FIREBASE_URL){setLive('','집계 준비 중');return;}
  poll();
}
/* ============================================================
   플레이어 랭킹 — 로그인한 사람이 게임을 시작한 횟수(내 기록 합계) TOP 10.
   · 서버(/ranks/<uid>)에는 "닉네임"(없으면 가운데를 가린 계정 이름)과 횟수만 올려요. 진짜 이름·사진·이메일은 올리지 않아요.
   · 마스킹: 가운데 글자를 *로 가려요. 예) 홍길동 → 홍*동, Alexander → A****r(최대 4개)
   · 닉네임은 있는 그대로 보여줘요. 닉네임도 가리고 싶으면 아래 MASK_NICKNAME 을 true 로 바꾸세요.
   · Firebase 규칙에 ranks 항목이 있어야 동작해요 (README/안내 참고). 없으면 순위표는 조용히 "아직 기록이 없어요"로 보여요.
   ============================================================ */
const RANK_TOP=10,RANK_REFRESH_MS=60000;
function maskName(n){
  const a=Array.from(String(n||'').trim()||'플레이어');
  if(a.length<=2)return a[0]+'*';
  return a[0]+'*'.repeat(Math.min(a.length-2,4))+a[a.length-1];
}
const rankSection=$('rank'),rkList=$('rkList');
let lastRanks=[];
function renderRanks(list){
  lastRanks=list;
  rankSection.hidden=false;
  if(!list.length){rkList.innerHTML='<li class="hot-empty">아직 순위가 없어요.<br>Google로 로그인하고 게임을 플레이하면 여기에 이름(가운데 가림)이 올라가요!</li>';return;}
  const max=list[0].n||1;
  rkList.innerHTML=list.map((x,i)=>{
    const my=me&&x.uid===me.uid;
    return `<li class="rk r${i+1}${my?' me':''}"><span class="rk-no">${i+1}</span>`+
      `<span class="rk-name">${esc(String(x.name).slice(0,30))}${my?'<i>나</i>':''}</span>`+
      `<span class="rk-n"><strong>${fmt(x.n)}</strong>회</span>`+
      `<span class="rk-bar"><span style="width:${Math.max(6,x.n/max*100)}%"></span></span></li>`;
  }).join('');
}
function normRanks(d){
  return Object.keys(d||{}).map(k=>({uid:k,name:d[k]&&d[k].name,n:+(d[k]&&d[k].n)||0}))
    .filter(x=>x.n>0&&typeof x.name==='string')
    .sort((a,b)=>b.n-a.n||String(a.name).localeCompare(String(b.name))).slice(0,RANK_TOP);
}
async function loadRanks(){
  if(DEMO||!FIREBASE_URL)return;
  const get=u=>fetch(FIREBASE_URL+u,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json();});
  try{
    let d;
    try{d=await get('/ranks.json?orderBy=%22n%22&limitToLast='+RANK_TOP);} /* 인덱스(.indexOn)가 있으면 상위 N명만 가져와요 */
    catch(e){d=await get('/ranks.json');} /* 인덱스가 없으면 전체를 받아 정렬 */
    renderRanks(normRanks(d));
  }catch(e){console.warn('[랭킹] 순위 불러오기 실패 — Firebase 규칙에서 ranks 읽기가 허용돼 있는지 확인하세요');if(!rkList.children.length)renderRanks([]);}
}
const RANK_NOTE_DEFAULT=document.querySelector('.lb-note').textContent;
function rankMsg(t){const el=document.querySelector('.lb-note');el.textContent=t||RANK_NOTE_DEFAULT;el.style.color=t?'var(--warn)':'';}
let rankTimer=null;
function pushRank(){
  if(!me||DEMO||!FIREBASE_URL)return;
  clearTimeout(rankTimer);
  rankTimer=setTimeout(async()=>{
    const n=Object.values(mine).reduce((a,v)=>a+(+v||0),0);
    if(!me||n<=0)return;
    try{
      const t=await me.getToken();
      const r=await fetch(`${FIREBASE_URL}/ranks/${encodeURIComponent(me.uid)}.json?auth=${encodeURIComponent(t)}`,{method:'PUT',body:JSON.stringify({n,name:rankName()})});
      if(r.ok){rankMsg('');loadRanks();}
      else{console.warn('[랭킹] 내 기록 저장 실패: HTTP '+r.status+' — Firebase 규칙에 ranks 항목이 있는지 확인하세요');rankMsg(r.status===401||r.status===403?'내 기록을 저장하지 못했어요 (Firebase 규칙에 ranks 추가 필요)':'내 기록 저장 실패 (HTTP '+r.status+')');}
    }catch(e){console.warn('[랭킹] 내 기록 저장 실패',e);}
  },800);
}
/* ============================================================
   닉네임 — 로그인한 사람이 정해요. 이 브라우저(localStorage 'lobby-nick')에 저장되고,
   SYNC_KEYS 덕분에 계정에 백업돼서 다른 기기에서 로그인해도 따라와요.
   ============================================================ */
const NICK_KEY='lobby-nick',NICK_MIN=2,NICK_MAX=12;
const MASK_NICKNAME=false; /* true 면 닉네임도 순위표에서 가운데를 가려요 */
const NICK_RE=/^[가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9 _.\-]+$/; /* Firebase 규칙(ranks/name)과 같은 문자만 허용 */
const RANK_NAME_RE=/^[가-힣ㄱ-ㅎㅏ-ㅣA-Za-z0-9 _.*\-]{1,30}$/;
function myNick(){return me?String(lget(NICK_KEY)||'').trim().slice(0,NICK_MAX):'';}
function rankName(){const nk=myNick(),nm=nk?(MASK_NICKNAME?maskName(nk):nk):maskName(me.name);return RANK_NAME_RE.test(nm)?nm:'플레이어';} /* 규칙에 안 맞는 문자(다른 나라 글자 등)는 기본 이름으로 */
function checkNick(raw){
  const v=String(raw||'').replace(/\s+/g,' ').trim(),len=Array.from(v).length;
  if(len<NICK_MIN||len>NICK_MAX)return {err:`닉네임은 ${NICK_MIN}~${NICK_MAX}자로 적어 주세요`};
  if(!NICK_RE.test(v))return {err:'한글·영문·숫자·공백·_ - . 만 쓸 수 있어요'};
  return {v};
}
/* ---------- 업적 뱃지 · 내 프로필 ---------- */
const BADGES=[
  {id:'first',t:'첫 걸음',d:'게임 1회 플레이',v:()=>myTotal(),goal:1},
  {id:'p10',t:'단골손님',d:'누적 10회 플레이',v:()=>myTotal(),goal:10},
  {id:'p50',t:'열혈 게이머',d:'누적 50회 플레이',v:()=>myTotal(),goal:50},
  {id:'p200',t:'로비의 전설',d:'누적 200회 플레이',v:()=>myTotal(),goal:200},
  {id:'ex5',t:'탐험가',d:'서로 다른 게임 5종',v:()=>myKinds(),goal:5},
  {id:'ex10',t:'수집가',d:'서로 다른 게임 10종',v:()=>myKinds(),goal:10},
  {id:'one20',t:'한 우물',d:'한 게임을 20회',v:()=>myMax(),goal:20},
  {id:'fav3',t:'큐레이터',d:'즐겨찾기 3개',v:()=>favSet.size,goal:3},
  {id:'multi',t:'함께 놀기',d:'멀티 게임 플레이',v:()=>GAMES.filter(g=>tagsOf(g).includes('멀티')&&(+mine[g.id]||0)>0).length,goal:1},
  {id:'nick',t:'나만의 이름',d:'닉네임 설정',v:()=>myNick()?1:0,goal:1},
];
const myTotal=()=>Object.values(mine).reduce((a,v)=>a+(+v||0),0);
const myKinds=()=>GAMES.filter(g=>(+mine[g.id]||0)>0).length;
const myMax=()=>Math.max(0,...GAMES.map(g=>+mine[g.id]||0));
const badgesEarned=()=>me?BADGES.filter(b=>b.v()>=b.goal).map(b=>b.id):[];
function badgesSeen(){let a=[];try{a=JSON.parse(lget('lobby-badges-seen')||'[]');}catch(e){}return Array.isArray(a)?a:[];}
function badgeDot(){return me&&badgesEarned().some(id=>!badgesSeen().includes(id))?'<span class="udot" title="새 뱃지"></span>':'';}
const profDlg=$('profDlg');
function openProfile(){
  if(!me||typeof profDlg.showModal!=='function')return;
  const seen=badgesSeen(),got=badgesEarned(),total=myTotal();
  const rk=lastRanks.findIndex(x=>x.uid===me.uid);
  const rows=GAMES.filter(g=>(+mine[g.id]||0)>0).sort((a,b)=>(+mine[b.id])-(+mine[a.id]));
  const max=rows.length?+mine[rows[0].id]:1;
  $('profBody').innerHTML=
    `<p class="pf-sub">${esc(myNick()||me.name||'플레이어')}</p>`+
    `<div class="pf-stats"><div class="pf-stat"><b>${fmt(total)}</b><span>총 플레이</span></div>`+
    `<div class="pf-stat"><b>${myKinds()}/${GAMES.filter(g=>g.ready).length}</b><span>해 본 게임</span></div>`+
    `<div class="pf-stat"><b>${rk>=0?rk+1+'위':'TOP '+RANK_TOP+' 밖'}</b><span>내 순위</span></div></div>`+
    `<h4>게임별 플레이</h4>`+(rows.length?`<ul class="pf-games">${rows.map(g=>`<li><span>${esc(g.title)}</span><span class="pf-bar"><i style="width:${Math.max(4,+mine[g.id]/max*100)}%"></i></span><em>${fmt(+mine[g.id])}회</em></li>`).join('')}</ul>`:'<p class="pf-sub">아직 플레이 기록이 없어요.</p>')+
    `<h4>업적 뱃지 ${got.length}/${BADGES.length}</h4><div class="pf-badges">${BADGES.map(b=>{
      const on=got.includes(b.id),v=Math.min(b.v(),b.goal);
      return `<div class="bd${on?' on':''}"><b>${on?'🏅 ':'🔒 '}${esc(b.t)}</b><span>${esc(b.d)}</span>${on?(seen.includes(b.id)?'':'<i class="bdn">NEW</i>'):`<span class="bdp"><i style="width:${v/b.goal*100}%"></i></span>`}</div>`;}).join('')}</div>`;
  try{localStorage.setItem('lobby-badges-seen',JSON.stringify(got));}catch(e){}
  schedulePush();renderAuth();
  profDlg.showModal();
}
$('profClose').addEventListener('click',()=>profDlg.close());
profDlg.addEventListener('click',e=>{if(e.target===profDlg)profDlg.close();});

/* ---------- 이어서 하기 · 랜덤 게임 · 제보 링크 ---------- */
const btnContinue=$('btnContinue');
function paintContinue(){
  const lg=GAMES.find(g=>g.id===lget('lobby-last')&&g.ready);
  btnContinue.hidden=!lg;
  if(lg)btnContinue.textContent='▶ 이어서 하기 · '+lg.title;
}
btnContinue.addEventListener('click',()=>{const lg=GAMES.find(g=>g.id===lget('lobby-last')&&g.ready);if(lg)openGame(lg);});
$('btnRandom').addEventListener('click',()=>{
  let pool=GAMES.filter(g=>g.ready&&!(grid.querySelector(`[data-id="${g.id}"]`)||{}).hidden);
  if(!pool.length)pool=GAMES.filter(g=>g.ready);
  if(pool.length>1&&current)pool=pool.filter(g=>g!==current);
  const lg=lget('lobby-last');
  const alt=pool.filter(g=>g.id!==lg);if(alt.length)pool=alt; /* 방금 한 게임은 되도록 피해요 */
  if(pool.length)openGame(pool[Math.floor(Math.random()*pool.length)]);
});
paintContinue();
(function(){
  const m=location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);if(!m)return;
  const seg=location.pathname.split('/').filter(Boolean)[0];
  const repo=seg&&!/\.html?$/i.test(seg)?seg:m[1]+'.github.io';
  const base='https://github.com/'+m[1]+'/'+repo+'/issues/new?template=';
  const f=$('flinks');
  f.innerHTML=`<a href="${base}bug-report.yml" target="_blank" rel="noopener">🐞 오류 제보</a>·<a href="${base}game-submission.yml" target="_blank" rel="noopener">🎮 게임 업로드 신청</a>`;
  f.hidden=false;
})();
const nickDlg=$('nickDlg'),nickInput=$('nickInput'),nickErr=$('nickErr');
function openNick(first){
  if(!me||typeof nickDlg.showModal!=='function')return;
  $('nickTitle').textContent=first?'닉네임을 정해 보세요':'닉네임 설정';
  $('nickCancel').textContent=first?'나중에':'취소';
  nickInput.value=myNick();nickErr.textContent='';
  if(!nickDlg.open)nickDlg.showModal();
  nickInput.focus();nickInput.select();
}
function applyNick(v){
  try{if(v)localStorage.setItem(NICK_KEY,v);else localStorage.removeItem(NICK_KEY);}catch(e){}
  renderAuth();schedulePush();pushDirty();pushRank();
}
$('nickForm').addEventListener('submit',e=>{
  e.preventDefault();
  const r=checkNick(nickInput.value);
  if(r.err){nickErr.textContent=r.err;nickInput.focus();return;}
  applyNick(r.v);nickDlg.close();
});
$('nickCancel').addEventListener('click',()=>nickDlg.close());
$('nickReset').addEventListener('click',()=>{applyNick('');nickDlg.close();});
nickInput.addEventListener('input',()=>{nickErr.textContent='';});
function afterLogin(){
  if(!me)return;
  renderAuth();pushRank();refreshFavs(); /* 다른 기기에서 정한 즐겨찾기 반영 */
  /* 닉네임이 아직 없고, 이 기기에서 물어본 적 없으면 한 번만 물어봐요 (동기화가 끝난 뒤라 다른 기기에서 정한 닉네임이 있으면 묻지 않아요) */
  let asked={};try{asked=JSON.parse(localStorage.getItem('lobby-nick-asked')||'{}');}catch(e){}
  if(!myNick()&&!asked[me.uid]){
    asked[me.uid]=1;try{localStorage.setItem('lobby-nick-asked',JSON.stringify(asked));}catch(e){}
    openNick(true);
  }
}

function startRanks(){
  if(DEMO){
    renderRanks([['김*수',482],['M***k',377],['박*준',351],['S****y',296],['최*우',240],['ha***o',198],['정*은',163],['J**n',120],['오*',96],['L*e',71]].map(([name,n],i)=>({uid:'demo'+i,name,n})));
    return;
  }
  if(!FIREBASE_URL)return;
  loadRanks();
  setInterval(()=>{if(!document.hidden)loadRanks();},RANK_REFRESH_MS);
}

startRanks();
sortGrid(); /* 즐겨찾기 먼저 */
startLive();
initAuth();
